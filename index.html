  /* =======================================================================
   * 5) Supabase sync: missing tables become optional, network errors deduped
   * ======================================================================= */
  syncState.missingTables = syncState.missingTables || new Set();
  syncState.lastNetworkErrorAt = syncState.lastNetworkErrorAt || 0;

  function kyMissingTable(err){
    const msg=String(err && (err.message||err.details||err.hint)||err||'').toLowerCase();
    return !!(err && (err.code==='PGRST205' || err.code==='42P01' || msg.includes('schema cache') || msg.includes('could not find the table') || msg.includes('relation') && msg.includes('does not exist')));
  }
  function kyNetworkError(err){
    const msg=String(err && (err.message||err.name)||err||'').toLowerCase();
    return msg.includes('failed to fetch') || msg.includes('networkerror') || msg.includes('load failed') || msg.includes('aborterror');
  }

  window.pullChanges = async function(){
    if(!sb || !currentUser) return {pulled:0,missingTables:[],networkError:false};
    const startedAt=Date.now()-60000;
    let totalPulled=0;
    let networkError=false;
    const missingTables=[];
    const tables=['sessions','exams','mistakes','plans','notes','progress'];

    for(const tableName of tables){
      if(syncState.missingTables.has(tableName)){ missingTables.push(tableName); continue; }
      let cursor=lastPullTs;
      let tableOK=true;
      for(let page=0;page<40;page++){
        const {data,error}=await sb.from(tableName).select('*')
          .eq('user_id',currentUser.id)
          .gte('updated_at',new Date(cursor).toISOString())
          .order('updated_at',{ascending:true})
          .limit(500);
        if(error){
          if(kyMissingTable(error)){
            syncState.missingTables.add(tableName);
            missingTables.push(tableName);
          }else if(kyNetworkError(error)){
            networkError=true;
          }else{
            logError('pull '+tableName+': '+error.message);
          }
          tableOK=false;
          break;
        }
        if(!data || !data.length) break;
        let maxTs=cursor;
        for(const raw of data){
          const remote=fromRemoteRow(raw);
          const local=await idbGet(tableName,remote.id);
          if(!local || remote.updated_at>(local.updated_at||0)){ await idbPut(tableName,remote); totalPulled++; }
          if(remote.updated_at>maxTs) maxTs=remote.updated_at;
        }
        if(data.length<500 || maxTs===cursor) break;
        cursor=maxTs;
      }
      if(!tableOK && networkError) continue;
    }
    if(!networkError) {
      lastPullTs=startedAt;
      await saveMeta('lastPullTs',lastPullTs);
    }
    return {pulled:totalPulled,missingTables:[...new Set(missingTables)],networkError};
  };

  window.pushOutbox = async function(){
    if(!sb || !currentUser) return {pushed:0,failed:0,networkError:false,missingTables:[]};
    const pending=(await idbGetAll('outbox')).filter(o=>o.status==='pending'||o.status==='retry').sort((a,b)=>a.ts-b.ts);
    if(!pending.length) return {pushed:0,failed:0,networkError:false,missingTables:[]};
    let pushed=0,failed=0,networkError=false;
    const missingTables=[];
    const allowed=['sessions','exams','mistakes','plans','notes','progress'];
    for(const op of pending){
      const table=op.store;
      if(!allowed.includes(table)){ await idbDelete('outbox',op.id); continue; }
      if(syncState.missingTables.has(table)){ missingTables.push(table); continue; }
      try{
        const payload=op.payload?toRemoteRow(op.payload,currentUser.id):null;
        const res=await sb.from(table).upsert(payload,{onConflict:'id'});
        if(res.error) throw res.error;
        op.status='done'; op.tries=(op.tries||0)+1; op.last_error=null;
        await idbPut('outbox',op); pushed++;
      }catch(err){
        if(kyMissingTable(err)){
          syncState.missingTables.add(table); missingTables.push(table);
          op.status='retry'; op.last_error='جدول '+table+' در Supabase وجود ندارد';
          await idbPut('outbox',op);
          continue;
        }
        if(kyNetworkError(err)){
          networkError=true;
          op.tries=(op.tries||0)+1; op.last_error='ارتباط با Supabase برقرار نشد'; op.status=op.tries>=5?'failed':'retry';
          await idbPut('outbox',op);
          break;
        }
        failed++; op.tries=(op.tries||0)+1; op.last_error=String(err.message||err).slice(0,300); op.status=op.tries>=5?'failed':'retry';
        await idbPut('outbox',op); logError('push '+table+': '+op.last_error);
      }
    }
    return {pushed,failed,networkError,missingTables:[...new Set(missingTables)]};
  };

  window.updateSyncPill = function(){
    const pill=$('#syncPill'),label=$('#syncLabel');
    if(!pill||!label) return;
    pill.className='sync-pill';
    if(!navigator.onLine){ pill.classList.add('network-error'); label.textContent='آفلاین'; return; }
    if(syncState.running){ label.textContent='همگام‌سازی…'; return; }
    if(syncState.lastError){ pill.classList.add('network-error'); label.textContent='اتصال ناموفق'; return; }
    if(syncState.missingTables && syncState.missingTables.size){ pill.classList.add('missing-table'); label.textContent='همگام‌سازی ناقص'; return; }
    if(currentUser){ label.textContent='همگام'; return; }
    label.textContent='محلی';
  };

  window.syncNow = async function(force){
    if(!sb||!currentUser||!navigator.onLine) return;
    if(syncState.running && !force) return;
    syncState.running=true; updateSyncPill();
    try{
      if(force) await retryFailedOps();
      const pr=await pushOutbox();
      const pu=await pullChanges();
      await refreshSharedStatsForToday();
      const hasNetworkError=!!(pr.networkError||pu.networkError);
      syncState.lastError=hasNetworkError?'ارتباط با Supabase برقرار نشد':null;
      syncState.backoff=hasNetworkError?Math.min(300000,Math.max(10000,syncState.backoff*2)):5000;
      if(hasNetworkError && Date.now()-syncState.lastNetworkErrorAt>30000){
        syncState.lastNetworkErrorAt=Date.now();
        logError('sync network: ارتباط با Supabase برقرار نشد');
      }
    }catch(err){
      syncState.lastError=String(err.message||err);
      if(Date.now()-syncState.lastNetworkErrorAt>30000){ syncState.lastNetworkErrorAt=Date.now(); logError('sync: '+syncState.lastError); }
      syncState.backoff=Math.min(300000,Math.max(10000,syncState.backoff*2));
    }finally{
      syncState.running=false; syncState.lastAttempt=Date.now();
      await refreshCache(); updateSyncPill(); updateAccountBtn();
      kyNormalizeDigits(document.body);
    }
  };

  function kyPairChannelName(){
    if(!currentUser || !currentProfile || !currentProfile.partner_id) return null;

    return 'couple:' + ids.join(':');

  function kyTodayStudySeconds(){
    const today=todayKey();
    let total=0;
    for(const session of (CACHE.sessions||[])){
      if(session.day===today && !session.deleted_at) total += Math.max(0,toInt(session.seconds,0));
    }
    if(Timer.state && Timer.state.day===today) total += Math.max(0,Timer.elapsedSeconds());
    return total;
  }

      try{ await presenceChannel.untrack(); }catch(e){}
      try{ await sb.removeChannel(presenceChannel); }catch(e){}

    partnerPresence=null;

  window.startPresence = async function(){
    if(!sb||!currentUser||!currentProfile||!currentProfile.partner_id){ await stopPresence(); return; }
    try{ await stopPresence(); }catch(e){}
    const name=kyPairChannelName();
    if(!name) return;
    presenceChannel=sb.channel(name,{config:{presence:{key:String(currentUser.id)}}});
    const applyState=()=>{
      const state=presenceChannel.presenceState();
      const pid=String(currentProfile.partner_id);
      const list=state[pid]||[];
      if(list.length && list[0]){
        const p=list[list.length-1];
        partnerPresence={
          user_id:pid,
          online:true,
          subject:p.subject||null,
          started_at:p.started_at||null,
          today_seconds:toInt(p.today_seconds,0),
          session_elapsed_seconds:toInt(p.session_elapsed_seconds,0),
          updated_at:toInt(p.updated_at,Date.now())
        };
      }else partnerPresence=null;
      renderPartnerCard();
    };
    presenceChannel.on('presence',{event:'sync'},applyState);
    presenceChannel.on('presence',{event:'join'},applyState);
    presenceChannel.on('presence',{event:'leave'},applyState);
    await presenceChannel.subscribe(async status=>{ if(status==='SUBSCRIBED') await trackPresence(); });
  };

  window.trackPresence = async function(){
    if(!presenceChannel||!currentUser) return;
    const running=!!(Timer.state && Timer.state.status==='running');
    const elapsed=running?Timer.elapsedSeconds():0;
    const payload={
      user_id:String(currentUser.id),
      online:true,
      subject:running?Timer.state.subject:null,
      started_at:running?Timer.state.started_at:null,
      session_elapsed_seconds:elapsed,
      today_seconds:kyTodayStudySeconds(),
      updated_at:Date.now()
    };
    try{ await presenceChannel.track(payload); }catch(e){
      if(Date.now()-syncState.lastNetworkErrorAt>30000){ syncState.lastNetworkErrorAt=Date.now(); logError('presence: '+(e.message||e)); }
    }
  };

    if(!currentProfile||!currentProfile.partner_id){

    }
    if(!partnerPresence){
      return '<div class="card section"><div class="card-head">'+ICONS.info+'<h3>وضعیت زنده همسر</h3><span class="badge">آفلاین</span></div><p class="t-sm muted">وقتی اپ همسرت باز باشد، وضعیت آنلاین و ساعت مطالعه‌اش اینجا زنده نمایش داده می‌شود.</p></div>';
    }
    const total=toInt(partnerPresence.today_seconds,0);
    const session=toInt(partnerPresence.session_elapsed_seconds,0);
    let live='آنلاین است ولی مشغول مطالعه نیست.';
    if(partnerPresence.subject){
      const sj=subj(partnerPresence.subject);
      const current=partnerPresence.started_at?Math.max(session,Math.floor((Date.now()-partnerPresence.started_at)/1000)):session;
      live='<div class="flex items-center gap-3"><span style="width:12px;height:12px;border-radius:50%;background:'+sj.color+';flex:none"></span><div style="flex:1;min-width:0"><b class="t-sm">در حال مطالعه '+esc(sj.name)+'</b><div class="mono" style="font-size:22px;font-weight:800" id="partnerTimer">'+faNum(fmtClock(current))+'</div></div></div>';
    }
    return '<div class="card section" data-partner-card-live="1"><div class="card-head">'+ICONS.flame+'<h3>وضعیت زنده همسر</h3><span class="badge ok"><span class="dot"></span>آنلاین</span></div>'+live+'<div class="partner-live-grid"><div class="partner-live-metric"><div class="v" id="partnerTodayTotal">'+faNum(fmtClock(total))+'</div><div class="l">مطالعه امروز</div></div><div class="partner-live-metric"><div class="v">'+(partnerPresence.subject? 'فعال':'—')+'</div><div class="l">وضعیت فعلی</div></div></div></div>';
  };

  const oldRenderPartnerCard=window.renderPartnerCard;
  window.renderPartnerCard=function(){
    try{
      const host=document.querySelector('#homeRoot');
      if(!host) return;
      const el=host.querySelector('[data-partner-card]');
      if(el) el.innerHTML=partnerCardHtml();
      kyNormalizeDigits(host);
    }catch(e){ if(oldRenderPartnerCard) oldRenderPartnerCard(); }
  };

  setInterval(()=>{
    const el=document.getElementById('partnerTimer');
    if(el && partnerPresence && partnerPresence.started_at){
      const s=Math.max(toInt(partnerPresence.session_elapsed_seconds,0),Math.floor((Date.now()-partnerPresence.started_at)/1000));
      el.textContent=faNum(fmtClock(s));
    }
    const total=document.getElementById('partnerTodayTotal');
    if(total && partnerPresence){
      const extra=partnerPresence.started_at
        ? Math.max(0,Math.floor((Date.now()-partnerPresence.started_at)/1000)-toInt(partnerPresence.session_elapsed_seconds,0))
        : 0;
      total.textContent=faNum(fmtClock(toInt(partnerPresence.today_seconds,0)+extra));
    }
  },1000);

  const oldLinkPartner=window.linkPartner;
  window.linkPartner=async function(email){
    const result=await oldLinkPartner(email);
    try{ await fetchMyProfile(); await startPresence(); }catch(e){}
    return result;
  };

  /* =======================================================================
   * 7) Current Gemini model set + robust exam-builder diagnostics
   * ======================================================================= */
  const kyGeminiModels=[
    {id:'gemini-3.8-flash',label:'Gemini 3.8 Flash — پیشنهادی'},
    {id:'gemini-3.7-flash',label:'Gemini 3.7 Flash'},
    {id:'gemini-3.6-flash',label:'Gemini 3.6 Flash'},
    {id:'gemini-3.5-flash',label:'Gemini 3.5 Flash'},
    {id:'gemini-3.5-flash-lite',label:'Gemini 3.5 Flash-Lite'}
  ];
  const kyGeminiIds=new Set(kyGeminiModels.map(x=>x.id));
  try{ GEMINI_MODELS.splice(0,GEMINI_MODELS.length,...kyGeminiModels); }catch(e){}
  if(S.settings.ai && !kyGeminiIds.has(S.settings.ai.geminiModel)){ S.settings.ai.geminiModel='gemini-3.8-flash'; saveSettings().catch(()=>{}); }

  const oldCallGeminiDirect=window.callGeminiDirect;
  window.callGeminiDirect=async function(feature,payload){
    try{
      const cfg=S.settings.ai||{};
      const model=kyGeminiIds.has(cfg.geminiModel)?cfg.geminiModel:'gemini-3.8-flash';
      const key=String(cfg.geminiKey||'').trim();
      if(!key) throw new Error('کلید Gemini تنظیم نشده');
      const system=getSystemPromptFor(feature);
      const userPrompt=buildUserPromptLocal(feature,payload);
      const url='https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent';
      const controller=new AbortController();
      const timeoutId=setTimeout(()=>controller.abort(),50000);
      let res;
      try{
        res=await fetch(url,{method:'POST',signal:controller.signal,headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify({contents:[{role:'user',parts:[{text:system+'\n\n'+userPrompt}]}],generationConfig:{temperature:.4,maxOutputTokens:2500,responseMimeType:'application/json'}})});
      }catch(err){
        if(err.name==='AbortError') throw new Error('Gemini پاسخ نداد؛ زمان تمام شد');
        throw new Error('ارتباط مستقیم با Gemini برقرار نشد؛ VPN یا فایروال را بررسی کن');
      }finally{clearTimeout(timeoutId);}
      if(!res.ok){
        const text=await res.text().catch(()=> '');
        let msg='HTTP '+res.status;
        try{ const j=JSON.parse(text); if(j?.error?.message) msg=j.error.message; }catch(e){}
        if(res.status===400 && /api key/i.test(msg)) msg='کلید Gemini نامعتبر است';
        if(res.status===401||res.status===403) msg='کلید یا دسترسی Gemini معتبر نیست';
        if(res.status===404) msg='مدل Gemini در دسترس نیست: '+model;
        if(res.status===429) msg='سهم درخواست Gemini تمام شده یا موقتاً محدود شده است';
        throw new Error(msg);
      }
      const data=await res.json();
      const text=(data?.candidates?.[0]?.content?.parts||[]).map(x=>x.text||'').join('');
      if(!text.trim()) throw new Error('Gemini پاسخ خالی برگرداند');
      const parsed=extractJSONLocal(text);
      const validated=validateShapeLocal(feature,parsed);
      return {ok:true,data:validated,provider:'gemini'};
    }catch(err){
      if(oldCallGeminiDirect && String(err.message||'').includes('undefined')) return oldCallGeminiDirect(feature,payload);
      throw err;
    }
  };

  window.aiCall=async function(feature,payload){
    const cfg=S.settings.ai||{};
    const primary=cfg.primaryProvider||'gemini';
    const fallback=cfg.fallbackEnabled!==false;
    const errors=[];
    const run=async provider=>provider==='gemini'?window.callGeminiDirect(feature,payload):callOpenRouterDirect(feature,payload);
    try{ return await run(primary); }catch(e){ errors.push((primary==='gemini'?'Gemini':'OpenRouter')+': '+(e.message||e)); }
    if(!fallback) throw new Error(errors.join('\n'));
    const secondary=primary==='gemini'?'openrouter':'gemini';
    try{ const r=await run(secondary); r.fallbackFrom=primary; return r; }catch(e){ errors.push((secondary==='gemini'?'Gemini':'OpenRouter')+': '+(e.message||e)); }
    throw new Error('هر دو AI ناموفق بودند:\n'+errors.map(x=>'• '+x).join('\n')+'\n\nبرای Gemini: VPN/کلید/مدل؛ برای OpenRouter: کلید و سهم مدل رایگان را بررسی کن.');
  };

  /* =======================================================================
   * 8) Normalize after every render/route without changing input fields
   * ======================================================================= */
  const originalNavigate=window.navigate;
  if(originalNavigate){
    window.navigate=function(v){
      const r=originalNavigate(v);
      requestAnimationFrame(()=>kyNormalizeDigits(document.body));
      return r;
    };
  }
  const originalRenderCurrent=window.renderCurrent;
  if(originalRenderCurrent){
    window.renderCurrent=function(){
      const r=originalRenderCurrent.apply(this,arguments);
      requestAnimationFrame(()=>kyNormalizeDigits(document.body));
      return r;
    };
  }

  window.addEventListener('load',()=>{
    setTimeout(()=>kyNormalizeDigits(document.body),50);
    setTimeout(()=>kyNormalizeDigits(document.body),350);
    try{ updateSyncPill(); }catch(e){}
  });
  setTimeout(()=>kyNormalizeDigits(document.body),0);
  setTimeout(()=>kyNormalizeDigits(document.body),700);
})();
</script>

<script>
(function(){
  'use strict';

  /* --------------------------------------------------------------------------
   * 1) OpenRouter: migrate deprecated model selections to the current free
   *    router. OpenRouter's free-model router dynamically selects a free model
   *    and supports structured-output-aware routing.
   * ------------------------------------------------------------------------ */
  const KY_OR_FREE = 'openrouter/free';
  const KY_OR_MODELS = [
    { id: 'openrouter/free', label: 'OpenRouter Free — رایگان و خودکار (پیشنهادی)' },
    { id: 'nvidia/nemotron-3-ultra-550b-a55b:free', label: 'Nemotron 3 Ultra — رایگان' },
    { id: 'qwen/qwen3.5-35b-a3b', label: 'Qwen 3.5 35B A3B — پرداختی' },
    { id: 'qwen/qwen3.5-plus-20260420', label: 'Qwen 3.5 Plus — پرداختی' },
    { id: 'qwen/qwen3.6-35b-a3b', label: 'Qwen 3.6 35B A3B — پرداختی' }
  ];
  try {
    if (Array.isArray(window.OPENROUTER_MODELS)) {
      OPENROUTER_MODELS.splice(0, OPENROUTER_MODELS.length, ...KY_OR_MODELS);
    }
  } catch(_) {}

  function kyMigrateAIConfig(){
    try{
      S.settings.ai = S.settings.ai || {};
      const a=S.settings.ai;
      const old=String(a.openrouterModel||'');
      if(!old || /:free$/i.test(old) || old==='qwen/qwen3.6-plus' || old==='qwen/qwen3.6-plus:free'){
        a.openrouterModel=KY_OR_FREE;
      }
      const gm=String(a.geminiModel||'');
      const validGemini=new Set(['gemini-3.8-flash','gemini-3.7-flash','gemini-3.6-flash','gemini-3.5-flash','gemini-3.5-flash-lite']);
      if(!validGemini.has(gm)) a.geminiModel='gemini-3.8-flash';
      if(typeof saveSettings==='function') saveSettings().catch(()=>{});
    }catch(_){}
  }
  kyMigrateAIConfig();

  /* --------------------------------------------------------------------------
   * 2) More reliable Gemini diagnostics.
   *    First validate that the key can access the Models API, then test the
   *    exact generateContent route used by the app. This separates bad key,
   *    disabled API, model problems and network/CORS/VPN failures.
   * ------------------------------------------------------------------------ */
  async function kyFetchJson(url, options, timeoutMs){
    const controller=new AbortController();
    const t=setTimeout(()=>controller.abort(), timeoutMs||30000);
    try{
      const res=await fetch(url,Object.assign({},options||{}, {signal:controller.signal}));
      const raw=await res.text();
      let data=null; try{data=raw?JSON.parse(raw):null;}catch(_){}
      return {res,data,raw};
    }catch(e){
      if(e && e.name==='AbortError') throw new Error('زمان پاسخ تمام شد');
      throw new Error('درخواست شبکه اجرا نشد؛ VPN/فایروال/اتصال اینترنت را بررسی کن');
    }finally{clearTimeout(t);}
  }

  async function kyGeminiConnectionTest(){
    const form=document.querySelector('form[data-form="ai-settings"]');
    const a=S.settings.ai||{};
    const typedKey=String(form && form.geminiKey ? form.geminiKey.value : '').trim();
    const key=typedKey || String(a.geminiKey||'').trim();
    const typedModel=String(form && form.geminiModel ? form.geminiModel.value : '').trim();
    const model=typedModel || String(a.geminiModel||'gemini-3.8-flash');
    if(!key) throw new Error('کلید Gemini وارد نشده است');

    const models=await kyFetchJson('https://generativelanguage.googleapis.com/v1beta/models',{
      method:'GET',
      headers:{'x-goog-api-key':key,'Accept':'application/json'}
    },20000);
    if(!models.res.ok){
      const msg=models.data?.error?.message || models.raw?.slice(0,220) || ('HTTP '+models.res.status);
      if(models.res.status===400||models.res.status===401) throw new Error('کلید Gemini نامعتبر است یا ساختار کلید مشکل دارد: '+msg);
      if(models.res.status===403) throw new Error('کلید Gemini معتبر است اما دسترسی API برای آن فعال نیست یا محدودیت کلید مانع درخواست شده است: '+msg);
      throw new Error('Gemini Models API خطا داد: HTTP '+models.res.status+' — '+msg);
    }

    const list=Array.isArray(models.data?.models)?models.data.models:[];
    const resource=list.find(x=>String(x.name||'')==='models/'+model);
    if(!resource){
      throw new Error('مدل انتخاب‌شده در لیست API این کلید نیست: '+model);
    }
    const supported=resource.supportedGenerationMethods||[];
    if(!supported.includes('generateContent')){
      throw new Error('مدل '+model+' از generateContent پشتیبانی نمی‌کند');
    }

    const url='https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent';
    const body={
      contents:[{role:'user',parts:[{text:'فقط این JSON را برگردان: {"ok":true}'}]}],
      generationConfig:{temperature:0,maxOutputTokens:100,responseMimeType:'application/json'}
    };
    const gen=await kyFetchJson(url,{
      method:'POST',
      headers:{'Content-Type':'application/json','x-goog-api-key':key,'Accept':'application/json'},
      body:JSON.stringify(body)
    },30000);
    if(!gen.res.ok){
      const msg=gen.data?.error?.message || gen.raw?.slice(0,260) || ('HTTP '+gen.res.status);
      if(gen.res.status===400) throw new Error('درخواست Gemini رد شد: '+msg);
      if(gen.res.status===401||gen.res.status===403) throw new Error('کلید Gemini یا مجوز API مشکل دارد: '+msg);
      if(gen.res.status===404) throw new Error('مدل Gemini پیدا نشد: '+model);
      if(gen.res.status===429) throw new Error('سهم/Rate Limit Gemini پر شده است');
      throw new Error('Gemini generateContent خطا داد: HTTP '+gen.res.status+' — '+msg);
    }
    return 'اتصال موفق — کلید، مدل و generateContent همگی قابل دسترسی‌اند';
  }

  /* --------------------------------------------------------------------------
   * 3) Test current OpenRouter configuration with current form values. Empty
   *    masked inputs never overwrite the stored key.
   * ------------------------------------------------------------------------ */
  async function kyOpenRouterConnectionTest(){
    const form=document.querySelector('form[data-form="ai-settings"]');
    const a=S.settings.ai||{};
    const typedKey=String(form && form.openrouterKey ? form.openrouterKey.value : '').trim();
    const key=typedKey || String(a.openrouterKey||'').trim();
    const typedModel=String(form && form.openrouterModel ? form.openrouterModel.value : '').trim();
    const model=typedModel || String(a.openrouterModel||KY_OR_FREE);
    if(!key) throw new Error('کلید OpenRouter وارد نشده است');

    const controller=new AbortController();
    const t=setTimeout(()=>controller.abort(),30000);
    let res;
    try{
      res=await fetch('https://openrouter.ai/api/v1/chat/completions',{
        method:'POST',signal:controller.signal,
        headers:{
          'Authorization':'Bearer '+key,
          'Content-Type':'application/json',
          'HTTP-Referer':location.href.startsWith('http')?location.href:location.origin,
          'X-Title':'KonkoorYar'
        },
        body:JSON.stringify({
          model,
          messages:[
            {role:'system',content:'فقط JSON معتبر برگردان.'},
            {role:'user',content:'فقط {"ok":true} را برگردان.'}
          ],
          max_tokens:100,
          temperature:0,
          response_format:{type:'json_object'}
        })
      });
      const raw=await res.text();
      let data=null; try{data=raw?JSON.parse(raw):null;}catch(_){}
      if(!res.ok){
        const msg=data?.error?.message || raw?.slice(0,280) || ('HTTP '+res.status);
        if(res.status===401) throw new Error('کلید OpenRouter نامعتبر است: '+msg);
        if(res.status===402) throw new Error('کلید معتبر است ولی اعتبار/بودجه OpenRouter کافی نیست: '+msg);
        if(res.status===429) throw new Error('Rate Limit / سهم OpenRouter پر شده است: '+msg);
        if(res.status===404) throw new Error('مدل OpenRouter پیدا نشد: '+model);
        throw new Error('OpenRouter خطا داد: HTTP '+res.status+' — '+msg);
      }
      return 'اتصال موفق — مدل '+model+' پاسخ داد';
    }catch(e){
      if(e && e.name==='AbortError') throw new Error('زمان پاسخ OpenRouter تمام شد');
      throw e;
    }finally{clearTimeout(t);}
  }

  function kyShowAIResults(results){
    const el=document.getElementById('aiTestResult'); if(!el) return;
    el.innerHTML=results.map(r=>
      '<div class="card card-inset ky-ai-diagnostic" style="padding:12px;margin-top:8px;border:1px solid '+(r.ok?'var(--ok)':'var(--bad)')+'">'+
        '<div class="flex items-center gap-2" style="color:'+(r.ok?'var(--ok)':'var(--bad)')+'">'+
        (r.ok?ICONS.check:ICONS.warning)+
        '<b class="t-sm">'+esc(r.provider)+': '+esc(r.message)+'</b></div>'+
      '</div>'
    ).join('');
  }

  async function kyRunAIConnectionTest(){
    const el=document.getElementById('aiTestResult');
    if(el) el.innerHTML='<div class="card card-inset" style="padding:12px"><div class="flex items-center gap-2"><span class="spinner"></span><span class="t-xs muted">در حال تست واقعی کلید و مدل…</span></div></div>';
    const form=document.querySelector('form[data-form="ai-settings"]');
    try{
      if(form?.openrouterModel?.value) S.settings.ai.openrouterModel=form.openrouterModel.value;
      if(form?.geminiModel?.value) S.settings.ai.geminiModel=form.geminiModel.value;
      const results=[];
      if(String(form?.geminiKey?.value||'').trim() || String(S.settings.ai.geminiKey||'').trim()){
        try{ results.push({provider:'Gemini',ok:true,message:await kyGeminiConnectionTest()}); }
        catch(e){ results.push({provider:'Gemini',ok:false,message:e.message||String(e)}); }
      }
      if(String(form?.openrouterKey?.value||'').trim() || String(S.settings.ai.openrouterKey||'').trim()){
        try{ results.push({provider:'OpenRouter',ok:true,message:await kyOpenRouterConnectionTest()}); }
        catch(e){ results.push({provider:'OpenRouter',ok:false,message:e.message||String(e)}); }
      }
      kyShowAIResults(results);
    }catch(e){
      kyShowAIResults([{provider:'AI',ok:false,message:e.message||String(e)}]);
    }
  }

  /* Intercept the old click listener before it gets to the legacy test code. */
  document.addEventListener('click',function(e){
    const el=e.target && e.target.closest ? e.target.closest('[data-action="test-ai-connection"]') : null;
    if(!el) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    kyRunAIConnectionTest();
  },true);

  /* --------------------------------------------------------------------------
   * 4) PWA install UX. Browser support controls whether the prompt exists;
   *    the website cannot force Brave Android to mint a real WebAPK.
   * ------------------------------------------------------------------------ */
  let kyDeferredInstallPrompt=null;

  function kyStandalone(){
    return window.matchMedia && window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true;
  }
  function kyGetInstallButton(){
    let b=document.getElementById('kyInstallButton');
    if(b) return b;
    const actions=document.querySelector('.top-actions');
    if(!actions) return null;
    b=document.createElement('button');
    b.type='button';
    b.id='kyInstallButton';
    b.className='icon-btn ky-install-btn';
    b.setAttribute('aria-label','نصب برنامه');
    b.title='نصب کنکوریار';
    b.innerHTML=(ICONS.download||'')+'<span class="ky-install-label">نصب</span>';
    actions.insertBefore(b,actions.firstChild);
    b.addEventListener('click',async()=>{
      if(!kyDeferredInstallPrompt){
        alert('این مرورگر فعلاً نصب مستقیم PWA را ارائه نکرده است. برای نصب واقعی، همین صفحه را در Google Chrome باز کن و گزینه Install را بزن.');
        return;
      }
      const prompt=kyDeferredInstallPrompt;
      kyDeferredInstallPrompt=null;
      b.classList.remove('ky-install-ready');
      try{
        await prompt.prompt();
        await prompt.userChoice;
      }catch(_){}
    });
    return b;
  }

  window.addEventListener('beforeinstallprompt',function(e){
    e.preventDefault();
    kyDeferredInstallPrompt=e;
    const b=kyGetInstallButton();
    if(b && !kyStandalone()) b.classList.add('ky-install-ready');
  });

  window.addEventListener('appinstalled',function(){
    kyDeferredInstallPrompt=null;
    const b=document.getElementById('kyInstallButton');
    if(b) b.classList.remove('ky-install-ready');
  });

  function kyEnsurePWAInstallAssets(){
    if(!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
    const p=location.pathname;
    const base=p.endsWith('/')?p:p.slice(0,p.lastIndexOf('/')+1);
    navigator.serviceWorker.register(base+'sw.js',{scope:base}).catch(()=>{});
  }

  document.addEventListener('DOMContentLoaded',function(){
    kyGetInstallButton();
    kyEnsurePWAInstallAssets();
  });
  setTimeout(()=>{kyGetInstallButton();kyEnsurePWAInstallAssets();},1500);
})();
</script>

    try {
      if (!currentUser || !currentProfile || !currentProfile.partner_id) return null;
      const a = String(currentUser.id || '');
      const b = String(currentProfile.partner_id || '');
      if (!a || !b || a === b) return null;
      const ids = [a, b].sort();
      return 'couple:' + ids[0] + ':' + ids[1];
    } catch (_) {
      return null;
    }
  }

  function todayCompletedSeconds() {
    try {
      const key = typeof todayKey === 'function' ? todayKey() : '';
      return (CACHE?.sessions || [])
        .filter(s => !s.deleted_at && s.day === key)
        .reduce((sum, s) => sum + Math.max(0, Number(s.seconds) || 0), 0);
    } catch (_) {
      return 0;
    }
  }

  function myLiveTodaySeconds() {
    let total = todayCompletedSeconds();
    try {
      if (Timer && Timer.state && Timer.state.status === 'running') {
        total += Math.max(0, Number(Timer.elapsedSeconds()) || 0);
      }
    } catch (_) {}
    return total;
  }

  function fmtSeconds(seconds) {
    seconds = Math.max(0, Math.floor(Number(seconds) || 0));
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    const s = seconds % 60;
    if (h > 0) return faNum(String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0'));
    return faNum(String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0'));
  }

  function partnerLiveTodaySeconds() {
    const p = KY.partnerPresence;
    if (!p) return 0;
    let base = Math.max(0, Number(p.today_seconds) || 0);
    if (p.status === 'running' && p.started_at) {
      base += Math.max(0, Math.floor((Date.now() - Number(p.started_at)) / 1000));
    }
    return base;
  }

  function safeRenderPartner() {
    try {
      if (typeof renderPartnerCard === 'function') renderPartnerCard();
    } catch (_) {}
  }

  function renderCoupleLiveCard() {
    if (!currentUser) return '';
    if (!currentProfile || !currentProfile.partner_id) {
      return '<div class="card section">' +
        '<div class="card-head"><h3>رقابت زوجی</h3></div>' +
        '<p class="t-sm muted" style="line-height:2">برای دیدن تایمر زنده و مقایسه آمار، حساب همسرت را از بخش حساب کاربری لینک کن.</p>' +
      '</div>';
    }

    const my = myLiveTodaySeconds();
    const partner = partnerLiveTodaySeconds();
    const pp = KY.partnerPresence;
    const isRunning = !!(pp && pp.status === 'running' && pp.subject);
    const sj = isRunning && typeof subj === 'function' ? subj(pp.subject) : null;

    const partnerStatus = !pp
      ? '<span class="badge">آفلاین</span>'
      : isRunning
        ? '<span class="badge ok"><span class="dot"></span>در حال مطالعه</span>'
        : '<span class="badge ok"><span class="dot"></span>آنلاین</span>';

    return '<div class="card section" data-couple-live-card="1">' +
      '<div class="card-head">' +
        '<h3>رقابت زنده</h3>' +
        partnerStatus +
      '</div>' +
      '<div class="grid g2" style="gap:10px">' +
        '<div class="card card-inset" style="padding:13px">' +
          '<div class="t-xs muted">امروز تو</div>' +
          '<div class="mono" style="font-size:25px;font-weight:800;margin-top:4px">' + fmtSeconds(my) + '</div>' +
          '<div class="t-xs muted" style="margin-top:3px">مطالعه امروز</div>' +
        '</div>' +
        '<div class="card card-inset" style="padding:13px">' +
          '<div class="t-xs muted">امروز همسر</div>' +
          '<div class="mono" style="font-size:25px;font-weight:800;margin-top:4px">' + fmtSeconds(partner) + '</div>' +
          '<div class="t-xs muted" style="margin-top:3px">' +
            (isRunning && sj ? 'در حال مطالعه ' + esc(sj.name) : (pp ? 'آنلاین' : 'آفلاین')) +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function newPartnerCardHtml() {
    if (!currentUser) return '';
    if (!currentProfile || !currentProfile.partner_id) {
      return '<div class="card section">' +
        '<div class="card-head">' + ICONS.info + '<h3>شریک مطالعه</h3></div>' +
        '<p class="t-sm muted mb-3" style="line-height:2">برای دیدن وضعیت زنده و رقابت، حساب شریک را لینک کن.</p>' +
        '<button class="btn btn-sm btn-primary" data-action="open-link-partner">' +
          ICONS.plus + '<span>لینک شریک</span>' +
        '</button>' +
      '</div>';
    }

    if (!KY.partnerPresence) {
      return '<div class="card section">' +
        '<div class="card-head">' + ICONS.info + '<h3>وضعیت شریک</h3><span class="badge">آفلاین</span></div>' +
        '<p class="t-sm muted">همسر آفلاین است.</p>' +
        '<div class="t-xs muted mt-2">مجموع امروز همسر: <b class="mono">' + fmtSeconds(0) + '</b></div>' +
      '</div>';
    }

    const p = KY.partnerPresence;
    const running = p.status === 'running' && p.subject;
    const sj = running && typeof subj === 'function' ? subj(p.subject) : null;
    const liveTimer = running && p.started_at
      ? Math.max(0, Math.floor((Date.now() - Number(p.started_at)) / 1000))
      : 0;

    return '<div class="card section">' +
      '<div class="card-head">' + ICONS.flame +
        '<h3>وضعیت زنده همسر</h3>' +
        '<span class="badge ok"><span class="dot"></span>آنلاین</span>' +
      '</div>' +
      '<div class="flex items-center gap-3">' +
        (sj ? '<span style="width:12px;height:12px;border-radius:50%;background:' + sj.color + ';flex:none"></span>' : '') +
        '<div style="flex:1;min-width:0">' +
          '<b class="t-sm">' + (sj ? 'در حال مطالعه ' + esc(sj.name) : 'فعلاً مطالعه نمی‌کند') + '</b>' +
          (running ? '<div class="mono" style="font-size:23px;font-weight:800" id="kyPartnerLiveTimer">' + fmtSeconds(liveTimer) + '</div>' : '') +
          '<div class="t-xs muted mt-1">مجموع مطالعه امروز: <b class="mono" id="kyPartnerTodayTotal">' + fmtSeconds(partnerLiveTodaySeconds()) + '</b></div>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  async function kyStartPresence() {
    if (!sb || !currentUser || !currentProfile || !currentProfile.partner_id) return;
    const topic = pairTopic();
    if (!topic) return;

    try {
      if (KY.presenceChannel && sb) await sb.removeChannel(KY.presenceChannel);
    } catch (_) {}

    KY.partnerPresence = null;
    KY.presenceChannel = sb.channel(topic, {
      config: {
        private: true,
        presence: { key: currentUser.id }
      }
    });

    KY.presenceChannel.on('presence', { event: 'sync' }, () => {
      try {
        const state = KY.presenceChannel.presenceState();
        const others = Object.keys(state).filter(k => k !== currentUser.id);
        if (!others.length) {
          KY.partnerPresence = null;
          safeRenderPartner();
          return;
        }

        // Because the SQL policy only lets the two linked users enter this topic,
        // the only valid "other" user here is the linked partner.
        const list = state[others[0]] || [];
        const payload = list[0] || null;
        if (!payload) {
          KY.partnerPresence = null;
        } else {
          KY.partnerPresence = {
            online: payload.online !== false,
            status: payload.status || (payload.subject ? 'running' : 'online'),
            subject: payload.subject || null,
            started_at: payload.started_at || null,
            today_seconds: Math.max(0, Number(payload.today_seconds) || 0),
            updated_at: payload.updated_at || Date.now()
          };
        }
        safeRenderPartner();
      } catch (err) {
        try { logError('couple presence sync: ' + (err.message || err)); } catch (_) {}
      }
    });

    KY.presenceChannel.on('presence', { event: 'join' }, () => safeRenderPartner());
    KY.presenceChannel.on('presence', { event: 'leave' }, () => {
      KY.partnerPresence = null;
      safeRenderPartner();
    });

    await KY.presenceChannel.subscribe(async status => {
      if (status === 'SUBSCRIBED') {
        await kyTrackPresence();
      }
    });
  }

  async function kyTrackPresence() {
    if (!KY.presenceChannel || !currentUser) return;
    try {
      const running = !!(Timer && Timer.state && Timer.state.status === 'running');
      const state = running ? Timer.state : null;
      const payload = {
        online: true,
        status: running ? 'running' : 'online',
        subject: running ? state.subject : null,
        started_at: running ? state.started_at : null,
        today_seconds: myLiveTodaySeconds(),
        day: typeof todayKey === 'function' ? todayKey() : null,
        updated_at: Date.now()
      };
      await KY.presenceChannel.track(payload);
    } catch (err) {
      try { logError('couple presence track: ' + (err.message || err)); } catch (_) {}
    }
  }

  function kyStopPresence() {
    return (async () => {
      try {
        if (KY.presenceChannel) {
          try { await KY.presenceChannel.untrack(); } catch (_) {}
          try { if (sb) await sb.removeChannel(KY.presenceChannel); } catch (_) {}
        }
      } finally {
        KY.presenceChannel = null;
        KY.partnerPresence = null;
      }
    })();
  }

  async function kyLoadComparison(mode) {
    if (!sb || !currentUser || !currentProfile?.partner_id || KY.comparisonBusy) return null;
    KY.comparisonBusy = true;
    try {
      const today = new Date();
      let start = new Date(today);
      let end = new Date(today);
      if (mode === 'monthly') {
        const key = typeof jalaliMonthKey === 'function' ? jalaliMonthKey(today) : '';
        let d = new Date(today);
        let guard = 0;
        while (guard < 32 && typeof jalaliMonthKey === 'function' && jalaliMonthKey(d) === key) {
          d.setDate(d.getDate() - 1);
          guard++;
        }
        d.setDate(d.getDate() + 1);
        start = d;
      } else {
        start.setDate(start.getDate() - 6);
      }
      const toKey = d => typeof isoDay === 'function' ? isoDay(d) : d.toISOString().slice(0,10);
      const { data, error } = await sb.rpc('get_couple_comparison', {
        p_start: toKey(start),
        p_end: toKey(end)
      });
      if (error) throw error;
      KY.lastComparison = { mode, data };
      return data;
    } catch (err) {
      try { logError('couple comparison: ' + (err.message || err)); } catch (_) {}
      return null;
    } finally {
      KY.comparisonBusy = false;
    }
  }

  function comparisonCard(data, title) {
    if (!data || !data.me || !data.partner) return '';
    const me = Number(data.me.study_seconds) || 0;
    const partner = Number(data.partner.study_seconds) || 0;
    const diff = me - partner;
    const winner = diff === 0 ? 'مساوی' : diff > 0 ? 'تو جلو هستی' : 'همسرت جلو است';

    return '<div class="card section" data-couple-comparison="1">' +
      '<div class="card-head"><h3>' + esc(title) + '</h3><span class="badge brand">' + esc(winner) + '</span></div>' +
      '<div class="grid g2" style="gap:10px">' +
        '<div class="card card-inset" style="padding:13px"><div class="t-xs muted">تو</div>' +
          '<div class="mono" style="font-size:24px;font-weight:800">' + fmtSeconds(me) + '</div>' +
          '<div class="t-xs muted">جلسه: ' + faNum(Number(data.me.session_count)||0) + ' · تست: ' + faNum(Number(data.me.test_count)||0) + '</div>' +
        '</div>' +
        '<div class="card card-inset" style="padding:13px"><div class="t-xs muted">همسر</div>' +
          '<div class="mono" style="font-size:24px;font-weight:800">' + fmtSeconds(partner) + '</div>' +
          '<div class="t-xs muted">جلسه: ' + faNum(Number(data.partner.session_count)||0) + ' · تست: ' + faNum(Number(data.partner.test_count)||0) + '</div>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function appendComparison(rootSelector, data, title) {
    const root = document.querySelector(rootSelector);
    if (!root) return;
    let host = root.querySelector('[data-couple-comparison-host]');
    if (!host) {
      host = document.createElement('div');
      host.setAttribute('data-couple-comparison-host', '1');
      root.appendChild(host);
    }
    host.innerHTML = comparisonCard(data, title);
  }

  function patchHome() {
    try {
      if (typeof renderHome !== 'function') return;
      if (!window.__KY_ORIGINAL_RENDER_HOME) {
        window.__KY_ORIGINAL_RENDER_HOME = renderHome;
        renderHome = async function () {
          await window.__KY_ORIGINAL_RENDER_HOME();
          const host = document.querySelector('#homeRoot [data-partner-card]');
          if (host) host.innerHTML = newPartnerCardHtml();
          const home = document.getElementById('homeRoot');
          if (home) {
            let live = home.querySelector('[data-couple-live-host]');
            if (!live) {
              live = document.createElement('div');
              live.setAttribute('data-couple-live-host','1');
              home.appendChild(live);
            }
            live.innerHTML = renderCoupleLiveCard();
          }
        };
      }
      if (window.RENDER) window.RENDER.home = renderHome;
    } catch (err) {
      try { logError('patch home: ' + (err.message || err)); } catch (_) {}
    }
  }

  function patchViews() {
    try {
      if (typeof renderStats === 'function' && !window.__KY_ORIGINAL_RENDER_STATS) {
        window.__KY_ORIGINAL_RENDER_STATS = renderStats;
        renderStats = async function () {
          await window.__KY_ORIGINAL_RENDER_STATS();
          const data = await kyLoadComparison('weekly');
          appendComparison('#statsRoot', data, 'رقابت هفتگی زوجی');
        };
      }
      if (typeof renderMonthly === 'function' && !window.__KY_ORIGINAL_RENDER_MONTHLY) {
        window.__KY_ORIGINAL_RENDER_MONTHLY = renderMonthly;
        renderMonthly = async function () {
          await window.__KY_ORIGINAL_RENDER_MONTHLY();
          const data = await kyLoadComparison('monthly');
          appendComparison('#monthlyRoot', data, 'رقابت ماهانه زوجی');
        };
      }
      if (window.RENDER) {
        if (typeof renderStats === 'function') window.RENDER.stats = renderStats;
        if (typeof renderMonthly === 'function') window.RENDER.monthly = renderMonthly;
      }
    } catch (err) {
      try { logError('patch views: ' + (err.message || err)); } catch (_) {}
    }
  }

  function patchBindings() {
    try {
      // The original timer save/clear calls trackPresence(), so replacing this
      // function is enough to publish only on meaningful state changes.
      if (!window.__KY_ORIGINAL_START_PRESENCE) {
        try { window.__KY_ORIGINAL_START_PRESENCE = startPresence; } catch (_) {}
      }
      if (!window.__KY_ORIGINAL_TRACK_PRESENCE) {
        try { window.__KY_ORIGINAL_TRACK_PRESENCE = trackPresence; } catch (_) {}
      }
      if (!window.__KY_ORIGINAL_STOP_PRESENCE) {
        try { window.__KY_ORIGINAL_STOP_PRESENCE = stopPresence; } catch (_) {}
      }
      if (!window.__KY_ORIGINAL_PARTNER_CARD_HTML) {
        try { window.__KY_ORIGINAL_PARTNER_CARD_HTML = partnerCardHtml; } catch (_) {}
      }

      startPresence = kyStartPresence;
      trackPresence = kyTrackPresence;
      stopPresence = kyStopPresence;
      partnerCardHtml = newPartnerCardHtml;

      patchHome();
      patchViews();
      KY.installed = true;
    } catch (err) {
      try { console.error('KY couple patch failed', err); } catch (_) {}
    }
  }

  function refreshNow() {
    patchBindings();
    if (currentUser && currentProfile?.partner_id) {
      try { kyStartPresence(); } catch (_) {}
    }
  }

  // Run immediately and again after the app has finished bootstrapping.
  refreshNow();
  setTimeout(refreshNow, 500);
  setTimeout(refreshNow, 1500);

  // Live clock is updated by the final stable ticker below; no DOM rebuild loop here.

  window.addEventListener('online', () => {
    setTimeout(() => {
      patchBindings();
      if (currentUser && currentProfile?.partner_id) kyStartPresence().catch(()=>{});
    }, 300);
  });

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && currentUser && currentProfile?.partner_id) {
      kyTrackPresence().catch(()=>{});
    }
  });

  window.KY_COUPLE.refresh = refreshNow;
  window.KY_COUPLE.loadComparison = kyLoadComparison;
})();

</script>

async function kyFetch(url,options,timeout=55000){
  const c=new AbortController(); const t=setTimeout(()=>c.abort(),timeout);
  try{return await fetch(url,Object.assign({},options,{signal:c.signal}));}
  catch(e){if(e?.name==='AbortError')throw new Error('زمان پاسخ تمام شد');throw new Error('درخواست شبکه اجرا نشد؛ VPN/فایروال/اتصال اینترنت را بررسی کن');}
  finally{clearTimeout(t);}
}
function kyAiError(provider,status,body){
  let msg='HTTP '+status; try{const j=JSON.parse(body);msg=j?.error?.message||msg;}catch(_){}
  if(status===400&&/api.?key|key/i.test(msg)) return provider+' — کلید نامعتبر است';
  if(status===401) return provider+' — کلید نامعتبر/احراز هویت رد شد';
  if(status===403) return provider+' — دسترسی این کلید/مدل مجاز نیست';
  if(status===404) return provider+' — مدل یا endpoint پیدا نشد';
  if(status===409) return provider+' — درخواست همزمان ناسازگار بود';
  if(status===413) return provider+' — تصویر/درخواست بیش از حد بزرگ است';
  if(status===429) return provider+' — سهم/Rate limit تمام شده؛ مدل رایگان دیگری امتحان می‌کنم';
  if(status>=500) return provider+' — سرور موقتاً خطا داد';
  return provider+' — '+msg.slice(0,260);
}
function kyStructuredPrompt(feature,payload){

async function kyGeminiText(model,key,prompt,imageData){
  if(!key) throw new Error('کلید Gemini تنظیم نشده');
  const parts=[{text:prompt}];
  if(imageData){
    const m=/^data:([^;]+);base64,(.*)$/.exec(imageData); if(!m)throw new Error('فرمت تصویر نامعتبر');
    parts.push({inlineData:{mimeType:m[1],data:m[2]}});
  }
  const url='https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent';
  const body={contents:[{role:'user',parts}],generationConfig:{temperature:.25,maxOutputTokens:5000}};
  const res=await kyFetch(url,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify(body)});
  const raw=await res.text(); if(!res.ok)throw new Error(kyAiError('Gemini',res.status,raw));
  const data=JSON.parse(raw); const text=kyExtractResponseTextGemini(data); if(!text.trim())throw new Error('Gemini پاسخ خالی برگرداند');
  return {provider:'gemini',model,text};
}
async function kyOpenRouterText(model,key,prompt,imageData){
  if(!key) throw new Error('کلید OpenRouter تنظیم نشده');
  const content=imageData ? [
    {type:'text',text:prompt},
    {type:'image_url',image_url:{url:imageData}}
  ] : prompt;
  const res=await kyFetch('https://openrouter.ai/api/v1/chat/completions',{
    method:'POST',
    headers:{'Authorization':'Bearer '+key,'Content-Type':'application/json','HTTP-Referer':location.origin,'X-Title':'KonkoorYar'},
    body:JSON.stringify({model,messages:[{role:'system',content:'تو یک دستیار فارسی متخصص مطالعه و کنکور ایران هستی. پاسخ دقیق و بدون حدس بی‌پایه بده.'},{role:'user',content}],temperature:.2,max_tokens:5000})
  });
  const raw=await res.text(); if(!res.ok)throw new Error(kyAiError('OpenRouter',res.status,raw));
  const data=JSON.parse(raw); const text=kyExtractResponseTextOR(data); if(!text.trim())throw new Error('OpenRouter پاسخ خالی برگرداند');
  return {provider:'openrouter',model,text};
}
function kyParseJSON(text){
  let t=String(text||'').trim().replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/i,'').trim();
  const s=t.indexOf('{'), e=t.lastIndexOf('}');
  if(s>=0&&e>s){try{return JSON.parse(t.slice(s,e+1));}catch(_){} }
  const a=t.indexOf('['), b=t.lastIndexOf(']');
  if(a>=0&&b>a){try{return JSON.parse(t.slice(a,b+1));}catch(_){} }
  throw new Error('خروجی JSON قابل خواندن نبود');
}
async function kyCallStructured(feature,payload){
  const a=S.settings.ai||{}; const errors=[];
  const p=a.primaryProvider||'gemini';
  const providers=p==='openrouter'?['openrouter','gemini']:['gemini','openrouter'];
  for(const provider of providers){
    if(provider==='gemini'&&!a.geminiKey)continue;
    if(provider==='openrouter'&&!a.openrouterKey)continue;
    const list=provider==='gemini'?KY_GEMINI_MODELS:KY_OR_MODELS;
    const selected=provider==='gemini'?a.geminiModel:a.openrouterModel;
    const models=[selected,...list.map(x=>x.id)].filter((x,i,arr)=>x&&arr.indexOf(x)===i);
    for(const model of models.slice(0,Math.min(models.length,4))){
      try{
        const r=provider==='gemini'
          ?await kyGeminiText(model,a.geminiKey,kyStructuredPrompt(feature,payload))
          :await kyOpenRouterText(model,a.openrouterKey,kyStructuredPrompt(feature,payload));
        const parsed=kyParseJSON(r.text);
        return {ok:true,data:(window.validateShapeLocal?validateShapeLocal(feature,parsed):parsed),provider:r.provider,model:r.model};
      }catch(e){errors.push((provider==='gemini'?'Gemini':'OpenRouter')+' / '+model+': '+(e.message||e));}
    }
  }
  throw new Error('AIها موفق نشدند:\n'+errors.slice(0,8).map(x=>'• '+x).join('\n'));
}
function kyCallText(prompt,{imageData=null,preferredVision=false}={}){
  return (async()=>{
    const a=S.settings.ai||{}; const errors=[];
    const providers=(a.primaryProvider||'gemini')==='openrouter'?['openrouter','gemini']:['gemini','openrouter'];
    for(const provider of providers){
      const key=provider==='gemini'?a.geminiKey:a.openrouterKey; if(!key)continue;
      const list=provider==='gemini'?KY_GEMINI_MODELS:KY_OR_MODELS;
      const selected=provider==='gemini'?a.geminiModel:a.openrouterModel;
      const usable=list.filter(x=>!imageData||!preferredVision||x.vision);
      const ids=[selected,...usable.map(x=>x.id)].filter((x,i,arr)=>x&&arr.indexOf(x)===i);
      for(const model of ids.slice(0,5)){
        const meta=list.find(x=>x.id===model);
        if(imageData&&preferredVision&&meta&&!meta.vision)continue;
        try{return provider==='gemini'
          ?await kyGeminiText(model,key,prompt,imageData)
          :await kyOpenRouterText(model,key,prompt,imageData);
        }catch(e){errors.push((provider==='gemini'?'Gemini':'OpenRouter')+' / '+model+': '+(e.message||e));}
      }
    }
    throw new Error(errors.slice(0,10).join('\n'));
  })();
}

function kyMyTodaySeconds(){
  const base=(CACHE.sessions||[]).filter(s=>!s.deleted_at&&s.day===kyTodayKey()).reduce((a,s)=>a+Number(s.seconds||0),0);
  let live=0;
  try{live=Timer?.state?Number(Timer.elapsedSeconds?.()||0):0;}catch(_){}
  return Math.max(0,Math.round(base+live));
}
function kyLivePayload(){
  if(!currentUser||!currentProfile?.partner_id||!sb)return null;
  const running=!!(Timer?.state&&Timer.state.status==='running');
  const elapsed=running?Number(Timer.elapsedSeconds?.()||0):Number(Timer?.elapsedSeconds?.()||0);
  let started=null;
  if(running&&Timer.state?.started_at)started=new Date(Number(Timer.state.started_at)).toISOString();
  const persisted=(CACHE.sessions||[]).filter(s=>!s.deleted_at&&s.day===kyTodayKey()).reduce((a,s)=>a+Number(s.seconds||0),0);
  return {user_id:currentUser.id,partner_id:currentProfile.partner_id,day:kyTodayKey(),today_seconds:Math.max(0,Math.round(persisted)),is_studying:running,subject:running?Timer.state.subject:null,started_at:started,session_elapsed_seconds:Math.max(0,Math.round(elapsed)),updated_at:new Date().toISOString()};
}
async function kyPublishLive(){
  const p=kyLivePayload();if(!p||!sb)return;
  try{await sb.from('couple_live_state').upsert(p,{onConflict:'user_id'});}catch(e){if(!/permission|relation|schema/i.test(String(e.message||''))){} }
}
function kyLiveProjected(state){
  if(!state)return 0;
  let extra=0;
  if(state.is_studying&&state.started_at){extra=Math.max(0,Math.floor((Date.now()-new Date(state.started_at).getTime())/1000));}
  return Math.max(0,Number(state.today_seconds||0)+Number(state.session_elapsed_seconds||0)+extra);
}
function kyPairKey(){

const KY_COACH_MODES={analysis:'وضعیت من را تحلیل کن',plan:'برای امروز و چند روز آینده برنامه عملی بده',lag:'دقیق حساب کن از هدف و پلن فعلی چقدر عقب یا جلو هستم'};
function kyCoachContext(){
  const today=kyTodayKey();
  const weekStart=kyAddDays(today,-6), monthStart=kyAddDays(today,-29);
  const sessions=(CACHE.sessions||[]).filter(s=>!s.deleted_at);
  const agg=(from,to)=>{const x=sessions.filter(s=>s.day>=from&&s.day<=to);return {minutes:Math.round(x.reduce((a,s)=>a+Number(s.seconds||0),0)/60),sessions:x.length,tests:x.reduce((a,s)=>a+Number(s.correct||0)+Number(s.wrong||0)+Number(s.blank||0),0)};};
  const todayAgg=agg(today,today),weekAgg=agg(weekStart,today),monthAgg=agg(monthStart,today);
  const plan=(CACHE.plans||[]).find(p=>p.day===today&&!p.deleted_at); const done=plan?.items?.filter(x=>x.done).length||0,total=plan?.items?.length||0;
  const mistakes=(CACHE.mistakes||[]).filter(m=>!m.deleted_at); const due=mistakes.filter(m=>m.next_review<=today).length;
  const recentProgress=(CACHE.progress||[]).filter(p=>!p.deleted_at).sort((a,b)=>String(b.day).localeCompare(String(a.day))).slice(0,15);
  const exam=(CACHE.exams||[]).filter(e=>!e.deleted_at).slice(-10);
  return {today,todayAgg,weekAgg,monthAgg,plan:{items:total,done,completion:total?Math.round(done/total*100):0},mistakes:{total:mistakes.length,due},progress:recentProgress,exams:exam,goal:{dailyMinutes:Number(S.settings.dailyGoalMinutes||0),dailyTests:Number(S.settings.dailyGoalTests||0),text:String(S.settings.ai?.coachPlanGoal||'')},couple:KY.coupleDashboard};

  const t=kyFinalRows('today'),w=kyFinalRows('week'),m=kyFinalRows('month');
  const meT=t.find(x=>x.user_id===currentUser.id)||{},paT=t.find(x=>x.user_id!==currentUser.id)||{};
  const meW=w.find(x=>x.user_id===currentUser.id)||{},paW=w.find(x=>x.user_id!==currentUser.id)||{};
  const meM=m.find(x=>x.user_id===currentUser.id)||{},paM=m.find(x=>x.user_id!==currentUser.id)||{};
  const live=window.KY?.partnerLive;
  const partnerNow=live?Number(live.today_seconds||0)+Number(live.session_elapsed_seconds||0)+(live.is_studying&&live.started_at?Math.max(0,Math.floor((Date.now()-new Date(live.started_at).getTime())/1000)):0):Number(paT.today_seconds||0);
  const myNow=(typeof kyMyTodaySeconds==='function'?kyMyTodaySeconds():Number(meT.today_seconds||0));
  const ww=Number(meW.week_seconds||0),pw=Number(paW.week_seconds||0),mm=Number(meM.month_seconds||0),pm=Number(paM.month_seconds||0);
  root.innerHTML='<div class="ky-couple-page">'+
    '<div class="page-head"><div><span class="ky-review-kicker">COUPLE</span><h1>رقابت مطالعه</h1><p class="muted">همزمان ببین چه کسی جلوتر است.</p></div><button class="btn" data-action="sync-now">همگام‌سازی</button></div>'+
    '<section class="card ky-couple-card"><div class="ky-couple-top"><div><h3>الان</h3><p>تایمر همسرت بدون بازسازی کارت به‌صورت زنده جلو می‌رود.</p></div><span class="badge ok"><span class="dot"></span>زنده</span></div>'+
      '<div class="ky-live-grid"><div class="ky-live-person me"><div class="ky-live-avatar">تو</div><div><b>'+kyFinalSec(myNow)+'</b><span>مطالعه امروز</span></div></div><div class="ky-vs">VS</div><div class="ky-live-person partner"><div class="ky-live-avatar">♥</div><div><b id="kyFinalPartnerTotal">'+kyFinalSec(partnerNow)+'</b><span>'+(live?.is_studying?'در حال مطالعه':'امروز')+'</span></div></div></div>'+ 
      '<div class="ky-partner-now">'+(live?.is_studying?'<span class="live-pulse"></span><div><b>همسرت الان '+esc(typeof subj==='function'?subj(live.subject).name:'در حال مطالعه')+' می‌خواند</b><strong id="kyFinalPartnerClock">'+kyFinalSec(Number(live.session_elapsed_seconds||0)+(live.started_at?Math.max(0,Math.floor((Date.now()-new Date(live.started_at).getTime())/1000)):0))+'</strong></div>':'<span class="live-pulse off"></span><div><b>همسرت الان در حال مطالعه نیست</b><span>با شروع تایمر، وضعیت زنده می‌شود.</span></div>')+'</div>'+
    '</section>'+
    '<div class="grid g2 section">'+
      '<section class="card"><div class="card-head"><h3>امروز</h3><span class="badge">'+esc(kyFinalWinner(Number(meT.today_seconds||0),Number(paT.today_seconds||0)))+'</span></div><div class="ky-compare-big"><div><span>تو</span><b>'+kyFinalSec(myNow)+'</b></div><div><span>همسرت</span><b>'+kyFinalSec(partnerNow)+'</b></div></div></section>'+
      '<section class="card"><div class="card-head"><h3>این هفته</h3><span class="badge">'+esc(kyFinalWinner(ww,pw))+'</span></div><div class="ky-compare-big"><div><span>تو</span><b>'+kyFinalSec(ww)+'</b></div><div><span>همسرت</span><b>'+kyFinalSec(pw)+'</b></div></div><div class="ky-dual-bar"><i style="width:'+Math.min(100,ww/Math.max(1,Math.max(ww,pw))*100)+'%"></i><i style="width:'+Math.min(100,pw/Math.max(1,Math.max(ww,pw))*100)+'%"></i></div></section>'+ 
      '<section class="card"><div class="card-head"><h3>این ماه</h3><span class="badge">'+esc(kyFinalWinner(mm,pm))+'</span></div><div class="ky-compare-big"><div><span>تو</span><b>'+kyFinalSec(mm)+'</b></div><div><span>همسرت</span><b>'+kyFinalSec(pm)+'</b></div></div><div class="ky-dual-bar"><i style="width:'+Math.min(100,mm/Math.max(1,Math.max(mm,pm))*100)+'%"></i><i style="width:'+Math.min(100,pm/Math.max(1,Math.max(mm,pm))*100)+'%"></i></div></section>'+ 
      '<section class="card"><div class="card-head"><h3>وضعیت رقابت</h3><span class="badge brand">هفته / ماه</span></div><p class="t-sm" style="line-height:2">هفته: <b>'+esc(kyFinalWinner(ww,pw))+'</b><br>ماه: <b>'+esc(kyFinalWinner(mm,pm))+'</b><br>اختلاف هفتگی: <b>'+kyFinalSec(Math.abs(ww-pw))+'</b><br>اختلاف ماهانه: <b>'+kyFinalSec(Math.abs(mm-pm))+'</b></p></section>'+ 
    '</div></div>';
}

/* ---------- Navigation: one shared More menu, no duplicate second menu ---------- */
try{
  if(Array.isArray(BOTTOM_NAV)){
    BOTTOM_NAV.splice(0,BOTTOM_NAV.length,'home','timer','exams','stats');
  }
  kyFinalEnsureCoupleView();
  if(typeof buildNav==='function') buildNav();
  const oldMore=window.kyMoreMenu;
  window.kyMoreMenu=function(){
    try{if(typeof kyToggleMobileMenu==='function'){kyToggleMobileMenu(true);return;}}catch(_){ }
    try{oldMore?.();}catch(_){ }
  };
  try{kyMoreMenu=window.kyMoreMenu;}catch(_){ }
  /* Hide the extra top menu trigger created by the older patch; the original mobile
     hamburger remains the single full navigation entry point. */
  document.querySelectorAll('.mobile-more-btn').forEach(x=>x.style.display='none');
  /* Add Couple to the existing hamburger menu, with correct icon/label. */
  if(typeof kyRenderMobileMenu==='function') kyRenderMobileMenu();
}catch(_){ }

/* ---------- Dedicated couple render registration ---------- */
try{
  if(window.RENDER) window.RENDER.couple=kyFinalRenderCouple;
  window.renderCouple=kyFinalRenderCouple;
  renderCouple=kyFinalRenderCouple;
}catch(_){ }

/* ---------- Account body: show actual linked partner ---------- */
try{
  const oldAccountBody=window.buildAccountBody;
  if(typeof oldAccountBody==='function'){
    window.buildAccountBody=function(){
      const html=oldAccountBody();
      if(!currentProfile?.partner_id)return html;
      const partner=window.KY_LINKED_PARTNER;
      const label=partner?.display_name||partner?.email||'حساب متصل';
      return html.replace('<b class="t-sm">لینک‌شده</b>','<b class="t-sm">'+esc(label)+'</b>');
    };
    try{buildAccountBody=window.buildAccountBody;}catch(_){ }
  }
}catch(_){ }

/* ---------- Fix home card: update in place instead of replacing whole card ---------- */
try{
  const oldTicker=window.KY?.coupleTicker;
  if(oldTicker)clearInterval(oldTicker);
  if(window.KY) window.KY.coupleTicker=setInterval(()=>{
    kyFinalUpdateLiveText();
    const el=document.getElementById('kyFinalPartnerClock');
    const live=window.KY?.partnerLive;
    if(el&&live?.is_studying&&live.started_at){
      const s=Number(live.session_elapsed_seconds||0)+Math.max(0,Math.floor((Date.now()-new Date(live.started_at).getTime())/1000));
      el.textContent=kyFinalSec(s);
    }
  },1000);
}catch(_){ }

/* ---------- Boot: refresh profile and start couple channel once ---------- */
async function kyFinalBootCouple(){
  try{
    if(!currentUser||!sb)return;
    await fetchMyProfile();
    if(currentProfile?.partner_id){
      try{window.KY_LINKED_PARTNER=await fetchPartnerProfile();}catch(_){ }
      try{await kyStartPresenceFinal();}catch(_){ }
      try{await kyLoadCoupleDashboard?.();}catch(_){ }
      try{await kyLoadPartnerLive?.();}catch(_){ }
      try{if(S.activeView==='home')renderHome?.();}catch(_){ }
    }
  }catch(_){ }
}
setTimeout(kyFinalBootCouple,1200);

/* ---------- Expose direct navigation helper ---------- */
window.openCoupleCompetition=function(){kyFinalEnsureCoupleView();navigate('couple');};

})();

</script>
</body>
</html>
