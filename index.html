function navigate(view) {
  if (!VIEW_TITLES[view]) view = 'home';
  S.activeView = view;
  $$('.view').forEach(v => {
    v.classList.toggle('active', v.id === 'view-' + view);
  });
  const bottomTarget = BOTTOM_NAV.includes(view) ? view : 'home';
  $$('#bottomNav button').forEach(b => {
    b.classList.toggle('active', b.dataset.nav === bottomTarget);
  });
  $$('#sideNav button').forEach(b => {
    b.classList.toggle('active', b.dataset.nav === view);
  });
  const titleEl = $('#topTitle');
  if (titleEl) titleEl.textContent = VIEW_TITLES[view] || '';
  const dateEl = $('#topDate');
  if (dateEl) dateEl.textContent = faDate(todayKey(), 'weekday');
  if (window.RENDER && window.RENDER[view]) {
    try { window.RENDER[view](); }
    catch (e) { logError('render ' + view + ': ' + e.message); }
  }
  updateFab();

  catch (e) { window.scrollTo(0, 0); }
}

/* ============================================================================

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

const uid = () => {
  if (window.crypto && typeof crypto.randomUUID === 'function') {
    return crypto.randomUUID();
  }
  return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
};

const pad2 = n => String(n).padStart(2, '0');
const clamp = (n, min, max) => Math.min(max, Math.max(min, n));

/* Persian & Arabic digit maps */
const FA_DIGIT_MAP = {
  '۰': 0, '۱': 1, '۲': 2, '۳': 3, '۴': 4,
  '۵': 5, '۶': 6, '۷': 7, '۸': 8, '۹': 9
};
const AR_DIGIT_MAP = {
  '٠': 0, '١': 1, '٢': 2, '٣': 3, '٤': 4,
  '٥': 5, '٦': 6, '٧': 7, '٨': 8, '٩': 9
};

function toAsciiDigits(s) {
  return String(s ?? '')
    .replace(/[۰-۹]/g, d => String(FA_DIGIT_MAP[d] ?? ''))
    .replace(/[٠-٩]/g, d => String(AR_DIGIT_MAP[d] ?? ''));
}

function toInt(v, fallback = 0) {
  const cleaned = toAsciiDigits(v).replace(/[^\d\-+]/g, '');
  const n = parseInt(cleaned, 10);
  return Number.isFinite(n) ? n : fallback;
}

function toNum(v, fallback = 0) {
  const cleaned = toAsciiDigits(v).replace(/[^\d\-+.]/g, '');
  const n = parseFloat(cleaned);
  return Number.isFinite(n) ? n : fallback;
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[c]));
}

/* Persian digits for display */
const FA_DIGITS = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];

function faNum(v) {
  if (v === null || v === undefined) return '—';
  return String(v).replace(/[0-9]/g, d => FA_DIGITS[+d]);
}

function faNumFloat(v, decimals = 1) {
  if (!Number.isFinite(v)) return '—';
  return faNum(v.toFixed(decimals));
}

/* Time formatters */
function fmtClock(totalSeconds) {
  const s = Math.max(0, Math.floor(totalSeconds));
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  return pad2(h) + ':' + pad2(m) + ':' + pad2(sec);
}

function fmtHM(minutes) {
  const m = Math.max(0, Math.round(minutes));
  const h = Math.floor(m / 60);
  const min = m % 60;
  return pad2(h) + ':' + pad2(min);
}

function fmtHMfa(minutes) {
  return faNum(fmtHM(minutes));
}

function fmtPct(n) {
  if (!Number.isFinite(n)) return '—';
  return faNumFloat(n, 1) + '٪';
}

function fmtDuration(seconds) {
  const s = Math.max(0, Math.floor(seconds));
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  if (h > 0) return faNum(h) + ' ساعت و ' + faNum(m) + ' دقیقه';
  return faNum(m) + ' دقیقه';
}

/* Date helpers */
const DAY_MS = 86400000;

function isoDay(d = new Date()) {
  const dt = d instanceof Date ? d : new Date(d);
  if (isNaN(dt.getTime())) return '';
  return dt.getFullYear() + '-' + pad2(dt.getMonth() + 1) + '-' + pad2(dt.getDate());
}

function parseDay(s) {
  const p = String(s || '').split('-').map(Number);
  if (p.length !== 3 || p.some(n => !Number.isFinite(n))) return new Date(NaN);
  const d = new Date(p[0], p[1] - 1, p[2]);
  return isNaN(d.getTime()) ? new Date(NaN) : d;
}

function todayKey() {
  return isoDay(new Date());
}

function addDays(key, n) {
  const d = parseDay(key);
  if (isNaN(d)) return key;
  d.setDate(d.getDate() + n);
  return isoDay(d);
}

function diffDays(fromKey, toKey) {
  const a = parseDay(fromKey);
  const b = parseDay(toKey);
  if (isNaN(a) || isNaN(b)) return 0;
  return Math.round((b.getTime() - a.getTime()) / DAY_MS);
}

/* Persian date formatting — DAY MONTH YEAR order */
function faDate(v, style) {
  const d = v instanceof Date ? v : parseDay(v);
  if (isNaN(d.getTime())) return '—';
  let opts;
  if (style === 'short') {
    opts = { day: 'numeric', month: 'numeric', year: '2-digit' };
  } else if (style === 'long') {
    opts = { day: 'numeric', month: 'long', year: 'numeric' };
  } else if (style === 'weekday') {
    opts = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
  } else {
    opts = { day: 'numeric', month: 'long', year: 'numeric' };
  }
  try {
    return new Intl.DateTimeFormat('fa-IR-u-ca-persian', opts).format(d);
  } catch (e) {
    try {
      return new Intl.DateTimeFormat('fa-IR', opts).format(d);
    } catch (e2) {
      return faNum(d.toLocaleDateString('en-GB'));
    }
  }
}

function faWeekdayShort(d) {
  const date = d instanceof Date ? d : parseDay(d);
  if (isNaN(date)) return '';
  const names = ['ی', 'د', 'س', 'چ', 'پ', 'ج', 'ش'];
  return names[date.getDay()];
}

function faWeekdayFull(d) {
  const date = d instanceof Date ? d : parseDay(d);
  if (isNaN(date)) return '';
  const names = ['یکشنبه', 'دوشنبه', 'سه‌شنبه', 'چهارشنبه', 'پنجشنبه', 'جمعه', 'شنبه'];
  return names[date.getDay()];
}

function faTime(ts) {
  if (!ts) return '—';
  const d = new Date(ts);
  if (isNaN(d)) return '—';
  try {
    return new Intl.DateTimeFormat('fa-IR', { hour: '2-digit', minute: '2-digit' }).format(d);
  } catch (e) { return '—'; }
}

function relativeDay(key) {
  const diff = diffDays(key, todayKey());
  if (diff === 0) return 'امروز';
  if (diff === 1) return 'دیروز';
  if (diff === -1) return 'فردا';
  if (diff > 1) return faNum(diff) + ' روز پیش';
  return faNum(-diff) + ' روز بعد';
}

/* Week helpers — Persian week starts Saturday */
function weekDaysFrom(key) {
  const d = parseDay(key);
  if (isNaN(d)) return [];
  const jsDow = d.getDay();
  const faDow = (jsDow + 1) % 7;
  const start = new Date(d);
  start.setDate(start.getDate() - faDow);
  const out = [];
  for (let i = 0; i < 7; i++) {
    const x = new Date(start);
    x.setDate(x.getDate() + i);
    out.push(x);
  }
  return out;
}

function jalaliMonthKey(v) {
  const d = v instanceof Date ? v : parseDay(v);
  if (isNaN(d.getTime())) return '';
  try {
    const parts = new Intl.DateTimeFormat('fa-IR-u-ca-persian', {
      year: 'numeric',
      month: 'numeric'
    }).formatToParts(d);
    let y = '', m = '';
    parts.forEach(p => {
      if (p.type === 'year') y = p.value;
      if (p.type === 'month') m = p.value;
    });
    return toAsciiDigits(y) + '-' + String(toAsciiDigits(m)).padStart(2, '0');
  } catch (e) {
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1);
  }
}

function jalaliMonthYearFromDay(day) {
  try {
    const d = parseDay(day);

    const parts = new Intl.DateTimeFormat('fa-IR-u-ca-persian', {
      year: 'numeric',

/* ============================================================================
 * SECTION 2 — INDEXEDDB
 * ========================================================================= */

const DB_NAME = 'konkoorYar';
const DB_VERSION = 3;
let dbInstance = null;

function openDB() {
  return new Promise((resolve, reject) => {
    if (dbInstance) return resolve(dbInstance);
    if (!window.indexedDB) {
      return reject(new Error('IndexedDB پشتیبانی نمی‌شود'));
    }
    const req = indexedDB.open(DB_NAME, DB_VERSION);

    req.onupgradeneeded = (e) => {
      const d = e.target.result;
      const ensure = (name, indexes) => {
        if (d.objectStoreNames.contains(name)) return;
        const s = d.createObjectStore(name, { keyPath: 'id' });
        (indexes || []).forEach(idx => {
          try { s.createIndex(idx, idx, { unique: false }); } catch (e) {}
        });
      };
      ensure('sessions', ['day', 'subject', 'updated_at']);
      ensure('exams', ['day', 'subject', 'updated_at']);
      ensure('mistakes', ['subject', 'next_review', 'updated_at']);
      ensure('plans', ['day', 'updated_at']);
      ensure('notes', ['day', 'updated_at']);
      ensure('progress', ['day', 'subject', 'updated_at']);
      ensure('outbox', ['ts', 'status']);
      ensure('logs', ['ts']);
      if (!d.objectStoreNames.contains('settings')) {
        d.createObjectStore('settings', { keyPath: 'key' });
      }
      if (!d.objectStoreNames.contains('timer')) {
        d.createObjectStore('timer', { keyPath: 'key' });
      }
      if (!d.objectStoreNames.contains('meta')) {
        d.createObjectStore('meta', { keyPath: 'key' });
      }
    };

    req.onsuccess = () => {
      dbInstance = req.result;
      resolve(dbInstance);
    };
    req.onerror = () => reject(req.error);
    req.onblocked = () => reject(new Error('اتصال دیتابیس مسدود شد'));
  });
}

async function idbPut(store, obj) {
  const d = await openDB();
  return new Promise((resolve, reject) => {
    const tx = d.transaction(store, 'readwrite');
    tx.objectStore(store).put(obj);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error || new Error('aborted'));
  });
}

async function idbGet(store, id) {
  const d = await openDB();
  return new Promise((resolve, reject) => {
    const tx = d.transaction(store, 'readonly');
    const req = tx.objectStore(store).get(id);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error || new Error('aborted'));

}

async function idbClear(store) {
  const d = await openDB();
  return new Promise((resolve, reject) => {
    const tx = d.transaction(store, 'readwrite');
    tx.objectStore(store).clear();

}

let lastSaveErrorAt = 0;

async function loadSettings() {
  const s = await idbGet('settings', STORE_KEY);
  if (s) {
    Object.assign(S.settings, s.settings || s);
    if (!S.settings.supabase || !S.settings.supabase.url) {
      S.settings.supabase = { url: SUPABASE_URL, anonKey: SUPABASE_PUBLISHABLE_KEY };
    }
    if (!S.settings.supabase.anonKey) {
      S.settings.supabase.anonKey = SUPABASE_PUBLISHABLE_KEY;
    }
    if (!S.settings.ai) {
      S.settings.ai = {};
    }
    /* Migration from 1.x */
    if (!S.settings.ai.primaryProvider) {
      S.settings.ai.primaryProvider = S.settings.ai.provider || 'gemini';
    }
    if (typeof S.settings.ai.fallbackEnabled !== 'boolean') {
      S.settings.ai.fallbackEnabled = true;
    }
    if (!S.settings.ai.geminiKey) S.settings.ai.geminiKey = GEMINI_API_KEY_DEFAULT;
    if (!S.settings.ai.geminiModel) S.settings.ai.geminiModel = 'gemini-3.5-flash';
    if (!S.settings.ai.openrouterKey) S.settings.ai.openrouterKey = OPENROUTER_API_KEY_DEFAULT;
    if (!S.settings.ai.openrouterModel) S.settings.ai.openrouterModel = 'qwen/qwen3.6-plus:free';
    /* Update default goal */
    if (S.settings.dailyGoalMinutes === 240) S.settings.dailyGoalMinutes = 600;
  } else {
    await saveSettings();
  }
}

async function saveSettings() {
  try {
    await idbPut('settings', { key: STORE_KEY, ...S.settings });
    return true;
  } catch (err) {
    const now = Date.now();
    if (now - lastSaveErrorAt > 30000) {
      lastSaveErrorAt = now;
      toast('ذخیره‌سازی محلی ناموفق بود.', 'error', 4500);
    }
    return false;
  }
}

async function queueOp(op, store, id, payload) {
  const entry = {
    id: uid(),
    ts: Date.now(),
    op,
    store,
    target_id: id,
    payload: payload ? deepClone(payload) : null,
    status: 'pending',
    tries: 0,
    last_error: null
  };
  try {
    await idbPut('outbox', entry);
    updateSyncPill();
  } catch (e) {
    logError('queueOp: ' + e.message);
  }
}

async function logError(msg, ctx) {
  try {
    const entry = {
      id: uid(),
      ts: Date.now(),
      msg: String(msg).slice(0, 400),
      ctx: ctx ? String(JSON.stringify(ctx)).slice(0, 500) : ''
    };
    await idbPut('logs', entry);
    const all = await idbGetAll('logs');
    if (all.length > 100) {
      all.sort((a, b) => a.ts - b.ts);
      for (const l of all.slice(0, all.length - 100)) await idbDelete('logs', l.id);
    }
  } catch (e) {}
}

function calcPercent(correct, wrong, blank) {
  const total = correct + wrong + blank;
  if (total <= 0) return 0;
  return ((3 * correct) - wrong) / (3 * total) * 100;
}

function aggregate(list) {
  let minutes = 0, correct = 0, wrong = 0, blank = 0;
  list.forEach(s => {
    minutes += Math.round(toInt(s.seconds) / 60);
    correct += toInt(s.correct);
    wrong += toInt(s.wrong);
    blank += toInt(s.blank);
  });
  const total = correct + wrong + blank;
  return {
    minutes, correct, wrong, blank, total,
    percent: calcPercent(correct, wrong, blank),
    rawPercent: total > 0 ? (correct / total) * 100 : 0
  };
}

function computeStreak(sessions) {
  const days = new Set(
    sessions.filter(s => !s.deleted_at).map(s => s.day).filter(Boolean)
  );
  if (!days.size) return 0;
  let cursor = new Date();
  if (!days.has(isoDay(cursor))) cursor.setDate(cursor.getDate() - 1);
  let count = 0;
  while (days.has(isoDay(cursor))) {
    count++;
    cursor.setDate(cursor.getDate() - 1);
  }
  return count;
}

function daysToExam() {
  const left = diffDays(todayKey(), S.settings.examDate);
  return Number.isFinite(left) ? Math.max(0, left) : 0;
}

function subjectMinutesMap(sessions) {
  const map = {};
  SUBJECTS.forEach(s => map[s.id] = 0);
  sessions.filter(s => !s.deleted_at).forEach(s => {
    if (map[s.subject] === undefined) map[s.subject] = 0;
    map[s.subject] += Math.round((s.seconds || 0) / 60);
  });
  return map;
}

/* Heatmap level from minutes */
function heatLevelFromMinutes(minutes) {
  if (minutes <= 0) return 0;
  if (minutes < 240) return 1;      /* < 4h */
  if (minutes < 360) return 2;      /* 4-6h */
  if (minutes < 480) return 3;      /* 6-8h */
  if (minutes < 600) return 4;      /* 8-10h */
  return 5;                          /* 10h+ */
}

const Timer = {
  state: null,
  tickHandle: null,
  pendingSubject: 'bio',

  async load() {
    try {
      const s = await idbGet('timer', 'state');
      if (s) this.state = s;
    } catch (e) { logError('Timer.load: ' + e.message); }
  },

  async save() {
    if (!this.state) return;
    try {
      await idbPut('timer', this.state);
      if (typeof trackPresence === 'function' && currentUser) {
        try { trackPresence(); } catch (e) {}
      }
    } catch (e) { logError('Timer.save: ' + e.message); }
  },

  async clear() {
    try { await idbDelete('timer', 'state'); } catch (e) {}
    this.state = null;
    if (typeof trackPresence === 'function' && currentUser) {
      try { trackPresence(); } catch (e) {}
    }
  },

  start(subject) {
    if (!SUBJ_MAP[subject]) return;
    const now = Date.now();
    this.state = {
      key: 'state',
      subject,
      status: 'running',
      started_at: now,
      accumulated_ms: 0,
      day: todayKey(),
      created_at: now
    };
    this.save();
    this.loop();
    this.render();
    if (S.settings.vibrationEnabled && navigator.vibrate) {
      try { navigator.vibrate(30); } catch (e) {}
    }
  },

  pause() {
    if (!this.state || this.state.status !== 'running') return;
    this.state.accumulated_ms += Math.max(0, Date.now() - this.state.started_at);
    this.state.started_at = null;
    this.state.status = 'paused';
    this.save();
    this.stopLoop();
    this.render();
    if (S.settings.vibrationEnabled && navigator.vibrate) {
      try { navigator.vibrate([20, 40, 20]); } catch (e) {}
    }
  },

  resume() {
    if (!this.state || this.state.status === 'running') return;
    this.state.status = 'running';
    this.state.started_at = Date.now();
    this.save();
    this.loop();
    this.render();
  },

  async reset() {
    this.stopLoop();
    await this.clear();
    this.render();
  },

  elapsedMs() {
    if (!this.state) return 0;
    if (this.state.status === 'running' && this.state.started_at) {
      const delta = Math.max(0, Date.now() - this.state.started_at);
      return this.state.accumulated_ms + delta;
    }
    return this.state.accumulated_ms;
  },

  elapsedSeconds() {
    return Math.floor(this.elapsedMs() / 1000);
  },

  loop() {
    this.stopLoop();
    this.tickHandle = setInterval(() => this.render(), 1000);
  },

  stopLoop() {
    if (this.tickHandle) {
      clearInterval(this.tickHandle);
      this.tickHandle = null;
    }
  },

  async finish() {
    if (!this.state) return null;
    const seconds = this.elapsedSeconds();
    if (seconds < 60) return null;
    const session = {
      id: uid(),
      created_at: Date.now(),
      updated_at: Date.now(),
      deleted_at: null,
      device_id: S.settings.deviceId,
      subject: this.state.subject,
      seconds,
      correct: 0,
      wrong: 0,
      blank: 0,
      note: '',
      day: this.state.day || todayKey(),
      type: 'آموزش',
      chapter: ''
    };
    await idbPut('sessions', session);
    await queueOp('upsert', 'sessions', session.id, session);
    await this.clear();
    await refreshCache();
    return session;
  },

  render() {
    const timeEl = $('#ringTime');
    const subEl = $('#ringSub');
    const ringEl = $('#ringFg');
    if (!timeEl || !subEl) return;
    const ms = this.elapsedMs();
    timeEl.textContent = faNum(fmtClock(ms / 1000));
    if (this.state) {
      const n = subj(this.state.subject).name;
      subEl.textContent = this.state.status === 'running'
        ? 'در حال مطالعه — ' + n
        : 'متوقف — ' + n;
    } else {
      subEl.textContent = 'آماده برای شروع';
    }
    if (ringEl) {
      const pct = clamp(ms / 3600000, 0, 1);
      const C = 2 * Math.PI * 88;
      ringEl.style.strokeDasharray = C.toFixed(2);
      ringEl.style.strokeDashoffset = (C * (1 - pct)).toFixed(2);
    }
  }
};

function toast(message, type = 'info', ms = 3200) {
  const host = $('#toasts');
  if (!host) return;
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.setAttribute('role', type === 'error' ? 'alert' : 'status');
  el.innerHTML = '<span class="tdot"></span><span dir="auto">' + esc(message) + '</span>';
  host.appendChild(el);
  requestAnimationFrame(() => el.classList.add('in'));
  setTimeout(() => {
    el.classList.remove('in');
    setTimeout(() => el.remove(), 400);
  }, ms);
}

/* ============================================================================
 * SECTION 10 — MODAL
 * ========================================================================= */

let modalPreviousFocus = null;

function openModal(html, opts) {
  opts = opts || {};
  const root = $('#modalRoot');
  if (!root) return;
  modalPreviousFocus = document.activeElement;
  const wasOpen = root.classList.contains('open');
  root.innerHTML =
    '<div class="overlay" data-action="close-modal"></div>' +
    '<div class="modal' + (opts.wide ? ' wide' : '') + '" role="dialog" aria-modal="true" tabindex="-1">' +
      html +
    '</div>';
  root.classList.add('open');
  document.body.classList.add('modal-open');
  const modal = root.querySelector('.modal');
  if (modal && !wasOpen) {
    const focusable = modal.querySelector(
      'input:not([type=hidden]), select, textarea, button:not(.overlay)'
    );
    setTimeout(() => {
      try { (focusable || modal).focus(); } catch (e) {}
    }, 80);
  }
}

function closeModal() {
  const root = $('#modalRoot');
  if (!root) return;
  root.classList.remove('open');
  root.innerHTML = '';
  document.body.classList.remove('modal-open');
  if (modalPreviousFocus && typeof modalPreviousFocus.focus === 'function') {
    try { modalPreviousFocus.focus(); } catch (e) {}
  }
  modalPreviousFocus = null;
}

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Tab') return;
  const modal = document.querySelector('#modalRoot.open .modal');
  if (!modal) return;
  const focusables = modal.querySelectorAll(
    'a[href], button:not([disabled]), input:not([type=hidden]):not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'
  );
  if (!focusables.length) return;
  const first = focusables[0];
  const last = focusables[focusables.length - 1];
  if (e.shiftKey && document.activeElement === first) {
    e.preventDefault();
    last.focus();
  } else if (!e.shiftKey && document.activeElement === last) {
    e.preventDefault();
    first.focus();
  }
});

function confirmModal(opts) {
  opts = opts || {};
  return new Promise(resolve => {
    openModal(
      '<div class="modal-head"><h3>' + esc(opts.title || 'تأیید') + '</h3></div>' +
      '<p class="t-sm muted" style="margin-bottom:16px;line-height:2">' + esc(opts.message || '') + '</p>' +
      '<div class="modal-actions">' +
        '<button type="button" class="btn" data-confirm-cancel>انصراف</button>' +
        '<button type="button" class="btn ' + (opts.danger ? 'btn-danger' : 'btn-primary') + '" data-confirm-accept>' +
          esc(opts.confirmLabel || 'تأیید') +
        '</button>' +
      '</div>'
    );
    const root = $('#modalRoot');
    const cancelBtn = root.querySelector('[data-confirm-cancel]');
    const acceptBtn = root.querySelector('[data-confirm-accept]');
    const overlay = root.querySelector('.overlay');
    let settled = false;
    const finish = (result) => {
      if (settled) return;
      settled = true;
      closeModal();
      resolve(result);
    };
    if (cancelBtn) cancelBtn.addEventListener('click', () => finish(false));
    if (acceptBtn) acceptBtn.addEventListener('click', () => finish(true));
    if (overlay) overlay.addEventListener('click', () => finish(false));
  });
}

function buildDonutHtml(total, map) {
  if (total <= 0) {
    return '<div class="empty" style="padding:22px 12px">' +
      '<b style="font-size:14px">داده‌ای برای نمایش نیست</b>' +
      '<p style="font-size:12.5px">هنوز در این بازه چیزی ثبت نشده است.</p>' +
    '</div>';
  }
  let grad = 'var(--surface-3) 0% 100%';
  let acc = 0;
  const stops = [];
  SUBJECTS.forEach(s => {
    const m = map[s.id] || 0;
    if (m <= 0) return;
    const pct = (m / total) * 100;
    stops.push(s.color + ' ' + acc.toFixed(3) + '% ' + (acc + pct).toFixed(3) + '%');
    acc += pct;
  });
  if (stops.length) grad = 'conic-gradient(' + stops.join(', ') + ')';
  const legend = SUBJECTS
    .map(s => ({ s, m: map[s.id] || 0 }))
    .filter(x => x.m > 0)
    .sort((a, b) => b.m - a.m)
    .map(x =>
      '<div style="display:flex;align-items:center;gap:8px;font-size:12.5px;padding:4px 0">' +
        '<span style="width:11px;height:11px;border-radius:50%;background:' + x.s.color + ';flex:none"></span>' +
        '<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(x.s.name) + '</span>' +
        '<span class="mono" style="font-size:11.5px;color:var(--ink-2)">' + fmtHMfa(x.m) + ' · ' + fmtPct((x.m / total) * 100) + '</span>' +
      '</div>'
    ).join('');
  return '<div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center">' +
    '<div style="width:150px;height:150px;border-radius:50%;position:relative;flex:none;background:' + grad + ';box-shadow:var(--sh-3)">' +
      '<div style="position:absolute;inset:26px;border-radius:50%;background:var(--surface);"></div>' +
      '<div style="position:absolute;inset:0;display:grid;place-items:center;z-index:2;text-align:center;font-family:var(--font-num)">' +
        '<div><div style="font-size:20px;font-weight:800">' + faNum(Math.floor(total / 60)) + '</div>' +
        '<div style="font-size:11px;color:var(--ink-3)">ساعت</div></div>' +
      '</div>' +
    '</div>' +
    '<div style="flex:1;min-width:170px">' + legend + '</div>' +
  '</div>';
}

function compressImage(file, maxW = 800, maxBytes = 200000) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        let q = 0.85;
        let out = canvas.toDataURL('image/jpeg', q);
        while (out.length * 0.75 > maxBytes && q > 0.3) {
          q -= 0.1;
          out = canvas.toDataURL('image/jpeg', q);
        }
        resolve(out);
      };
      img.onerror = () => reject(new Error('تصویر نامعتبر'));
      img.src = reader.result;
    };
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}

async function copyToClipboard(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) {}
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  } catch (e) {
    return false;
  }
}

function initSupabaseSDK() {
  const cfg = S.settings.supabase || {};
  if (!cfg.url || !cfg.anonKey) return false;
  if (typeof window.supabase === 'undefined' || !window.supabase.createClient) return false;
  if (sb) return true;

  try {
    sb = window.supabase.createClient(cfg.url, cfg.anonKey, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: false,
        storageKey: 'ky.auth'
      },
      realtime: { params: { eventsPerSecond: 5 } },
      global: {
        fetch: (url, opts = {}) => {
          const ctrl = new AbortController();
          const t = setTimeout(() => ctrl.abort(), 20000);
          return fetch(url, { ...opts, signal: opts.signal || ctrl.signal })
            .finally(() => clearTimeout(t));
        }
      }
    });
    return true;
  } catch (err) {
    logError('SB init: ' + (err.message || err));
    return false;
  }
}

function faAuthError(msg) {
  const m = String(msg || '').toLowerCase();
  if (m.includes('invalid login')) return 'ایمیل یا رمز اشتباه است';
  if (m.includes('already registered')) return 'این ایمیل قبلاً ثبت شده';
  if (m.includes('password') && m.includes('6')) return 'رمز باید حداقل ۶ کاراکتر باشد';
  if (m.includes('registration not allowed')) return 'این ایمیل مجاز نیست';
  if (m.includes('database error saving new user')) return 'این ایمیل در لیست مجاز نیست';
  if (m.includes('email not confirmed')) return 'ایمیل هنوز تأیید نشده';
  if (m.includes('rate limit')) return 'تعداد تلاش زیاد است';
  if (m.includes('abort') || m.includes('failed to fetch')) return 'ارتباط با سرور برقرار نشد';
  return msg || 'خطای احراز هویت';
}

async function authSignIn(email, password) {
  if (!sb) throw new Error('Supabase پیکربندی نشده');
  const { data, error } = await sb.auth.signInWithPassword({
    email: String(email).trim().toLowerCase(),
    password
  });
  if (error) throw new Error(faAuthError(error.message));
  return data.user;
}

async function authSignUp(email, password) {
  if (!sb) throw new Error('Supabase پیکربندی نشده');
  const { data, error } = await sb.auth.signUp({
    email: String(email).trim().toLowerCase(),
    password,
    options: { emailRedirectTo: location.origin + location.pathname }
  });
  if (error) throw new Error(faAuthError(error.message));
  return data.user;
}

  try { await stopPresence(); } catch (e) {}

  currentProfile = null;

const TS_FIELDS = ['created_at', 'updated_at', 'deleted_at'];

function toRemoteRow(row, userId) {
  const r = deepClone(row);
  TS_FIELDS.forEach(k => {
    const v = r[k];
    r[k] = (v === null || v === undefined || v === '')
      ? null
      : (typeof v === 'number' ? new Date(v).toISOString() : v);
  });
  r.user_id = userId;
  return r;
}

function fromRemoteRow(row) {
  const r = { ...row };
  TS_FIELDS.forEach(k => {
    r[k] = r[k] == null
      ? null
      : (typeof r[k] === 'number' ? r[k] : new Date(r[k]).getTime());
  });
  return r;
}

async function retryFailedOps() {
  const all = await idbGetAll('outbox');
  for (const o of all) {
    if (o.status === 'failed') {
      o.status = 'pending';
      o.tries = 0;
      o.last_error = null;
      await idbPut('outbox', o);
    }
  }
}

async function pushOutbox() {
  if (!sb || !currentUser) return { pushed: 0, failed: 0 };
  const pending = (await idbGetAll('outbox'))
    .filter(o => o.status === 'pending' || o.status === 'retry');
  pending.sort((a, b) => a.ts - b.ts);
  if (!pending.length) return { pushed: 0, failed: 0 };

  let pushed = 0;
  let failed = 0;

  for (const op of pending) {
    try {
      const table = op.store;
      if (!['sessions', 'exams', 'mistakes', 'plans', 'notes', 'progress'].includes(table)) {
        await idbDelete('outbox', op.id);
        continue;
      }
      const payload = op.payload ? toRemoteRow(op.payload, currentUser.id) : null;
      const res = await sb.from(table).upsert(payload, { onConflict: 'id' });
      if (res.error) throw new Error(res.error.message);
      op.status = 'done';
      op.tries = (op.tries || 0) + 1;
      op.last_error = null;
      await idbPut('outbox', op);
      pushed++;
    } catch (err) {
      failed++;
      op.tries = (op.tries || 0) + 1;
      op.last_error = String(err.message || err).slice(0, 300);
      op.status = op.tries >= 5 ? 'failed' : 'retry';
      await idbPut('outbox', op);
      logError('push ' + op.store + ': ' + op.last_error);
    }
  }

  const cutoff = Date.now() - 24 * 3600 * 1000;
  const all = await idbGetAll('outbox');
  for (const o of all) {
    if (o.status === 'done' && o.ts < cutoff) await idbDelete('outbox', o.id);
  }

  return { pushed, failed };
}

async function pullChanges() {
  if (!sb || !currentUser) return { pulled: 0 };
  const startedAt = Date.now() - 60000;
  let totalPulled = 0;
  let ok = true;
  const tables = ['sessions', 'exams', 'mistakes', 'plans', 'notes', 'progress'];

  for (const t of tables) {
    let cursor = lastPullTs;
    for (let page = 0; page < 40; page++) {
      const { data, error } = await sb.from(t).select('*')
        .eq('user_id', currentUser.id)
        .gte('updated_at', new Date(cursor).toISOString())
        .order('updated_at', { ascending: true })
        .limit(500);
      if (error) {
        ok = false;
        logError('pull ' + t + ': ' + error.message);
        break;
      }
      if (!data || !data.length) break;
      let maxTs = cursor;
      for (const raw of data) {
        const remote = fromRemoteRow(raw);
        const local = await idbGet(t, remote.id);
        if (!local || remote.updated_at > (local.updated_at || 0)) {
          await idbPut(t, remote);
          totalPulled++;
        }
        if (remote.updated_at > maxTs) maxTs = remote.updated_at;
      }
      if (data.length < 500 || maxTs === cursor) break;
      cursor = maxTs;
    }
  }
  if (ok) {
    lastPullTs = startedAt;
    await saveMeta('lastPullTs', lastPullTs);
  }
  return { pulled: totalPulled };
}

async function syncNow(force) {
  if (!sb || !currentUser) return;
  if (syncState.running && !force) return;
  if (!navigator.onLine) return;

  syncState.running = true;
  updateSyncPill();

  try {
    if (force) await retryFailedOps();
    const pr = await pushOutbox();
    await pullChanges();
    await refreshSharedStatsForToday();
    syncState.backoff = pr.failed > 0
      ? Math.min(300000, syncState.backoff * 2)
      : 5000;
    syncState.lastError = null;
  } catch (err) {
    syncState.lastError = err.message || String(err);
    logError('sync: ' + syncState.lastError);
    syncState.backoff = Math.min(300000, syncState.backoff * 2);
  } finally {
    syncState.running = false;
    syncState.lastAttempt = Date.now();
    await refreshCache();
    updateSyncPill();
    updateAccountBtn();
  }
}

let syncLoopHandle = null;

function startSyncLoop() {
  if (syncLoopHandle) clearInterval(syncLoopHandle);
  syncLoopHandle = setInterval(() => {
    if (!navigator.onLine || !sb || !currentUser || syncState.running) return;
    if (Date.now() - syncState.lastAttempt < Math.max(syncState.backoff, 30000)) return;
    syncNow();
  }, 8000);
}

async function startPresence() {
  if (!sb || !currentUser) return;
  try { await stopPresence(); } catch (e) {}
  presenceChannel = sb.channel('partners', {
    config: { presence: { key: currentUser.id } }
  });
  presenceChannel.on('presence', { event: 'sync' }, () => {
    const state = presenceChannel.presenceState();
    const others = Object.keys(state).filter(k => k !== currentUser.id);
    if (!others.length) { partnerPresence = null; renderPartnerCard(); return; }
    const list = state[others[0]] || [];
    if (list[0]) {
      partnerPresence = {
        subject: list[0].subject,
        started_at: list[0].started_at,
        online: true
      };
    } else {
      partnerPresence = null;
    }
    renderPartnerCard();
  });
  presenceChannel.on('presence', { event: 'leave' }, (e) => {
    const leaving = e.key || (e.leftPresences && e.leftPresences[0] && e.leftPresences[0].key);
    if (leaving && leaving !== currentUser.id) {
      partnerPresence = null;
      renderPartnerCard();
    }
  });
  await presenceChannel.subscribe(async (status) => {
    if (status === 'SUBSCRIBED') await trackPresence();
  });
}

async function trackPresence() {
  if (!presenceChannel || !currentUser) return;
  const running = Timer.state && Timer.state.status === 'running';
  const payload = {
    online: true,
    subject: running ? Timer.state.subject : null,
    started_at: running ? Timer.state.started_at : null,
    updated_at: Date.now()
  };
  try { await presenceChannel.track(payload); } catch (e) {}
}

async function stopPresence() {
  if (presenceChannel) {
    try { await presenceChannel.untrack(); } catch (e) {}
    try { await sb.removeChannel(presenceChannel); } catch (e) {}
    presenceChannel = null;
  }
  partnerPresence = null;
}

/* ============================================================================
 * SECTION 15 — AI CLIENT (Gemini → OpenRouter fallback)
 * ---------------------------------------------------------------------------
 * AI call strategy:
 * 1. Try primary provider (default: Gemini)
 * 2. If fails and fallback enabled, try OpenRouter
 * 3. If both fail, throw a clear error message
 * ========================================================================= */

async function aiCall(feature, payload) {
  const aiCfg = S.settings.ai || {};
  const primary = aiCfg.primaryProvider || 'gemini';
  const fallback = aiCfg.fallbackEnabled !== false;

  const errors = [];

  /* Try primary */
  if (primary === 'gemini') {
    try {
      const res = await callGeminiDirect(feature, payload);
      return res;
    } catch (err) {
      errors.push('Gemini: ' + err.message);
      if (!fallback) throw new Error('Gemini: ' + err.message);
    }
    /* Fallback to OpenRouter */
    try {
      const res = await callOpenRouterDirect(feature, payload);
      res.fallbackFrom = 'gemini';
      return res;
    } catch (err) {
      errors.push('OpenRouter: ' + err.message);
    }
  } else {
    /* OpenRouter primary */
    try {
      const res = await callOpenRouterDirect(feature, payload);
      return res;
    } catch (err) {
      errors.push('OpenRouter: ' + err.message);
      if (!fallback) throw new Error('OpenRouter: ' + err.message);
    }
    /* Fallback to Gemini */
    try {
      const res = await callGeminiDirect(feature, payload);
      res.fallbackFrom = 'openrouter';
      return res;
    } catch (err) {
      errors.push('Gemini: ' + err.message);
    }
  }

  /* Both failed */
  throw new Error(
    'اتصال به هر دو سرویس ناموفق بود:\n' +
    errors.map(e => '• ' + e).join('\n') +
    '\n\nبررسی کن: اتصال اینترنت، VPN (برای Gemini)، یا سهم روزانه OpenRouter.'
  );
}

/* ---------- Gemini direct ---------- */
async function callGeminiDirect(feature, payload) {
  const aiCfg = S.settings.ai || {};
  const apiKey = String(aiCfg.geminiKey || '').trim();
  const model = aiCfg.geminiModel || 'gemini-3.5-flash';

  if (!apiKey) throw new Error('کلید Gemini تنظیم نشده');

  const system = getSystemPromptFor(feature);
  const userPrompt = buildUserPromptLocal(feature, payload);

  const url = 'https://generativelanguage.googleapis.com/v1beta/models/' +
    encodeURIComponent(model) + ':generateContent';

  const body = {
    contents: [{
      role: 'user',
      parts: [{ text: system + '\n\n' + userPrompt }]
    }],
    generationConfig: {
      temperature: 0.4,
      maxOutputTokens: 2500,
      responseMimeType: 'application/json'
    }
  };

  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 50000);

  let res;
  try {
    res = await fetch(url, {
      method: 'POST',
      signal: controller.signal,
      headers: {
        'Content-Type': 'application/json',
        'x-goog-api-key': apiKey
      },
      body: JSON.stringify(body)
    });
  } catch (netErr) {
    if (netErr.name === 'AbortError') throw new Error('زمان پاسخ‌دهی تمام شد');
    throw new Error('اتصال برقرار نشد. VPN خود را بررسی کن.');
  } finally {
    clearTimeout(timeoutId);
  }

  if (!res.ok) {
    const errText = await res.text().catch(() => '');
    let msg = 'HTTP ' + res.status;
    try {
      const errJson = JSON.parse(errText);
      if (errJson && errJson.error && errJson.error.message) {
        msg = errJson.error.message;
      }
    } catch (e) {
      if (errText) msg += ': ' + errText.slice(0, 150);
    }
    if (res.status === 400 && /api key/i.test(msg)) msg = 'کلید نامعتبر';
    if (res.status === 403) msg = 'دسترسی مجاز نیست';
    if (res.status === 404) msg = 'مدل در دسترس نیست';
    if (res.status === 429) msg = 'سهم تمام شد';
    throw new Error(msg);
  }

  const data = await res.json();
  const cand = data && data.candidates && data.candidates[0];
  const text = (cand && cand.content && Array.isArray(cand.content.parts))
    ? cand.content.parts.map(p => p.text || '').join('')
    : '';

  if (!text.trim()) {
    const fr = cand && cand.finishReason;
    if (fr === 'SAFETY') throw new Error('فیلتر ایمنی');
    if (fr === 'MAX_TOKENS') throw new Error('پاسخ ناقص');
    if (fr === 'RECITATION') throw new Error('شباهت به منابع');
    throw new Error('پاسخ خالی');
  }

  const parsed = extractJSONLocal(text);
  const validated = validateShapeLocal(feature, parsed);
  return { ok: true, data: validated, provider: 'gemini' };
}

/* ---------- OpenRouter direct ---------- */
async function callOpenRouterDirect(feature, payload) {
  const aiCfg = S.settings.ai || {};
  const apiKey = String(aiCfg.openrouterKey || '').trim();
  const model = aiCfg.openrouterModel || 'qwen/qwen3.6-plus:free';

  if (!apiKey) throw new Error('کلید OpenRouter تنظیم نشده');

  const system = getSystemPromptFor(feature);
  const userPrompt = buildUserPromptLocal(feature, payload);

  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 50000);

  let res;
  try {
    res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
      method: 'POST',
      signal: controller.signal,
      headers: {
        'Authorization': 'Bearer ' + apiKey,
        'Content-Type': 'application/json',
        'HTTP-Referer': location.origin,
        'X-Title': 'KonkoorYar'
      },
      body: JSON.stringify({
        model,
        messages: [
          { role: 'system', content: system },
          { role: 'user', content: userPrompt }
        ],
        max_tokens: 2500,
        temperature: 0.4,
        response_format: { type: 'json_object' }
      })
    });
  } catch (netErr) {
    if (netErr.name === 'AbortError') throw new Error('زمان پاسخ‌دهی تمام شد');
    throw new Error('اتصال برقرار نشد');
  } finally {
    clearTimeout(timeoutId);
  }

  if (!res.ok) {
    const errText = await res.text().catch(() => '');
    let msg = 'HTTP ' + res.status;
    try {
      const errJson = JSON.parse(errText);
      if (errJson && errJson.error && errJson.error.message) msg = errJson.error.message;
    } catch (e) {
      if (errText) msg += ': ' + errText.slice(0, 150);
    }
    if (res.status === 401) msg = 'کلید نامعتبر';
    if (res.status === 402) msg = 'اعتبار کافی نیست';
    if (res.status === 429) msg = 'سهم تمام شد';
    throw new Error(msg);
  }

  const data = await res.json();
  const text = (data && data.choices && data.choices[0] && data.choices[0].message)
    ? String(data.choices[0].message.content || '')
    : '';

  if (!text.trim()) {
    const fr = data && data.choices && data.choices[0] && data.choices[0].finish_reason;
    if (fr === 'content_filter') throw new Error('فیلتر محتوا');
    if (fr === 'length') throw new Error('پاسخ ناقص');
    throw new Error('پاسخ خالی');
  }

  const parsed = extractJSONLocal(text);
  const validated = validateShapeLocal(feature, parsed);
  return { ok: true, data: validated, provider: 'openrouter' };
}

/* ---------- Prompt builders ---------- */
function buildUserPromptLocal(feature, payload) {
  const limit = (s, n) => String(s || '').slice(0, n);

  if (feature === 'mistake-analysis') {
    const items = Array.isArray(payload?.items) ? payload.items.slice(0, 15) : [];
    const compact = items.map((it, i) => ({
      n: i + 1,
      subject: limit(it?.subject, 40),
      cause: limit(it?.cause, 20),
      question: limit(it?.question, 400)
    }));
    return 'این ' + compact.length + ' مورد از دفترچه اشتباه من است.\n' +
      'تحلیل کن و JSON بده با این ساختار دقیق:\n' +
      '{"categories":["دسته‌های تکرارشونده"],"patterns":["الگوهای پنهان"],"actions":["توصیه ۱","توصیه ۲","توصیه ۳"],"honest":"یک جمله صادقانه درباره محدودیت این تحلیل"}\n' +
      'داده:\n' + JSON.stringify(compact);
  }

  if (feature === 'explain-topic') {
    const topic = limit(payload?.topic, 150);
    const subject = limit(payload?.subject, 50);
    return 'موضوع: ' + topic + '\n' +
      'درس: ' + subject + '\n' +
      'این مبحث را در چارچوب کتاب درسی کنکور تجربی برای من توضیح بده.\n' +
      'خروجی JSON با این ساختار:\n' +
      '{"title":"عنوان مبحث",' +
      '"intro":"یک پاراگراف مقدمه (۲-۳ خط)",' +
      '"key_points":[{"heading":"تیتر نکته","explanation":"توضیح دقیق"}],' +
      '"formulas":["فرمول یا قاعده کلیدی"],' +
      '"pitfalls":["دام تستی که در کنکور می‌آید"],' +
      '"study_tip":"یک توصیه عملی برای مطالعه این مبحث"}';
  }

  if (feature === 'make-slides') {
    const topic = limit(payload?.topic, 150);
    const subject = limit(payload?.subject, 50);
    const slideCount = Math.min(Math.max(parseInt(payload?.count) || 7, 3), 15);
    return 'موضوع: ' + topic + '\n' +
      'درس: ' + subject + '\n' +
      'برای این مبحث یک ارائه (' + slideCount + ' اسلاید) بساز.\n' +
      'خروجی JSON:\n' +
      '{"deck_title":"عنوان ارائه",' +
      '"slides":[{"title":"عنوان اسلاید","bullets":["نکته ۱","نکته ۲"],"image_prompt":"توضیح تصویری که باید در این اسلاید باشد"}]}';
  }

  if (feature === 'quiz-from-topic') {
    const topic = limit(payload?.topic, 150);
    const subject = limit(payload?.subject, 50);
    const level = limit(payload?.level, 20);
    const count = Math.min(Math.max(parseInt(payload?.count) || 5, 3), 20);
    return 'موضوع: ' + topic + '\n' +
      'درس: ' + subject + '\n' +
      'سطح: ' + level + '\n' +
      'تعداد سؤال: ' + count + '\n' +
      'از این مبحث، ' + count + ' سؤال چهارگزینه‌ای در حد کنکور سراسری طراحی کن.\n' +
      'خروجی JSON:\n' +
      '{"questions":[{"stem":"متن سؤال",' +
      '"options":["گزینه ۱","گزینه ۲","گزینه ۳","گزینه ۴"],' +
      '"correct_index":0,' +
      '"explanation":"توضیح کوتاه چرا این گزینه درست است",' +
      '"source":"فصل کتاب",' +
      '"needs_review":false}]}';
  }

  if (feature === 'suggest-plan') {
    const goal = limit(payload?.goal, 100);
    const progress = payload?.progress || [];
    return 'هدف: ' + goal + '\n' +
      'وضعیت فعلی من (خلاصه پیشرفت):\n' + JSON.stringify(progress) + '\n' +
      'خروجی JSON:\n' +
      '{"summary":"خلاصه یک جمله‌ای",' +
      '"priorities":["درس اولویت‌دار ۱","درس اولویت‌دار ۲"],' +
      '"suggestions":[{"subject":"نام درس","chapter":"فصل پیشنهادی","minutes":60,"reason":"چرا این"}],' +
      '"tip":"یک توصیه کلی"}';
  }

  throw new Error('feature ناشناخته: ' + feature);
}

function extractJSONLocal(text) {
  if (!text || !text.trim()) throw new Error('پاسخ خالی');
  let t = String(text).trim();
  t = t.replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/i, '').trim();
  const s = t.indexOf('{');
  const e = t.lastIndexOf('}');
  if (s < 0 || e <= s) throw new Error('JSON یافت نشد');
  return JSON.parse(t.slice(s, e + 1));
}

function validateShapeLocal(feature, obj) {
  if (!obj || typeof obj !== 'object') throw new Error('ساختار نامعتبر');

  if (feature === 'mistake-analysis') {
    return {
      categories: Array.isArray(obj.categories) ? obj.categories.slice(0, 8).map(String) : [],
      patterns: Array.isArray(obj.patterns) ? obj.patterns.slice(0, 8).map(String) : [],
      actions: Array.isArray(obj.actions) ? obj.actions.slice(0, 5).map(String) : ['داده کافی نیست.'],
      honest: String(obj.honest || 'این تحلیل قطعی نیست.').slice(0, 300)
    };
  }

  if (feature === 'explain-topic') {
    return {
      title: String(obj.title || 'مبحث').slice(0, 200),
      intro: String(obj.intro || '').slice(0, 600),
      key_points: Array.isArray(obj.key_points) ? obj.key_points.slice(0, 12).map(k => ({
        heading: String(k?.heading || '').slice(0, 150),
        explanation: String(k?.explanation || '').slice(0, 800)
      })) : [],
      formulas: Array.isArray(obj.formulas) ? obj.formulas.slice(0, 10).map(String) : [],
      pitfalls: Array.isArray(obj.pitfalls) ? obj.pitfalls.slice(0, 10).map(String) : [],
      study_tip: String(obj.study_tip || '').slice(0, 500)
    };
  }

  if (feature === 'make-slides') {
    return {
      deck_title: String(obj.deck_title || 'ارائه').slice(0, 200),
      slides: Array.isArray(obj.slides) ? obj.slides.slice(0, 15).map(s => ({
        title: String(s?.title || '').slice(0, 150),
        bullets: Array.isArray(s?.bullets) ? s.bullets.slice(0, 8).map(b => String(b).slice(0, 400)) : [],
        image_prompt: String(s?.image_prompt || '').slice(0, 300)
      })) : []
    };
  }

  if (feature === 'quiz-from-topic') {
    return {
      questions: Array.isArray(obj.questions) ? obj.questions.slice(0, 20).map(q => {
        const opts = Array.isArray(q?.options) ? q.options.slice(0, 4).map(x => String(x).slice(0, 400)) : [];
        while (opts.length < 4) opts.push('—');
        return {
          stem: String(q?.stem || '').slice(0, 800),
          options: opts,
          correct_index: Math.min(Math.max(parseInt(q?.correct_index) || 0, 0), 3),
          explanation: String(q?.explanation || '').slice(0, 500),
          source: String(q?.source || '').slice(0, 200),
          needs_review: !!q?.needs_review
        };
      }) : []
    };
  }

  if (feature === 'suggest-plan') {
    return {
      summary: String(obj.summary || '').slice(0, 300),
      priorities: Array.isArray(obj.priorities) ? obj.priorities.slice(0, 5).map(String) : [],
      suggestions: Array.isArray(obj.suggestions) ? obj.suggestions.slice(0, 10).map(s => ({
        subject: String(s?.subject || '').slice(0, 50),
        chapter: String(s?.chapter || '').slice(0, 150),
        minutes: Math.min(Math.max(parseInt(s?.minutes) || 60, 15), 300),
        reason: String(s?.reason || '').slice(0, 300)
      })) : [],
      tip: String(obj.tip || '').slice(0, 300)
    };
  }

  throw new Error('feature ناشناخته');
}

  const pending = (CACHE.outbox || []).filter(o => o.status === 'pending' || o.status === 'retry').length;

  pill.className = 'sync-pill';

    pill.classList.add('offline');
    label.textContent = 'آفلاین';
    return;
  }
  if (!currentUser) {
    label.textContent = 'محلی';
    return;
  }
  if (failed > 0) {
    pill.classList.add('offline');
    label.textContent = 'خطا';
    return;
  }
  if (syncState.running) {
    pill.classList.add('queue');
    label.textContent = 'sync…';
    return;
  }
  if (pending > 0) {
    pill.classList.add('queue');
    label.textContent = 'صف: ' + faNum(pending);
    return;
  }
  label.textContent = 'همگام';

function navigate(view) {
  if (!VIEW_TITLES[view]) view = 'home';
  S.activeView = view;
  $$('.view').forEach(v => {
    v.classList.toggle('active', v.id === 'view-' + view);
  });
  const bottomTarget = BOTTOM_NAV.includes(view) ? view : 'home';
  $$('#bottomNav button').forEach(b => {
    b.classList.toggle('active', b.dataset.nav === bottomTarget);
  });
  $$('#sideNav button').forEach(b => {
    b.classList.toggle('active', b.dataset.nav === view);
  });
  const titleEl = $('#topTitle');
  if (titleEl) titleEl.textContent = VIEW_TITLES[view] || '';
  const dateEl = $('#topDate');
  if (dateEl) dateEl.textContent = faDate(todayKey(), 'weekday');
  if (window.RENDER && window.RENDER[view]) {
    try { window.RENDER[view](); }
    catch (e) { logError('render ' + view + ': ' + e.message); }
  }
  updateFab();
  try { window.scrollTo({ top: 0, behavior: 'smooth' }); }
  catch (e) { window.scrollTo(0, 0); }
}

  const fab = $('#fab');
  if (!fab) return;

  const root = $('#cmdRoot');
  if (!root) return;
  root.style.display = 'flex';
  const input = $('#cmdInput');
  if (input) { input.value = ''; input.focus(); }
  renderCmdList('');
}

function closeCmd() {
  const root = $('#cmdRoot');
  if (root) root.style.display = 'none';
}

function renderCmdList(query) {
  const list = $('#cmdList');
  if (!list) return;
  const q = String(query || '').toLowerCase().trim();
  const items = CMD_ITEMS.filter(it =>
    !q || it.label.toLowerCase().includes(q) || it.id.includes(q)
  );
  if (!items.length) {
    list.innerHTML = '<p class="t-sm muted center" style="padding:20px">چیزی یافت نشد.</p>';
    return;
  }
  list.innerHTML = items.map((it, i) =>
    '<button type="button" class="cmd-item' + (i === 0 ? ' active' : '') + '" ' +
      'data-cmd-id="' + it.id + '" ' +
      'style="display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:13.5px;color:var(--ink);border:0;background:none;width:100%;text-align:start;font-family:inherit' +

      (ICONS[it.icon] || '') +
      '<span>' + esc(it.label) + '</span>' +
    '</button>'
  ).join('');
}

function runCmdItem(id) {
  const it = CMD_ITEMS.find(x => x.id === id);
  if (!it) return;
  closeCmd();
  if (it.nav) {
    navigate(it.nav);
  } else if (it.action === 'toggle-theme') {
    S.settings.theme = S.settings.theme === 'dark' ? 'light' : 'dark';
    applyTheme();
    saveSettings();
  } else if (it.action === 'open-account') {
    openAccount();
  } else if (it.action === 'export') {
    exportData();
  } else if (it.action === 'sync-now') {
    syncNow(true);
  }
}

/* Weekly chart — last 7 days */
function buildWeeklyChartCard() {
  const today = new Date();
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    days.push(d);
  }
  const dayKeys = days.map(d => isoDay(d));
  const byDay = {};
  dayKeys.forEach(k => {
    byDay[k] = CACHE.sessions
      .filter(s => !s.deleted_at && s.day === k)
      .reduce((a, s) => a + (s.seconds || 0), 0);
  });
  const maxSec = Math.max(...Object.values(byDay), 3600);
  const bars = days.map(d => {
    const k = isoDay(d);
    const sec = byDay[k] || 0;
    const h = (sec / maxSec) * 100;
    const isToday = k === todayKey();
    return '<div class="mini-bar-col">' +
      '<div class="mini-bar-val">' + faNum(Math.round(sec / 60)) + '</div>' +
      '<div class="mini-bar-track">' +
        '<div class="mini-bar-fill' + (isToday ? ' today' : '') + '" style="height:' + h.toFixed(1) + '%"></div>' +
      '</div>' +

  const totalMin = Object.values(byDay).reduce((a, b) => a + b, 0) / 60;
  const avgMin = Math.round(totalMin / 7);

  return '<div class="card section">' +
    '<div class="card-head">' +
      '<h3>نمودار هفت روز اخیر</h3>' +
      '<span class="hint">میانگین: ' + fmtHMfa(avgMin) + '</span>' +
    '</div>' +
    '<div class="mini-bars">' + bars + '</div>' +
    '<div class="flex justify-between t-xs muted mt-3">' +
      '<span>مجموع: <b class="mono">' + fmtHMfa(totalMin) + '</b></span>' +
      '<span>دقیقه</span>' +
    '</div>' +
  '</div>';
}

/* Heatmap — current month like Yeolpumta */
function buildHeatmapCard() {
  const today = new Date();
  const currentMonthKey = jalaliMonthKey(today);
  const { month, year } = jalaliMonthYearFromDay(today);

  /* Find first day of current Jalali month */
  const firstOfMonth = (() => {
    const d = new Date(today);
    d.setDate(1);
    /* Walk back until we hit a day where jalaliMonthKey changes */
    let guard = 0;
    while (jalaliMonthKey(d) === currentMonthKey && guard < 32) {
      d.setDate(d.getDate() - 1);
      guard++;
    }
    d.setDate(d.getDate() + 1);
    return d;
  })();

  /* Find last day */
  const lastOfMonth = (() => {
    const d = new Date(firstOfMonth);
    let guard = 0;
    while (jalaliMonthKey(d) === currentMonthKey && guard < 32) {
      d.setDate(d.getDate() + 1);
      guard++;
    }
    d.setDate(d.getDate() - 1);
    return d;
  })();

  const totalDays = Math.round((lastOfMonth - firstOfMonth) / 86400000) + 1;

  /* Compute weekly offset for first day (Persian week starts Saturday) */
  const jsDow = firstOfMonth.getDay();
  const faOffset = (jsDow + 1) % 7;

  const byDay = {};
  CACHE.sessions.filter(s => !s.deleted_at).forEach(s => {
    if (byDay[s.day] === undefined) byDay[s.day] = 0;
    byDay[s.day] += Math.round((s.seconds || 0) / 60);
  });

  /* Build cells */
  const cells = [];
  const dayNames = ['ش', 'ی', 'د', 'س', 'چ', 'پ', 'ج'];

  /* Header */
  const header = dayNames.map(n => '<span>' + n + '</span>').join('');

  /* Empty cells before first day */
  for (let i = 0; i < faOffset; i++) {
    cells.push('<div class="heat-cell empty"></div>');
  }

  /* Actual days */
  for (let i = 0; i < totalDays; i++) {
    const d = new Date(firstOfMonth);
    d.setDate(d.getDate() + i);
    const k = isoDay(d);
    const mins = byDay[k] || 0;
    const level = heatLevelFromMinutes(mins);
    const isToday = k === todayKey();
    const cls = 'heat-cell' + (level > 0 ? ' l' + level : '') + (isToday ? ' today' : '');
    cells.push(
      '<div class="' + cls + '" title="' + esc(faDate(k, 'long')) + ' — ' + faNum(mins) + ' دقیقه">' +
        '<span class="day-num">' + faNum(d.getDate()) + '</span>' +
      '</div>'
    );
  }

  /* Legend */
  const legend = '<div class="heat-legend">' +
    '<span>کمتر</span>' +
    '<span class="heat-legend-swatch" style="background:var(--heat-0)"></span>' +
    '<span class="heat-legend-swatch" style="background:var(--heat-1)"></span>' +
    '<span class="heat-legend-swatch" style="background:var(--heat-2)"></span>' +
    '<span class="heat-legend-swatch" style="background:var(--heat-3)"></span>' +
    '<span class="heat-legend-swatch" style="background:var(--heat-4)"></span>' +
    '<span class="heat-legend-swatch" style="background:var(--heat-5)"></span>' +
    '<span>بیشتر</span>' +
    '<span class="muted-2" style="margin-inline-start:auto">۱۰+ ساعت</span>' +
  '</div>';

  return '<div class="card section">' +
    '<div class="card-head">' +
      '<h3>' + esc(month) + ' ' + esc(year) + '</h3>' +
      '<span class="hint">نقشه مطالعه</span>' +
    '</div>' +
    '<div class="heatmap-head">' + header + '</div>' +
    '<div class="heatmap-wrap">' + cells.join('') + '</div>' +
    legend +
  '</div>';
}

async function handleMistakeResult(id, wasRight) {
  const m = await idbGet('mistakes', id);
  if (!m) return;

  const currentBox = m.box || 1;
  const newBox = wasRight ? Math.min(5, currentBox + 1) : 1;
  const intervalDays = LEITNER_DAYS[newBox - 1];
  const nextReview = addDays(todayKey(), intervalDays);

  m.box = newBox;
  m.next_review = nextReview;
  m.updated_at = Date.now();
  m.history = Array.isArray(m.history) ? m.history : [];
  m.history.push({ ts: Date.now(), right: !!wasRight, box: newBox, interval: intervalDays });

  await idbPut('mistakes', m);
  await queueOp('upsert', 'mistakes', m.id, m);
  await refreshCache();

  if (S.settings.vibrationEnabled && navigator.vibrate) {
    try { navigator.vibrate(wasRight ? 30 : [20, 40, 20]); } catch (e) {}
  }

  toast(
    wasRight
      ? 'مرحله ' + faNum(newBox) + ' — ' + faDate(nextReview, 'short')
      : 'به مرحله ۱ برگشت',
    wasRight ? 'ok' : 'warn',
    2400
  );

  renderMistakes();
}

async function simTick() {
  if (!activeSim || !activeSim.started_at) return;
  const elapsed = Math.floor((Date.now() - activeSim.started_at) / 1000);
  const remaining = Math.max(0, activeSim.duration_sec - elapsed);
  const el = $('#simTime');
  if (el) {
    el.textContent = faNum(fmtClock(remaining));
    const bar = $('#simBar');
    if (bar) bar.style.width = clamp((elapsed / activeSim.duration_sec) * 100, 0, 100).toFixed(1) + '%';
  }
  if (remaining <= 0) {
    toast('زمان آزمون تمام شد', 'warn', 4000);
    await finishSim(true);
  }
}

async function finishSim(auto) {
  if (!activeSim) return;

  if (simTick._handle) {
    clearInterval(simTick._handle);
    simTick._handle = null;
  }

  const a = activeSim.answers || {};
  const c = toInt($('#simCorrect')?.value, a.c || 0);
  const w = toInt($('#simWrong')?.value, a.w || 0);
  const b = toInt($('#simBlank')?.value, a.b || 0);

  if (c + w + b === 0) {
    if (!auto) toast('هیچ پاسخی ثبت نشد', 'warn');
    activeSim = null;
    renderSim();
    return;
  }

  const pct = calcPercent(c, w, b);
  const duration = Math.round((Date.now() - activeSim.started_at) / 60000);

  const exam = {
    id: uid(),
    created_at: Date.now(),
    updated_at: Date.now(),
    deleted_at: null,
    device_id: S.settings.deviceId,
    subject: activeSim.subject,
    day: todayKey(),
    correct: c,
    wrong: w,
    blank: b,
    duration,
    percent: pct,
    note: 'آزمون شبیه‌سازی'
  };

  await idbPut('exams', exam);
  await queueOp('upsert', 'exams', exam.id, exam);

  S.simConfig.lastResult = {
    correct: c,
    wrong: w,
    blank: b,
    percent: pct,
    ts: Date.now()
  };
  await saveSettings();

  await refreshCache();
  activeSim = null;

  if (S.settings.vibrationEnabled && navigator.vibrate) {
    try { navigator.vibrate([30, 60, 30]); } catch (e) {}
  }

  toast('آزمون ثبت شد — ' + fmtPct(pct), 'ok', 3200);
  renderSim();
}

async function renderMonthly() {
  const root = $('#monthlyRoot');
  if (!root) return;

  const allSessions = CACHE.sessions.filter(s => !s.deleted_at);
  const allExams = CACHE.exams.filter(e => !e.deleted_at);
  const today = todayKey();
  const currentKey = jalaliMonthKey(today);

  const buckets = new Map();
  const addToBucket = (day, kind, item) => {
    const k = jalaliMonthKey(day);
    if (!k) return;
    if (!buckets.has(k)) buckets.set(k, { sessions: [], exams: [] });
    buckets.get(k)[kind].push(item);
  };
  allSessions.forEach(s => addToBucket(s.day, 'sessions', s));
  allExams.forEach(e => addToBucket(e.day, 'exams', e));

  const keys = [...buckets.keys()].sort().reverse();

  if (keys.length === 0) {
    root.innerHTML =
      '<div class="view-title"><h2>گزارش ماهانه</h2></div>' +
      '<div class="empty"><b>هنوز داده‌ای نیست</b>' +
        '<p>بعد از ثبت چند جلسه و آزمون، گزارش ماهانه اینجا ساخته می‌شود.</p>' +
      '</div>';
    return;
  }

  const currentIdx = keys.indexOf(currentKey);
  const prevKey = currentIdx >= 0 ? keys[currentIdx + 1] : keys[0];

  const summary = (key) => {
    const b = buckets.get(key) || { sessions: [], exams: [] };
    const days = new Set(b.sessions.map(s => s.day));
    const sampleDay = (b.sessions[0] && b.sessions[0].day) ||
                      (b.exams[0] && b.exams[0].day) ||
                      today;
    const agg = (() => {
      const inS = b.sessions;
      const inE = b.exams;
      const seconds = inS.reduce((a, s) => a + (s.seconds || 0), 0);
      const correct = inS.reduce((a, s) => a + (s.correct || 0), 0);
      const wrong = inS.reduce((a, s) => a + (s.wrong || 0), 0);
      const blank = inS.reduce((a, s) => a + (s.blank || 0), 0);
      const examTests = inE.reduce((a, e) => a + (e.correct || 0) + (e.wrong || 0) + (e.blank || 0), 0);
      const avgPercent = inE.length ? inE.reduce((a, e) => a + (e.percent || 0), 0) / inE.length : null;
      return {
        minutes: Math.round(seconds / 60),
        testCount: correct + wrong + blank + examTests,
        percent: calcPercent(correct, wrong, blank),
        examPercent: avgPercent
      };
    })();
    return { key, label: jalaliLabelFromDay(sampleDay), activeDays: days.size, agg };
  };

  const cur = summary(currentKey);
  const prev = prevKey ? summary(prevKey) : null;

  const kpi = (label, curVal, prevVal, fmt) => {
    let delta = '';
    if (prev && Number.isFinite(curVal) && Number.isFinite(prevVal) && prevVal !== 0) {
      const d = curVal - prevVal;
      if (Math.abs(d) >= 0.01) {
        delta = '<span class="badge ' + (d > 0 ? 'ok' : 'bad') + ' badge-sm">' +
          (d > 0 ? '+' : '−') + fmt(Math.abs(d)) +
        '</span>';
      }
    }
    return '<div class="stat">' +
      '<div class="lbl">' + esc(label) + '</div>' +
      '<div class="val">' + (Number.isFinite(curVal) ? fmt(curVal) : '—') + '</div>' +
      '<div class="sub flex gap-2 items-center flex-wrap">' + delta +
        (prev && Number.isFinite(prevVal) ? '<span>قبل: ' + fmt(prevVal) + '</span>' : '') +
      '</div>' +
    '</div>';
  };

  const kpiHtml = '<div class="grid g4">' +
    kpi('مطالعه ماه', cur.agg.minutes, prev && prev.agg.minutes, fmtHMfa) +
    kpi('تعداد تست', cur.agg.testCount, prev && prev.agg.testCount, faNum) +
    kpi('میانگین آزمون',
      cur.agg.examPercent != null ? cur.agg.examPercent : NaN,
      prev && prev.agg.examPercent != null ? prev.agg.examPercent : NaN,
      fmtPct) +
    kpi('روزهای فعال', cur.activeDays, prev && prev.activeDays, faNum) +
  '</div>';

  const daysOfMonth = [...new Set(
    allSessions.filter(s => jalaliMonthKey(s.day) === currentKey).map(s => s.day)
  )].sort();

  const perDayMap = {};
  allSessions.filter(s => jalaliMonthKey(s.day) === currentKey).forEach(s => {
    perDayMap[s.day] = (perDayMap[s.day] || 0) + (s.seconds || 0);
  });

  const maxMin = Math.max(...Object.values(perDayMap).map(s => s / 60), 60);
  const daysBars = daysOfMonth.map(day => {
    const min = (perDayMap[day] || 0) / 60;
    const h = maxMin > 0 ? (min / maxMin) * 100 : 0;
    const isToday = day === today;
    return '<div class="mini-bar-col">' +
      '<div class="mini-bar-val">' + faNum(Math.round(min)) + '</div>' +
      '<div class="mini-bar-track">' +
        '<div class="mini-bar-fill' + (isToday ? ' today' : '') + '" style="height:' + h.toFixed(1) + '%"></div>' +
      '</div>' +
      '<div class="mini-bar-lbl">' + faNum(parseDay(day).getDate()) + '</div>' +
    '</div>';
  }).join('');

  const subjectMap = {};
  allSessions.filter(s => jalaliMonthKey(s.day) === currentKey).forEach(s => {
    subjectMap[s.subject] = (subjectMap[s.subject] || 0) + Math.round((s.seconds || 0) / 60);
  });
  const totalSecM = Object.values(subjectMap).reduce((a, b) => a + b, 0);

  const historyHtml = keys.slice(0, 6).map(k => {
    const s = summary(k);
    return '<div class="item">' +
      '<div class="item-main">' +
        '<b>' + esc(s.label) + '</b>' +
        '<span>' +
          faNum(s.activeDays) + ' روز فعال · ' +
          faNum(s.agg.testCount) + ' تست' +
          (s.agg.examPercent != null ? ' · میانگین آزمون ' + fmtPct(s.agg.examPercent) : '') +
        '</span>' +
      '</div>' +
      '<span class="mono t-xs">' + fmtHMfa(s.agg.minutes) + '</span>' +
    '</div>';
  }).join('');

  root.innerHTML =
    '<div class="view-title">' +
      '<h2>گزارش ماهانه</h2>' +
      '<span>' + esc(cur.label) + '</span>' +
    '</div>' +
    kpiHtml +
    '<div class="card section">' +
      '<div class="card-head"><h3>روزهای این ماه</h3><span class="hint">دقیقه</span></div>' +
      (daysBars ? '<div class="mini-bars" style="height:160px">' + daysBars + '</div>' : '<p class="t-sm muted">روزی ثبت نشده.</p>') +
    '</div>' +
    '<div class="card section">' +
      '<div class="card-head"><h3>سهم دروس ماه</h3></div>' +
      buildDonutHtml(totalSecM, subjectMap) +
    '</div>' +
    '<div class="card section">' +
      '<div class="card-head"><h3>ماه‌های گذشته</h3></div>' +
      '<div class="list">' + historyHtml + '</div>' +
    '</div>';
}

async function renderDiag() {
  const root = $('#diagRoot');
  if (!root) return;

  const outbox = CACHE.outbox || [];
  const logs = (CACHE.logs || []).slice().sort((a, b) => b.ts - a.ts).slice(0, 12);
  const pending = outbox.filter(o => o.status === 'pending' || o.status === 'retry');
  const failed = outbox.filter(o => o.status === 'failed');
  const persistState = (await navigator.storage?.persisted?.()) ? 'فعال' : 'غیرفعال';
  const sizeKb = (JSON.stringify(CACHE).length / 1024).toFixed(1);

  root.innerHTML =
    '<div class="view-title"><h2>عیب‌یابی</h2><span>وضعیت</span></div>' +

    '<div class="grid g4">' +
      statCard({ icon: 'timer', label: 'جلسات', value: faNum(CACHE.sessions.length), sub: 'IndexedDB', tint: 'rgba(37,99,235,.08)' }) +
      statCard({ icon: 'exams', label: 'آزمون‌ها', value: faNum(CACHE.exams.length), sub: 'IndexedDB', tint: 'rgba(234,88,12,.08)' }) +
      statCard({ icon: 'mistakes', label: 'دفترچه', value: faNum(CACHE.mistakes.length), sub: 'IndexedDB', tint: 'rgba(220,38,38,.08)' }) +
      statCard({ icon: 'plan', label: 'برنامه‌ها', value: faNum(CACHE.plans.length), sub: 'IndexedDB', tint: 'rgba(5,150,105,.08)' }) +
    '</div>' +

    '<div class="card section">' +
      '<div class="card-head">' + ICONS.info + '<h3>وضعیت کلی</h3></div>' +
      '<div class="t-sm muted" style="line-height:2.4">' +
        '<div>آنلاین: <b>' + (navigator.onLine ? 'بله' : 'خیر') + '</b></div>' +
        '<div>Storage persisted: <b>' + persistState + '</b></div>' +
        '<div>حجم داده: <b class="mono">' + faNum(sizeKb) + ' KB</b></div>' +
        '<div>صف sync: <b>' + faNum(pending.length) + '</b></div>' +
        '<div>ناموفق: <b>' + faNum(failed.length) + '</b></div>' +
        '<div>آخرین خطا: <b dir="auto">' + (logs.length ? esc(logs[0].msg) : 'بدون خطا') + '</b></div>' +
      '</div>' +
      '<div class="flex gap-2 flex-wrap mt-3">' +
        '<button class="btn btn-sm" data-action="request-persist">' +
          ICONS.save + '<span>ذخیره دائمی</span>' +
        '</button>' +
        '<button class="btn btn-sm" data-action="sync-now">' +
          ICONS.refresh + '<span>sync اجباری</span>' +
        '</button>' +
        '<button class="btn btn-sm btn-danger" data-action="clear-logs">' +
          ICONS.trash + '<span>پاک لاگ</span>' +
        '</button>' +
      '</div>' +
    '</div>' +

    (outbox.length
      ? '<div class="card section">' +
          '<div class="card-head"><h3>صف sync</h3><span class="hint">' + faNum(outbox.length) + '</span></div>' +
          '<div class="list">' +
            outbox.slice(-12).reverse().map(o =>
              '<div class="item"><div class="item-main">' +
                '<b>' + esc(o.op) + ' — ' + esc(o.store) + '</b>' +
                '<span>' + esc(new Date(o.ts).toLocaleString('fa-IR')) + ' · ' + esc(o.status) +
                  (o.tries ? ' · تلاش ' + faNum(o.tries) : '') + '</span>' +
              '</div></div>'
            ).join('') +
          '</div></div>'
      : '') +

    (logs.length
      ? '<div class="card section">' +
          '<div class="card-head"><h3>خطاها</h3><span class="hint">' + faNum(logs.length) + '</span></div>' +
          '<div class="list">' +
            logs.map(l =>
              '<div class="item"><div class="item-main">' +
                '<b dir="auto">' + esc(l.msg) + '</b>' +
                '<span>' + esc(new Date(l.ts).toLocaleString('fa-IR')) + '</span>' +
              '</div></div>'
            ).join('') +
          '</div></div>'
      : '');
}

async function exportData() {
  try {
    const settingsClean = await (async () => {
      const s = await idbGet('settings', STORE_KEY);
      if (!s) return s;
      const c = deepClone(s);
      if (c.ai) {
        c.ai.geminiKey = '';
        c.ai.openrouterKey = '';
      }
      if (c.supabase) c.supabase.anonKey = '';
      return c;
    })();

    const data = {
      settings: settingsClean,
      sessions: await idbGetAll('sessions'),
      exams: await idbGetAll('exams'),
      mistakes: await idbGetAll('mistakes'),
      plans: await idbGetAll('plans'),
      notes: await idbGetAll('notes'),
      progress: await idbGetAll('progress'),
      outbox: await idbGetAll('outbox')
    };
    const payload = {
      app: 'konkoor-yar',
      version: 2,
      exported_at: new Date().toISOString(),
      data
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'konkoor-yar-backup-' + todayKey() + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('پشتیبان ساخته شد (بدون کلیدهای API)', 'ok');
  } catch (err) {
    logError('export: ' + err.message);
    toast('خطا در پشتیبان', 'error');
  }
}

async function handleImport(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const parsed = JSON.parse(String(reader.result || ''));
      if (!parsed || parsed.app !== 'konkoor-yar' || !parsed.data) {
        throw new Error('ساختار نامعتبر');
      }
      const ok = await confirmModal({
        title: 'تأیید بازیابی',
        message: 'داده‌های فعلی با فایل پشتیبان جایگزین می‌شوند. ادامه می‌دهی؟',
        confirmLabel: 'بازیابی کن',
        danger: true
      });
      if (!ok) return;

      const d = parsed.data;
      if (d.settings) {
        const keep = {
          deviceId: S.settings.deviceId,
          supabase: S.settings.supabase,
          geminiKey: (S.settings.ai || {}).geminiKey || '',
          openrouterKey: (S.settings.ai || {}).openrouterKey || ''
        };
        Object.assign(S.settings, d.settings);
        S.settings.deviceId = keep.deviceId;
        S.settings.supabase = keep.supabase;
        S.settings.ai = Object.assign({}, S.settings.ai, {
          geminiKey: keep.geminiKey,
          openrouterKey: keep.openrouterKey
        });
        await saveSettings();
      }

      const stores = ['sessions', 'exams', 'mistakes', 'plans', 'notes', 'progress', 'outbox'];
      for (const store of stores) {
        await idbClear(store);
        if (Array.isArray(d[store])) {
          for (const r of d[store]) await idbPut(store, r);
        }
      }

      await refreshCache();
      applyTheme();
      navigate('home');
      toast('بازیابی موفق', 'ok');
    } catch (err) {
      toast('فایل معتبر نیست: ' + err.message, 'error');
    }
  };
  reader.readAsText(file);
}

/* CSV Helpers — fixed date format */
function csvDateForExcel(dayStr) {
  /* Output as YYYY/MM/DD which Excel likes better than ISO */
  const d = parseDay(dayStr);
  if (isNaN(d)) return '';
  return d.getFullYear() + '/' + pad2(d.getMonth() + 1) + '/' + pad2(d.getDate());
}

function csvEscape(v) {
  if (v === null || v === undefined) return '';
  const s = String(v);
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function toCSV(headers, rows) {
  return '\uFEFF' + headers.join(',') + '\n' + rows.map(r => r.map(csvEscape).join(',')).join('\n');
}

function downloadText(name, text, mime) {
  const blob = new Blob([text], { type: mime || 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function exportSessionsCSV() {
  const list = CACHE.sessions
    .filter(s => !s.deleted_at)
    .sort((a, b) => String(a.day).localeCompare(String(b.day)));
  if (!list.length) { toast('جلسه‌ای نیست', 'warn'); return; }
  const headers = ['تاریخ', 'درس', 'فصل', 'نوع', 'دقیقه', 'درست', 'غلط', 'نزده', 'درصد', 'توضیح'];
  const rows = list.map(s => [
    csvDateForExcel(s.day),
    subj(s.subject).name,
    s.chapter || '',
    s.type || '',
    Math.round((s.seconds || 0) / 60),
    s.correct || 0,
    s.wrong || 0,
    s.blank || 0,
    ((s.correct || 0) + (s.wrong || 0) + (s.blank || 0)) > 0
      ? calcPercent(s.correct || 0, s.wrong || 0, s.blank || 0).toFixed(2)
      : '',
    s.note || ''
  ]);
  downloadText('ky-sessions-' + todayKey() + '.csv', toCSV(headers, rows));
  toast('خروجی آماده شد', 'ok');
}

async function wipeStore(store) {
  const map = {
    sessions: 'جلسات',
    exams: 'آزمون‌ها',
    mistakes: 'دفترچه',
    plans: 'برنامه‌ها',
    notes: 'یادداشت‌ها',
    progress: 'پیشرفت درسی'
  };
  const label = map[store] || store;
  const ok = await confirmModal({
    title: 'پاک‌کردن ' + label,
    message: 'تمام ' + label + ' پاک می‌شوند. بازگشت‌ناپذیر.',
    confirmLabel: 'پاک کن',
    danger: true
  });
  if (!ok) return;
  for (const r of await idbGetAll(store)) {
    if (r.id) {
      r.deleted_at = Date.now();
      r.updated_at = Date.now();
      await idbPut(store, r);
      await queueOp('delete', store, r.id, r);
    }
  }
  await refreshCache();
  renderSettings();
  toast(label + ' پاک شد', 'ok');
}

async function submitManualSession(form) {
  const subject = String(form.subject.value || '');
  const chapter = String(form.chapter?.value || '').trim();
  const type = String(form.type?.value || SESSION_TYPES[0]);
  const minutes = clamp(toInt(form.minutes.value, 0), 1, 1440);
  const day = String(form.day?.value || todayKey());
  const correct = clamp(toInt(form.correct?.value, 0), 0, 1000);
  const wrong = clamp(toInt(form.wrong?.value, 0), 0, 1000);
  const blank = clamp(toInt(form.blank?.value, 0), 0, 1000);
  const note = String(form.note?.value || '').trim();

  if (!SUBJ_MAP[subject]) { toast('درس نامعتبر', 'error'); return; }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(day)) { toast('تاریخ نامعتبر', 'error'); return; }

  const session = {
    id: uid(),
    created_at: Date.now(),
    updated_at: Date.now(),
    deleted_at: null,
    device_id: S.settings.deviceId,
    subject,
    chapter,
    seconds: minutes * 60,
    correct,
    wrong,
    blank,
    note,
    day,
    type
  };

  await idbPut('sessions', session);
  await queueOp('upsert', 'sessions', session.id, session);
  await refreshCache();

  if (S.settings.vibrationEnabled && navigator.vibrate) {
    try { navigator.vibrate(30); } catch (e) {}
  }
  toast('ثبت شد', 'ok');
  navigate('home');
}

  if (!text) return;
  const tKey = todayKey();
  let plan = CACHE.plans.find(p => p.day === tKey && !p.deleted_at);
  if (!plan) {
    plan = {
      id: uid(),
      day: tKey,
      wake_time: '',
      items: [],
      created_at: Date.now(),
      updated_at: Date.now(),
      device_id: S.settings.deviceId,
      deleted_at: null
    };
  }
  plan.items.push({ text, done: false });
  plan.updated_at = Date.now();
  await idbPut('plans', plan);
  await queueOp('upsert', 'plans', plan.id, plan);
  await refreshCache();
  renderPlan();
}

async function aiExplainTopic(form) {
  const subject = String(form.subject.value || '');
  const chapter = String(form.chapter?.value || '').trim();
  const customTopic = String(form.customTopic?.value || '').trim();
  const topic = customTopic || chapter || subj(subject).name;

  if (!topic) { toast('موضوع را انتخاب کن', 'error'); return; }

  aiState.busy = true;
  aiState.result = null;
  renderAI();

  try {
    const res = await aiCall('explain-topic', {
      topic,
      subject: subj(subject).name
    });
    aiState.result = res.data;
    aiState.busy = false;
    renderAI();
    if (res.fallbackFrom) {
      toast('با ' + res.provider + ' ساخته شد (fallback از ' + res.fallbackFrom + ')', 'info', 2400);
    }
  } catch (err) {
    aiState.busy = false;
    aiState.result = null;
    renderAI();
    toast('خطا: ' + err.message, 'error', 6000);
  }
}

async function aiAnalyzeMistakes() {

  aiState.busy = true;
  aiState.mistakesResult = null;
  renderAI();

  try {
    const res = await aiCall('mistake-analysis', {
      items: items.map(m => ({
        subject: subj(m.subject).name,
        cause: m.cause || '',
        question: String(m.question || '').slice(0, 400)
      }))
    });
    aiState.mistakesResult = res.data;
    aiState.busy = false;
    renderAI();
  } catch (err) {
    aiState.busy = false;
    aiState.mistakesResult = null;
    renderAI();
    toast('خطا: ' + err.message, 'error', 6000);
  }
}
