 * SECTION 26 — RENDER: MONTHLY (rewritten)
 * ========================================================================= */

async function renderMonthly() {
  const root = $('#monthlyRoot');
  if (!root) return;

  const allSessions = CACHE.sessions.filter(s => !s.deleted_at);
  const allExams = CACHE.exams.filter(e => !e.deleted_at);
  const today = todayKey();
  const currentKey = jalaliMonthKey(today);

  const buckets = new Map();
  const addToBucket = (day, kind, item) => {
    const k = jalaliMonthKey(day);
    if (!k) return;
    if (!buckets.has(k)) buckets.set(k, { sessions: [], exams: [] });
    buckets.get(k)[kind].push(item);
  };
  allSessions.forEach(s => addToBucket(s.day, 'sessions', s));
  allExams.forEach(e => addToBucket(e.day, 'exams', e));

  const keys = [...buckets.keys()].sort().reverse();

  if (keys.length === 0) {
    root.innerHTML =
      '<div class="view-title"><h2>گزارش ماهانه</h2></div>' +
      '<div class="empty"><b>هنوز داده‌ای نیست</b>' +
        '<p>بعد از ثبت چند جلسه و آزمون، گزارش ماهانه اینجا ساخته می‌شود.</p>' +
      '</div>';
    return;
  }

  const currentIdx = keys.indexOf(currentKey);
  const prevKey = currentIdx >= 0 ? keys[currentIdx + 1] : keys[0];

  const summary = (key) => {
    const b = buckets.get(key) || { sessions: [], exams: [] };
    const days = new Set(b.sessions.map(s => s.day));
    const sampleDay = (b.sessions[0] && b.sessions[0].day) ||
                      (b.exams[0] && b.exams[0].day) ||
                      today;
    const agg = (() => {
      const inS = b.sessions;
      const inE = b.exams;
      const seconds = inS.reduce((a, s) => a + (s.seconds || 0), 0);
      const correct = inS.reduce((a, s) => a + (s.correct || 0), 0);
      const wrong = inS.reduce((a, s) => a + (s.wrong || 0), 0);
      const blank = inS.reduce((a, s) => a + (s.blank || 0), 0);
      const examTests = inE.reduce((a, e) => a + (e.correct || 0) + (e.wrong || 0) + (e.blank || 0), 0);
      const avgPercent = inE.length ? inE.reduce((a, e) => a + (e.percent || 0), 0) / inE.length : null;
      return {
        minutes: Math.round(seconds / 60),
        testCount: correct + wrong + blank + examTests,
        percent: calcPercent(correct, wrong, blank),
        examPercent: avgPercent
      };
    })();
    return { key, label: jalaliLabelFromDay(sampleDay), activeDays: days.size, agg };
  };

  const cur = summary(currentKey);
  const prev = prevKey ? summary(prevKey) : null;

  const kpi = (label, curVal, prevVal, fmt) => {
    let delta = '';
    if (prev && Number.isFinite(curVal) && Number.isFinite(prevVal) && prevVal !== 0) {
      const d = curVal - prevVal;
      if (Math.abs(d) >= 0.01) {
        delta = '<span class="badge ' + (d > 0 ? 'ok' : 'bad') + ' badge-sm">' +
          (d > 0 ? '+' : '−') + fmt(Math.abs(d)) +
        '</span>';
      }
    }
    return '<div class="stat">' +
      '<div class="lbl">' + esc(label) + '</div>' +
      '<div class="val">' + (Number.isFinite(curVal) ? fmt(curVal) : '—') + '</div>' +
      '<div class="sub flex gap-2 items-center flex-wrap">' + delta +
        (prev && Number.isFinite(prevVal) ? '<span>قبل: ' + fmt(prevVal) + '</span>' : '') +
      '</div>' +
    '</div>';
  };

  const kpiHtml = '<div class="grid g4">' +
    kpi('مطالعه ماه', cur.agg.minutes, prev && prev.agg.minutes, fmtHMfa) +
    kpi('تعداد تست', cur.agg.testCount, prev && prev.agg.testCount, faNum) +
    kpi('میانگین آزمون',
      cur.agg.examPercent != null ? cur.agg.examPercent : NaN,
      prev && prev.agg.examPercent != null ? prev.agg.examPercent : NaN,
      fmtPct) +
    kpi('روزهای فعال', cur.activeDays, prev && prev.activeDays, faNum) +
  '</div>';

  const daysOfMonth = [...new Set(
    allSessions.filter(s => jalaliMonthKey(s.day) === currentKey).map(s => s.day)
  )].sort();

  const perDayMap = {};
  allSessions.filter(s => jalaliMonthKey(s.day) === currentKey).forEach(s => {
    perDayMap[s.day] = (perDayMap[s.day] || 0) + (s.seconds || 0);
  });

  const maxMin = Math.max(...Object.values(perDayMap).map(s => s / 60), 60);
  const daysBars = daysOfMonth.map(day => {
    const min = (perDayMap[day] || 0) / 60;
    const h = maxMin > 0 ? (min / maxMin) * 100 : 0;
    const isToday = day === today;
    return '<div class="mini-bar-col">' +
      '<div class="mini-bar-val">' + faNum(Math.round(min)) + '</div>' +
      '<div class="mini-bar-track">' +
        '<div class="mini-bar-fill' + (isToday ? ' today' : '') + '" style="height:' + h.toFixed(1) + '%"></div>' +
      '</div>' +
      '<div class="mini-bar-lbl">' + faNum(parseDay(day).getDate()) + '</div>' +
    '</div>';
  }).join('');

  const subjectMap = {};
  allSessions.filter(s => jalaliMonthKey(s.day) === currentKey).forEach(s => {
    subjectMap[s.subject] = (subjectMap[s.subject] || 0) + Math.round((s.seconds || 0) / 60);
  });
  const totalSecM = Object.values(subjectMap).reduce((a, b) => a + b, 0);

  const historyHtml = keys.slice(0, 6).map(k => {
    const s = summary(k);
    return '<div class="item">' +
      '<div class="item-main">' +
        '<b>' + esc(s.label) + '</b>' +
        '<span>' +
          faNum(s.activeDays) + ' روز فعال · ' +
          faNum(s.agg.testCount) + ' تست' +
          (s.agg.examPercent != null ? ' · میانگین آزمون ' + fmtPct(s.agg.examPercent) : '') +
        '</span>' +
      '</div>' +
      '<span class="mono t-xs">' + fmtHMfa(s.agg.minutes) + '</span>' +
    '</div>';
  }).join('');

  root.innerHTML =
    '<div class="view-title">' +
      '<h2>گزارش ماهانه</h2>' +
      '<span>' + esc(cur.label) + '</span>' +
    '</div>' +
    kpiHtml +
    '<div class="card section">' +
      '<div class="card-head"><h3>روزهای این ماه</h3><span class="hint">دقیقه</span></div>' +
      (daysBars ? '<div class="mini-bars" style="height:160px">' + daysBars + '</div>' : '<p class="t-sm muted">روزی ثبت نشده.</p>') +
    '</div>' +
    '<div class="card section">' +
      '<div class="card-head"><h3>سهم دروس ماه</h3></div>' +
      buildDonutHtml(totalSecM, subjectMap) +
    '</div>' +
    '<div class="card section">' +
      '<div class="card-head"><h3>ماه‌های گذشته</h3></div>' +
      '<div class="list">' + historyHtml + '</div>' +
    '</div>';
}

async function exportData() {
  try {
    const settingsClean = await (async () => {
      const s = await idbGet('settings', STORE_KEY);
      if (!s) return s;
      const c = deepClone(s);
      if (c.ai) {
        c.ai.geminiKey = '';
        c.ai.openrouterKey = '';
      }
      if (c.supabase) c.supabase.anonKey = '';
      return c;
    })();

    const data = {
      settings: settingsClean,
      sessions: await idbGetAll('sessions'),
      exams: await idbGetAll('exams'),
      mistakes: await idbGetAll('mistakes'),
      plans: await idbGetAll('plans'),
      notes: await idbGetAll('notes'),
      progress: await idbGetAll('progress'),
      outbox: await idbGetAll('outbox')
    };
    const payload = {
      app: 'konkoor-yar',
      version: 2,
      exported_at: new Date().toISOString(),
      data
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'konkoor-yar-backup-' + todayKey() + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);

  } catch (err) {
    logError('export: ' + err.message);
    toast('خطا در پشتیبان', 'error');
  }
}

async function handleImport(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const parsed = JSON.parse(String(reader.result || ''));
      if (!parsed || parsed.app !== 'konkoor-yar' || !parsed.data) {
        throw new Error('ساختار نامعتبر');
      }
      const ok = await confirmModal({
        title: 'تأیید بازیابی',
        message: 'داده‌های فعلی با فایل پشتیبان جایگزین می‌شوند. ادامه می‌دهی؟',
        confirmLabel: 'بازیابی کن',
        danger: true
      });
      if (!ok) return;

      const d = parsed.data;
      if (d.settings) {
        const keep = {
          deviceId: S.settings.deviceId,
          supabase: S.settings.supabase,
          geminiKey: (S.settings.ai || {}).geminiKey || '',
          openrouterKey: (S.settings.ai || {}).openrouterKey || ''
        };
        Object.assign(S.settings, d.settings);
        S.settings.deviceId = keep.deviceId;
        S.settings.supabase = keep.supabase;
        S.settings.ai = Object.assign({}, S.settings.ai, {
          geminiKey: keep.geminiKey,
          openrouterKey: keep.openrouterKey
        });
        await saveSettings();
      }

      const stores = ['sessions', 'exams', 'mistakes', 'plans', 'notes', 'progress', 'outbox'];
      for (const store of stores) {
        await idbClear(store);
        if (Array.isArray(d[store])) {
          for (const r of d[store]) await idbPut(store, r);
        }
      }

      await refreshCache();
      applyTheme();
      navigate('home');
      toast('بازیابی موفق', 'ok');
    } catch (err) {
      toast('فایل معتبر نیست: ' + err.message, 'error');
    }
  };
  reader.readAsText(file);
}

/* CSV Helpers — fixed date format */
function csvDateForExcel(dayStr) {
  /* Output as YYYY/MM/DD which Excel likes better than ISO */
  const d = parseDay(dayStr);
  if (isNaN(d)) return '';
  return d.getFullYear() + '/' + pad2(d.getMonth() + 1) + '/' + pad2(d.getDate());
}

function csvEscape(v) {
  if (v === null || v === undefined) return '';
  const s = String(v);
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function toCSV(headers, rows) {
  return '\uFEFF' + headers.join(',') + '\n' + rows.map(r => r.map(csvEscape).join(',')).join('\n');
}

function downloadText(name, text, mime) {
  const blob = new Blob([text], { type: mime || 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function submitManualSession(form) {
  const subject = String(form.subject.value || '');
  const chapter = String(form.chapter?.value || '').trim();
  const type = String(form.type?.value || SESSION_TYPES[0]);
  const minutes = clamp(toInt(form.minutes.value, 0), 1, 1440);
  const day = String(form.day?.value || todayKey());
  const correct = clamp(toInt(form.correct?.value, 0), 0, 1000);
  const wrong = clamp(toInt(form.wrong?.value, 0), 0, 1000);
  const blank = clamp(toInt(form.blank?.value, 0), 0, 1000);
  const note = String(form.note?.value || '').trim();

  if (!SUBJ_MAP[subject]) { toast('درس نامعتبر', 'error'); return; }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(day)) { toast('تاریخ نامعتبر', 'error'); return; }

  const session = {
    id: uid(),
    created_at: Date.now(),
    updated_at: Date.now(),
    deleted_at: null,
    device_id: S.settings.deviceId,
    subject,
    chapter,
    seconds: minutes * 60,
    correct,
    wrong,
    blank,
    note,
    day,
    type
  };

  await idbPut('sessions', session);
  await queueOp('upsert', 'sessions', session.id, session);
  await refreshCache();

  if (S.settings.vibrationEnabled && navigator.vibrate) {
    try { navigator.vibrate(30); } catch (e) {}
  }
  toast('ثبت شد', 'ok');
  navigate('home');
}

    plan = {
      id: uid(),
      day: tKey,
      wake_time: '',
      items: [],
      created_at: Date.now(),
      updated_at: Date.now(),
      device_id: S.settings.deviceId,

  plan.items.push({ text, done: false });

  const chapter = String(form.chapter?.value || '').trim();
  const customTopic = String(form.customTopic?.value || '').trim();
  const topic = customTopic || chapter || subj(subject).name;

  if (!topic) { toast('موضوع را انتخاب کن', 'error'); return; }

  aiState.busy = true;
  aiState.result = null;
  renderAI();

  try {
    const res = await aiCall('explain-topic', {
      topic,
      subject: subj(subject).name
    });
    aiState.result = res.data;
    aiState.busy = false;
    renderAI();
    if (res.fallbackFrom) {
      toast('با ' + res.provider + ' ساخته شد (fallback از ' + res.fallbackFrom + ')', 'info', 2400);
    }
  } catch (err) {
    aiState.busy = false;
    aiState.result = null;
    renderAI();
    toast('خطا: ' + err.message, 'error', 6000);
  }
}

async function aiMakeSlides(form) {
  const subject = String(form.subject.value || '');
  const chapter = String(form.chapter?.value || '').trim();
  const customTopic = String(form.customTopic?.value || '').trim();
  const count = clamp(toInt(form.count.value, 7), 3, 15);
  const topic = customTopic || chapter || subj(subject).name;

  if (!topic) { toast('موضوع را انتخاب کن', 'error'); return; }

  aiState.busy = true;
  aiState.slidesResult = null;
  renderAI();

  try {
    const res = await aiCall('make-slides', {
      topic,
      subject: subj(subject).name,
      count
    });
    aiState.slidesResult = res.data;
    aiState.busy = false;
    renderAI();
    toast('اسلاید آماده شد', 'ok');
  } catch (err) {
    aiState.busy = false;
    aiState.slidesResult = null;
    renderAI();
    toast('خطا: ' + err.message, 'error', 6000);
  }
}

async function aiAnalyzeMistakes() {
  const items = CACHE.mistakes.filter(m => !m.deleted_at).slice(0, 15);
  if (items.length < 3) { toast('حداقل ۳ کارت لازم است', 'warn'); return; }

  aiState.busy = true;
  aiState.mistakesResult = null;
  renderAI();

  try {
    const res = await aiCall('mistake-analysis', {
      items: items.map(m => ({
        subject: subj(m.subject).name,
        cause: m.cause || '',
        question: String(m.question || '').slice(0, 400)
      }))
    });
    aiState.mistakesResult = res.data;
    aiState.busy = false;
    renderAI();
  } catch (err) {
    aiState.busy = false;
    aiState.mistakesResult = null;
    renderAI();
    toast('خطا: ' + err.message, 'error', 6000);
  }
}

async function aiSuggestPlan() {
  const goal = 'برنامه مطالعه امروز';
  const progress = (CACHE.progress || [])
    .filter(p => !p.deleted_at)
    .slice(-20)
    .map(p => ({
      day: p.day,
      subject: subj(p.subject).name,
      chapter: p.chapter,
      note: p.note
    }));

  const stats = {
    today: aggregate(CACHE.sessions.filter(s => s.day === todayKey())),
    week: aggregate(CACHE.sessions.filter(s => {
      return s.day >= addDays(todayKey(), -6);
    }))
  };

  toast('در حال دریافت پیشنهاد…', 'info', 2000);

  try {
    const res = await aiCall('suggest-plan', { goal, progress, stats });
    const d = res.data;
    openModal(
      '<div class="modal-head"><h3>پیشنهاد AI</h3>' +
        '<button class="icon-btn sm" data-action="close-modal">' + ICONS.close + '</button></div>' +
      '<div style="font-size:13.5px;line-height:2">' +
        '<p class="muted mb-3" dir="auto">' + esc(d.summary) + '</p>' +
        (d.priorities.length
          ? '<h4 style="color:var(--brand);margin:10px 0 6px">اولویت‌ها</h4>' +
            '<ul style="padding-inline-start:20px">' +
              d.priorities.map(p => '<li dir="auto">' + esc(p) + '</li>').join('') + '</ul>'
          : '') +
        (d.suggestions.length
          ? '<h4 style="color:var(--brand);margin:14px 0 6px">پیشنهاد جلسات</h4>' +
            '<div class="list">' +
              d.suggestions.map(s =>
                '<div class="item"><div class="item-main">' +
                  '<b>' + esc(s.subject) + (s.chapter ? ' — ' + esc(s.chapter) : '') + '</b>' +
                  '<span>' + faNum(s.minutes) + ' دقیقه</span>' +
                  '<p dir="auto">' + esc(s.reason) + '</p>' +
                '</div></div>'
              ).join('') + '</div>'
          : '') +
        (d.tip
          ? '<div class="card card-brand" style="padding:12px;margin-top:14px">' +
              '<p class="t-sm" dir="auto" style="margin:0">💡 ' + esc(d.tip) + '</p></div>'
          : '') +
      '</div>'
    );
  } catch (err) {
    toast('خطا: ' + err.message, 'error', 6000);
  }
}

function aiDownloadSlides() {
  if (!aiState.slidesResult) return;
  const d = aiState.slidesResult;
  const html = '<!DOCTYPE html>\n' +
    '<html lang="fa" dir="rtl"><head><meta charset="utf-8">' +
    '<title>' + esc(d.deck_title) + '</title>' +
    '<style>body{font-family:Tahoma,sans-serif;background:#f5f5f5;margin:0;padding:20px}' +
    '.slide{background:#fff;border-radius:16px;padding:40px;margin-bottom:24px;box-shadow:0 4px 20px rgba(0,0,0,.08);page-break-after:always}' +
    'h1{color:#2563eb;font-size:28px;margin:0 0 20px} h2{color:#2563eb;font-size:22px;margin:0 0 14px}' +
    'li{font-size:16px;line-height:2;margin-bottom:8px} ul{padding-inline-start:24px}' +
    '.num{display:inline-block;background:#2563eb;color:#fff;padding:4px 12px;border-radius:12px;font-size:14px;margin-bottom:12px}' +
    '</style></head><body>' +
    '<h1>' + esc(d.deck_title) + '</h1>' +
    d.slides.map((s, i) =>
      '<div class="slide"><div class="num">اسلاید ' + (i + 1) + '</div>' +
        '<h2>' + esc(s.title) + '</h2>' +
        (s.bullets.length ? '<ul>' + s.bullets.map(b => '<li>' + esc(b) + '</li>').join('') + '</ul>' : '') +
        (s.image_prompt ? '<p style="font-style:italic;color:#888;margin-top:14px">📷 تصویر: ' + esc(s.image_prompt) + '</p>' : '') +
      '</div>'
    ).join('') +
    '</body></html>';
  downloadText('ky-slides-' + todayKey() + '.html', html, 'text/html;charset=utf-8');
  toast('فایل HTML ذخیره شد', 'ok');
}

async function testAIConnectionHandler() {
  const resultEl = $('#aiTestResult');
  if (!resultEl) return;
  resultEl.innerHTML = '<div class="card card-inset" style="padding:12px">' +
    '<div class="flex items-center gap-2">' +
      '<span class="spinner"></span>' +
      '<span class="t-xs muted">در حال تست…</span></div></div>';

  const form = document.querySelector('form[data-form="ai-settings"]');
  if (form) {
    /* Save temp keys for testing */
    const gVal = String(form.geminiKey.value || '').trim();
    const oVal = String(form.openrouterKey.value || '').trim();
    if (gVal) S.settings.ai.geminiKey = gVal;
    if (oVal) S.settings.ai.openrouterKey = oVal;
  }

  const results = await testAIConnection();

  if (!results.length) {
    resultEl.innerHTML = '<div class="card card-inset" style="padding:12px">' +
      '<p class="t-sm muted">هیچ کلیدی ثبت نشده</p></div>';
    return;
  }

  resultEl.innerHTML = results.map(r =>
    '<div class="card card-inset" style="padding:12px;margin-top:8px;border:1px solid ' +
      (r.ok ? 'var(--ok)' : 'var(--bad)') + '">' +
      '<div class="flex items-center gap-2" style="color:' + (r.ok ? 'var(--ok)' : 'var(--bad)') + '">' +
        (r.ok ? ICONS.check : ICONS.warning) +
        '<b class="t-sm">' + esc(r.provider) + ': ' + esc(r.message) + '</b>' +
      '</div>' +
    '</div>'
  ).join('');
}
</script>

<script>
/* ============================================================================
 * SECTION 34 — EVENT BINDINGS
 * ========================================================================= */

function bindEvents() {
  document.addEventListener('click', async (e) => {
    const navBtn = e.target.closest('[data-nav]');
    if (navBtn && navBtn.dataset.nav) {
      e.preventDefault();
      navigate(navBtn.dataset.nav);
      return;
    }

    const cmdItem = e.target.closest('[data-cmd-id]');
    if (cmdItem) { runCmdItem(cmdItem.dataset.cmdId); return; }

    const el = e.target.closest('[data-action]');
    if (!el) return;
    const action = el.dataset.action;
    const id = el.dataset.id;

    switch (action) {
      case 'close-modal': closeModal(); break;
      case 'open-cmd': openCmd(); break;
      case 'close-cmd': closeCmd(); break;

      case 'toggle-theme':
        S.settings.theme = S.settings.theme === 'dark' ? 'light' : 'dark';
        applyTheme();
        await saveSettings();
        if (S.activeView === 'settings') renderSettings();
        break;

      case 'toggle-sound':
        S.settings.soundEnabled = !S.settings.soundEnabled;
        await saveSettings();
        if (S.activeView === 'settings') renderSettings();
        break;

      case 'toggle-vibration':
        S.settings.vibrationEnabled = !S.settings.vibrationEnabled;
        await saveSettings();
        if (S.activeView === 'settings') renderSettings();
        break;

      case 'toggle-ai-fallback':
        S.settings.ai = S.settings.ai || {};
        S.settings.ai.fallbackEnabled = !(S.settings.ai.fallbackEnabled !== false);
        await saveSettings();
        renderSettings();
        break;

      case 'toggle-key-visibility': {
        const target = document.querySelector('input[name="' + el.dataset.target + '"]');
        if (!target) break;
        const isPwd = target.type === 'password';
        target.type = isPwd ? 'text' : 'password';
        el.innerHTML = isPwd ? ICONS.eyeOff : ICONS.eye;
        break;
      }

      case 'test-ai-connection':
        await testAIConnectionHandler();
        break;

      case 'edit-exam-date':
        navigate('settings');
        setTimeout(() => {
          const inp = document.querySelector('input[name="examDate"]');
          if (inp) inp.focus();
        }, 250);
        break;

      /* Timer */
      case 'timer-subj': {
        if (Timer.state && Timer.state.status === 'running') {
          toast('اول تایمر را متوقف کن', 'warn');
          break;
        }
        if (Timer.state) {
          Timer.state.subject = id;
          await Timer.save();
        } else {
          Timer.pendingSubject = id;
        }
        renderTimer();
        break;
      }
      case 'timer-start':
        Timer.start(Timer.state ? Timer.state.subject : (Timer.pendingSubject || 'bio'));
        renderTimer();
        break;
      case 'timer-pause': Timer.pause(); renderTimer(); break;
      case 'timer-resume': Timer.resume(); renderTimer(); break;

      case 'timer-finish': {
        const s = await Timer.finish();
        if (s) {
          toast('ثبت شد — ' + fmtHMfa((s.seconds || 0) / 60), 'ok');
          /* Offer to add chapter + tests info */
          const wantDetail = await confirmModal({
            title: 'اطلاعات تکمیلی',
            message: 'می‌خواهی فصل و تعداد تست‌های این جلسه را هم ثبت کنی؟',
            confirmLabel: 'بله'
          });
          if (wantDetail) {
            /* Update the session with more info */
            await openSessionDetailEditor(s.id);
          }
          navigate('home');
        } else {
          const drop = await confirmModal({
            title: 'جلسه خیلی کوتاه',
            message: 'مدت کمتر از ۱ دقیقه است. تایمر پاک شود؟',
            confirmLabel: 'پاک کن',
            danger: true
          });
          if (drop) { await Timer.reset(); renderTimer(); }
        }
        break;
      }

      case 'timer-cancel': {
        if (!Timer.state) break;
        const ok = await confirmModal({
          title: 'لغو',
          message: 'جلسه لغو شود؟',
          confirmLabel: 'لغو',
          danger: true
        });
        if (!ok) break;
        await Timer.reset();
        renderTimer();
        break;
      }

      case 'timer-zen':
        document.body.classList.add('zen-mode');
        break;

      case 'zen-exit':
        document.body.classList.remove('zen-mode');
        break;

      /* Delete exam */
      case 'del-exam': {
        const ok = await confirmModal({
          title: 'حذف',
          message: 'این آزمون حذف شود؟',
          confirmLabel: 'حذف',
          danger: true
        });
        if (!ok) break;
        const ex = await idbGet('exams', id);
        if (!ex) break;
        ex.deleted_at = Date.now();
        ex.updated_at = Date.now();
        await idbPut('exams', ex);
        await queueOp('delete', 'exams', id, ex);
        await refreshCache();
        renderExams();
        toast('حذف شد', 'ok', 1600);
        break;
      }

      /* Mistakes */
      case 'mistake-right': await handleMistakeResult(id, true); break;
      case 'mistake-wrong': await handleMistakeResult(id, false); break;

      case 'del-mistake': {
        const ok = await confirmModal({
          title: 'حذف',
          message: 'حذف شود؟',
          confirmLabel: 'حذف',
          danger: true
        });
        if (!ok) break;
        const m = await idbGet('mistakes', id);
        if (!m) break;
        m.deleted_at = Date.now();
        m.updated_at = Date.now();
        await idbPut('mistakes', m);
        await queueOp('delete', 'mistakes', id, m);
        await refreshCache();
        renderMistakes();
        toast('حذف شد', 'ok', 1600);
        break;
      }

      case 'set-importance': {
        const value = toInt(el.dataset.value, 3);
        updateImportanceStars(value);
        break;
      }

      case 'pick-mistake-image': {
        const inp = document.createElement('input');
        inp.type = 'file';
        inp.accept = 'image/*';
        inp.addEventListener('change', async () => {
          const f = inp.files && inp.files[0];
          if (!f) return;
          if (f.size > 5 * 1024 * 1024) { toast('حداکثر ۵ مگابایت', 'error'); return; }
          try {
            pendingMistakeImage = await compressImage(f);
            renderMistakes();
            toast('آماده شد', 'ok', 1200);
          } catch (err) { toast('خطا', 'error'); }
        });
        inp.click();
        break;
      }

      case 'clear-mistake-image':
        pendingMistakeImage = null;
        renderMistakes();
        break;

      /* Plan */
      case 'plan-toggle': {
        const tKey = todayKey();
        const sameDay = CACHE.plans.filter(p => p.day === tKey && !p.deleted_at);
        sameDay.sort((a, b) => (b.updated_at || 0) - (a.updated_at || 0));
        const plan = sameDay[0];
        if (!plan) break;
        const i = toInt(el.dataset.idx, -1);
        if (i < 0 || i >= plan.items.length) break;
        plan.items[i].done = !plan.items[i].done;
        plan.updated_at = Date.now();
        await idbPut('plans', plan);
        await queueOp('upsert', 'plans', plan.id, plan);
        await refreshCache();
        renderPlan();
        break;
      }

      case 'plan-del': {
        const tKey = todayKey();
        const sameDay = CACHE.plans.filter(p => p.day === tKey && !p.deleted_at);
        sameDay.sort((a, b) => (b.updated_at || 0) - (a.updated_at || 0));
        const plan = sameDay[0];
        if (!plan) break;
        const i = toInt(el.dataset.idx, -1);
        if (i < 0) break;
        plan.items.splice(i, 1);
        plan.updated_at = Date.now();
        await idbPut('plans', plan);
        await queueOp('upsert', 'plans', plan.id, plan);
        await refreshCache();
        renderPlan();
        break;
      }

      case 'note-del': {
        const n = await idbGet('notes', id);
        if (!n) break;
        n.deleted_at = Date.now();
        n.updated_at = Date.now();
        await idbPut('notes', n);
        await queueOp('delete', 'notes', id, n);
        await refreshCache();
        renderPlan();
        break;
      }

      case 'progress-del': {
        const p = await idbGet('progress', id);
        if (!p) break;
        p.deleted_at = Date.now();
        p.updated_at = Date.now();
        await idbPut('progress', p);
        await queueOp('delete', 'progress', id, p);
        await refreshCache();
        renderPlan();
        break;
      }

      case 'ai-suggest-plan':
        await aiSuggestPlan();
        break;

      /* Sim */
      case 'sim-finish': await finishSim(false); break;
      case 'sim-cancel': {
        const ok = await confirmModal({
          title: 'لغو',
          message: 'لغو شود؟',
          confirmLabel: 'لغو',
          danger: true
        });
        if (!ok) break;
        if (simTick._handle) { clearInterval(simTick._handle); simTick._handle = null; }
        activeSim = null;
        renderSim();
        break;
      }

      /* AI */
      case 'ai-mode':
        aiState.mode = el.dataset.mode;
        aiState.result = null;
        aiState.slidesResult = null;
        aiState.mistakesResult = null;
        renderAI();
        break;

      case 'ai-analyze-mistakes':
        await aiAnalyzeMistakes();
        break;

      case 'ai-download-slides':
        aiDownloadSlides();
        break;

      /* CSV */
      case 'csv-sessions': exportSessionsCSV(); break;
      case 'csv-exams': exportExamsCSV(); break;
      case 'csv-mistakes': exportMistakesCSV(); break;

      /* Backup */
      case 'export': exportData(); break;
      case 'import':
        const fi = $('#importFile');
        if (fi) { fi.value = ''; fi.click(); }
        break;

      case 'wipe-store': await wipeStore(el.dataset.store); break;

      case 'request-persist':
        if (navigator.storage && navigator.storage.persist) {
          try {
            const r = await navigator.storage.persist();
            toast(r ? 'فعال شد' : 'مرورگر اجازه نداد', r ? 'ok' : 'warn');
          } catch (e) { toast('پشتیبانی نمی‌شود', 'warn'); }
        }
        break;

      case 'clear-logs':
        for (const l of await idbGetAll('logs')) await idbDelete('logs', l.id);
        await refreshCache();
        renderDiag();
        toast('پاک شد', 'ok', 1500);
        break;

      /* Account */
      case 'open-account': openAccount(); break;

      case 'show-signup': {
        const m = document.querySelector('#modalRoot .modal');
        if (m) m.innerHTML =
          '<div class="modal-head"><h3>ثبت‌نام</h3>' +
            '<button class="icon-btn sm" data-action="close-modal">' + ICONS.close + '</button></div>' +
          buildSignupForm();
        break;
      }

      case 'show-login': {
        const m = document.querySelector('#modalRoot .modal');
        if (m) m.innerHTML =
          '<div class="modal-head"><h3>ورود</h3>' +
            '<button class="icon-btn sm" data-action="close-modal">' + ICONS.close + '</button></div>' +
          buildLoginForm();
        break;
      }

      case 'clear-supabase-config': {
        const ok = await confirmModal({
          title: 'پاک',
          message: 'پیکربندی پاک شود؟',
          confirmLabel: 'پاک'
        });
        if (!ok) break;
        S.settings.supabase = { url: '', anonKey: '' };
        await saveSettings();
        updateAccountBtn();
        closeModal();
        break;
      }

      case 'open-link-partner':
        if (!currentUser) { toast('اول وارد شو', 'warn'); return; }
        openLinkPartnerModal();
        break;

      case 'sign-out': {
        const ok = await confirmModal({
          title: 'خروج',
          message: 'از حساب خارج شوی؟',
          confirmLabel: 'خروج'
        });
        if (!ok) break;
        await authSignOut();
        closeModal();
        toast('خارج شدی', 'ok');
        break;
      }

      case 'sync-now':
        toast('در حال sync…', 'info', 1200);
        await syncNow(true);
        if ($('#modalRoot').classList.contains('open')) openAccount();
        else if (S.activeView === 'diag') renderDiag();
        break;

      case 'force-pull':
        lastPullTs = 0;
        await saveMeta('lastPullTs', 0);
        await syncNow(true);
        toast('دریافت شد', 'ok', 1200);
        if ($('#modalRoot').classList.contains('open')) openAccount();
        break;

      case 'fab-main': {
        const v = $('#fab').dataset.view;
        if (v === 'plan') {
          const inp = document.querySelector('form[data-form="plan-add"] input[name="text"]');
          if (inp) { inp.focus(); inp.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
        } else if (v === 'mistakes') {
          const inp = document.querySelector('form[data-form="mistake"] textarea[name="question"]');
          if (inp) { inp.focus(); inp.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
        } else if (v === 'exams') {
          const sel = document.querySelector('form[data-form="exam"] select[name="subject"]');
          if (sel) { sel.focus(); sel.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
        } else {
          navigate('timer');
        }
        break;
      }

      default: break;
    }
  });

  /* Submit */
  document.addEventListener('submit', async (e) => {
    const form = e.target.closest('form[data-form]');
    if (!form) return;
    e.preventDefault();
    const kind = form.dataset.form;

    try {
      if (kind === 'session-manual') await submitManualSession(form);
      else if (kind === 'exam') await submitExam(form);
      else if (kind === 'mistake') await submitMistake(form);
      else if (kind === 'note') await submitNote(form);
      else if (kind === 'plan-add') await submitTask(form);
      else if (kind === 'progress') await submitProgress(form);
      else if (kind === 'ai-explain') await aiExplainTopic(form);
      else if (kind === 'ai-slides') await aiMakeSlides(form);
      else if (kind === 'exam-date') {
        const title = String(form.examTitle.value || '').trim();
        const d = String(form.examDate.value || '');
        if (title) S.settings.examTitle = title;
        if (d && /^\d{4}-\d{2}-\d{2}$/.test(d)) S.settings.examDate = d;
        await saveSettings();
        toast('ذخیره شد', 'ok');
        renderSettings();
      }
      else if (kind === 'goals') {
        S.settings.dailyGoalMinutes = clamp(toInt(form.dailyGoalMinutes.value, 600), 30, 1200);
        S.settings.dailyGoalTests = clamp(toInt(form.dailyGoalTests.value, 80), 0, 500);
        await saveSettings();
        toast('ذخیره شد', 'ok');
        renderSettings();
      }
      else if (kind === 'ai-settings') {
        S.settings.ai = S.settings.ai || {};
        S.settings.ai.primaryProvider = String(form.primaryProvider.value || 'gemini');
        const gVal = String(form.geminiKey.value || '').trim();
        const oVal = String(form.openrouterKey.value || '').trim();
        if (gVal) S.settings.ai.geminiKey = gVal;
        if (oVal) S.settings.ai.openrouterKey = oVal;
        S.settings.ai.geminiModel = String(form.geminiModel.value || S.settings.ai.geminiModel);
        S.settings.ai.openrouterModel = String(form.openrouterModel.value || S.settings.ai.openrouterModel);
        await saveSettings();
        toast('ذخیره شد', 'ok');
        renderSettings();
      }
      else if (kind === 'plan-wake') {
        const tKey = todayKey();
        let plan = CACHE.plans.find(p => p.day === tKey && !p.deleted_at);
        if (!plan) {
          plan = {
            id: uid(),
            day: tKey,
            wake_time: '',
            items: [],
            created_at: Date.now(),
            updated_at: Date.now(),
            device_id: S.settings.deviceId,
            deleted_at: null
          };
        }
        plan.wake_time = String(form.wake.value || '');
        plan.updated_at = Date.now();
        await idbPut('plans', plan);
        await queueOp('upsert', 'plans', plan.id, plan);
        await refreshCache();
        renderPlan();
        toast('ذخیره شد', 'ok');
      }
      else if (kind === 'sim-start') {
        const subject = String(form.subject.value || 'bio');
        const count = clamp(toInt(form.count.value, 30), 5, 100);
        const minutes = clamp(toInt(form.minutes.value, 35), 1, 300);
        S.simConfig = Object.assign({}, S.simConfig, { subject, count, minutes });
        await saveSettings();
        activeSim = {
          id: uid(),
          subject, count, minutes,
          duration_sec: minutes * 60,
          started_at: Date.now(),
          answers: { c: 0, w: 0, b: 0 }
        };
        if (simTick._handle) clearInterval(simTick._handle);
        simTick._handle = setInterval(simTick, 1000);
        renderSim();
      }
      else if (kind === 'exam-ai-build') {
        await aiBuildExam(form);
      }
      else if (kind === 'supabase-config') {
        S.settings.supabase = {
          url: String(form.url.value || '').trim().replace(/\/$/, ''),
          anonKey: String(form.anonKey.value || '').trim()
        };
        await saveSettings();
        if (!initSupabaseSDK()) { toast('SDK بارگذاری نشده', 'error'); return; }
        updateAccountBtn();
        toast('ذخیره شد', 'ok');
        openAccount();
      }
      else if (kind === 'auth-login') {
        const btn = form.querySelector('button[type="submit"]');
        if (btn) { btn.disabled = true; btn.textContent = 'در حال ورود…'; }
        try {
          await authSignIn(form.email.value, form.password.value);
          closeModal();
          toast('خوش آمدی', 'ok');
          afterSignIn().catch(err => logError('afterSignIn: ' + err.message));
        } catch (err) {
          toast(err.message, 'error', 4200);
          if (btn) { btn.disabled = false; btn.textContent = 'ورود'; }
        }
      }
      else if (kind === 'auth-signup') {
        const btn = form.querySelector('button[type="submit"]');
        if (btn) { btn.disabled = true; btn.textContent = 'در حال ساخت…'; }
        try {
          await authSignUp(form.email.value, form.password.value);
          toast('اگر ایمیل تأیید لازم بود، صندوق را ببین.', 'ok', 5000);
          const m = document.querySelector('#modalRoot .modal');
          if (m) m.innerHTML =
            '<div class="modal-head"><h3>ورود</h3>' +
              '<button class="icon-btn sm" data-action="close-modal">' + ICONS.close + '</button></div>' +
            buildLoginForm();
        } catch (err) {
          toast(err.message, 'error', 4600);
          if (btn) { btn.disabled = false; btn.textContent = 'ثبت‌نام'; }
        }
      }
      else if (kind === 'link-partner') {
        try {
          await linkPartner(form.partnerEmail.value);
          toast('لینک شد', 'ok');
          closeModal();
          await startPresence();
          renderHome();
        } catch (err) { toast(err.message || 'خطا', 'error'); }
      }
    } catch (err) {
      logError(err.message || String(err));
      toast('خطا: ' + (err.message || ''), 'error');
    }
  });

  /* Input */
  document.addEventListener('input', (e) => {
    const t = e.target;
    const examForm = t.closest && t.closest('form[data-form="exam"]');
    if (examForm && ['correct', 'wrong', 'blank'].includes(t.name)) {
      const c = toInt(examForm.correct.value, 0);
      const w = toInt(examForm.wrong.value, 0);
      const b = toInt(examForm.blank.value, 0);
      const prev = examForm.querySelector('#examPreview');
      if (prev) prev.value = (c + w + b) > 0 ? calcPercent(c, w, b).toFixed(2) + '%' : '—';
    }
    if (t.id === 'cmdInput') renderCmdList(t.value);
  });

  /* Keyboard */
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      const root = $('#cmdRoot');
      if (root && root.style.display === 'flex') closeCmd();
      else openCmd();
      return;
    }
    const cmdRoot = $('#cmdRoot');
    if (cmdRoot && cmdRoot.style.display === 'flex') {
      if (e.key === 'Escape') { e.preventDefault(); closeCmd(); return; }
      if (e.key === 'Enter') {
        e.preventDefault();
        const active = cmdRoot.querySelector('.cmd-item.active');
        if (active) runCmdItem(active.dataset.cmdId);
        return;
      }
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        const items = Array.from(cmdRoot.querySelectorAll('.cmd-item'));
        if (!items.length) return;
        const idx = items.findIndex(it => it.classList.contains('active'));
        items.forEach(it => it.classList.remove('active'));
        let next = e.key === 'ArrowDown' ? idx + 1 : idx - 1;
        if (next < 0) next = items.length - 1;
        if (next >= items.length) next = 0;
        items[next].classList.add('active');
        items[next].scrollIntoView({ block: 'nearest' });
        return;
      }
    }
    if (e.key === 'Escape') {
      if (document.body.classList.contains('zen-mode')) {
        document.body.classList.remove('zen-mode');
      } else if ($('#modalRoot').classList.contains('open')) {
        closeModal();
      }
    }
  });

  const importFile = $('#importFile');
  if (importFile) {
    importFile.addEventListener('change', (e) => {
      handleImport(e.target.files && e.target.files[0]);
    });
  }

  window.addEventListener('online', () => {
    updateSyncPill();
    if (currentUser) syncNow(true);
  });
  window.addEventListener('offline', () => updateSyncPill());

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      Timer.render();
      if (currentUser && navigator.onLine) syncNow();
    }
  });

  window.addEventListener('beforeunload', () => { Timer.save(); });
}

/* ============================================================================
 * SECTION 35 — AI EXAM BUILDER
 * ========================================================================= */

async function aiBuildExam(form) {
  const subject = String(form.subject.value || 'bio');
  const chapter = String(form.chapter?.value || '').trim();
  const level = String(form.level.value || 'متوسط');
  const count = clamp(toInt(form.count.value, 5), 3, 20);
  const minutes = clamp(toInt(form.minutes.value, 10), 1, 300);
  const customTopic = String(form.topic?.value || '').trim();
  const topic = customTopic || chapter || subj(subject).name;

  if (!topic) { toast('موضوع را وارد کن', 'error'); return; }

  const btn = form.querySelector('button[type=submit]');
  const orig = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span><span>در حال ساخت…</span>'; }

  try {
    const res = await aiCall('quiz-from-topic', {
      topic,
      subject: subj(subject).name,
      level,
      count
    });

    const questions = res.data.questions;
    if (!questions.length) {
      toast('سؤالی ساخته نشد، دوباره تلاش کن', 'warn');
      if (btn) { btn.disabled = false; btn.innerHTML = orig; }
      return;
    }

    /* Open quiz modal */
    activeSim = null;
    openQuizFromAI(questions, {
      subject,
      topic,
      level,
      minutes,
      count: questions.length
    });

    if (btn) { btn.disabled = false; btn.innerHTML = orig; }
  } catch (err) {
    if (btn) { btn.disabled = false; btn.innerHTML = orig; }
    toast('خطا: ' + err.message, 'error', 6000);
  }
}

/* ============================================================================
 * SECTION 36 — QUIZ MODAL (AI-generated)
 * ========================================================================= */

let activeQuiz = null;

function openQuizFromAI(questions, meta) {
  activeQuiz = {
    questions: questions.map(q => ({
      text: q.stem,
      options: q.options,
      correctIndex: q.correct_index,
      explanation: q.explanation,
      needsReview: q.needs_review
    })),
    answers: new Array(questions.length).fill(null),
    submitted: false,
    startedAt: Date.now(),
    meta
  };
  openModal(renderQuizModal(), { wide: true });
}

function renderQuizModal() {
  if (!activeQuiz) return '';
  const qs = activeQuiz.questions;
  const answered = activeQuiz.answers.filter(a => a !== null).length;

  const body = qs.map((q, i) => {
    const selected = activeQuiz.answers[i];
    const showResult = activeQuiz.submitted;
    const optsHtml = '<div class="quiz-options">' + q.options.map((opt, oi) => {
      const isSelected = selected === oi;
      const isCorrect = showResult && oi === q.correctIndex;
      const isWrong = showResult && isSelected && oi !== q.correctIndex;
      const cls = 'quiz-opt' +
        (isSelected ? ' selected' : '') +
        (isCorrect ? ' correct' : '') +
        (isWrong ? ' wrong' : '');
      return '<button type="button" class="' + cls + '" ' +
        'data-action="quiz-answer" data-q="' + i + '" data-o="' + oi + '"' +
        (showResult ? ' disabled' : '') + '>' +
        '<span class="quiz-opt-key">' + faNum(oi + 1) + '</span>' +
        '<span>' + esc(opt) + '</span>' +
      '</button>';
    }).join('') + '</div>';

    const explanation = (showResult && q.explanation)
      ? '<div class="card card-inset" style="margin-top:10px;padding:12px">' +
          '<b class="tiny" style="color:var(--brand)">توضیح:</b>' +
          '<p style="font-size:12.5px;line-height:1.95;margin-top:6px" dir="auto">' + esc(q.explanation) + '</p>' +
        '</div>'
      : '';

    const review = q.needsReview
      ? '<span class="badge warn sm mt-2">نیاز به بررسی</span>'
      : '';

    return '<div class="quiz-q">' +
      '<div class="quiz-q-head">' +
        '<span class="quiz-q-num">' + faNum(i + 1) + '</span>' +
        '<div class="quiz-q-text" dir="auto">' + esc(q.text) + '</div>' +
      '</div>' +
      optsHtml +
      explanation +
      review +
    '</div>';
  }).join('');

  let footer;
  if (!activeQuiz.submitted) {
    footer = '<div class="modal-actions" style="justify-content:space-between;margin-top:14px">' +
      '<span class="t-xs muted">پاسخ‌داده: <b class="mono">' + faNum(answered) + ' از ' + faNum(qs.length) + '</b></span>' +
      '<div style="display:flex;gap:8px">' +
        '<button type="button" class="btn" data-action="close-modal">انصراف</button>' +
        '<button type="button" class="btn btn-primary" data-action="quiz-submit" ' +
          (answered === qs.length ? '' : 'disabled') + '>' +
          ICONS.check + '<span>تصحیح</span>' +
        '</button>' +
      '</div>' +
    '</div>';
  } else {
    const stats = computeQuizStats();
    footer = '<div class="card card-inset" style="margin-top:14px;padding:16px">' +
      '<div class="grid g4">' +
        '<div style="text-align:center"><div class="t-xs muted">درست</div>' +
          '<div class="mono" style="font-size:22px;font-weight:800;color:var(--ok)">' + faNum(stats.correct) + '</div></div>' +
        '<div style="text-align:center"><div class="t-xs muted">غلط</div>' +
          '<div class="mono" style="font-size:22px;font-weight:800;color:var(--bad)">' + faNum(stats.wrong) + '</div></div>' +
        '<div style="text-align:center"><div class="t-xs muted">نزده</div>' +
          '<div class="mono" style="font-size:22px;font-weight:800;color:var(--ink-3)">' + faNum(stats.blank) + '</div></div>' +
        '<div style="text-align:center"><div class="t-xs muted">تسلط</div>' +
          '<div class="mono" style="font-size:22px;font-weight:800;color:var(--brand)">' + fmtPct(stats.percent) + '</div></div>' +
      '</div>' +
    '</div>' +
    '<div class="modal-actions" style="justify-content:space-between;margin-top:14px">' +
      '<button type="button" class="btn" data-action="quiz-retake">' + ICONS.refresh + '<span>تمرین مجدد</span></button>' +
      '<div style="display:flex;gap:8px">' +
        '<button type="button" class="btn" data-action="close-modal">بستن</button>' +
        '<button type="button" class="btn btn-primary" data-action="quiz-save-session">' +
          ICONS.save + '<span>ثبت در جلسات</span>' +
        '</button>' +
      '</div>' +
    '</div>';
  }

  return '<div class="modal-head">' +
      '<h3>' + esc(activeQuiz.meta.topic) + ' — ' + faNum(qs.length) + ' سؤال</h3>' +
      '<button type="button" class="icon-btn sm" data-action="close-modal">' + ICONS.close + '</button>' +
    '</div>' + body + footer;
}

function computeQuizStats() {
  if (!activeQuiz) return { correct: 0, wrong: 0, blank: 0, total: 0, percent: 0 };
  let correct = 0, wrong = 0, blank = 0;
  activeQuiz.questions.forEach((q, i) => {
    const a = activeQuiz.answers[i];
    if (a === null) blank++;
    else if (a === q.correctIndex) correct++;
    else wrong++;
  });
  const total = correct + wrong + blank;
  return {
    correct, wrong, blank, total,
    percent: total > 0 ? ((3 * correct - wrong) / (3 * total)) * 100 : 0
  };
}

function quizAnswer(qIndex, optIndex) {
  if (!activeQuiz || activeQuiz.submitted) return;
  activeQuiz.answers[qIndex] = optIndex;
  /* Re-render */
  const root = $('#modalRoot');
  if (root) {
    root.innerHTML =
      '<div class="overlay" data-action="close-modal"></div>' +
      '<div class="modal wide" role="dialog" aria-modal="true">' +
        renderQuizModal() +
      '</div>';
  }
}

function quizSubmit() {
  if (!activeQuiz) return;
  const all = activeQuiz.answers.every(a => a !== null);
  if (!all) { toast('به همه سوالات پاسخ بده', 'error'); return; }
  activeQuiz.submitted = true;
  const root = $('#modalRoot');
  if (root) {
    root.innerHTML =
      '<div class="overlay" data-action="close-modal"></div>' +
      '<div class="modal wide" role="dialog" aria-modal="true">' +
        renderQuizModal() +
      '</div>';
  }
}

async function quizSaveSession() {
  if (!activeQuiz) return;
  const stats = computeQuizStats();
  const meta = activeQuiz.meta;

  closeModal();

  openModal(
    '<form data-form="quiz-to-session" class="modal-form">' +
      '<div class="modal-head"><h3>ثبت نتیجه آزمون در جلسات</h3></div>' +
      '<div class="field"><label class="label">درس</label>' +
        '<select class="select" name="subject">' +
          subjectOptionsHtml(meta.subject) +
        '</select></div>' +
      '<div class="field"><label class="label">فصل</label>' +
        '<select class="select" name="chapter">' +
          '<option value="">— انتخاب فصل —</option>' +
          chapterOptionsHtml(meta.subject, meta.topic) +
        '</select></div>' +
      '<div class="field"><label class="label">مدت (دقیقه)</label>' +
        '<input class="input mono" type="text" inputmode="numeric" name="minutes" value="' + meta.minutes + '" dir="ltr"></div>' +
      '<div class="field"><label class="label">عنوان مبحث</label>' +
        '<input class="input" type="text" name="topic" value="' + esc(meta.topic) + '" dir="auto"></div>' +
      '<input type="hidden" name="correct" value="' + stats.correct + '">' +
      '<input type="hidden" name="wrong" value="' + stats.wrong + '">' +
      '<input type="hidden" name="blank" value="' + stats.blank + '">' +
      '<div class="modal-actions">' +
        '<button type="button" class="btn" data-action="close-modal">انصراف</button>' +
        '<button type="submit" class="btn btn-primary">ثبت</button>' +
      '</div>' +
    '</form>'
  );
}

async function submitQuizToSession(form) {
  const subject = String(form.subject.value || '');
  const chapter = String(form.chapter?.value || '').trim();
  const minutes = clamp(toInt(form.minutes.value, 1), 1, 600);
  const topic = String(form.topic.value || '').trim();
  const correct = clamp(toInt(form.correct.value, 0), 0, 500);
  const wrong = clamp(toInt(form.wrong.value, 0), 0, 500);
  const blank = clamp(toInt(form.blank.value, 0), 0, 500);
  if (!SUBJ_MAP[subject]) { toast('درس نامعتبر', 'error'); return; }
  if (!topic) { toast('عنوان را وارد کن', 'error'); return; }

  const session = {
    id: uid(),
    created_at: Date.now(),
    updated_at: Date.now(),
    deleted_at: null,
    device_id: S.settings.deviceId,
    subject, chapter, topic,
    type: 'تست سنجشی',
    minutes,
    seconds: minutes * 60,
    correct, wrong, blank,
    note: '',
    day: todayKey()
  };
  await idbPut('sessions', session);
  await queueOp('upsert', 'sessions', session.id, session);
  await refreshCache();
  closeModal();
  toast('ثبت شد', 'ok', 3200);
  renderCurrent();
}

/* ============================================================================
 * SECTION 37 — SESSION DETAIL EDITOR (after timer finish)
 * ========================================================================= */

async function openSessionDetailEditor(sessionId) {
  const s = await idbGet('sessions', sessionId);
  if (!s) return;
  openModal(
    '<form data-form="session-update" class="modal-form">' +
      '<div class="modal-head"><h3>اطلاعات تکمیلی جلسه</h3></div>' +
      '<div class="field"><label class="label">فصل</label>' +
        '<select class="select" name="chapter">' +
          '<option value="">— انتخاب فصل —</option>' +
          chapterOptionsHtml(s.subject, s.chapter) +
        '</select></div>' +
      '<div class="form-grid c3">' +
        '<div class="field"><label class="label">درست</label>' +
          '<input class="input mono" type="text" inputmode="numeric" name="correct" value="' + (s.correct || 0) + '" dir="ltr"></div>' +
        '<div class="field"><label class="label">غلط</label>' +
          '<input class="input mono" type="text" inputmode="numeric" name="wrong" value="' + (s.wrong || 0) + '" dir="ltr"></div>' +
        '<div class="field"><label class="label">نزده</label>' +
          '<input class="input mono" type="text" inputmode="numeric" name="blank" value="' + (s.blank || 0) + '" dir="ltr"></div>' +
      '</div>' +
      '<div class="field"><label class="label">یادداشت</label>' +
        '<input class="input" name="note" value="' + esc(s.note || '') + '" dir="auto" maxlength="200"></div>' +
      '<input type="hidden" name="sessionId" value="' + esc(sessionId) + '">' +
      '<div class="modal-actions">' +
        '<button type="button" class="btn" data-action="close-modal">بستن</button>' +
        '<button type="submit" class="btn btn-primary">ذخیره</button>' +
      '</div>' +
    '</form>'
  );
}

async function submitSessionUpdate(form) {
  const id = String(form.sessionId.value || '');
  const s = await idbGet('sessions', id);
  if (!s) { closeModal(); return; }
  s.chapter = String(form.chapter?.value || '').trim();
  s.correct = clamp(toInt(form.correct.value, 0), 0, 1000);
  s.wrong = clamp(toInt(form.wrong.value, 0), 0, 1000);
  s.blank = clamp(toInt(form.blank.value, 0), 0, 1000);
  s.note = String(form.note.value || '').trim();
  s.updated_at = Date.now();
  await idbPut('sessions', s);
  await queueOp('upsert', 'sessions', s.id, s);
  await refreshCache();
  closeModal();
  toast('به‌روزرسانی شد', 'ok');
}
</script>

<script>
/* ============================================================================
 * SECTION 38 — AFTER SIGN IN & BOOTSTRAP
 * ========================================================================= */

async function afterSignIn() {
  if (!initSupabaseSDK()) return;
  const { data } = await sb.auth.getUser();
  if (!data || !data.user) return;
  currentUser = { id: data.user.id, email: data.user.email };
  lastPullTs = toInt(await getMeta('lastPullTs'), 0);
  await fetchMyProfile();
  await refreshSharedStatsForToday().catch(() => {});
  await syncNow(true);
  await startPresence();
  startSyncLoop();
  updateAccountBtn();
  if (S.activeView === 'home') renderHome();
}

/* ============================================================================
 * SECTION 39 — RENDER MAP
 * ========================================================================= */

window.RENDER = {
  home: renderHome,
  timer: renderTimer,
  exams: renderExams,
  mistakes: renderMistakes,
  sim: renderSim,
  plan: renderPlan,
  stats: renderStats,
  monthly: renderMonthly,
  ai: renderAI,
  settings: renderSettings,
  diag: renderDiag
};

/* ============================================================================
 * SECTION 40 — BOOTSTRAP
 * ========================================================================= */

async function bootstrap() {
  try {
    await openDB();
    await loadSettings();
    await Timer.load();
    await refreshCache();
    applyTheme();
    buildNav();
    bindEvents();

    /* Handle session update form */
    document.addEventListener('submit', async (e) => {
      const form = e.target.closest('form[data-form="session-update"]');
      if (!form) return;
      e.preventDefault();
      await submitSessionUpdate(form);
    });

    /* Handle quiz-to-session form */
    document.addEventListener('submit', async (e) => {
      const form = e.target.closest('form[data-form="quiz-to-session"]');
      if (!form) return;
      e.preventDefault();
      await submitQuizToSession(form);
    });

    /* Quiz actions */
    document.addEventListener('click', async (e) => {
      const el = e.target.closest('[data-action]');
      if (!el) return;
      const a = el.dataset.action;

      if (a === 'quiz-answer') {
        quizAnswer(toInt(el.dataset.q), toInt(el.dataset.o));
      } else if (a === 'quiz-submit') {
        quizSubmit();
      } else if (a === 'quiz-retake') {
        if (!activeQuiz) return;
        const qs = activeQuiz.questions.slice();
        const meta = activeQuiz.meta;
        closeModal();
        setTimeout(() => {
          activeQuiz = {
            questions: qs,
            answers: new Array(qs.length).fill(null),
            submitted: false,
            startedAt: Date.now(),
            meta
          };
          openModal(renderQuizModal(), { wide: true });
        }, 200);
      } else if (a === 'quiz-save-session') {
        await quizSaveSession();
      }
    });

    if (Timer.state && Timer.state.status === 'running') {
      Timer.state.started_at = Timer.state.started_at || Date.now();
      Timer.loop();
    }

    try {
      if (navigator.storage && navigator.storage.persist) {
        const persisted = await navigator.storage.persisted();
        if (!persisted) navigator.storage.persist().catch(() => {});
      }
    } catch (e) {}

    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      navigator.serviceWorker.register('./sw.js').catch((e) => logError('SW: ' + e.message));
    }

    if (initSupabaseSDK()) {
      try {
        const { data } = await sb.auth.getSession();
        if (data && data.session && data.session.user) {
          currentUser = { id: data.session.user.id, email: data.session.user.email };
          lastPullTs = toInt(await getMeta('lastPullTs'), 0);
          await fetchMyProfile();
          await syncNow(true);
          await startPresence();
          startSyncLoop();
          updateAccountBtn();
        }
      } catch (err) {
        logError('bootstrap phase2: ' + (err.message || err));
      }
    }

    navigate(S.activeView || 'home');

    setInterval(updateSyncPill, 15000);
    setInterval(() => {
      if (currentUser && navigator.onLine && !syncState.running) syncNow();
    }, 60000);

    const lastBackupReminder = toInt(await getMeta('lastBackupReminder'), 0);
    const WEEK_MS = 7 * 24 * 60 * 60 * 1000;
    if (Date.now() - lastBackupReminder > WEEK_MS) {
      setTimeout(() => {
        toast('یادآوری: پشتیبان JSON بگیر.', 'warn', 5000);
        saveMeta('lastBackupReminder', Date.now());
      }, 3000);
    }
  } catch (err) {
    console.error(err);
    document.body.innerHTML =
      '<div style="padding:24px;text-align:center;font-family:sans-serif;color:#dc2626">' +
        '<h2>خطا در راه‌اندازی</h2>' +
        '<p>' + esc(err.message) + '</p>' +
        '<button onclick="location.reload()" style="margin-top:12px;padding:10px 20px">تلاش مجدد</button>' +
      '</div>';
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', bootstrap);
} else {
  bootstrap();
}

window.addEventListener('error', (e) => {
  try { logError(e.message, { stack: e.error && e.error.stack }); } catch (_) {}
});
window.addEventListener('unhandledrejection', (e) => {
  try {
    const reason = e.reason;
    logError('Unhandled: ' + (reason && reason.message ? reason.message : reason));
  } catch (_) {}
});
</script>

<script>
/* ============================================================================
 * KONKOOR YAR 2.0 — HARDENING PATCH
 * No existing project line is removed. This layer repairs:
 *  - duplicated DOM IDs / duplicated shell
 *  - mobile navigation access to every view
 *  - Supabase SDK/client lifecycle
 *  - file:// signup callback handling
 *  - auth state/UI synchronization
 *  - online/offline sync UI
 * ========================================================================== */
(function(){
  "use strict";

  let kySbFingerprint = "";
  let kyAuthSubscription = null;
  let kyMobileNavRoot = null;

  function kyCfg(){
    return (S && S.settings && S.settings.supabase) ? S.settings.supabase : {url:"",anonKey:""};
  }

  function kyHasValidHttpOrigin(){
    return location.protocol === "http:" || location.protocol === "https:";
  }

  function kySupabaseFingerprint(cfg){
    return String((cfg && cfg.url) || "") + "\n" + String((cfg && cfg.anonKey) || "");
  }

  function kyCleanupOldSupabase(){
    try{
      if (kyAuthSubscription && typeof kyAuthSubscription.unsubscribe === "function"){
        kyAuthSubscription.unsubscribe();
      }
    }catch(_){}
    kyAuthSubscription = null;

    try{
      if (presenceChannel && sb && typeof sb.removeChannel === "function"){
        sb.removeChannel(presenceChannel);
      }
    }catch(_){}
    try{ presenceChannel = null; }catch(_){}
    try{ partnerPresence = null; }catch(_){}
    try{ currentUser = null; currentProfile = null; }catch(_){}
    sb = null;
    kySbFingerprint = "";
  }

  function kyBindAuthState(client){
    if (!client || !client.auth || typeof client.auth.onAuthStateChange !== "function") return;
    try{
      const result = client.auth.onAuthStateChange((event, session) => {
        try{
          if (session && session.user){
            currentUser = {id:session.user.id, email:session.user.email || ""};
            updateAccountBtn();
            updateSyncPill();

            if (event === "SIGNED_IN" || event === "TOKEN_REFRESHED"){
              setTimeout(async () => {
                try{
                  if (!currentUser || !sb) return;
                  await fetchMyProfile();
                  updateAccountBtn();
                  if (S.activeView === "home") renderHome();
                }catch(err){ try{ logError("auth state: " + (err.message || err)); }catch(_){} }
              }, 0);
            }
          }else if (event === "SIGNED_OUT"){
            currentUser = null;
            currentProfile = null;
            partnerPresence = null;
            try{ stopPresence(); }catch(_){}
            updateAccountBtn();
            updateSyncPill();
            if (S.activeView === "home") renderHome();
          }
        }catch(_){}
      });
      kyAuthSubscription = result && result.data ? result.data.subscription : null;
    }catch(err){
      try{ logError("auth listener: " + (err.message || err)); }catch(_){}
    }
  }

  function kyInitSupabaseSDK(){
    const cfg = kyCfg();
    if (!cfg.url || !cfg.anonKey) return false;
    if (typeof window.supabase === "undefined" || typeof window.supabase.createClient !== "function") return false;

    const fp = kySupabaseFingerprint(cfg);
    if (sb && kySbFingerprint === fp) return true;

    if (sb && kySbFingerprint !== fp) kyCleanupOldSupabase();

    try{
      sb = window.supabase.createClient(cfg.url, cfg.anonKey, {
        auth:{
          persistSession:true,
          autoRefreshToken:true,
          detectSessionInUrl:false,
          storageKey:"ky.auth"
        },
        realtime:{params:{eventsPerSecond:5}},
        global:{
          fetch:(url, opts={}) => {
            const ctrl = new AbortController();
            const t = setTimeout(() => ctrl.abort(), 20000);
            return fetch(url, {...opts, signal:opts.signal || ctrl.signal})
              .finally(() => clearTimeout(t));
          }
        }
      });
      kySbFingerprint = fp;
      try{ sb.__kyConfigFingerprint = fp; }catch(_){}
      kyBindAuthState(sb);
      return true;
    }catch(err){
      try{ logError("SB init hardened: " + (err.message || err)); }catch(_){}
      sb = null;
      kySbFingerprint = "";
      return false;
    }
  }

  async function kyLoadSupabaseSDK(timeoutMs=8500){
    if (typeof window.supabase !== "undefined" && typeof window.supabase.createClient === "function") return true;

    try{
      if (typeof window.__loadSupabaseCdn === "function") window.__loadSupabaseCdn();
    }catch(_){}

    if (!document.querySelector('script[data-ky-supabase-cdn]')){
      const s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js";
      s.async = true;
      s.dataset.kySupabaseCdn = "1";
      document.head.appendChild(s);
    }

    const started = Date.now();
    while (Date.now() - started < timeoutMs){
      if (typeof window.supabase !== "undefined" && typeof window.supabase.createClient === "function") return true;
      await new Promise(r => setTimeout(r, 120));
    }
    return typeof window.supabase !== "undefined" && typeof window.supabase.createClient === "function";
  }

  function kyBuildAccountBody(){
    const cfg = kyCfg();
    if (!cfg.url || !cfg.anonKey){
      return '<div class="card card-inset mb-3" style="padding:14px">' +
        '<p class="t-sm muted" style="line-height:2">URL و anon key را وارد کن.</p></div>' +
        buildSupabaseConfigForm(cfg);
    }

    if (!currentUser){
      return buildLoginForm();
    }
    return buildAccountBody();
  }

  async function kyOpenAccount(){
    const cfg = kyCfg();
    if (!cfg.url || !cfg.anonKey){
      openModal(
        '<div class="modal-head"><h3>حساب کاربری</h3>' +
        '<button class="icon-btn sm" data-action="close-modal">' + ICONS.close + '</button></div>' +
        kyBuildAccountBody()
      );
      return;
    }

    const sdkOk = await kyLoadSupabaseSDK(8500);
    if (!sdkOk){
      openModal(
        '<div class="modal-head"><h3>حساب کاربری</h3>' +
        '<button class="icon-btn sm" data-action="close-modal">' + ICONS.close + '</button></div>' +
        '<div class="card card-inset" style="padding:14px">' +
        '<b class="t-sm">اتصال حساب آماده نیست</b>' +
        '<p class="t-sm muted" style="margin-top:6px;line-height:2">کتابخانه Supabase بارگذاری نشد. اینترنت و فایل vendor/supabase.min.js را بررسی کن و دوباره تلاش کن.</p>' +
        '<button type="button" class="btn btn-primary btn-block mt-3" data-action="open-account">تلاش دوباره</button>' +
        '</div>'
      );
      return;
    }

    if (!kyInitSupabaseSDK()){
      openModal(
        '<div class="modal-head"><h3>حساب کاربری</h3>' +
        '<button class="icon-btn sm" data-action="close-modal">' + ICONS.close + '</button></div>' +
        '<div class="card card-inset" style="padding:14px">' +
        '<p class="t-sm muted">پیکربندی Supabase معتبر نیست.</p></div>' +
        buildSupabaseConfigForm(cfg)
      );
      return;
    }

    try{
      const sessionRes = await sb.auth.getSession();
      const session = sessionRes && sessionRes.data ? sessionRes.data.session : null;
      if (session && session.user){
        currentUser = {id:session.user.id, email:session.user.email || ""};
        if (!currentProfile) await fetchMyProfile();
      }else{
        currentUser = null;
        currentProfile = null;
      }
    }catch(err){
      try{ logError("account getSession: " + (err.message || err)); }catch(_){}
    }

    openModal(
      '<div class="modal-head"><h3>حساب کاربری</h3>' +
      '<button class="icon-btn sm" data-action="close-modal">' + ICONS.close + '</button></div>' +
      kyBuildAccountBody()
    );
    updateAccountBtn();
  }

  async function kyAuthSignIn(email, password){
    if (!kyInitSupabaseSDK()) throw new Error("Supabase پیکربندی نشده یا SDK آماده نیست");
    const {data,error} = await sb.auth.signInWithPassword({
      email:String(email || "").trim().toLowerCase(),
      password:String(password || "")
    });
    if (error) throw new Error(faAuthError(error.message));
    if (data && data.user){
      currentUser = {id:data.user.id, email:data.user.email || String(email || "").trim().toLowerCase()};
      try{ await fetchMyProfile(); }catch(_){}
      updateAccountBtn();
      updateSyncPill();
    }
    return data && data.user;
  }

  async function kyAuthSignUp(email, password){
    if (!kyInitSupabaseSDK()) throw new Error("Supabase پیکربندی نشده یا SDK آماده نیست");
    const payload = {
      email:String(email || "").trim().toLowerCase(),
      password:String(password || "")
    };
    if (kyHasValidHttpOrigin()){
      payload.options = {emailRedirectTo:location.origin + location.pathname};
    }
    const {data,error} = await sb.auth.signUp(payload);
    if (error) throw new Error(faAuthError(error.message));
    if (data && data.session && data.user){
      currentUser = {id:data.user.id, email:data.user.email || payload.email};
      try{ await fetchMyProfile(); }catch(_){}
      updateAccountBtn();
      updateSyncPill();
    }
    return data && data.user;
  }

  async function kyAuthSignOut(){
    try{ await stopPresence(); }catch(_){}
    try{ if (sb && sb.auth) await sb.auth.signOut(); }catch(_){}
    currentUser = null;
    currentProfile = null;
    partnerPresence = null;
    updateAccountBtn();
    updateSyncPill();
    if (S.activeView === "home") renderHome();
  }

  function kyDedupeDuplicateIds(){
    const seen = new Set();
    document.querySelectorAll("[id]").forEach(el => {
      const id = el.id;
      if (!id) return;
      if (!seen.has(id)){ seen.add(id); return; }
      el.setAttribute("data-ky-duplicate","1");
      el.setAttribute("aria-hidden","true");
      el.style.setProperty("display","none","important");
      if ("disabled" in el) {
        try{ el.disabled = true; }catch(_){}
      }
    });

    const apps = document.querySelectorAll("body > .app");
    apps.forEach((el,i) => {
      if (i > 0){
        el.setAttribute("data-ky-duplicate-app","1");
        el.style.setProperty("display","none","important");
      }
    });
  }

  function kyCreateMobileMenu(){
    if (document.querySelector(".mobile-more-btn")) return;

    const actions = document.querySelector(".top-actions");
    if (!actions) return;

    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "icon-btn mobile-more-btn";
    btn.setAttribute("aria-label","همه بخش‌ها");
    btn.setAttribute("title","همه بخش‌ها");
    btn.setAttribute("data-ky-action","open-mobile-nav");
    btn.innerHTML =
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" width="19" height="19">' +
      '<path d="M4 7h16M4 12h16M4 17h16"/></svg>';
    actions.appendChild(btn);

    const root = document.createElement("div");
    root.className = "ky-mobile-nav-root";
    root.id = "kyMobileNavRoot";
    root.setAttribute("aria-hidden","true");
    root.innerHTML =
      '<div class="ky-mobile-nav-overlay" data-ky-action="close-mobile-nav"></div>' +
      '<section class="ky-mobile-nav-sheet" role="dialog" aria-modal="true" aria-label="همه بخش‌ها">' +
        '<div class="ky-mobile-nav-head">' +
          '<h3>همه بخش‌های کنکوریار</h3>' +
          '<button type="button" class="icon-btn sm" data-ky-action="close-mobile-nav" aria-label="بستن">' + ICONS.close + '</button>' +
        '</div>' +
        '<div class="ky-mobile-nav-grid" id="kyMobileNavGrid"></div>' +
      '</section>';
    document.body.appendChild(root);
    kyMobileNavRoot = root;
    kyRenderMobileMenu();
  }

  function kyRenderMobileMenu(){
    const grid = document.getElementById("kyMobileNavGrid");
    if (!grid || !Array.isArray(NAV_ITEMS)) return;
    grid.innerHTML = NAV_ITEMS.map(n =>
      '<button type="button" class="ky-mobile-nav-item' + (S.activeView === n.id ? ' active' : '') +
      '" data-nav="' + esc(n.id) + '">' +
      (ICONS[n.icon] || '') +
      '<span>' + esc(n.label) + '</span></button>'
    ).join("");
  }

  function kyToggleMobileMenu(open){
    if (!kyMobileNavRoot) return;
    const shouldOpen = !!open;
    kyMobileNavRoot.classList.toggle("open", shouldOpen);
    kyMobileNavRoot.setAttribute("aria-hidden", shouldOpen ? "false" : "true");
    document.body.classList.toggle("ky-mobile-nav-open", shouldOpen);
    if (shouldOpen) kyRenderMobileMenu();
  }

  function kyInstallMobileDelegation(){
    document.addEventListener("click", async (e) => {
      const target = e.target.closest && e.target.closest("[data-ky-action]");
      if (target){
        const action = target.getAttribute("data-ky-action");
        if (action === "open-mobile-nav"){
          e.preventDefault();
          kyToggleMobileMenu(true);
          return;
        }
        if (action === "close-mobile-nav"){
          e.preventDefault();
          kyToggleMobileMenu(false);
          return;
        }
      }
    });

    document.addEventListener("keydown", e => {
      if (e.key === "Escape" && kyMobileNavRoot && kyMobileNavRoot.classList.contains("open")){
        e.preventDefault();
        kyToggleMobileMenu(false);
      }
    });

    window.addEventListener("online", () => {
      try{ updateSyncPill(); }catch(_){}
      try{ if (currentUser) syncNow(true); }catch(_){}
    });

    window.addEventListener("offline", () => {
      try{ updateSyncPill(); }catch(_){}
    });
  }

  // Expose repaired implementations to the existing app's global function calls.
  window.initSupabaseSDK = kyInitSupabaseSDK;
  window.openAccount = kyOpenAccount;
  window.authSignIn = kyAuthSignIn;
  window.authSignUp = kyAuthSignUp;
  window.authSignOut = kyAuthSignOut;

  kyDedupeDuplicateIds();
  kyCreateMobileMenu();
  kyInstallMobileDelegation();

  const originalNavigate = window.navigate;
  window.navigate = function(view){
    const result = originalNavigate(view);
    try{ kyRenderMobileMenu(); kyToggleMobileMenu(false); }catch(_){}
    return result;
  };

  // Re-apply duplicate-ID cleanup after the original bootstrap's initial rendering.
  setTimeout(kyDedupeDuplicateIds, 0);
  setTimeout(kyDedupeDuplicateIds, 500);
})();
</script>

<script>
(function(){
  'use strict';

  /* =======================================================================
   * 1) Persian date formatting — explicit DAY MONTH YEAR order
   * ======================================================================= */
  function kyJalaliParts(value, withWeekday){
    const d = value instanceof Date ? value : parseDay(value);
    if (!d || isNaN(d.getTime())) return null;
    try{
      const opts = withWeekday
        ? {weekday:'long', day:'numeric', month:'long', year:'numeric'}
        : {day:'numeric', month:'long', year:'numeric'};
      const parts = new Intl.DateTimeFormat('fa-IR-u-ca-persian-nu-latn', opts).formatToParts(d);
      const out = {day:'',month:'',year:'',weekday:''};
      for(const part of parts){
        if(part.type === 'day') out.day = part.value;
        else if(part.type === 'month') out.month = part.value;
        else if(part.type === 'year') out.year = part.value;
        else if(part.type === 'weekday') out.weekday = part.value;
      }
      return out;
    }catch(e){ return null; }
  }

  window.faDate = function(value, style){
    const p = kyJalaliParts(value, style === 'weekday');
    if(!p) return '—';
    const core = [faNum(p.day), p.month, faNum(p.year)].filter(Boolean).join(' ');
    if(style === 'weekday') return p.weekday + '، ' + core;
    return core;
  };

  window.kyJalaliDayNumber = function(value){
    const p = kyJalaliParts(value, false);
    return p ? faNum(p.day) : '—';
  };

  /* =======================================================================
   * 2) All visible numeric text -> Persian digits
   *    Do not touch editable LTR fields, code, scripts, or styles.
   * ======================================================================= */
  function kyNormalizeDigits(root){
    if(!root || typeof document === 'undefined') return;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const nodes=[];
    let n;
    while((n=walker.nextNode())) nodes.push(n);
    for(const node of nodes){
      const parent=node.parentElement;
      if(!parent) continue;
      if(parent.closest('script,style,textarea,input,[dir="ltr"],.ltr,[data-no-fa-numbers]')) continue;
      const next=node.nodeValue.replace(/[0-9]/g, d => FA_DIGITS[Number(d)]);
      if(next !== node.nodeValue) node.nodeValue = next;
    }
  }
  window.kyNormalizeDigits = kyNormalizeDigits;

  /* =======================================================================
   * 3) Wake-time wheel picker (hour first, then minute)
   * ======================================================================= */
  const wakeState = {
    step: 1,
    hour: 7,
    minute: 0,
    root: null
  };
  window.kyWakeState = wakeState;

  function kyPad(n){ return String(Math.max(0,Number(n)||0)).padStart(2,'0'); }
  function kyWakeText(h,m){ return faNum(kyPad(h) + ':' + kyPad(m)); }

  function wheelHtml(type, selected){
    const max = type === 'hour' ? 23 : 59;
    let html = '<div class="wake-wheel-wrap"><div class="wake-wheel-center"></div><div class="wake-wheel" data-wake-wheel="' + type + '">';
