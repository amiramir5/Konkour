/** محاسبه درصد استاندارد کنکور: ((3×درست) - غلط) ÷ (3×کل) × 100 */
function calcPercent(correct, wrong, blank) {
  const total = correct + wrong + blank;
  if (total <= 0) return 0;
  return ((3 * correct) - wrong) / (3 * total) * 100;
}

/** جمع‌بندی یک لیست جلسه */
function aggregate(list) {
  let minutes = 0, correct = 0, wrong = 0, blank = 0;
  list.forEach(s => {
    minutes += Math.round(toInt(s.seconds) / 60);
    correct += toInt(s.correct);
    wrong += toInt(s.wrong);
    blank += toInt(s.blank);
  });
  const total = correct + wrong + blank;
  return {
    minutes,
    correct,
    wrong,
    blank,
    total,
    percent: calcPercent(correct, wrong, blank),
    rawPercent: total > 0 ? (correct / total) * 100 : 0
  };
}

/** جمع‌بندی یک بازه تاریخی */
function aggregateRange(sessions, exams, fromDay, toDay) {
  const inS = sessions.filter(s => !s.deleted_at && s.day >= fromDay && s.day <= toDay);
  const inE = exams.filter(e => !e.deleted_at && e.day >= fromDay && e.day <= toDay);
  const seconds = inS.reduce((a, s) => a + (s.seconds || 0), 0);
  const correct = inS.reduce((a, s) => a + (s.correct || 0), 0);
  const wrong = inS.reduce((a, s) => a + (s.wrong || 0), 0);
  const blank = inS.reduce((a, s) => a + (s.blank || 0), 0);
  const examTests = inE.reduce((a, e) => a + (e.correct || 0) + (e.wrong || 0) + (e.blank || 0), 0);
  const avgPercent = inE.length
    ? inE.reduce((a, e) => a + (e.percent || 0), 0) / inE.length
    : null;
  return {
    sessions: inS.length,
    exams: inE.length,
    seconds,
    minutes: Math.round(seconds / 60),
    correct,
    wrong,
    blank,
    testCount: correct + wrong + blank + examTests,
    percent: calcPercent(correct, wrong, blank),
    examPercent: avgPercent
  };
}

/** محاسبه تداوم (روزهای پیوسته مطالعه) */
function computeStreak(sessions) {
  const days = new Set(
    sessions.filter(s => !s.deleted_at).map(s => s.day).filter(Boolean)
  );
  if (!days.size) return 0;
  let cursor = new Date();
  if (!days.has(isoDay(cursor))) cursor.setDate(cursor.getDate() - 1);
  let count = 0;
  while (days.has(isoDay(cursor))) {
    count++;
    cursor.setDate(cursor.getDate() - 1);
  }
  return count;
}

/** روزهای باقی‌مانده تا کنکور */
function daysToExam() {
  const left = diffDays(todayKey(), S.settings.examDate);
  return Number.isFinite(left) ? Math.max(0, left) : 0;
}

/** نگاشت دقیقه مطالعه به هر درس */
function subjectMinutesMap(sessions) {
  const map = {};
  SUBJECTS.forEach(s => map[s.id] = 0);
  sessions.filter(s => !s.deleted_at).forEach(s => {
    if (map[s.subject] === undefined) map[s.subject] = 0;
    map[s.subject] += Math.round((s.seconds || 0) / 60);
  });
  return map;
}

/** مرتب‌سازی آزمون‌ها به ترتیب تاریخی */
function examSortedChronologically() {
  return CACHE.exams
    .filter(e => !e.deleted_at)
    .sort((a, b) => String(a.day).localeCompare(String(b.day)));
}


/* ============================================================================
 * SECTION 7 — TIMER ENGINE
 * ---------------------------------------------------------------------------
 * موتور تایمر timestamp-based. مقاوم در برابر بستن اپ و قفل صفحه.
 * ========================================================================= */

const Timer = {
  state: null,
  tickHandle: null,
  pendingSubject: 'bio',

  /** بارگذاری وضعیت تایمر از IndexedDB */
  async load() {
    try {
      const s = await idbGet('timer', 'state');
      if (s) this.state = s;
    } catch (e) {
      logError('Timer.load: ' + e.message);
    }
  },

  /** ذخیره وضعیت تایمر */
  async save() {
    if (!this.state) return;
    try {
      await idbPut('timer', this.state);
      if (typeof trackPresence === 'function' && currentUser) {
        try { trackPresence(); } catch (e) {}
      }
    } catch (e) {
      logError('Timer.save: ' + e.message);
    }
  },

  /** پاک کردن وضعیت تایمر */
  async clear() {
    try { await idbDelete('timer', 'state'); } catch (e) {}
    this.state = null;
    if (typeof trackPresence === 'function' && currentUser) {
      try { trackPresence(); } catch (e) {}
    }
  },

  /** شروع تایمر برای یک درس */
  start(subject) {
    if (!SUBJ_MAP[subject]) return;
    const now = Date.now();
    this.state = {
      key: 'state',
      subject,
      status: 'running',
      started_at: now,
      accumulated_ms: 0,
      day: todayKey(),
      created_at: now
    };
    this.save();
    this.loop();
    this.render();
    if (S.settings.vibrationEnabled && navigator.vibrate) {
      try { navigator.vibrate(30); } catch (e) {}
    }
  },

  /** توقف موقت */
  pause() {
    if (!this.state || this.state.status !== 'running') return;
    this.state.accumulated_ms += Math.max(0, Date.now() - this.state.started_at);
    this.state.started_at = null;
    this.state.status = 'paused';
    this.save();
    this.stopLoop();
    this.render();
    if (S.settings.vibrationEnabled && navigator.vibrate) {
      try { navigator.vibrate([20, 40, 20]); } catch (e) {}
    }
  },

  /** ادامه */
  resume() {
    if (!this.state || this.state.status === 'running') return;
    this.state.status = 'running';
    this.state.started_at = Date.now();
    this.save();
    this.loop();
    this.render();
  },

  /** بازنشانی */
  async reset() {
    this.stopLoop();
    await this.clear();
    this.render();
  },

  /** محاسبه زمان سپری‌شده به میلی‌ثانیه */
  elapsedMs() {
    if (!this.state) return 0;
    if (this.state.status === 'running' && this.state.started_at) {
      const delta = Math.max(0, Date.now() - this.state.started_at);
      return this.state.accumulated_ms + delta;
    }
    return this.state.accumulated_ms;
  },

  /** زمان سپری‌شده به ثانیه */
  elapsedSeconds() {
    return Math.floor(this.elapsedMs() / 1000);
  },

  /** شروع حلقه رندر */
  loop() {
    this.stopLoop();
    this.tickHandle = setInterval(() => this.render(), 1000);
  },

  /** توقف حلقه رندر */
  stopLoop() {
    if (this.tickHandle) {
      clearInterval(this.tickHandle);
      this.tickHandle = null;
    }
  },

  /** پایان و ثبت جلسه */
  async finish() {
    if (!this.state) return null;
    const seconds = this.elapsedSeconds();
    if (seconds < 60) return null;
    const session = {
      id: uid(),
      created_at: Date.now(),
      updated_at: Date.now(),
      deleted_at: null,
      device_id: S.settings.deviceId,
      subject: this.state.subject,
      seconds,
      correct: 0,
      wrong: 0,
      blank: 0,
      note: '',
      day: this.state.day || todayKey(),
      type: 'آموزش'
    };
    await idbPut('sessions', session);
    await queueOp('upsert', 'sessions', session.id, session);
    await this.clear();
    await refreshCache();
    return session;
  },

  /** رندر تایمر */
  render() {
    const timeEl = $('#ringTime');
    const subEl = $('#ringSub');
    const ringEl = $('#ringFg');
    if (!timeEl || !subEl) return;
    const ms = this.elapsedMs();
    timeEl.textContent = faNum(fmtClock(ms / 1000));
    if (this.state) {
      const n = subj(this.state.subject).name;
      subEl.textContent = this.state.status === 'running'
        ? 'در حال مطالعه — ' + n
        : 'متوقف — ' + n;
    } else {
      subEl.textContent = 'آماده برای شروع';
    }
    if (ringEl) {
      const pct = clamp(ms / 3600000, 0, 1);
      const C = 2 * Math.PI * 88;
      ringEl.style.strokeDasharray = C.toFixed(2);
      ringEl.style.strokeDashoffset = (C * (1 - pct)).toFixed(2);
    }
  }
};

 * ---------------------------------------------------------------------------

 * ========================================================================= */

function toast(message, type = 'info', ms = 3200) {
  const host = $('#toasts');
  if (!host) return;
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.setAttribute('role', type === 'error' ? 'alert' : 'status');
  el.innerHTML = '<span class="tdot"></span><span dir="auto">' + esc(message) + '</span>';
  host.appendChild(el);
  requestAnimationFrame(() => el.classList.add('in'));
  setTimeout(() => {
    el.classList.remove('in');
    setTimeout(() => el.remove(), 400);
  }, ms);
}


/* ============================================================================
 * SECTION 10 — MODAL
 * ---------------------------------------------------------------------------
 * پنجره‌های مودال با focus trap.
 * ========================================================================= */

let modalPreviousFocus = null;

function openModal(html, opts) {
  opts = opts || {};
  const root = $('#modalRoot');
  if (!root) return;
  modalPreviousFocus = document.activeElement;
  const wasOpen = root.classList.contains('open');
  root.innerHTML =
    '<div class="overlay" data-action="close-modal"></div>' +
    '<div class="modal' + (opts.wide ? ' wide' : '') + '" role="dialog" aria-modal="true" tabindex="-1">' +
      html +
    '</div>';
  root.classList.add('open');
  document.body.classList.add('modal-open');
  const modal = root.querySelector('.modal');
  if (modal && !wasOpen) {
    const focusable = modal.querySelector(
      'input:not([type=hidden]), select, textarea, button:not(.overlay)'
    );
    setTimeout(() => {
      try { (focusable || modal).focus(); } catch (e) {}
    }, 80);
  }
}

function closeModal() {
  const root = $('#modalRoot');
  if (!root) return;
  root.classList.remove('open');
  root.innerHTML = '';
  document.body.classList.remove('modal-open');
  if (modalPreviousFocus && typeof modalPreviousFocus.focus === 'function') {
    try { modalPreviousFocus.focus(); } catch (e) {}
  }
  modalPreviousFocus = null;
}

/* Focus trap */
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Tab') return;
  const modal = document.querySelector('#modalRoot.open .modal');
  if (!modal) return;
  const focusables = modal.querySelectorAll(
    'a[href], button:not([disabled]), input:not([type=hidden]):not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'
  );
  if (!focusables.length) return;
  const first = focusables[0];
  const last = focusables[focusables.length - 1];
  if (e.shiftKey && document.activeElement === first) {
    e.preventDefault();
    last.focus();
  } else if (!e.shiftKey && document.activeElement === last) {
    e.preventDefault();
    first.focus();
  }
});

function confirmModal(opts) {
  opts = opts || {};
  return new Promise(resolve => {
    openModal(
      '<div class="modal-head"><h3>' + esc(opts.title || 'تأیید') + '</h3></div>' +
      '<p class="t-sm muted" style="margin-bottom:16px;line-height:2">' + esc(opts.message || '') + '</p>' +
      '<div class="modal-actions">' +
        '<button type="button" class="btn" data-confirm-cancel>انصراف</button>' +
        '<button type="button" class="btn ' + (opts.danger ? 'btn-danger' : 'btn-primary') + '" data-confirm-accept>' +
          esc(opts.confirmLabel || 'تأیید') +
        '</button>' +
      '</div>'
    );
    const root = $('#modalRoot');
    const cancelBtn = root.querySelector('[data-confirm-cancel]');
    const acceptBtn = root.querySelector('[data-confirm-accept]');
    const overlay = root.querySelector('.overlay');
    let settled = false;
    const finish = (result) => {
      if (settled) return;
      settled = true;
      closeModal();
      resolve(result);
    };
    if (cancelBtn) cancelBtn.addEventListener('click', () => finish(false));
    if (acceptBtn) acceptBtn.addEventListener('click', () => finish(true));
    if (overlay) overlay.addEventListener('click', () => finish(false));
  });
}

function buildDonutHtml(total, map) {
  if (total <= 0) {
    return '<div class="empty no-border" style="padding:22px 12px">' +
      '<b style="font-size:14px">داده‌ای برای نمایش نیست</b>' +
      '<p style="font-size:12.5px">هنوز در این بازه چیزی ثبت نشده است.</p>' +
    '</div>';
  }
  let grad = 'var(--surface-3) 0% 100%';
  let acc = 0;
  const stops = [];
  SUBJECTS.forEach(s => {
    const m = map[s.id] || 0;
    if (m <= 0) return;
    const pct = (m / total) * 100;
    stops.push(s.color + ' ' + acc.toFixed(3) + '% ' + (acc + pct).toFixed(3) + '%');
    acc += pct;
  });
  if (stops.length) grad = 'conic-gradient(' + stops.join(', ') + ')';
  const legend = SUBJECTS
    .map(s => ({ s, m: map[s.id] || 0 }))
    .filter(x => x.m > 0)
    .sort((a, b) => b.m - a.m)
    .map(x =>
      '<div class="legend-row">' +
        '<span class="legend-dot" style="background:' + x.s.color + '"></span>' +
        '<span class="legend-name">' + esc(x.s.name) + '</span>' +
        '<span class="legend-val">' + fmtHMfa(x.m) + ' · ' + fmtPct((x.m / total) * 100) + '</span>' +
      '</div>'
    ).join('');
  return '<div class="donut-wrap">' +
    '<div class="donut" style="background:' + grad + '">' +
      '<div class="donut-center">' +
        '<span><b>' + faNum(Math.floor(total / 60)) + '</b> ساعت</span>' +
        '<span>' + faNum(total) + ' دقیقه</span>' +
      '</div>' +
    '</div>' +
    '<div class="legend">' + legend + '</div>' +
  '</div>';
}

function compressImage(file, maxW = 800, maxBytes = 200000) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        let q = 0.85;
        let out = canvas.toDataURL('image/jpeg', q);
        while (out.length * 0.75 > maxBytes && q > 0.3) {
          q -= 0.1;
          out = canvas.toDataURL('image/jpeg', q);
        }
        resolve(out);
      };
      img.onerror = () => reject(new Error('تصویر نامعتبر'));
      img.src = reader.result;
    };
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}

async function copyToClipboard(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) {}
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  } catch (e) {
    return false;
  }
}

<script>
/* ============================================================================
 * SECTION 12 — SUPABASE CLIENT
 * ---------------------------------------------------------------------------
 * اتصال به Supabase برای همگام‌سازی اختیاری.
 * ========================================================================= */

let sb = null;
let currentUser = null;
let currentProfile = null;
let partnerPresence = null;
let presenceChannel = null;
let lastPullTs = 0;
let aiQuota = { used: 0, remaining: 20, busy: false };

const syncState = {
  running: false,
  lastAttempt: 0,
  backoff: 5000,
  lastError: null
};

/** راه‌اندازی کلاینت Supabase */
function initSupabaseSDK() {
  const cfg = S.settings.supabase || {};
  if (!cfg.url || !cfg.anonKey) return false;
  if (typeof window.supabase === 'undefined' || !window.supabase.createClient) return false;
  if (sb) return true;

  try {
    sb = window.supabase.createClient(cfg.url, cfg.anonKey, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: false,
        storageKey: 'ky.auth'
      },
      realtime: {
        params: { eventsPerSecond: 5 }
      },
      global: {
        fetch: (url, opts = {}) => {
          const ctrl = new AbortController();
          const t = setTimeout(() => ctrl.abort(), 15000);
          return fetch(url, { ...opts, signal: opts.signal || ctrl.signal })
            .finally(() => clearTimeout(t));
        }
      }
    });
    return true;
  } catch (err) {
    logError('SB init: ' + (err.message || err));
    return false;
  }
}


/* ============================================================================
 * SECTION 13 — AUTH
 * ---------------------------------------------------------------------------
 * ورود، ثبت‌نام، خروج، مدیریت پروفایل.
 * ========================================================================= */

function faAuthError(msg) {
  const m = String(msg || '').toLowerCase();
  if (m.includes('invalid login')) return 'ایمیل یا رمز اشتباه است';
  if (m.includes('already registered')) return 'این ایمیل قبلاً ثبت شده';
  if (m.includes('password') && m.includes('6')) return 'رمز باید حداقل ۶ کاراکتر باشد';
  if (m.includes('registration not allowed')) return 'این ایمیل مجاز نیست';
  if (m.includes('database error saving new user')) return 'این ایمیل در لیست مجاز نیست';
  if (m.includes('email not confirmed')) return 'ایمیل هنوز تأیید نشده';
  if (m.includes('rate limit')) return 'تعداد تلاش زیاد است؛ چند دقیقه بعد امتحان کن';
  if (m.includes('abort') || m.includes('failed to fetch')) return 'ارتباط با سرور برقرار نشد';
  return msg || 'خطای احراز هویت';
}

async function authSignIn(email, password) {

  const { data, error } = await sb.auth.signInWithPassword({

  });
  if (error) throw new Error(faAuthError(error.message));

}

}

/* ============================================================================
 * SECTION 14 — SYNC ENGINE
 * ---------------------------------------------------------------------------
 * همگام‌سازی دوطرفه با outbox و last-write-wins.
 * ========================================================================= */

const TS_FIELDS = ['created_at', 'updated_at', 'deleted_at'];

function toRemoteRow(row, userId) {
  const r = deepClone(row);
  TS_FIELDS.forEach(k => {
    const v = r[k];
    r[k] = (v === null || v === undefined || v === '')
      ? null
      : (typeof v === 'number' ? new Date(v).toISOString() : v);
  });
  r.user_id = userId;
  return r;
}

function fromRemoteRow(row) {
  const r = { ...row };
  TS_FIELDS.forEach(k => {
    r[k] = r[k] == null
      ? null
      : (typeof r[k] === 'number' ? r[k] : new Date(r[k]).getTime());
  });
  return r;
}

async function retryFailedOps() {
  const all = await idbGetAll('outbox');
  for (const o of all) {
    if (o.status === 'failed') {
      o.status = 'pending';
      o.tries = 0;
      o.last_error = null;
      await idbPut('outbox', o);
    }
  }
}

async function pushOutbox() {
  if (!sb || !currentUser) return { pushed: 0, failed: 0 };

  const pending = (await idbGetAll('outbox'))
    .filter(o => o.status === 'pending' || o.status === 'retry');
  pending.sort((a, b) => a.ts - b.ts);

  if (!pending.length) return { pushed: 0, failed: 0 };

  let pushed = 0;
  let failed = 0;

  for (const op of pending) {
    try {
      const table = op.store;
      if (!['sessions', 'exams', 'mistakes', 'plans', 'notes'].includes(table)) {
        await idbDelete('outbox', op.id);
        continue;
      }

      const payload = op.payload ? toRemoteRow(op.payload, currentUser.id) : null;
      const res = await sb.from(table).upsert(payload, { onConflict: 'id' });
      if (res.error) throw new Error(res.error.message);

      op.status = 'done';
      op.tries = (op.tries || 0) + 1;
      op.last_error = null;
      await idbPut('outbox', op);
      pushed++;
    } catch (err) {
      failed++;
      op.tries = (op.tries || 0) + 1;
      op.last_error = String(err.message || err).slice(0, 300);
      op.status = op.tries >= 5 ? 'failed' : 'retry';
      await idbPut('outbox', op);
      logError('push ' + op.store + ': ' + op.last_error);
    }
  }

  const cutoff = Date.now() - 24 * 3600 * 1000;
  const all = await idbGetAll('outbox');
  for (const o of all) {
    if (o.status === 'done' && o.ts < cutoff) {
      await idbDelete('outbox', o.id);
    }
  }

  return { pushed, failed };
}

async function pullChanges() {
  if (!sb || !currentUser) return { pulled: 0 };

  const since = lastPullTs
    ? new Date(lastPullTs).toISOString()
    : new Date(0).toISOString();

  let totalPulled = 0;
  let maxTs = lastPullTs;

  const tables = ['sessions', 'exams', 'mistakes', 'plans', 'notes'];

  for (const t of tables) {
    const { data, error } = await sb
      .from(t)
      .select('*')
      .eq('user_id', currentUser.id)
      .gt('updated_at', since)
      .order('updated_at', { ascending: true })
      .limit(500);

    if (error) {
      logError('pull ' + t + ': ' + error.message);
      continue;
    }
    if (!data || !data.length) continue;

    for (const raw of data) {
      const remote = fromRemoteRow(raw);
      const local = await idbGet(t, remote.id);
      if (!local || remote.updated_at > (local.updated_at || 0)) {
        await idbPut(t, remote);
        totalPulled++;
      }
      if (remote.updated_at > maxTs) maxTs = remote.updated_at;
    }
  }

  lastPullTs = maxTs;
  await saveMeta('lastPullTs', lastPullTs);
  return { pulled: totalPulled };
}

async function syncNow(force) {
  if (!sb || !currentUser) return;
  if (syncState.running && !force) return;
  if (!navigator.onLine) return;

  syncState.running = true;
  updateSyncPill();

  try {
    if (force) await retryFailedOps();
    const pr = await pushOutbox();
    await pullChanges();
    await refreshSharedStatsForToday();
    syncState.backoff = pr.failed > 0
      ? Math.min(300000, syncState.backoff * 2)
      : 5000;
    syncState.lastError = null;
  } catch (err) {
    syncState.lastError = err.message || String(err);
    logError('sync: ' + syncState.lastError);
    syncState.backoff = Math.min(300000, syncState.backoff * 2);
  } finally {
    syncState.running = false;
    syncState.lastAttempt = Date.now();
    await refreshCache();
    updateSyncPill();
    updateAccountBtn();
  }
}

let syncLoopHandle = null;

function startSyncLoop() {
  if (syncLoopHandle) clearInterval(syncLoopHandle);
  syncLoopHandle = setInterval(() => {
    if (!navigator.onLine || !sb || !currentUser || syncState.running) return;
    if (Date.now() - syncState.lastAttempt < syncState.backoff) return;
    syncNow();
  }, 8000);
}

async function refreshSharedStatsForToday() {
  if (!sb || !currentUser) return;
  const streak = computeStreak(CACHE.sessions.filter(s => !s.deleted_at));
  try {
    await sb.rpc('refresh_shared_stats', {
      day_date: todayKey(),
      streak_days: streak
    });
  } catch (err) {
    logError('refresh_shared_stats: ' + (err.message || err));
  }
}


/* ============================================================================
 * SECTION 15 — PRESENCE
 * ---------------------------------------------------------------------------
 * وضعیت زنده شریک با Realtime Presence.
 * ========================================================================= */

async function startPresence() {
  if (!sb || !currentUser) return;
  try { await stopPresence(); } catch (e) {}

  presenceChannel = sb.channel('partners', {
    config: { presence: { key: currentUser.id } }
  });

  presenceChannel.on('presence', { event: 'sync' }, () => {
    const state = presenceChannel.presenceState();
    const others = Object.keys(state).filter(k => k !== currentUser.id);
    if (!others.length) {
      partnerPresence = null;
      renderPartnerCard();
      return;
    }
    const list = state[others[0]] || [];
    if (list[0]) {
      partnerPresence = {
        subject: list[0].subject,
        started_at: list[0].started_at,
        online: true
      };
    } else {
      partnerPresence = null;
    }
    renderPartnerCard();
  });

  presenceChannel.on('presence', { event: 'leave' }, (e) => {
    const leaving = e.key || (e.leftPresences && e.leftPresences[0] && e.leftPresences[0].key);
    if (leaving && leaving !== currentUser.id) {
      partnerPresence = null;
      renderPartnerCard();
    }
  });

  await presenceChannel.subscribe(async (status) => {
    if (status === 'SUBSCRIBED') {
      await trackPresence();
    }
  });
}

async function trackPresence() {
  if (!presenceChannel || !currentUser) return;
  const running = Timer.state && Timer.state.status === 'running';
  const payload = {
    online: true,
    subject: running ? Timer.state.subject : null,
    started_at: running ? Timer.state.started_at : null,
    updated_at: Date.now()
  };
  try {
    await presenceChannel.track(payload);
  } catch (e) {}
}

async function stopPresence() {
  if (presenceChannel) {
    try { await presenceChannel.untrack(); } catch (e) {}
    try { await sb.removeChannel(presenceChannel); } catch (e) {}
    presenceChannel = null;
  }
  partnerPresence = null;
}

function renderPartnerCard() {
  const host = document.querySelector('#homeRoot');

/* ============================================================================
 * SECTION 16 — AI CLIENT
 * ---------------------------------------------------------------------------
 * فراخوانی هوش مصنوعی از طریق کلید محلی یا Edge Function.
 * ========================================================================= */

async function aiCall(feature, payload) {
  const aiCfg = S.settings.ai || {};
  const useLocal = aiCfg.useLocalKey && aiCfg.apiKey;

  if (useLocal) {
    const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + aiCfg.apiKey.trim(),
        'Content-Type': 'application/json',
        'HTTP-Referer': location.origin,
        'X-Title': 'KonkoorYar'
      },
      body: JSON.stringify({
        model: aiCfg.model || 'meta-llama/llama-3.1-8b-instruct:free',
        messages: [
          { role: 'system', content: getSystemPromptFor(feature) },
          { role: 'user', content: buildUserPromptLocal(feature, payload) }
        ],
        max_tokens: 1400,
        temperature: 0.4,
        response_format: { type: 'json_object' }
      })
    });

    if (!res.ok) {
      const t = await res.text().catch(() => '');
      throw new Error('OpenRouter ' + res.status + ': ' + t.slice(0, 200));
    }

    const data = await res.json();
    const text = data?.choices?.[0]?.message?.content || '';
    const parsed = extractJSONLocal(text);
    const validated = validateShapeLocal(feature, parsed);
    return { ok: true, data: validated, remaining: 'local' };
  }

  if (!sb) throw new Error('اول وارد حساب شو یا کلید محلی بگذار');
  if (!currentUser) throw new Error('ابتدا وارد حساب شو');

  const { data: { session } } = await sb.auth.getSession();
  if (!session) throw new Error('نشست منقضی شده — دوباره وارد شو');

  const url = (S.settings.supabase.url || '').replace(/\/$/, '') + '/functions/v1/ai-proxy';
  const res = await fetch(url, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + session.access_token,
      'apikey': S.settings.supabase.anonKey
    },
    body: JSON.stringify({ feature, payload })
  });

  const data = await res.json().catch(() => ({}));

  if (res.status === 429 || data.error === 'quota_exceeded') {
    aiQuota.remaining = 0;
    throw new Error('سهم امروز تمام شد. فردا دوباره امتحان کن.');
  }
  if (!res.ok || !data.ok) {
    throw new Error(data.message || data.error || ('خطای ' + res.status));
  }
  if (typeof data.remaining === 'number') {
    aiQuota.remaining = data.remaining;
  }
  return data;
}

function getSystemPromptFor() {
  return 'تو یک دستیار فارسی کنکور ایران هستی. کوتاه، عملی، بدون آمار ساختگی. خروجی JSON معتبر.';
}

function buildUserPromptLocal(feature, payload) {
  const limit = (s, n) => String(s || '').slice(0, n);

  if (feature === 'mistake-analysis') {
    const items = Array.isArray(payload?.items) ? payload.items.slice(0, 15) : [];
    const compact = items.map((it, i) => ({
      n: i + 1,
      subject: limit(it?.subject, 40),
      cause: limit(it?.cause, 20),
      question: limit(it?.question, 400)
    }));
    return `این ${compact.length} غلط من است. JSON بده:\n` +
      `{"categories":[],"patterns":[],"actions":["...","...","..."],"honest":"..."}\n` +
      `داده: ${JSON.stringify(compact)}`;
  }

  if (feature === 'summary') {
    return `موضوع: ${limit(payload?.topic, 100)}\n` +
      `JSON:\n{"title":"","sections":[{"heading":"","bullets":[]}],"not_in_text":[]}\n` +
      `متن: ${limit(payload?.text, 6000)}`;
  }

  if (feature === 'quiz-from-text') {
    const count = Math.min(Math.max(parseInt(payload?.count) || 5, 1), 10);
    return `موضوع: ${limit(payload?.topic, 100)}\n${count} سؤال چهارگزینه‌ای.\n` +
      `JSON:\n{"questions":[{"stem":"","options":["","","",""],"correct_index":0,"explanation":"","needs_review":false}]}\n` +
      `متن: ${limit(payload?.text, 6000)}`;
  }

  throw new Error('feature ناشناخته');
}

function extractJSONLocal(text) {
  if (!text || !text.trim()) throw new Error('پاسخ خالی');
  let t = String(text).trim();
  t = t.replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/i, '').trim();
  const s = t.indexOf('{');
  const e = t.lastIndexOf('}');
  if (s < 0 || e <= s) throw new Error('JSON یافت نشد');
  return JSON.parse(t.slice(s, e + 1));
}

function validateShapeLocal(feature, obj) {
  if (!obj || typeof obj !== 'object') throw new Error('ساختار نامعتبر');

  if (feature === 'mistake-analysis') {
    return {
      categories: Array.isArray(obj.categories) ? obj.categories.slice(0, 8).map(String) : [],
      patterns: Array.isArray(obj.patterns) ? obj.patterns.slice(0, 8).map(String) : [],
      actions: Array.isArray(obj.actions) ? obj.actions.slice(0, 5).map(String) : ['داده کافی نیست.'],
      honest: String(obj.honest || 'تحلیل قطعی نیست.').slice(0, 300)
    };
  }

  if (feature === 'summary') {
    const sections = Array.isArray(obj.sections) ? obj.sections.slice(0, 12).map(s => ({
      heading: String(s?.heading || '').slice(0, 120),
      bullets: Array.isArray(s?.bullets) ? s.bullets.slice(0, 8).map(b => String(b).slice(0, 400)) : []
    })) : [];
    return {
      title: String(obj.title || 'خلاصه').slice(0, 140),
      sections,
      not_in_text: Array.isArray(obj.not_in_text) ? obj.not_in_text.slice(0, 8).map(String) : []
    };
  }

  if (feature === 'quiz-from-text') {
    const questions = Array.isArray(obj.questions) ? obj.questions.slice(0, 12).map(q => {
      const opts = Array.isArray(q?.options) ? q.options.slice(0, 4).map(x => String(x).slice(0, 300)) : [];
      while (opts.length < 4) opts.push('—');
      return {
        stem: String(q?.stem || '').slice(0, 500),
        options: opts,
        correct_index: Math.min(Math.max(parseInt(q?.correct_index) || 0, 0), 3),
        explanation: String(q?.explanation || '').slice(0, 400),
        needs_review: !!q?.needs_review
      };
    }) : [];
    return { questions };
  }

  throw new Error('feature ناشناخته');
}

async function refreshAiQuota() {
  if (!sb || !currentUser) return;
  try {
    const { data } = await sb.rpc('ai_usage_today');
    const used = typeof data === 'number' ? data : 0;
    aiQuota.used = used;
    aiQuota.remaining = Math.max(0, 20 - used);
    renderAiQuotaBadge();
  } catch (e) {}
}

function renderAiQuotaBadge() {
  const el = document.getElementById('aiQuotaLabel');
  if (!el) return;
  const aiCfg = S.settings.ai || {};
  if (aiCfg.useLocalKey && aiCfg.apiKey) {
    el.textContent = 'کلید محلی';
    el.className = 'badge ok';
    return;
  }
  el.textContent = faNum(aiQuota.remaining);

function updateSyncPill() {
  const pill = $('#syncPill');
  const label = $('#syncLabel');

  const pending = (CACHE.outbox || []).filter(o => o.status === 'pending' || o.status === 'retry').length;
  const failed = (CACHE.outbox || []).filter(o => o.status === 'failed').length;

  pill.className = 'sync-pill';

  if (!navigator.onLine) {
    pill.classList.add('offline');
    label.textContent = 'آفلاین';
    return;
  }
  if (!currentUser) {
    label.textContent = 'محلی';
    return;
  }
  if (failed > 0) {
    pill.classList.add('offline');
    label.textContent = 'خطا';
    return;
  }
  if (syncState.running) {
    pill.classList.add('queue');
    label.textContent = 'sync…';
    return;
  }
  if (pending > 0) {
    pill.classList.add('queue');
    label.textContent = 'صف: ' + faNum(pending);
    return;
  }
  label.textContent = 'همگام';
}

function buildNav() {
  const side = $('#sideNav');
  if (side) {
    side.innerHTML = NAV_ITEMS.map(n =>
      '<button type="button" data-nav="' + n.id + '" class="' +
        (S.activeView === n.id ? 'active' : '') + '">' +
        (ICONS[n.icon] || '') +
        '<span>' + esc(n.label) + '</span>' +
      '</button>'
    ).join('');
  }

  const bottom = $('#bottomNav');
  if (bottom) {
    bottom.innerHTML = BOTTOM_NAV.map(id => {
      const n = NAV_ITEMS.find(x => x.id === id);
      if (!n) return '';
      return '<button type="button" data-nav="' + n.id + '" class="' +

        (ICONS[n.icon] || '') +
        '<span>' + esc(n.label) + '</span>' +
      '</button>';
    }).join('');
  }
}

function navigate(view) {
  if (!VIEW_TITLES[view]) view = 'home';
  S.activeView = view;

  $$('.view').forEach(v => {
    v.classList.toggle('active', v.id === 'view-' + view);
  });

  const bottomTarget = BOTTOM_NAV.includes(view) ? view : 'home';
  $$('#bottomNav button').forEach(b => {
    b.classList.toggle('active', b.dataset.nav === bottomTarget);
  });
  $$('#sideNav button').forEach(b => {
    b.classList.toggle('active', b.dataset.nav === view);
  });

  const titleEl = $('#topTitle');
  if (titleEl) titleEl.textContent = VIEW_TITLES[view] || '';
  const dateEl = $('#topDate');
  if (dateEl) dateEl.textContent = faDate(todayKey(), 'weekday');

  if (RENDER[view]) {
    try {
      RENDER[view]();
    } catch (e) {
      logError('render ' + view + ': ' + e.message);
    }
  }

  updateFab();

  try {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (e) {
    window.scrollTo(0, 0);
  }
}

function updateFab() {
  const fab = $('#fab');
  if (!fab) return;
  const v = S.activeView;
  if (['home', 'plan', 'mistakes', 'exams'].includes(v)) {
    fab.classList.remove('hidden');
    fab.dataset.view = v;
    fab.innerHTML = ICONS.plus;
    fab.setAttribute('aria-label',

      v === 'mistakes' ? 'ثبت خطای جدید' :

    fab.classList.add('hidden');

function openCmd() {
  const root = $('#cmdRoot');
  if (!root) return;
  root.style.display = 'flex';
  const input = $('#cmdInput');
  if (input) {
    input.value = '';
    input.focus();
  }
  renderCmdList('');
}

function closeCmd() {
  const root = $('#cmdRoot');
  if (root) root.style.display = 'none';
}

function renderCmdList(query) {
  const list = $('#cmdList');
  if (!list) return;
  const q = String(query || '').toLowerCase().trim();
  const items = CMD_ITEMS.filter(it =>
    !q || it.label.toLowerCase().includes(q) || it.id.includes(q)
  );

  if (!items.length) {
    list.innerHTML = '<p class="t-sm muted center" style="padding:20px">چیزی یافت نشد.</p>';
    return;
  }

  list.innerHTML = items.map((it, i) =>
    '<button type="button" class="cmd-item' + (i === 0 ? ' active' : '') + '" ' +
      'data-cmd-id="' + it.id + '" ' +
      'style="display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:13.5px;color:var(--ink);border:0;background:none;width:100%;text-align:start;font-family:inherit' +
      (i === 0 ? ';background:var(--brand-soft);color:var(--brand)' : '') + '">' +
      (ICONS[it.icon] || '') +
      '<span>' + esc(it.label) + '</span>' +
    '</button>'
  ).join('');
}

function runCmdItem(id) {
  const it = CMD_ITEMS.find(x => x.id === id);
  if (!it) return;
  closeCmd();
  if (it.nav) {
    navigate(it.nav);
  } else if (it.action === 'toggle-theme') {
    S.settings.theme = S.settings.theme === 'dark' ? 'light' : 'dark';
    applyTheme();
    saveSettings();
  } else if (it.action === 'open-account') {
    openAccount();
  } else if (it.action === 'export') {
    exportData();
  } else if (it.action === 'sync-now') {
    syncNow(true);
  }
}

async function handleMistakeResult(id, wasRight) {
  const m = await idbGet('mistakes', id);
  if (!m) return;

  const currentBox = m.box || 1;
  const newBox = wasRight ? Math.min(5, currentBox + 1) : 1;
  const intervalDays = LEITNER_DAYS[newBox - 1];
  const nextReview = addDays(todayKey(), intervalDays);

  m.box = newBox;
  m.next_review = nextReview;
  m.updated_at = Date.now();
  m.history = Array.isArray(m.history) ? m.history : [];
  m.history.push({
    ts: Date.now(),
    right: !!wasRight,
    box: newBox,
    interval: intervalDays
  });

  await idbPut('mistakes', m);
  await queueOp('upsert', 'mistakes', m.id, m);
  await refreshCache();

  if (S.settings.vibrationEnabled && navigator.vibrate) {
    try {
      navigator.vibrate(wasRight ? 30 : [20, 40, 20]);
    } catch (e) {}
  }

  toast(
    wasRight
      ? 'مرحله ' + faNum(newBox) + ' — ' + faDate(nextReview, 'short')
      : 'به مرحله ۱ برگشت',
    wasRight ? 'ok' : 'warn',
    2400
  );

  renderMistakes();
}

  const c = $('#simCorrect');
  const w = $('#simWrong');
  const b = $('#simBlank');
  const recalc = () => {
    const pct = calcPercent(toInt(c.value), toInt(w.value), toInt(b.value));
    $('#simPct').textContent = fmtPct(pct);
  };
  [c, w, b].forEach(el => el && el.addEventListener('input', recalc));
  recalc();
}

async function simTick() {
  if (!activeSim || !activeSim.started_at) return;
  const el = $('#simTime');
  if (!el) return;

  const elapsed = Math.floor((Date.now() - activeSim.started_at) / 1000);
  const remaining = Math.max(0, activeSim.duration_sec - elapsed);
  el.textContent = faNum(fmtClock(remaining));

  const bar = $('#simBar');
  if (bar) {
    bar.style.width = clamp((elapsed / activeSim.duration_sec) * 100, 0, 100).toFixed(1) + '%';
  }

  if (remaining <= 0) {
    toast('زمان آزمون تمام شد', 'warn', 4000);
    await finishSim(true);
  }
}

async function finishSim(auto) {
  if (!activeSim) return;

  if (simTick._handle) {
    clearInterval(simTick._handle);
    simTick._handle = null;
  }

  const c = toInt($('#simCorrect')?.value, 0);
  const w = toInt($('#simWrong')?.value, 0);
  const b = toInt($('#simBlank')?.value, 0);

  if (c + w + b === 0) {
    if (!auto) toast('هیچ پاسخی ثبت نشد', 'warn');
    activeSim = null;
    renderSim();
    return;
  }

  const pct = calcPercent(c, w, b);
  const duration = Math.round((Date.now() - activeSim.started_at) / 60000);

  const exam = {
    id: uid(),
    created_at: Date.now(),
    updated_at: Date.now(),
    deleted_at: null,
    device_id: S.settings.deviceId,
    subject: activeSim.subject,
    day: todayKey(),
    correct: c,
    wrong: w,
    blank: b,
    duration,
    percent: pct,
    note: 'آزمون شبیه‌سازی'
  };

  await idbPut('exams', exam);
  await queueOp('upsert', 'exams', exam.id, exam);
  await refreshCache();

  activeSim = null;

  if (S.settings.vibrationEnabled && navigator.vibrate) {
    try { navigator.vibrate([30, 60, 30]); } catch (e) {}
  }

  toast('آزمون ثبت شد — ' + fmtPct(pct), 'ok', 3200);
  navigate('exams');
}

async function renderMonthly() {
  const root = $('#monthlyRoot');
  if (!root) return;

  const allSessions = CACHE.sessions.filter(s => !s.deleted_at);
  const allExams = CACHE.exams.filter(e => !e.deleted_at);
  const today = todayKey();
  const currentKey = jalaliMonthKey(today);

  const buckets = new Map();
  const addToBucket = (day, kind, item) => {
    const k = jalaliMonthKey(day);
    if (!k) return;
    if (!buckets.has(k)) buckets.set(k, { sessions: [], exams: [] });
    buckets.get(k)[kind].push(item);
  };
  allSessions.forEach(s => addToBucket(s.day, 'sessions', s));
  allExams.forEach(e => addToBucket(e.day, 'exams', e));

  const keys = [...buckets.keys()].sort().reverse();

  if (keys.length === 0) {
    root.innerHTML =
      '<div class="view-title">' +
        '<h2>گزارش ماهانه</h2>' +
        '<span>مقایسه و روند</span>' +
      '</div>' +
      '<div class="empty">' +
        '<b>هنوز داده‌ای نیست</b>' +
        '<p>بعد از ثبت چند جلسه و آزمون، گزارش ماهانه اینجا ساخته می‌شود.</p>' +
      '</div>';
    return;
  }

  const currentIdx = keys.indexOf(currentKey);
  const prevKey = currentIdx >= 0 ? keys[currentIdx + 1] : keys[1];

  const summary = (key) => {
    const b = buckets.get(key) || { sessions: [], exams: [] };
    const days = new Set(b.sessions.map(s => s.day));
    const sampleDay = (b.sessions[0] && b.sessions[0].day) ||
                      (b.exams[0] && b.exams[0].day) ||
                      today;
    return {
      key,
      label: jalaliLabelFromDay(sampleDay),
      activeDays: days.size,
      agg: aggregateRange(b.sessions, b.exams, '0000-00-00', '9999-99-99')
    };
  };

  const cur = summary(currentKey);
  const prev = prevKey ? summary(prevKey) : null;

  const kpi = (label, curVal, prevVal, fmt) => {
    let delta = '';
    if (prev && Number.isFinite(curVal) && Number.isFinite(prevVal) && prevVal !== 0) {
      const d = curVal - prevVal;
      if (Math.abs(d) >= 0.01) {
        delta = '<span class="badge ' + (d > 0 ? 'ok' : 'bad') + ' badge-sm">' +
          (d > 0 ? '+' : '−') + fmt(Math.abs(d)) +
        '</span>';
      }
    }
    return '<div class="stat">' +
      '<div class="lbl">' + esc(label) + '</div>' +
      '<div class="val">' + (Number.isFinite(curVal) ? fmt(curVal) : '—') + '</div>' +
      '<div class="sub flex gap-2 items-center flex-wrap">' +
        delta +
        (prev && Number.isFinite(prevVal) ? '<span>قبل: ' + fmt(prevVal) + '</span>' : '') +
      '</div>' +
    '</div>';
  };

  const kpiHtml =
    '<div class="grid g4">' +
      kpi('مطالعه ماه', cur.agg.minutes, prev && prev.agg.minutes, fmtHMfa) +
      kpi('تعداد تست', cur.agg.testCount, prev && prev.agg.testCount, faNum) +
      kpi(
        'میانگین آزمون',
        cur.agg.examPercent != null ? cur.agg.examPercent : NaN,
        prev && prev.agg.examPercent != null ? prev.agg.examPercent : NaN,
        fmtPct
      ) +
      kpi('روزهای فعال', cur.activeDays, prev && prev.activeDays, faNum) +
    '</div>';

  const daysOfMonth = [...new Set(
    allSessions.filter(s => jalaliMonthKey(s.day) === currentKey).map(s => s.day)
  )].sort();

  const perDayMap = {};
  allSessions.filter(s => jalaliMonthKey(s.day) === currentKey).forEach(s => {
    perDayMap[s.day] = (perDayMap[s.day] || 0) + (s.seconds || 0);
  });

  const maxMin = Math.max(...Object.values(perDayMap).map(s => s / 60), 60);
  const daysBars = daysOfMonth.map(day => {
    const min = (perDayMap[day] || 0) / 60;
    const h = maxMin > 0 ? (min / maxMin) * 100 : 0;
    const isToday = day === today;
    return '<div class="bar-col">' +
      '<div class="bar-val">' + faNum(Math.round(min)) + '</div>' +
      '<div class="bar-track">' +
        '<div class="bar-fill' + (isToday ? ' today' : '') + '" ' +
          'style="height:' + h.toFixed(1) + '%"></div>' +
      '</div>' +
      '<div class="bar-lbl">' + faNum(parseDay(day).getDate()) + '</div>' +
    '</div>';
  }).join('');

  const subjectMap = {};
  allSessions
    .filter(s => jalaliMonthKey(s.day) === currentKey)
    .forEach(s => {
      subjectMap[s.subject] = (subjectMap[s.subject] || 0) + Math.round((s.seconds || 0) / 60);
    });
  const totalSecM = Object.values(subjectMap).reduce((a, b) => a + b, 0);

  const historyHtml = keys.slice(0, 6).map(k => {
    const s = summary(k);
    return '<div class="item">' +
      '<div class="item-main">' +
        '<b>' + esc(s.label) + '</b>' +
        '<span>' +
          faNum(s.activeDays) + ' روز فعال · ' +
          faNum(s.agg.testCount) + ' تست' +
          (s.agg.examPercent != null ? ' · میانگین آزمون ' + fmtPct(s.agg.examPercent) : '') +
        '</span>' +
      '</div>' +
      '<span class="mono t-xs">' + fmtHMfa(s.agg.minutes) + '</span>' +
    '</div>';
  }).join('');

  root.innerHTML =
    '<div class="view-title">' +
      '<h2>گزارش ماهانه</h2>' +
      '<span>' + esc(cur.label) + '</span>' +
    '</div>' +
    kpiHtml +
    '<div class="card section">' +
      '<div class="card-head">' +
        '<h3>روزهای این ماه</h3>' +
        '<span class="hint">دقیقه</span>' +
      '</div>' +
      (daysBars
        ? '<div class="bars">' + daysBars + '</div>'
        : '<p class="t-sm muted">روزی ثبت نشده.</p>') +
    '</div>' +
    '<div class="card section">' +
      '<div class="card-head">' +
        '<h3>سهم دروس ماه</h3>' +
      '</div>' +
      buildDonutHtml(totalSecM, subjectMap) +
    '</div>' +
    '<div class="card section">' +
      '<div class="card-head">' +
        '<h3>ماه‌های گذشته</h3>' +
      '</div>' +
      '<div class="list">' + historyHtml + '</div>' +
    '</div>';
}

async function aiRunOnText(feature) {
  const topic = String($('#aiTopic')?.value || '').trim();
  const text = String($('#aiText')?.value || '').trim();
  const countEl = $('#aiCount');

  if (!topic) { toast('موضوع را وارد کن', 'error'); return; }
  if (!text) { toast('متن جزوه را بچسبان', 'error'); return; }
  if (text.length > 6000) { toast('متن طولانی است', 'error'); return; }

  const out = $('#aiOutput');
  if (out) {
    out.innerHTML =
      '<div class="loading-state">' +
        '<span class="spinner lg"></span>' +
        '<p>در حال پردازش…</p>' +
      '</div>';
  }

  try {
    const payload = { topic, text };
    if (feature === 'quiz-from-text') payload.count = toInt(countEl?.value, 5);

    const res = await aiCall(feature, payload);
    const d = res.data;
    let html = '';

    if (feature === 'summary') {
      html = '<div class="card card-inset">' +
        '<h4 style="font-size:15px;margin-bottom:10px" dir="auto">' + esc(d.title) + '</h4>';

      d.sections.forEach(sec => {
        html += '<h5 style="color:var(--brand);font-size:13px;margin:14px 0 6px" dir="auto">' +
          esc(sec.heading) + '</h5>';
        if (sec.bullets.length) {
          html += '<ul style="padding-inline-start:20px;margin:4px 0;font-size:13px;line-height:1.95">' +
            sec.bullets.map(b => '<li dir="auto">' + esc(b) + '</li>').join('') +
          '</ul>';
        }
      });

      if (d.not_in_text.length) {
        html += '<hr class="divider">' +
          '<p class="t-sm muted mb-2">این موارد در متن نبود:</p>' +
          '<ul style="padding-inline-start:20px;font-size:12.5px">' +
            d.not_in_text.map(x => '<li dir="auto">' + esc(x) + '</li>').join('') +
          '</ul>';
      }

      html += '</div>';
    } else if (feature === 'quiz-from-text') {
      if (!d.questions.length) {
        html = '<div class="empty"><b>سؤالی ساخته نشد</b></div>';
      } else {
        html = '<div class="card card-inset">' +
          '<div class="badge warn mb-3">' +
            '<span class="dot"></span>' +
            'جایگزین آزمون واقعی نیست.' +
          '</div>';

        d.questions.forEach((q, i) => {
          html +=
            '<div style="margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border)" dir="auto">' +
              '<div class="flex gap-2 items-start">' +
                '<span class="mono" style="font-weight:800;color:var(--brand)">' + faNum(i + 1) + '.</span>' +
                '<div style="flex:1;min-width:0">' +
                  '<p style="font-size:13px;font-weight:600;line-height:1.9">' + esc(q.stem) + '</p>' +
                '</div>' +
              '</div>' +
              '<ol style="padding-inline-start:22px;margin:8px 0;font-size:12.5px;line-height:1.9">' +
                q.options.map((o, oi) =>
                  '<li style="' + (oi === q.correct_index ? 'color:var(--ok);font-weight:700' : '') + '">' +
                  esc(o) + (oi === q.correct_index ? ' ✓' : '') +
                  '</li>'
                ).join('') +
              '</ol>' +
              (q.explanation
                ? '<p class="t-xs muted mt-2">' + esc(q.explanation) + '</p>'
                : '') +
              (q.needs_review
                ? '<span class="badge warn sm mt-2">نیاز به بررسی</span>'
                : '') +
            '</div>';
        });

        html += '</div>';
      }
    }

    if (out) out.innerHTML = html;
    renderAiQuotaBadge();
  } catch (err) {
    if (out) {
      out.innerHTML =
        '<div class="empty">' +
          '<b>خطا</b>' +
          '<p dir="auto">' + esc(err.message) + '</p>' +
        '</div>';
    }
  }
}

async function exportData() {
  try {
    const data = {
      settings: await idbGet('settings', STORE_KEY),
      sessions: await idbGetAll('sessions'),
      exams: await idbGetAll('exams'),
      mistakes: await idbGetAll('mistakes'),
      plans: await idbGetAll('plans'),
      notes: await idbGetAll('notes'),
      outbox: await idbGetAll('outbox')
    };
    const payload = {
      app: 'konkoor-yar',
      version: 1,
      exported_at: new Date().toISOString(),
      data
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'konkoor-yar-backup-' + todayKey() + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('پشتیبان ساخته شد', 'ok');
  } catch (err) {
    logError('export: ' + err.message);
    toast('خطا در پشتیبان', 'error');
  }
}

async function handleImport(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const parsed = JSON.parse(String(reader.result || ''));
      if (!parsed || parsed.app !== 'konkoor-yar' || !parsed.data) {
        throw new Error('ساختار نامعتبر');
      }
      const ok = await confirmModal({
        title: 'تأیید بازیابی',
        message: 'داده‌های فعلی با فایل پشتیبان جایگزین می‌شوند. ادامه می‌دهی؟',
        confirmLabel: 'بازیابی کن',
        danger: true
      });
      if (!ok) return;

      const d = parsed.data;
      if (d.settings) {
        Object.assign(S.settings, d.settings);
        await saveSettings();
      }

      const stores = ['sessions', 'exams', 'mistakes', 'plans', 'notes', 'outbox'];
      for (const store of stores) {
        await idbClear(store);
        if (Array.isArray(d[store])) {
          for (const r of d[store]) await idbPut(store, r);
        }
      }

      await refreshCache();
      applyTheme();
      navigate('home');
      toast('بازیابی موفق', 'ok');
    } catch (err) {
      toast('فایل معتبر نیست: ' + err.message, 'error');
    }
  };
  reader.readAsText(file);
}

function csvEscape(v) {
  if (v === null || v === undefined) return '';
  const s = String(v);
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function toCSV(headers, rows) {
  return '\uFEFF' + headers.join(',') + '\n' + rows.map(r => r.map(csvEscape).join(',')).join('\n');
}

function downloadText(name, text, mime) {
  const blob = new Blob([text], { type: mime || 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function runHealthCheck() {
  const out = $('#healthOut');
  if (!out) return;
  out.innerHTML =
    '<div class="loading-state">' +
      '<span class="spinner"></span>' +
      '<p>در حال بررسی…</p>' +
    '</div>';

  const issues = [];

  CACHE.sessions.filter(s => !s.deleted_at).forEach(s => {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(s.day))) {
      issues.push('جلسه با تاریخ نامعتبر: ' + s.id);
    }
  });

  CACHE.exams.filter(e => !e.deleted_at).forEach(e => {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(e.day))) {
      issues.push('آزمون با تاریخ نامعتبر: ' + e.id);
    }
  });

  CACHE.mistakes.filter(m => !m.deleted_at).forEach(m => {
    const b = toInt(m.box, 1);
    if (b < 1 || b > 5) issues.push('کارت با مرحله خارج بازه: ' + m.id);
  });

  if (!issues.length) {
    out.innerHTML =
      '<div class="card card-inset" style="padding:12px;border:1px solid var(--ok)">' +
        '<div class="flex items-center gap-2" style="color:var(--ok)">' +
          ICONS.check +

        '</div>' +
      '</div>';
  } else {
    out.innerHTML =
      '<div class="card card-inset" style="padding:12px;border:1px solid var(--warn)">' +
        '<div class="flex items-center gap-2" style="color:var(--warn)">' +
          ICONS.warning +
          '<b class="t-sm">' + faNum(issues.length) + ' مورد یافت شد</b>' +
        '</div>' +
        '<ul style="padding-inline-start:18px;margin-top:8px;font-size:12.5px;line-height:1.9">' +
          issues.slice(0, 20).map(x => '<li dir="auto">' + esc(x) + '</li>').join('') +
        '</ul>' +
      '</div>';
  }
}

async function wipeStore(store) {
  const map = {
    sessions: 'جلسات',
    exams: 'آزمون‌ها',
    mistakes: 'دفترچه',
    plans: 'برنامه‌ها',
    notes: 'یادداشت‌ها'
  };
  const label = map[store] || store;

  const ok = await confirmModal({
    title: 'پاک‌کردن ' + label,
    message: 'تمام ' + label + ' پاک می‌شوند. بازگشت‌ناپذیر.',
    confirmLabel: 'پاک کن',
    danger: true
  });
  if (!ok) return;

  const all = await idbGetAll(store);
  for (const r of all) {
    if (r.id) {
      r.deleted_at = Date.now();
      r.updated_at = Date.now();
      await idbPut(store, r);
      await queueOp('delete', store, r.id, r);
    }
  }

  await refreshCache();
  renderSettings();
  toast(label + ' پاک شد', 'ok');
}

async function submitManualSession(form) {
  const subject = String(form.subject.value || '');
  const type = String(form.type?.value || SESSION_TYPES[0]);
  const minutes = clamp(toInt(form.minutes.value, 0), 1, 1440);
  const day = String(form.day?.value || todayKey());
  const correct = clamp(toInt(form.correct?.value, 0), 0, 1000);
  const wrong = clamp(toInt(form.wrong?.value, 0), 0, 1000);
  const blank = clamp(toInt(form.blank?.value, 0), 0, 1000);
  const note = String(form.note?.value || '').trim();

  if (!SUBJ_MAP[subject]) { toast('درس نامعتبر', 'error'); return; }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(day)) { toast('تاریخ نامعتبر', 'error'); return; }

  const session = {
    id: uid(),
    created_at: Date.now(),
    updated_at: Date.now(),
    deleted_at: null,
    device_id: S.settings.deviceId,
    subject,
    seconds: minutes * 60,
    correct,
    wrong,
    blank,
    note,
    day,
    type
  };

  await idbPut('sessions', session);
  await queueOp('upsert', 'sessions', session.id, session);
  await refreshCache();

  if (S.settings.vibrationEnabled && navigator.vibrate) {
    try { navigator.vibrate(30); } catch (e) {}
  }

  toast('ثبت شد', 'ok');
  navigate('home');
}

async function submitExam(form) {
  const subject = String(form.subject.value || '');
  const day = String(form.day.value || todayKey());
  const correct = clamp(toInt(form.correct.value, 0), 0, 1000);
  const wrong = clamp(toInt(form.wrong.value, 0), 0, 1000);
  const blank = clamp(toInt(form.blank.value, 0), 0, 1000);
  const duration = clamp(toInt(form.duration.value, 0), 0, 600);
  const note = String(form.note.value || '').trim();

  if (!SUBJ_MAP[subject]) { toast('درس نامعتبر', 'error'); return; }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(day)) { toast('تاریخ نامعتبر', 'error'); return; }
  if (correct + wrong + blank === 0) { toast('حداقل یک سؤال ثبت کن', 'error'); return; }

  const percent = calcPercent(correct, wrong, blank);

  const exam = {
    id: uid(),
    created_at: Date.now(),
    updated_at: Date.now(),
    deleted_at: null,
    device_id: S.settings.deviceId,
    subject,
    day,
    correct,
    wrong,
    blank,
    duration,
    percent,
    note
  };

  await idbPut('exams', exam);
  await queueOp('upsert', 'exams', exam.id, exam);
  await refreshCache();

  if (S.settings.vibrationEnabled && navigator.vibrate) {
    try { navigator.vibrate(30); } catch (e) {}
  }

  toast('ثبت شد — ' + fmtPct(percent), 'ok');
  navigate('exams');
}

async function submitMistake(form) {

  const cause = String(form.cause.value || '');
