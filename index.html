async function renderMonthly() {
  const root = $('#monthlyRoot');
  if (!root) return;

  const allSessions = CACHE.sessions.filter(s => !s.deleted_at);
  const allExams = CACHE.exams.filter(e => !e.deleted_at);
  const today = todayKey();
  const currentKey = jalaliMonthKey(today);

  const buckets = new Map();
  const addToBucket = (day, kind, item) => {
    const k = jalaliMonthKey(day);
    if (!k) return;
    if (!buckets.has(k)) buckets.set(k, { sessions: [], exams: [] });
    buckets.get(k)[kind].push(item);
  };
  allSessions.forEach(s => addToBucket(s.day, 'sessions', s));
  allExams.forEach(e => addToBucket(e.day, 'exams', e));

  const keys = [...buckets.keys()].sort().reverse();

  if (keys.length === 0) {
    root.innerHTML =
      '<div class="view-title">' +
        '<h2>گزارش ماهانه</h2>' +
        '<span>مقایسه و روند</span>' +
      '</div>' +
      '<div class="empty">' +
        '<b>هنوز داده‌ای نیست</b>' +
        '<p>بعد از ثبت چند جلسه و آزمون، گزارش ماهانه اینجا ساخته می‌شود.</p>' +
      '</div>';
    return;
  }

  const currentIdx = keys.indexOf(currentKey);
  const prevKey = currentIdx >= 0 ? keys[currentIdx + 1] : keys[0];

  const summary = (key) => {
    const b = buckets.get(key) || { sessions: [], exams: [] };
    const days = new Set(b.sessions.map(s => s.day));
    const sampleDay = (b.sessions[0] && b.sessions[0].day) ||
                      (b.exams[0] && b.exams[0].day) ||
                      today;
    return {
      key,
      label: jalaliLabelFromDay(sampleDay),
      activeDays: days.size,
      agg: aggregateRange(b.sessions, b.exams, '0000-00-00', '9999-99-99')
    };
  };

  const cur = summary(currentKey);
  const prev = prevKey ? summary(prevKey) : null;

  const kpi = (label, curVal, prevVal, fmt) => {
    let delta = '';
    if (prev && Number.isFinite(curVal) && Number.isFinite(prevVal) && prevVal !== 0) {
      const d = curVal - prevVal;
      if (Math.abs(d) >= 0.01) {
        delta = '<span class="badge ' + (d > 0 ? 'ok' : 'bad') + ' badge-sm">' +
          (d > 0 ? '+' : '−') + fmt(Math.abs(d)) +
        '</span>';
      }
    }
    return '<div class="stat">' +
      '<div class="lbl">' + esc(label) + '</div>' +
      '<div class="val">' + (Number.isFinite(curVal) ? fmt(curVal) : '—') + '</div>' +
      '<div class="sub flex gap-2 items-center flex-wrap">' +
        delta +
        (prev && Number.isFinite(prevVal) ? '<span>قبل: ' + fmt(prevVal) + '</span>' : '') +
      '</div>' +
    '</div>';
  };

  const kpiHtml =
    '<div class="grid g4">' +
      kpi('مطالعه ماه', cur.agg.minutes, prev && prev.agg.minutes, fmtHMfa) +
      kpi('تعداد تست', cur.agg.testCount, prev && prev.agg.testCount, faNum) +
      kpi(
        'میانگین آزمون',
        cur.agg.examPercent != null ? cur.agg.examPercent : NaN,
        prev && prev.agg.examPercent != null ? prev.agg.examPercent : NaN,
        fmtPct
      ) +
      kpi('روزهای فعال', cur.activeDays, prev && prev.activeDays, faNum) +
    '</div>';

  const daysOfMonth = [...new Set(
    allSessions.filter(s => jalaliMonthKey(s.day) === currentKey).map(s => s.day)
  )].sort();

  const perDayMap = {};
  allSessions.filter(s => jalaliMonthKey(s.day) === currentKey).forEach(s => {
    perDayMap[s.day] = (perDayMap[s.day] || 0) + (s.seconds || 0);
  });

  const maxMin = Math.max(...Object.values(perDayMap).map(s => s / 60), 60);
  const daysBars = daysOfMonth.map(day => {
    const min = (perDayMap[day] || 0) / 60;
    const h = maxMin > 0 ? (min / maxMin) * 100 : 0;
    const isToday = day === today;
    return '<div class="bar-col">' +
      '<div class="bar-val">' + faNum(Math.round(min)) + '</div>' +
      '<div class="bar-track">' +
        '<div class="bar-fill' + (isToday ? ' today' : '') + '" ' +
          'style="height:' + h.toFixed(1) + '%"></div>' +
      '</div>' +
      '<div class="bar-lbl">' + faNum(parseDay(day).getDate()) + '</div>' +
    '</div>';
  }).join('');

  const subjectMap = {};
  allSessions
    .filter(s => jalaliMonthKey(s.day) === currentKey)
    .forEach(s => {
      subjectMap[s.subject] = (subjectMap[s.subject] || 0) + Math.round((s.seconds || 0) / 60);
    });
  const totalSecM = Object.values(subjectMap).reduce((a, b) => a + b, 0);

  const historyHtml = keys.slice(0, 6).map(k => {
    const s = summary(k);
    return '<div class="item">' +
      '<div class="item-main">' +
        '<b>' + esc(s.label) + '</b>' +
        '<span>' +
          faNum(s.activeDays) + ' روز فعال · ' +
          faNum(s.agg.testCount) + ' تست' +
          (s.agg.examPercent != null ? ' · میانگین آزمون ' + fmtPct(s.agg.examPercent) : '') +
        '</span>' +
      '</div>' +
      '<span class="mono t-xs">' + fmtHMfa(s.agg.minutes) + '</span>' +
    '</div>';
  }).join('');

  root.innerHTML =
    '<div class="view-title">' +
      '<h2>گزارش ماهانه</h2>' +
      '<span>' + esc(cur.label) + '</span>' +
    '</div>' +
    kpiHtml +
    '<div class="card section">' +
      '<div class="card-head">' +
        '<h3>روزهای این ماه</h3>' +
        '<span class="hint">دقیقه</span>' +
      '</div>' +
      (daysBars
        ? '<div class="bars">' + daysBars + '</div>'
        : '<p class="t-sm muted">روزی ثبت نشده.</p>') +
    '</div>' +
    '<div class="card section">' +
      '<div class="card-head">' +
        '<h3>سهم دروس ماه</h3>' +
      '</div>' +
      buildDonutHtml(totalSecM, subjectMap) +
    '</div>' +
    '<div class="card section">' +
      '<div class="card-head">' +
        '<h3>ماه‌های گذشته</h3>' +
      '</div>' +
      '<div class="list">' + historyHtml + '</div>' +
    '</div>';
}
  </script>

    toast('حداقل ۳ کارت در دفترچه لازم است', 'warn');
    return;
  }

  openModal(
    '<div class="modal-head">' +

    '<div id="aiMistakeOut">' +
      '<div class="loading-state">' +
        '<span class="spinner lg"></span>' +
        '<p>در حال تحلیل…</p>' +
      '</div>' +
    '</div>'
  );

  try {
    const res = await aiCall('mistake-analysis', {
      items: items.map(m => ({
        subject: subj(m.subject).name,
        cause: m.cause || '',
        question: String(m.question || '').slice(0, 400)

    const html =
      '<div style="font-size:13.5px;line-height:2">' +
        '<h4 style="color:var(--brand);margin-bottom:6px">دسته‌های تکرارشونده</h4>' +
        (d.categories.length
          ? '<ul style="padding-inline-start:20px">' +
              d.categories.map(x => '<li dir="auto">' + esc(x) + '</li>').join('') +
            '</ul>'
          : '<p class="t-sm muted">دسته‌ای شناسایی نشد.</p>') +

        '<h4 style="color:var(--brand);margin-top:14px;margin-bottom:6px">الگوهای تکراری</h4>' +
        (d.patterns.length
          ? '<ul style="padding-inline-start:20px">' +
              d.patterns.map(x => '<li dir="auto">' + esc(x) + '</li>').join('') +
            '</ul>'
          : '<p class="t-sm muted">الگویی شناسایی نشد.</p>') +

        '<h4 style="color:var(--brand);margin-top:14px;margin-bottom:6px">توصیه‌های عملی</h4>' +
        '<ul style="padding-inline-start:20px">' +
          d.actions.map(x => '<li dir="auto">' + esc(x) + '</li>').join('') +
        '</ul>' +

        '<hr class="divider">' +
        '<p class="t-sm muted" dir="auto">' + esc(d.honest) + '</p>' +
        '<p class="t-xs muted mt-3">provider: ' + esc(res.provider || '?') + '</p>' +

    const out = document.getElementById('aiMistakeOut');

      out.innerHTML =

          '<p dir="auto">' + esc(err.message) + '</p>' +
          '<button class="btn btn-sm mt-3" data-nav="settings">برو به تنظیمات AI</button>' +
        '</div>';
    }
  }
}

async function aiRunOnText(feature) {
  const topic = String($('#aiTopic')?.value || '').trim();
  const text = String($('#aiText')?.value || '').trim();
  const countEl = $('#aiCount');

  if (!topic) { toast('موضوع را وارد کن', 'error'); return; }
  if (!text) { toast('متن جزوه را بچسبان', 'error'); return; }
  if (text.length > 6000) { toast('متن طولانی است', 'error'); return; }

  const out = $('#aiOutput');
  if (out) {
    out.innerHTML =
      '<div class="loading-state">' +
        '<span class="spinner lg"></span>' +
        '<p>در حال پردازش…</p>' +
      '</div>';
  }

  try {
    const payload = { topic, text };
    if (feature === 'quiz-from-text') payload.count = toInt(countEl?.value, 5);

    const res = await aiCall(feature, payload);
    const d = res.data;
    let html = '';

    if (feature === 'summary') {
      html = '<div class="card card-inset">' +
        '<h4 style="font-size:15px;margin-bottom:10px" dir="auto">' + esc(d.title) + '</h4>';

      d.sections.forEach(sec => {
        html += '<h5 style="color:var(--brand);font-size:13px;margin:14px 0 6px" dir="auto">' +
          esc(sec.heading) + '</h5>';
        if (sec.bullets.length) {
          html += '<ul style="padding-inline-start:20px;margin:4px 0;font-size:13px;line-height:1.95">' +
            sec.bullets.map(b => '<li dir="auto">' + esc(b) + '</li>').join('') +
          '</ul>';
        }
      });

      if (d.not_in_text.length) {
        html += '<hr class="divider">' +
          '<p class="t-sm muted mb-2">این موارد در متن نبود:</p>' +
          '<ul style="padding-inline-start:20px;font-size:12.5px">' +
            d.not_in_text.map(x => '<li dir="auto">' + esc(x) + '</li>').join('') +
          '</ul>';
      }

      html += '</div>';
    } else if (feature === 'quiz-from-text') {
      if (!d.questions.length) {
        html = '<div class="empty"><b>سؤالی ساخته نشد</b></div>';
      } else {
        html = '<div class="card card-inset">' +
          '<div class="badge warn mb-3">' +
            '<span class="dot"></span>' +
            'جایگزین آزمون واقعی نیست.' +
          '</div>';

        d.questions.forEach((q, i) => {
          html +=
            '<div style="margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border)" dir="auto">' +
              '<div class="flex gap-2 items-start">' +
                '<span class="mono" style="font-weight:800;color:var(--brand)">' + faNum(i + 1) + '.</span>' +
                '<div style="flex:1;min-width:0">' +
                  '<p style="font-size:13px;font-weight:600;line-height:1.9">' + esc(q.stem) + '</p>' +
                '</div>' +
              '</div>' +
              '<ol style="padding-inline-start:22px;margin:8px 0;font-size:12.5px;line-height:1.9">' +
                q.options.map((o, oi) =>
                  '<li style="' + (oi === q.correct_index ? 'color:var(--ok);font-weight:700' : '') + '">' +
                  esc(o) + (oi === q.correct_index ? ' ✓' : '') +
                  '</li>'
                ).join('') +
              '</ol>' +
              (q.explanation
                ? '<p class="t-xs muted mt-2">' + esc(q.explanation) + '</p>'
                : '') +
              (q.needs_review
                ? '<span class="badge warn sm mt-2">نیاز به بررسی</span>'
                : '') +
            '</div>';
        });

        html += '</div>';
      }
    }

    if (out) out.innerHTML = html;
  } catch (err) {
    if (out) {
      out.innerHTML =
        '<div class="empty">' +
          '<b>خطا</b>' +
          '<p dir="auto">' + esc(err.message) + '</p>' +
          '<button class="btn btn-sm mt-3" data-nav="settings">تنظیمات AI</button>' +
        '</div>';
    }
  }
}

async function exportData() {
  try {
    const settingsClean = await (async () => {
      const s = await idbGet('settings', STORE_KEY);
      if (!s) return s;
      const c = deepClone(s);
      /* پاک کردن کلیدهای API و شناسه دستگاه از پشتیبان */
      if (c.ai) {
        c.ai.geminiKey = '';
        c.ai.openrouterKey = '';
      }
      if (c.supabase) {
        c.supabase.anonKey = '';
      }
      return c;
    })();

    const data = {
      settings: settingsClean,
      sessions: await idbGetAll('sessions'),
      exams: await idbGetAll('exams'),
      mistakes: await idbGetAll('mistakes'),
      plans: await idbGetAll('plans'),
      notes: await idbGetAll('notes'),
      outbox: await idbGetAll('outbox')
    };
    const payload = {
      app: 'konkoor-yar',
      version: 1,
      exported_at: new Date().toISOString(),
      data
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'konkoor-yar-backup-' + todayKey() + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('پشتیبان ساخته شد (بدون کلیدهای API)', 'ok');
  } catch (err) {
    logError('export: ' + err.message);
    toast('خطا در پشتیبان', 'error');
  }
}

async function handleImport(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const parsed = JSON.parse(String(reader.result || ''));
      if (!parsed || parsed.app !== 'konkoor-yar' || !parsed.data) {
        throw new Error('ساختار نامعتبر');
      }
      const ok = await confirmModal({
        title: 'تأیید بازیابی',
        message: 'داده‌های فعلی با فایل پشتیبان جایگزین می‌شوند. ادامه می‌دهی؟',
        confirmLabel: 'بازیابی کن',
        danger: true
      });
      if (!ok) return;

      const d = parsed.data;
      if (d.settings) {
        const keep = {
          deviceId: S.settings.deviceId,
          supabase: S.settings.supabase,
          geminiKey: (S.settings.ai || {}).geminiKey || '',
          openrouterKey: (S.settings.ai || {}).openrouterKey || ''
        };
        Object.assign(S.settings, d.settings);
        S.settings.deviceId = keep.deviceId;
        S.settings.supabase = keep.supabase;
        S.settings.ai = Object.assign({}, S.settings.ai, {
          geminiKey: keep.geminiKey,
          openrouterKey: keep.openrouterKey
        });
        await saveSettings();
      }

      const stores = ['sessions', 'exams', 'mistakes', 'plans', 'notes', 'outbox'];
      for (const store of stores) {
        await idbClear(store);
        if (Array.isArray(d[store])) {
          for (const r of d[store]) await idbPut(store, r);
        }
      }

      await refreshCache();
      applyTheme();
      navigate('home');
      toast('بازیابی موفق', 'ok');
    } catch (err) {
      toast('فایل معتبر نیست: ' + err.message, 'error');
    }
  };
  reader.readAsText(file);
}

function csvEscape(v) {
  if (v === null || v === undefined) return '';
  const s = String(v);
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function toCSV(headers, rows) {
  return '\uFEFF' + headers.join(',') + '\n' + rows.map(r => r.map(csvEscape).join(',')).join('\n');
}

function downloadText(name, text, mime) {
  const blob = new Blob([text], { type: mime || 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function submitManualSession(form) {
  const subject = String(form.subject.value || '');
  const type = String(form.type?.value || SESSION_TYPES[0]);
  const minutes = clamp(toInt(form.minutes.value, 0), 1, 1440);
  const day = String(form.day?.value || todayKey());
  const correct = clamp(toInt(form.correct?.value, 0), 0, 1000);
  const wrong = clamp(toInt(form.wrong?.value, 0), 0, 1000);
  const blank = clamp(toInt(form.blank?.value, 0), 0, 1000);
  const note = String(form.note?.value || '').trim();

  if (!SUBJ_MAP[subject]) { toast('درس نامعتبر', 'error'); return; }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(day)) { toast('تاریخ نامعتبر', 'error'); return; }

  const session = {
    id: uid(),
    created_at: Date.now(),
    updated_at: Date.now(),
    deleted_at: null,
    device_id: S.settings.deviceId,
    subject,
    seconds: minutes * 60,
    correct,
    wrong,
    blank,
    note,
    day,
    type
  };

  await idbPut('sessions', session);
  await queueOp('upsert', 'sessions', session.id, session);
  await refreshCache();

  if (S.settings.vibrationEnabled && navigator.vibrate) {
    try { navigator.vibrate(30); } catch (e) {}
  }

  toast('ثبت شد', 'ok');
  navigate('home');
}

async function submitExam(form) {
  const subject = String(form.subject.value || '');
  const day = String(form.day.value || todayKey());
  const correct = clamp(toInt(form.correct.value, 0), 0, 1000);
  const wrong = clamp(toInt(form.wrong.value, 0), 0, 1000);
  const blank = clamp(toInt(form.blank.value, 0), 0, 1000);
  const duration = clamp(toInt(form.duration.value, 0), 0, 600);
  const note = String(form.note.value || '').trim();

  if (!SUBJ_MAP[subject]) { toast('درس نامعتبر', 'error'); return; }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(day)) { toast('تاریخ نامعتبر', 'error'); return; }
  if (correct + wrong + blank === 0) { toast('حداقل یک سؤال ثبت کن', 'error'); return; }

  const percent = calcPercent(correct, wrong, blank);

  const exam = {
    id: uid(),
    created_at: Date.now(),
    updated_at: Date.now(),
    deleted_at: null,
    device_id: S.settings.deviceId,
    subject,
    day,
    correct,
    wrong,
    blank,
    duration,
    percent,
    note
  };

  await idbPut('exams', exam);
  await queueOp('upsert', 'exams', exam.id, exam);
  await refreshCache();

  if (S.settings.vibrationEnabled && navigator.vibrate) {
    try { navigator.vibrate(30); } catch (e) {}
  }

  toast('ثبت شد — ' + fmtPct(percent), 'ok');
  navigate('exams');
}

async function submitMistake(form) {
  const subject = String(form.subject.value || '');
  const cause = String(form.cause.value || '');
  const question = String(form.question.value || '').trim();
  const source = String(form.source.value || '').trim();

  if (!SUBJ_MAP[subject]) { toast('درس نامعتبر', 'error'); return; }
  if (!question) { toast('صورت سؤال الزامی است', 'error'); return; }

  const m = {
    id: uid(),
    created_at: Date.now(),
    updated_at: Date.now(),
    deleted_at: null,
    device_id: S.settings.deviceId,
    subject,
    cause,
    question,
    source,
    image_data: pendingMistakeImage || null,
    box: 1,
    next_review: addDays(todayKey(), LEITNER_DAYS[0]),
    history: []
  };

  await idbPut('mistakes', m);
  await queueOp('upsert', 'mistakes', m.id, m);
  pendingMistakeImage = null;
  await refreshCache();

  if (S.settings.vibrationEnabled && navigator.vibrate) {
    try { navigator.vibrate(30); } catch (e) {}
  }

  toast('اضافه شد', 'ok');
  navigate('mistakes');
}

async function submitNote(form) {
  const text = String(form.text.value || '').trim();
  if (!text) { toast('خالی است', 'error'); return; }

  const note = {
    id: uid(),
    created_at: Date.now(),
    updated_at: Date.now(),
    deleted_at: null,
    device_id: S.settings.deviceId,
    day: todayKey(),
    text,
    ts: Date.now()
  };

  await idbPut('notes', note);
  await queueOp('upsert', 'notes', note.id, note);
  await refreshCache();

  toast('ثبت شد', 'ok');
  renderPlan();
}

async function submitTask(form) {
  const text = String(form.text.value || '').trim();
  if (!text) return;

  const tKey = todayKey();
  let plan = CACHE.plans.find(p => p.day === tKey && !p.deleted_at);
  if (!plan) {
    plan = {
      id: uid(),
      day: tKey,
      wake_time: '',
      items: [],
      created_at: Date.now(),
      updated_at: Date.now(),
      device_id: S.settings.deviceId,
      deleted_at: null
    };
  }
  plan.items.push({ text, done: false });
  plan.updated_at = Date.now();

  await idbPut('plans', plan);
  await queueOp('upsert', 'plans', plan.id, plan);
  await refreshCache();
  renderPlan();
}

/* ============================================================================
 * SECTION 33 — EVENT BINDINGS
 * ========================================================================= */

function bindEvents() {
  document.addEventListener('click', async (e) => {
    const navBtn = e.target.closest('[data-nav]');
    if (navBtn && navBtn.dataset.nav) {
      e.preventDefault();
      navigate(navBtn.dataset.nav);
      return;
    }

    const cmdItem = e.target.closest('[data-cmd-id]');
    if (cmdItem) {
      runCmdItem(cmdItem.dataset.cmdId);
      return;
    }

    const el = e.target.closest('[data-action]');
    if (!el) return;
    const action = el.dataset.action;
    const id = el.dataset.id;

    switch (action) {
      case 'close-modal': closeModal(); break;
      case 'open-cmd': openCmd(); break;
      case 'close-cmd': closeCmd(); break;

      case 'toggle-theme':
        S.settings.theme = S.settings.theme === 'dark' ? 'light' : 'dark';
        applyTheme();
        await saveSettings();
        if (S.activeView === 'settings') renderSettings();
        break;

      case 'toggle-sound':
        S.settings.soundEnabled = !S.settings.soundEnabled;
        await saveSettings();
        if (S.activeView === 'settings') renderSettings();
        break;

      case 'toggle-vibration':
        S.settings.vibrationEnabled = !S.settings.vibrationEnabled;
        await saveSettings();
        if (S.activeView === 'settings') renderSettings();
        break;

      case 'toggle-key-visibility': {
        const target = document.querySelector('input[name="' + el.dataset.target + '"]');
        if (!target) break;
        const isPwd = target.type === 'password';
        target.type = isPwd ? 'text' : 'password';
        el.innerHTML = isPwd ? ICONS.eyeOff : ICONS.eye;
        break;
      }

      /* [فاز ۱ - تغییر ۱۱] پرش به تنظیمات AI با اسکرول و فوکوس */
      case 'goto-ai-settings': {
        navigate('settings');
        setTimeout(() => {
          const form = document.querySelector('form[data-form="ai-settings"]');
          if (form) {
            form.scrollIntoView({ behavior: 'smooth', block: 'start' });
            const firstInput = form.querySelector('select[name="aiProvider"]');
            if (firstInput) {
              setTimeout(() => { try { firstInput.focus(); } catch (e) {} }, 400);
            }
          }
        }, 320);
        break;
      }

      case 'test-ai-key': {
        const resultEl = $('#aiKeyTestResult');
        if (!resultEl) break;
        resultEl.innerHTML =
          '<div class="card card-inset" style="padding:12px">' +
            '<div class="flex items-center gap-2">' +
              '<span class="spinner"></span>' +
              '<span class="t-xs muted">در حال تست…</span>' +
            '</div>' +
          '</div>';

        const form = document.querySelector('form[data-form="ai-settings"]');
        if (!form) break;

        const testProvider = form.aiProvider.value;
        const gKeyInput = form.geminiKey.value.trim();
        const oKeyInput = form.openrouterKey.value.trim();

        const backup = {
          provider: S.settings.ai.provider,
          geminiKey: S.settings.ai.geminiKey,
          openrouterKey: S.settings.ai.openrouterKey
        };

        if (gKeyInput) S.settings.ai.geminiKey = gKeyInput;
        if (oKeyInput) S.settings.ai.openrouterKey = oKeyInput;
        S.settings.ai.provider = testProvider;

        try {
          const res = await aiCall('summary', {
            topic: 'تست اتصال',
            text: 'این یک تست اتصال است. JSON بده: {"title":"تست","sections":[],"not_in_text":[]}'
          });
          resultEl.innerHTML =
            '<div class="card card-inset" style="padding:12px;border:1px solid var(--ok)">' +
              '<div class="flex items-center gap-2" style="color:var(--ok)">' +
                ICONS.check +
                '<b class="t-sm">اتصال موفق (' + esc(res.provider || '?') + ')</b>' +
              '</div>' +
            '</div>';
        } catch (err) {
          resultEl.innerHTML =
            '<div class="card card-inset" style="padding:12px;border:1px solid var(--bad)">' +
              '<div class="flex items-center gap-2" style="color:var(--bad)">' +
                ICONS.warning +
                '<b class="t-sm">اتصال ناموفق</b>' +
              '</div>' +
              '<p class="t-xs muted mt-2" dir="auto">' + esc(err.message) + '</p>' +
            '</div>';
        } finally {
          if (!gKeyInput) S.settings.ai.geminiKey = backup.geminiKey;
          if (!oKeyInput) S.settings.ai.openrouterKey = backup.openrouterKey;
          S.settings.ai.provider = backup.provider;
        }
        break;
      }

      case 'edit-exam-date':
        navigate('settings');
        setTimeout(() => {
          const inp = document.querySelector('input[name="examDate"]');
          if (inp) inp.focus();
        }, 250);
        break;

      case 'timer-subj': {
        if (Timer.state && Timer.state.status === 'running') {
          toast('اول تایمر را متوقف کن', 'warn');
          break;
        }
        if (Timer.state) {
          Timer.state.subject = id;
          await Timer.save();
        } else {
          Timer.pendingSubject = id;
        }
        renderTimer();
        break;
      }

      case 'timer-start':
        Timer.start(Timer.state ? Timer.state.subject : (Timer.pendingSubject || 'bio'));
        renderTimer();
        break;

      case 'timer-pause': Timer.pause(); renderTimer(); break;
      case 'timer-resume': Timer.resume(); renderTimer(); break;

      /* [فاز ۱ - تغییر ۱۰] پس از پایان تایمر، مودال جزئیات باز می‌شود */
      case 'timer-finish': {
        const s = await Timer.finish();
        if (s) {
          openTimerFinishModal(s);
        } else {
          const drop = await confirmModal({
            title: 'جلسهٔ خیلی کوتاه',
            message: 'مدت کمتر از ۱ دقیقه است و ثبت نمی‌شود. تایمر پاک شود؟',
            confirmLabel: 'پاک کن',
            danger: true
          });
          if (drop) { await Timer.reset(); renderTimer(); }
        }
        break;
      }

      case 'timer-cancel': {
        if (!Timer.state) break;
        const ok = await confirmModal({
          title: 'لغو',
          message: 'جلسه لغو شود؟ (ثبت نمی‌شود)',
          confirmLabel: 'لغو',
          danger: true
        });
        if (!ok) break;
        await Timer.reset();
        renderTimer();
        break;
      }

      case 'timer-zen':
        document.body.classList.toggle('zen-mode');
        break;

      case 'del-exam': {
        const ok = await confirmModal({
          title: 'حذف',
          message: 'این آزمون حذف شود؟',
          confirmLabel: 'حذف',
          danger: true
        });
        if (!ok) break;
        const ex = await idbGet('exams', id);
        if (!ex) break;
        ex.deleted_at = Date.now();
        ex.updated_at = Date.now();
        await idbPut('exams', ex);
        await queueOp('delete', 'exams', id, ex);
        await refreshCache();
        renderExams();
        toast('حذف شد', 'ok', 1600);
        break;
      }

      case 'mistake-right': await handleMistakeResult(id, true); break;
      case 'mistake-wrong': await handleMistakeResult(id, false); break;

      case 'del-mistake': {
        const ok = await confirmModal({
          title: 'حذف',
          message: 'حذف شود؟',
          confirmLabel: 'حذف',
          danger: true
        });
        if (!ok) break;
        const m = await idbGet('mistakes', id);
        if (!m) break;
        m.deleted_at = Date.now();
        m.updated_at = Date.now();
        await idbPut('mistakes', m);
        await queueOp('delete', 'mistakes', id, m);
        await refreshCache();
        renderMistakes();
        toast('حذف شد', 'ok', 1600);
        break;
      }

      case 'pick-mistake-image': {
        const inp = document.createElement('input');
        inp.type = 'file';
        inp.accept = 'image/*';
        inp.addEventListener('change', async () => {
          const f = inp.files && inp.files[0];
          if (!f) return;
          if (f.size > 5 * 1024 * 1024) {
            toast('حداکثر ۵ مگابایت', 'error');
            return;
          }
          try {
            pendingMistakeImage = await compressImage(f);
            renderMistakes();
            toast('آماده شد', 'ok', 1200);
          } catch (err) {
            toast('خطا در پردازش', 'error');
          }
        });
        inp.click();
        break;
      }

      case 'clear-mistake-image':
        pendingMistakeImage = null;
        renderMistakes();
        break;

      case 'plan-toggle': {
        const tKey = todayKey();
        const sameDay = CACHE.plans.filter(p => p.day === tKey && !p.deleted_at);
        sameDay.sort((a, b) => (b.updated_at || 0) - (a.updated_at || 0));
        const plan = sameDay[0];
        if (!plan) break;
        const i = toInt(el.dataset.idx, -1);
        if (i < 0 || i >= plan.items.length) break;
        plan.items[i].done = !plan.items[i].done;
        plan.updated_at = Date.now();
        await idbPut('plans', plan);
        await queueOp('upsert', 'plans', plan.id, plan);
        await refreshCache();
        renderPlan();
        break;
      }

      case 'plan-del': {
        const tKey = todayKey();
        const sameDay = CACHE.plans.filter(p => p.day === tKey && !p.deleted_at);
        sameDay.sort((a, b) => (b.updated_at || 0) - (a.updated_at || 0));
        const plan = sameDay[0];
        if (!plan) break;
        const i = toInt(el.dataset.idx, -1);
        if (i < 0) break;
        plan.items.splice(i, 1);
        plan.updated_at = Date.now();
        await idbPut('plans', plan);
        await queueOp('upsert', 'plans', plan.id, plan);
        await refreshCache();
        renderPlan();
        break;
      }

      case 'note-del': {
        const n = await idbGet('notes', id);
        if (!n) break;
        n.deleted_at = Date.now();
        n.updated_at = Date.now();
        await idbPut('notes', n);
        await queueOp('delete', 'notes', id, n);
        await refreshCache();
        renderPlan();
        break;
      }

      case 'sim-finish': await finishSim(false); break;

      case 'sim-cancel': {
        const ok = await confirmModal({
          title: 'لغو',
          message: 'لغو شود؟',
          confirmLabel: 'لغو',
          danger: true
        });
        if (!ok) break;
        if (simTick._handle) {
          clearInterval(simTick._handle);
          simTick._handle = null;
        }
        activeSim = null;
        renderSim();
        break;
      }

      case 'csv-sessions': exportSessionsCSV(); break;
      case 'csv-exams': exportExamsCSV(); break;
      case 'csv-mistakes': exportMistakesCSV(); break;
      case 'export': exportData(); break;

      case 'import': {
        const fi = $('#importFile');
        if (fi) { fi.value = ''; fi.click(); }
        break;
      }

      case 'wipe-store': await wipeStore(el.dataset.store); break;
      case 'health-check': await runHealthCheck(); break;

      case 'request-persist':
        if (navigator.storage && navigator.storage.persist) {
          try {
            const r = await navigator.storage.persist();
            toast(r ? 'فعال شد' : 'مرورگر اجازه نداد', r ? 'ok' : 'warn');
          } catch (e) {
            toast('پشتیبانی نمی‌شود', 'warn');
          }
        }
        break;

      case 'clear-logs':
        for (const l of await idbGetAll('logs')) await idbDelete('logs', l.id);
        await refreshCache();
        renderDiag();
        toast('پاک شد', 'ok', 1500);
        break;

      case 'open-account': openAccount(); break;

      case 'show-signup': {
        const m = document.querySelector('#modalRoot .modal');
        if (m) {
          m.innerHTML =
            '<div class="modal-head">' +
              '<h3>ثبت‌نام</h3>' +
              '<button class="icon-btn sm" data-action="close-modal">' + ICONS.close + '</button>' +
            '</div>' +
            buildSignupForm();
        }
        break;
      }

      case 'show-login': {
        const m = document.querySelector('#modalRoot .modal');
        if (m) {
          m.innerHTML =
            '<div class="modal-head">' +
              '<h3>ورود</h3>' +
              '<button class="icon-btn sm" data-action="close-modal">' + ICONS.close + '</button>' +
            '</div>' +
            buildLoginForm();
        }
        break;
      }

      case 'clear-supabase-config': {
        const ok = await confirmModal({
          title: 'پاک',
          message: 'پیکربندی پاک شود؟',
          confirmLabel: 'پاک'
        });
        if (!ok) break;
        S.settings.supabase = { url: '', anonKey: '' };
        await saveSettings();
        updateAccountBtn();
        closeModal();
        break;
      }

      case 'open-link-partner':
        if (!currentUser) { toast('اول وارد شو', 'warn'); return; }
        openLinkPartnerModal();
        break;

      case 'sign-out': {
        const ok = await confirmModal({
          title: 'خروج',
          message: 'از حساب خارج شوی؟ داده‌های محلی می‌مانند.',
          confirmLabel: 'خروج'
        });
        if (!ok) break;
        await authSignOut();
        closeModal();
        toast('خارج شدی', 'ok');
        break;
      }

      case 'sync-now':
        toast('در حال sync…', 'info', 1200);
        await syncNow(true);
        if ($('#modalRoot').classList.contains('open')) openAccount();
        else if (S.activeView === 'diag') renderDiag();
        break;

      case 'force-pull':
        lastPullTs = 0;
        await saveMeta('lastPullTs', 0);
        await syncNow(true);
        toast('دریافت شد', 'ok', 1200);
        if ($('#modalRoot').classList.contains('open')) openAccount();
        break;

      case 'ai-mistakes': aiAnalyzeMistakes(); break;

      case 'fab-main': {
        const v = $('#fab').dataset.view;
        if (v === 'plan') {
          const inp = document.querySelector('form[data-form="plan-add"] input[name="text"]');
          if (inp) { inp.focus(); inp.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
        } else if (v === 'mistakes') {
          const inp = document.querySelector('form[data-form="mistake"] textarea[name="question"]');
          if (inp) { inp.focus(); inp.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
        } else if (v === 'exams') {
          const sel = document.querySelector('form[data-form="exam"] select[name="subject"]');
          if (sel) { sel.focus(); sel.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
        } else {
          navigate('timer');
        }
        break;
      }

      default: break;
    }
  });

  document.addEventListener('submit', async (e) => {
    const form = e.target.closest('form[data-form]');
    if (!form) return;
    e.preventDefault();
    const kind = form.dataset.form;

    try {
      if (kind === 'session-manual') {
        await submitManualSession(form);
      } else if (kind === 'exam') {
        await submitExam(form);
      } else if (kind === 'mistake') {
        await submitMistake(form);
      } else if (kind === 'note') {
        await submitNote(form);
      } else if (kind === 'plan-add') {
        await submitTask(form);
      } else if (kind === 'exam-date') {
        const title = String(form.examTitle.value || '').trim();
        const d = String(form.examDate.value || '');
        if (title) S.settings.examTitle = title;
        if (d && /^\d{4}-\d{2}-\d{2}$/.test(d)) S.settings.examDate = d;
        await saveSettings();
        toast('ذخیره شد', 'ok');
        renderSettings();
      } else if (kind === 'goals') {
        S.settings.dailyGoalMinutes = clamp(toInt(form.dailyGoalMinutes.value, 600), 30, 900);
        S.settings.dailyGoalTests = clamp(toInt(form.dailyGoalTests.value, 100), 0, 500);
        await saveSettings();
        toast('ذخیره شد', 'ok');
        renderSettings();
      } else if (kind === 'ai-settings') {
        S.settings.ai = S.settings.ai || {};
        S.settings.ai.provider = String(form.aiProvider.value || 'gemini');
        const gKey = String(form.geminiKey.value || '').trim();
        const oKey = String(form.openrouterKey.value || '').trim();
        if (gKey) S.settings.ai.geminiKey = gKey;
        if (oKey) S.settings.ai.openrouterKey = oKey;
        S.settings.ai.geminiModel = String(form.geminiModel.value || S.settings.ai.geminiModel);
        S.settings.ai.openrouterModel = String(form.openrouterModel.value || S.settings.ai.openrouterModel);
        await saveSettings();
        toast('ذخیره شد', 'ok');
        renderSettings();
      } else if (kind === 'plan-wake') {
        const tKey = todayKey();
        let plan = CACHE.plans.find(p => p.day === tKey && !p.deleted_at);
        if (!plan) {
          plan = {
            id: uid(),
            day: tKey,
            wake_time: '',
            items: [],
            created_at: Date.now(),
            updated_at: Date.now(),
            device_id: S.settings.deviceId,
            deleted_at: null
          };
        }
        plan.wake_time = String(form.wake.value || '');
        plan.updated_at = Date.now();
        await idbPut('plans', plan);
        await queueOp('upsert', 'plans', plan.id, plan);
        await refreshCache();
        renderPlan();
        toast('ذخیره شد', 'ok');
      } else if (kind === 'sim-start') {
        const subject = String(form.subject.value || 'bio');
        const count = clamp(toInt(form.count.value, 30), 5, 100);
        const minutes = clamp(toInt(form.minutes.value, 35), 1, 300);
        S.simConfig = { subject, count, minutes };
        await saveSettings();
        activeSim = {
          id: uid(),
          subject,
          count,
          minutes,
          duration_sec: minutes * 60,
          started_at: Date.now(),
          answers: { c: 0, w: 0, b: 0 }
        };
        if (simTick._handle) clearInterval(simTick._handle);
        simTick._handle = setInterval(simTick, 1000);
        renderSim();
      } else if (kind === 'supabase-config') {
        S.settings.supabase = {
          url: String(form.url.value || '').trim().replace(/\/$/, ''),
          anonKey: String(form.anonKey.value || '').trim()
        };
        await saveSettings();
        if (!initSupabaseSDK()) {
          toast('SDK بارگذاری نشده', 'error');
          return;
        }
        updateAccountBtn();
        toast('ذخیره شد', 'ok');
        openAccount();
      } else if (kind === 'auth-login') {
        const btn = form.querySelector('button[type="submit"]');
        if (btn) {
          btn.disabled = true;
          btn.textContent = 'در حال ورود…';
        }
        try {
          await authSignIn(form.email.value, form.password.value);
          closeModal();
          toast('خوش آمدی', 'ok');
          afterSignIn().catch(err => logError('afterSignIn: ' + err.message));
        } catch (err) {
          toast(err.message, 'error', 4200);
          if (btn) {
            btn.disabled = false;
            btn.textContent = 'ورود';
          }
        }
      } else if (kind === 'auth-signup') {
        const btn = form.querySelector('button[type="submit"]');
        if (btn) {
          btn.disabled = true;
          btn.textContent = 'در حال ساخت…';
        }
        try {
          await authSignUp(form.email.value, form.password.value);
          toast('اگر ایمیل تأیید لازم بود، صندوق را ببین.', 'ok', 5000);
          const m = document.querySelector('#modalRoot .modal');
          if (m) {
            m.innerHTML =
              '<div class="modal-head">' +
                '<h3>ورود</h3>' +
                '<button class="icon-btn sm" data-action="close-modal">' + ICONS.close + '</button>' +
              '</div>' +
              buildLoginForm();
          }
        } catch (err) {
          toast(err.message, 'error', 4600);
          if (btn) {
            btn.disabled = false;
            btn.textContent = 'ثبت‌نام';
          }
        }
      } else if (kind === 'link-partner') {
        try {
          await linkPartner(form.partnerEmail.value);
          toast('لینک شد', 'ok');
          closeModal();
          await startPresence();
          renderHome();
        } catch (err) {
          toast(err.message || 'خطا', 'error');
        }
      } else if (kind === 'ai-text') {
        await aiRunOnText(form.dataset.feature);
      } else if (kind === 'timer-finish-details') {
        /* [فاز ۱ - تغییر ۱۰] ذخیره جزئیات جلسه پس از پایان تایمر */
        const sid = form.dataset.sessionId;
        const s = await idbGet('sessions', sid);
        if (!s) break;
        s.subject = String(form.subject.value || s.subject);
        s.type = String(form.type.value || s.type || SESSION_TYPES[0]);
        s.topic = String(form.topic.value || '').trim();
        s.correct = clamp(toInt(form.correct.value, 0), 0, 1000);
        s.wrong = clamp(toInt(form.wrong.value, 0), 0, 1000);
        s.blank = clamp(toInt(form.blank.value, 0), 0, 1000);
        s.note = String(form.note.value || '').trim();
        s.updated_at = Date.now();
        await idbPut('sessions', s);
        await queueOp('upsert', 'sessions', s.id, s);
        await refreshCache();
        closeModal();
        toast('جزئیات ذخیره شد — ' + fmtHMfa((s.seconds || 0) / 60), 'ok');
        navigate('home');
      }
    } catch (err) {
      logError(err.message || String(err));
      toast('خطا: ' + (err.message || ''), 'error');
    }
  });

  document.addEventListener('input', (e) => {
    const t = e.target;

    const examForm = t.closest && t.closest('form[data-form="exam"]');
    if (examForm && ['correct', 'wrong', 'blank'].includes(t.name)) {
      const c = toInt(examForm.correct.value, 0);
      const w = toInt(examForm.wrong.value, 0);
      const b = toInt(examForm.blank.value, 0);
      const prev = examForm.querySelector('#examPreview');
      if (prev) {
        prev.value = (c + w + b) > 0 ? calcPercent(c, w, b).toFixed(2) + '%' : '—';
      }
    }

    if (t.id === 'cmdInput') {
      renderCmdList(t.value);
    }
  });

  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      const root = $('#cmdRoot');
      if (root && root.style.display === 'flex') closeCmd();
      else openCmd();
      return;
    }

    const cmdRoot = $('#cmdRoot');
    if (cmdRoot && cmdRoot.style.display === 'flex') {
      if (e.key === 'Escape') {
        e.preventDefault();
        closeCmd();
        return;
      }
      if (e.key === 'Enter') {
        e.preventDefault();
        const active = cmdRoot.querySelector('.cmd-item[style*="brand-soft"]');
        if (active) runCmdItem(active.dataset.cmdId);
        return;
      }
    }

    if (e.key === 'Escape') {
      if (document.body.classList.contains('zen-mode')) {
        document.body.classList.remove('zen-mode');
      } else if ($('#modalRoot').classList.contains('open')) {
        closeModal();
      }
    }
  });

  const importFile = $('#importFile');
  if (importFile) {
    importFile.addEventListener('change', (e) => {
      handleImport(e.target.files && e.target.files[0]);
    });
  }

  window.addEventListener('online', () => {
    updateSyncPill();
    if (currentUser && sb) syncNow(true);
  });
  window.addEventListener('offline', () => {
    updateSyncPill();
  });

  /* [فاز ۱ - تغییر ۹] در visibilitychange هم وجود sb را چک کن */
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      Timer.render();
      if (currentUser && navigator.onLine && sb && !syncState.running) {
        syncNow();
      }
    }
  });

  window.addEventListener('beforeunload', () => {
    Timer.save();
  });
}

/* ============================================================================
 * SECTION 34 — AFTER SIGN IN
 * ========================================================================= */

async function afterSignIn() {
  if (!initSupabaseSDK()) return;

  const { data } = await sb.auth.getUser();
  if (!data || !data.user) return;

  currentUser = {
    id: data.user.id,
    email: data.user.email
  };

  lastPullTs = toInt(await getMeta('lastPullTs'), 0);
  await fetchMyProfile();
  await refreshSharedStatsForToday().catch(() => {});
  await syncNow(true);
  await startPresence();
  startSyncLoop();
  updateAccountBtn();

  if (S.activeView === 'home') renderHome();
}

/* ============================================================================
 * SECTION 35 — RENDER MAP
 * ========================================================================= */

window.RENDER = {
  home: renderHome,
  timer: renderTimer,
  exams: renderExams,
  mistakes: renderMistakes,
  sim: renderSim,
  plan: renderPlan,
  stats: renderStats,
  monthly: renderMonthly,
  ai: renderAI,
  settings: renderSettings,
  diag: renderDiag
};

/* ============================================================================
 * SECTION 36 — BOOTSTRAP
 * ========================================================================= */

async function bootstrap() {
  try {
    await openDB();
    await loadSettings();
    await Timer.load();
    await refreshCache();
    applyTheme();
    buildNav();
    bindEvents();

    if (Timer.state && Timer.state.status === 'running') {
      Timer.state.started_at = Timer.state.started_at || Date.now();
      Timer.loop();
    }

    try {
      if (navigator.storage && navigator.storage.persist) {
        const persisted = await navigator.storage.persisted();
        if (!persisted) navigator.storage.persist().catch(() => {});
      }
    } catch (e) {}

    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      navigator.serviceWorker.register('./sw.js').catch((e) => {
        logError('SW: ' + e.message);
      });
    }

    if (initSupabaseSDK()) {
      try {
        const { data } = await sb.auth.getSession();
        if (data && data.session && data.session.user) {
          currentUser = {
            id: data.session.user.id,
            email: data.session.user.email
          };
          lastPullTs = toInt(await getMeta('lastPullTs'), 0);
          await fetchMyProfile();
          await syncNow(true);
          await startPresence();
          startSyncLoop();
          updateAccountBtn();
        }
      } catch (err) {
        logError('bootstrap phase2: ' + (err.message || err));
      }
    }

    navigate(S.activeView || 'home');

    setInterval(updateSyncPill, 15000);

    setInterval(() => {
      if (currentUser && navigator.onLine && !syncState.running) {
        syncNow();
      }
    }, 60000);

    const lastBackupReminder = toInt(await getMeta('lastBackupReminder'), 0);
    const WEEK_MS = 7 * 24 * 60 * 60 * 1000;
    if (Date.now() - lastBackupReminder > WEEK_MS) {
      setTimeout(() => {
        toast('یادآوری: پشتیبان JSON بگیر.', 'warn', 5000);
        saveMeta('lastBackupReminder', Date.now());
      }, 3000);
    }
  } catch (err) {
    console.error(err);
    document.body.innerHTML =
      '<div style="padding:24px;text-align:center;font-family:sans-serif;color:#dc2626">' +
        '<h2>خطا در راه‌اندازی</h2>' +
        '<p>' + esc(err.message) + '</p>' +
        '<button onclick="location.reload()" style="margin-top:12px;padding:10px 20px">تلاش مجدد</button>' +
      '</div>';
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', bootstrap);
} else {
  bootstrap();
}

window.addEventListener('error', (e) => {
  try {
    logError(e.message, { stack: e.error && e.error.stack });
  } catch (_) {}
});

window.addEventListener('unhandledrejection', (e) => {
  try {
    const reason = e.reason;
    logError('Unhandled: ' + (reason && reason.message ? reason.message : reason));
  } catch (_) {}
});
</script>
</body>
