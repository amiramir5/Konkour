  renderPlan();
}

async function submitTask(form) {
  const text = String(form.text.value || '').trim();
  if (!text) return;

  const tKey = todayKey();
  let plan = CACHE.plans.find(p => p.day === tKey && !p.deleted_at);
  if (!plan) {
    plan = {
      id: uid(),
      day: tKey,
      wake_time: '',
      items: [],
      created_at: Date.now(),
      updated_at: Date.now(),
      device_id: S.settings.deviceId,
      deleted_at: null
    };
  }
  plan.items.push({ text, done: false });
  plan.updated_at = Date.now();

  await idbPut('plans', plan);
  await queueOp('upsert', 'plans', plan.id, plan);
  await refreshCache();
  renderPlan();
}


/* ============================================================================
 * SECTION 34 — EVENT BINDINGS
 * ========================================================================= */

function bindEvents() {

  /* --------------------------------------------------------------
     CLICK
     -------------------------------------------------------------- */
  document.addEventListener('click', async (e) => {
    const navBtn = e.target.closest('[data-nav]');
    if (navBtn && navBtn.dataset.nav) {
      e.preventDefault();
      navigate(navBtn.dataset.nav);
      return;
    }

    const cmdItem = e.target.closest('[data-cmd-id]');
    if (cmdItem) {
      runCmdItem(cmdItem.dataset.cmdId);
      return;
    }

    const el = e.target.closest('[data-action]');
    if (!el) return;
    const action = el.dataset.action;
    const id = el.dataset.id;

    switch (action) {
      case 'close-modal':
        closeModal();
        break;

      case 'open-cmd':
        openCmd();
        break;

      case 'close-cmd':
        closeCmd();
        break;

      /* Theme */
      case 'toggle-theme':
        S.settings.theme = S.settings.theme === 'dark' ? 'light' : 'dark';
        applyTheme();
        await saveSettings();
        if (S.activeView === 'settings') renderSettings();
        break;

      case 'toggle-sound':
        S.settings.soundEnabled = !S.settings.soundEnabled;
        await saveSettings();
        if (S.activeView === 'settings') renderSettings();
        break;

      case 'toggle-vibration':
        S.settings.vibrationEnabled = !S.settings.vibrationEnabled;
        await saveSettings();
        if (S.activeView === 'settings') renderSettings();
        break;

      case 'toggle-ai-local':
        S.settings.ai = S.settings.ai || {};
        S.settings.ai.useLocalKey = !S.settings.ai.useLocalKey;
        await saveSettings();
        renderSettings();
        break;

      case 'toggle-key-visibility': {
        const target = document.querySelector('input[name="' + el.dataset.target + '"]');
        if (!target) break;
        const isPwd = target.type === 'password';
        target.type = isPwd ? 'text' : 'password';
        el.innerHTML = isPwd ? ICONS.eyeOff : ICONS.eye;
        break;
      }

      case 'test-ai-key': {
        const resultEl = $('#aiKeyTestResult');
        if (!resultEl) break;
        resultEl.innerHTML =
          '<div class="card card-inset" style="padding:12px">' +
            '<div class="flex items-center gap-2">' +
              '<span class="spinner"></span>' +
              '<span class="t-xs muted">در حال تست…</span>' +
            '</div>' +
          '</div>';

        const form = document.querySelector('form[data-form="ai-settings"]');
        const keyInput = form ? form.querySelector('input[name="aiApiKey"]') : null;
        const modelSelect = form ? form.querySelector('select[name="aiModel"]') : null;

        const testKey = (keyInput && keyInput.value.trim()) || S.settings.ai?.apiKey || '';
        const testModel = (modelSelect && modelSelect.value) || S.settings.ai?.model;

        if (!testKey) {
          resultEl.innerHTML =
            '<div class="card card-inset" style="padding:12px;border:1px solid var(--bad)">' +
              '<p class="t-sm" style="color:var(--bad)">کلید API را وارد کن</p>' +
            '</div>';
          break;
        }

        try {
          const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Authorization': 'Bearer ' + testKey,
              'Content-Type': 'application/json',
              'HTTP-Referer': location.origin,
              'X-Title': 'KonkoorYar'
            },
            body: JSON.stringify({
              model: testModel,
              messages: [
                { role: 'system', content: 'فقط بگو: سلام' },
                { role: 'user', content: 'سلام' }
              ],
              max_tokens: 30
            })
          });

          if (!res.ok) {
            const t = await res.text().catch(() => '');
            throw new Error('HTTP ' + res.status + ': ' + t.slice(0, 150));
          }

          const data = await res.json();
          const text = data?.choices?.[0]?.message?.content || '';

          resultEl.innerHTML =
            '<div class="card card-inset" style="padding:12px;border:1px solid var(--ok)">' +
              '<div class="flex items-center gap-2" style="color:var(--ok)">' +
                ICONS.check +
                '<b class="t-sm">اتصال موفق</b>' +
              '</div>' +
              '<p class="t-xs muted mt-2" dir="auto">' + esc(text.slice(0, 100)) + '</p>' +
            '</div>';
        } catch (err) {
          resultEl.innerHTML =
            '<div class="card card-inset" style="padding:12px;border:1px solid var(--bad)">' +
              '<div class="flex items-center gap-2" style="color:var(--bad)">' +
                ICONS.warning +
                '<b class="t-sm">اتصال ناموفق</b>' +
              '</div>' +
              '<p class="t-xs muted mt-2" dir="auto">' + esc(err.message) + '</p>' +
            '</div>';
        }
        break;
      }

      /* Exam date */
      case 'edit-exam-date':
        navigate('settings');
        setTimeout(() => {
          const inp = document.querySelector('input[name="examDate"]');
          if (inp) inp.focus();
        }, 250);
        break;

      /* Timer */
      case 'timer-subj': {
        if (Timer.state && Timer.state.status === 'running') {
          toast('اول تایمر را متوقف کن', 'warn');
          break;
        }
        if (Timer.state) {
          Timer.state.subject = id;
          await Timer.save();
        } else {
          Timer.pendingSubject = id;
        }
        renderTimer();
        break;
      }

      case 'timer-start':
        Timer.start(Timer.state ? Timer.state.subject : (Timer.pendingSubject || 'bio'));
        renderTimer();
        break;

      case 'timer-pause':
        Timer.pause();
        renderTimer();
        break;

      case 'timer-resume':
        Timer.resume();
        renderTimer();
        break;

      case 'timer-finish': {
        const s = await Timer.finish();
        if (s) toast('ثبت شد — ' + fmtHMfa((s.seconds || 0) / 60), 'ok');
        else toast('کمتر از ۱ دقیقه', 'warn');
        navigate('home');
        break;
      }

      case 'timer-cancel': {
        if (!Timer.state) break;
        const ok = await confirmModal({
          title: 'لغو',
          message: 'جلسه لغو شود؟ (ثبت نمی‌شود)',
          confirmLabel: 'لغو',
          danger: true
        });
        if (!ok) break;
        await Timer.reset();
        renderTimer();
        break;
      }

      case 'timer-zen':
        document.body.classList.toggle('zen-mode');
        break;

      /* Del exam */
      case 'del-exam': {
        const ok = await confirmModal({
          title: 'حذف',
          message: 'این آزمون حذف شود؟',
          confirmLabel: 'حذف',
          danger: true
        });
        if (!ok) break;
        const ex = await idbGet('exams', id);
        if (!ex) break;
        ex.deleted_at = Date.now();
        ex.updated_at = Date.now();
        await idbPut('exams', ex);
        await queueOp('delete', 'exams', id, ex);
        await refreshCache();
        renderExams();
        toast('حذف شد', 'ok', 1600);
        break;
      }

      /* Mistakes */
      case 'mistake-right':
        await handleMistakeResult(id, true);
        break;

      case 'mistake-wrong':
        await handleMistakeResult(id, false);
        break;

      case 'del-mistake': {
        const ok = await confirmModal({
          title: 'حذف',
          message: 'حذف شود؟',
          confirmLabel: 'حذف',
          danger: true
        });
        if (!ok) break;
        const m = await idbGet('mistakes', id);
        if (!m) break;
        m.deleted_at = Date.now();
        m.updated_at = Date.now();
        await idbPut('mistakes', m);
        await queueOp('delete', 'mistakes', id, m);
        await refreshCache();
        renderMistakes();
        toast('حذف شد', 'ok', 1600);
        break;
      }

      case 'pick-mistake-image': {
        const inp = document.createElement('input');
        inp.type = 'file';
        inp.accept = 'image/*';
        inp.addEventListener('change', async () => {
          const f = inp.files && inp.files[0];
          if (!f) return;
          if (f.size > 5 * 1024 * 1024) {
            toast('حداکثر ۵ مگابایت', 'error');
            return;
          }
          try {
            pendingMistakeImage = await compressImage(f);
            renderMistakes();
            toast('آماده شد', 'ok', 1200);
          } catch (err) {
            toast('خطا در پردازش', 'error');
          }
        });
        inp.click();
        break;
      }

      case 'clear-mistake-image':
        pendingMistakeImage = null;
        renderMistakes();
        break;

      /* Plan */
      case 'plan-toggle': {
        const tKey = todayKey();
        const sameDay = CACHE.plans.filter(p => p.day === tKey && !p.deleted_at);
        sameDay.sort((a, b) => (b.updated_at || 0) - (a.updated_at || 0));
        const plan = sameDay[0];
        if (!plan) break;
        const i = toInt(el.dataset.idx, -1);
        if (i < 0 || i >= plan.items.length) break;
        plan.items[i].done = !plan.items[i].done;
        plan.updated_at = Date.now();
        await idbPut('plans', plan);
        await queueOp('upsert', 'plans', plan.id, plan);
        await refreshCache();
        renderPlan();
        break;
      }

      case 'plan-del': {
        const tKey = todayKey();
        const sameDay = CACHE.plans.filter(p => p.day === tKey && !p.deleted_at);
        sameDay.sort((a, b) => (b.updated_at || 0) - (a.updated_at || 0));
        const plan = sameDay[0];
        if (!plan) break;
        const i = toInt(el.dataset.idx, -1);
        if (i < 0) break;
        plan.items.splice(i, 1);
        plan.updated_at = Date.now();
        await idbPut('plans', plan);
        await queueOp('upsert', 'plans', plan.id, plan);
        await refreshCache();
        renderPlan();
        break;
      }

      case 'note-del': {
        const n = await idbGet('notes', id);
        if (!n) break;
        n.deleted_at = Date.now();
        n.updated_at = Date.now();
        await idbPut('notes', n);
        await queueOp('delete', 'notes', id, n);
        await refreshCache();
        renderPlan();
        break;
      }

      /* Simulation */
      case 'sim-finish':
        await finishSim(false);
        break;

      case 'sim-cancel': {
        const ok = await confirmModal({
          title: 'لغو',
          message: 'لغو شود؟',
          confirmLabel: 'لغو',
          danger: true
        });
        if (!ok) break;
        if (simTick._handle) {
          clearInterval(simTick._handle);
          simTick._handle = null;
        }
        activeSim = null;
        renderSim();
        break;
      }

      /* CSV */
      case 'csv-sessions':
        exportSessionsCSV();
        break;
      case 'csv-exams':
        exportExamsCSV();
        break;
      case 'csv-mistakes':
        exportMistakesCSV();
        break;

      /* Backup */
      case 'export':
        exportData();
        break;

      case 'import': {
        const fi = $('#importFile');
        if (fi) {
          fi.value = '';
          fi.click();
        }
        break;
      }

      case 'wipe-store':
        await wipeStore(el.dataset.store);
        break;

      case 'health-check':
        await runHealthCheck();
        break;

      case 'request-persist':
        if (navigator.storage && navigator.storage.persist) {
          try {
            const r = await navigator.storage.persist();
            toast(r ? 'فعال شد' : 'مرورگر اجازه نداد', r ? 'ok' : 'warn');
          } catch (e) {
            toast('پشتیبانی نمی‌شود', 'warn');
          }
        }
        break;

      case 'clear-logs':
        for (const l of await idbGetAll('logs')) await idbDelete('logs', l.id);
        await refreshCache();
        renderDiag();
        toast('پاک شد', 'ok', 1500);
        break;

      /* Account */
      case 'open-account':
        openAccount();
        break;

      case 'show-signup': {
        const m = document.querySelector('#modalRoot .modal');
        if (m) {
          m.innerHTML =
            '<div class="modal-head">' +
              '<h3>ثبت‌نام</h3>' +
              '<button class="icon-btn sm" data-action="close-modal">' + ICONS.close + '</button>' +
            '</div>' +
            buildSignupForm();
        }
        break;
      }

      case 'show-login': {
        const m = document.querySelector('#modalRoot .modal');
        if (m) {
          m.innerHTML =
            '<div class="modal-head">' +
              '<h3>ورود</h3>' +
              '<button class="icon-btn sm" data-action="close-modal">' + ICONS.close + '</button>' +
            '</div>' +
            buildLoginForm();
        }
        break;
      }

      case 'clear-supabase-config': {
        const ok = await confirmModal({
          title: 'پاک',
          message: 'پیکربندی پاک شود؟',
          confirmLabel: 'پاک'
        });
        if (!ok) break;
        S.settings.supabase = { url: '', anonKey: '' };
        await saveSettings();
        updateAccountBtn();
        closeModal();
        break;
      }

      case 'open-link-partner':
        if (!currentUser) { toast('اول وارد شو', 'warn'); return; }
        openLinkPartnerModal();
        break;

      case 'sign-out': {
        const ok = await confirmModal({
          title: 'خروج',
          message: 'از حساب خارج شوی؟ داده‌های محلی می‌مانند.',
          confirmLabel: 'خروج'
        });
        if (!ok) break;
        await authSignOut();
        closeModal();
        toast('خارج شدی', 'ok');
        break;
      }

      case 'sync-now':
        toast('در حال sync…', 'info', 1200);
        await syncNow(true);
        if ($('#modalRoot').classList.contains('open')) openAccount();
        else if (S.activeView === 'diag') renderDiag();
        break;

      case 'force-pull':
        lastPullTs = 0;
        await saveMeta('lastPullTs', 0);
        await syncNow(true);
        toast('دریافت شد', 'ok', 1200);
        if ($('#modalRoot').classList.contains('open')) openAccount();
        break;

      /* AI */
      case 'ai-mistakes':
        aiAnalyzeMistakes();
        break;

      /* FAB */
      case 'fab-main': {
        const v = $('#fab').dataset.view;
        if (v === 'plan') {
          const inp = document.querySelector('form[data-form="plan-add"] input[name="text"]');
          if (inp) { inp.focus(); inp.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
        } else if (v === 'mistakes') {
          const inp = document.querySelector('form[data-form="mistake"] textarea[name="question"]');
          if (inp) { inp.focus(); inp.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
        } else if (v === 'exams') {
          const sel = document.querySelector('form[data-form="exam"] select[name="subject"]');
          if (sel) { sel.focus(); sel.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
        } else {
          navigate('timer');
        }
        break;
      }

      default:
        break;
    }
  });

  /* --------------------------------------------------------------
     SUBMIT
     -------------------------------------------------------------- */
  document.addEventListener('submit', async (e) => {
    const form = e.target.closest('form[data-form]');
    if (!form) return;
    e.preventDefault();

    const kind = form.dataset.form;

    try {
      if (kind === 'session-manual') {
        await submitManualSession(form);
      } else if (kind === 'exam') {
        await submitExam(form);
      } else if (kind === 'mistake') {
        await submitMistake(form);
      } else if (kind === 'note') {
        await submitNote(form);
      } else if (kind === 'plan-add') {
        await submitTask(form);
      } else if (kind === 'exam-date') {
        const title = String(form.examTitle.value || '').trim();
        const d = String(form.examDate.value || '');
        if (title) S.settings.examTitle = title;
        if (d && /^\d{4}-\d{2}-\d{2}$/.test(d)) S.settings.examDate = d;
        await saveSettings();
        toast('ذخیره شد', 'ok');
        renderSettings();
      } else if (kind === 'goals') {
        S.settings.dailyGoalMinutes = clamp(toInt(form.dailyGoalMinutes.value, 240), 30, 900);
        S.settings.dailyGoalTests = clamp(toInt(form.dailyGoalTests.value, 60), 0, 500);
        await saveSettings();
        toast('ذخیره شد', 'ok');
        renderSettings();
      } else if (kind === 'ai-settings') {
        S.settings.ai = S.settings.ai || {};
        const keyVal = String(form.aiApiKey.value || '').trim();
        if (keyVal) S.settings.ai.apiKey = keyVal;
        S.settings.ai.model = String(form.aiModel.value || S.settings.ai.model);
        await saveSettings();
        toast('ذخیره شد', 'ok');
        renderSettings();
      } else if (kind === 'plan-wake') {
        const tKey = todayKey();
        let plan = CACHE.plans.find(p => p.day === tKey && !p.deleted_at);
        if (!plan) {
          plan = {
            id: uid(),
            day: tKey,
            wake_time: '',
            items: [],
            created_at: Date.now(),
            updated_at: Date.now(),
            device_id: S.settings.deviceId,
            deleted_at: null
          };
        }
        plan.wake_time = String(form.wake.value || '');
        plan.updated_at = Date.now();
        await idbPut('plans', plan);
        await queueOp('upsert', 'plans', plan.id, plan);
        await refreshCache();
        renderPlan();
        toast('ذخیره شد', 'ok');
      } else if (kind === 'sim-start') {
        const subject = String(form.subject.value || 'bio');
        const count = clamp(toInt(form.count.value, 30), 5, 100);
        const minutes = clamp(toInt(form.minutes.value, 35), 1, 300);
        S.simConfig = { subject, count, minutes };
        await saveSettings();
        activeSim = {
          id: uid(),
          subject,
          count,
          minutes,
          duration_sec: minutes * 60,
          started_at: Date.now()
        };
        if (simTick._handle) clearInterval(simTick._handle);
        simTick._handle = setInterval(simTick, 1000);
        renderSim();
      } else if (kind === 'supabase-config') {
        S.settings.supabase = {
          url: String(form.url.value || '').trim().replace(/\/$/, ''),
          anonKey: String(form.anonKey.value || '').trim()
        };
        await saveSettings();
        if (!initSupabaseSDK()) {
          toast('SDK بارگذاری نشده', 'error');
          return;
        }
        updateAccountBtn();
        toast('ذخیره شد', 'ok');
        openAccount();
      } else if (kind === 'auth-login') {
        const btn = form.querySelector('button[type="submit"]');
        if (btn) {
          btn.disabled = true;
          btn.textContent = 'در حال ورود…';
        }
        try {
          await authSignIn(form.email.value, form.password.value);
          closeModal();
          toast('خوش آمدی', 'ok');
          afterSignIn().catch(err => logError('afterSignIn: ' + err.message));
        } catch (err) {
          toast(err.message, 'error', 4200);
          if (btn) {
            btn.disabled = false;
            btn.textContent = 'ورود';
          }
        }
      } else if (kind === 'auth-signup') {
        const btn = form.querySelector('button[type="submit"]');
        if (btn) {
          btn.disabled = true;
          btn.textContent = 'در حال ساخت…';
        }
        try {
          await authSignUp(form.email.value, form.password.value);
          toast('اگر ایمیل تأیید لازم بود، صندوق را ببین.', 'ok', 5000);
          const m = document.querySelector('#modalRoot .modal');
          if (m) {
            m.innerHTML =
              '<div class="modal-head">' +
                '<h3>ورود</h3>' +
                '<button class="icon-btn sm" data-action="close-modal">' + ICONS.close + '</button>' +
              '</div>' +
              buildLoginForm();
          }
        } catch (err) {
          toast(err.message, 'error', 4600);
          if (btn) {
            btn.disabled = false;
            btn.textContent = 'ثبت‌نام';
          }
        }
      } else if (kind === 'link-partner') {
        try {
          await linkPartner(form.partnerEmail.value);
          toast('لینک شد', 'ok');
          closeModal();
          await startPresence();
          renderHome();
        } catch (err) {
          toast(err.message || 'خطا', 'error');
        }
      } else if (kind === 'ai-text') {
        await aiRunOnText(form.dataset.feature);
      }
    } catch (err) {
      logError(err.message || String(err));
      toast('خطا: ' + (err.message || ''), 'error');
    }
  });

  /* --------------------------------------------------------------
     INPUT
     -------------------------------------------------------------- */
  document.addEventListener('input', (e) => {
    const t = e.target;

    const examForm = t.closest && t.closest('form[data-form="exam"]');
    if (examForm && ['correct', 'wrong', 'blank'].includes(t.name)) {
      const c = toInt(examForm.correct.value, 0);
      const w = toInt(examForm.wrong.value, 0);
      const b = toInt(examForm.blank.value, 0);
      const prev = examForm.querySelector('#examPreview');
      if (prev) {
        prev.value = (c + w + b) > 0 ? calcPercent(c, w, b).toFixed(2) + '%' : '—';
      }
    }

    if (t.id === 'cmdInput') {
      renderCmdList(t.value);
    }
  });

  /* --------------------------------------------------------------
     KEYBOARD
     -------------------------------------------------------------- */
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      const root = $('#cmdRoot');
      if (root && root.style.display === 'flex') closeCmd();
      else openCmd();
      return;
    }

    const cmdRoot = $('#cmdRoot');
    if (cmdRoot && cmdRoot.style.display === 'flex') {
      if (e.key === 'Escape') {
        e.preventDefault();
        closeCmd();
        return;
      }
      if (e.key === 'Enter') {
        e.preventDefault();
        const active = cmdRoot.querySelector('.cmd-item[style*="brand-soft"]');
        if (active) runCmdItem(active.dataset.cmdId);
        return;
      }
    }

    if (e.key === 'Escape') {
      if (document.body.classList.contains('zen-mode')) {
        document.body.classList.remove('zen-mode');
      } else if ($('#modalRoot').classList.contains('open')) {
        closeModal();
      }
    }
  });

  /* --------------------------------------------------------------
     FILE INPUT
     -------------------------------------------------------------- */
  const importFile = $('#importFile');
  if (importFile) {
    importFile.addEventListener('change', (e) => {
      handleImport(e.target.files && e.target.files[0]);
    });
  }

  /* --------------------------------------------------------------
     NETWORK
     -------------------------------------------------------------- */
  window.addEventListener('online', () => {
    updateSyncPill();
    if (currentUser) syncNow(true);
  });
  window.addEventListener('offline', () => {
    updateSyncPill();
  });

  /* --------------------------------------------------------------
     VISIBILITY
     -------------------------------------------------------------- */
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      Timer.render();
      if (currentUser && navigator.onLine) syncNow();
    }
  });

  /* --------------------------------------------------------------
     BEFORE UNLOAD
     -------------------------------------------------------------- */
  window.addEventListener('beforeunload', () => {
    Timer.save();
  });
}


/* ============================================================================
 * SECTION 35 — AFTER SIGN IN
 * ========================================================================= */

async function afterSignIn() {
  if (!initSupabaseSDK()) return;

  const { data } = await sb.auth.getUser();
  if (!data || !data.user) return;

  currentUser = {
    id: data.user.id,
    email: data.user.email
  };

  lastPullTs = toInt(await getMeta('lastPullTs'), 0);
  await fetchMyProfile();
  await refreshSharedStatsForToday().catch(() => {});
  await syncNow(true);
  await startPresence();
  startSyncLoop();
  updateAccountBtn();

  if (S.activeView === 'home') renderHome();
}


/* ============================================================================
 * SECTION 36 — RENDER MAP
 * ========================================================================= */

const RENDER = {
  home: renderHome,
  timer: renderTimer,
  exams: renderExams,
  mistakes: renderMistakes,
  sim: renderSim,
  plan: renderPlan,
  stats: renderStats,
  monthly: renderMonthly,
  ai: renderAI,
  settings: renderSettings,
  diag: renderDiag
};


/* ============================================================================
 * SECTION 37 — BOOTSTRAP
 * ========================================================================= */

async function bootstrap() {
  try {
    await openDB();
    await loadSettings();
    await Timer.load();
    await refreshCache();
    applyTheme();
    buildNav();
    bindEvents();

    if (Timer.state && Timer.state.status === 'running') {
      Timer.state.started_at = Timer.state.started_at || Date.now();
      Timer.loop();
    }

    try {
      if (navigator.storage && navigator.storage.persist) {
        const persisted = await navigator.storage.persisted();
        if (!persisted) navigator.storage.persist().catch(() => {});
      }
    } catch (e) {}

    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      navigator.serviceWorker.register('./sw.js').catch((e) => {
        logError('SW: ' + e.message);
      });
    }

    if (initSupabaseSDK()) {
      try {
        const { data } = await sb.auth.getSession();
        if (data && data.session && data.session.user) {
          currentUser = {
            id: data.session.user.id,
            email: data.session.user.email
          };
          lastPullTs = toInt(await getMeta('lastPullTs'), 0);
          await fetchMyProfile();
          await syncNow(true);
          await startPresence();
          startSyncLoop();
          updateAccountBtn();
        }
      } catch (err) {
        logError('bootstrap phase2: ' + (err.message || err));
      }
    }

    navigate(S.activeView || 'home');

    setInterval(updateSyncPill, 15000);

    setInterval(() => {
      if (currentUser && navigator.onLine && !syncState.running) {
        syncNow();
      }
    }, 60000);

    const lastBackupReminder = toInt(await getMeta('lastBackupReminder'), 0);
    const WEEK_MS = 7 * 24 * 60 * 60 * 1000;
    if (Date.now() - lastBackupReminder > WEEK_MS) {
      setTimeout(() => {
        toast('یادآوری: پشتیبان JSON بگیر.', 'warn', 5000);
        saveMeta('lastBackupReminder', Date.now());
      }, 3000);
    }
  } catch (err) {
    console.error(err);
    document.body.innerHTML =
      '<div style="padding:24px;text-align:center;font-family:sans-serif;color:#dc2626">' +
        '<h2>خطا در راه‌اندازی</h2>' +
        '<p>' + esc(err.message) + '</p>' +
        '<button onclick="location.reload()" style="margin-top:12px;padding:10px 20px">تلاش مجدد</button>' +
      '</div>';
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', bootstrap);
} else {
  bootstrap();
}

window.addEventListener('error', (e) => {
  try {
    logError(e.message, { stack: e.error && e.error.stack });
  } catch (_) {}
});

window.addEventListener('unhandledrejection', (e) => {
  try {
    const reason = e.reason;
    logError('Unhandled: ' + (reason && reason.message ? reason.message : reason));
  } catch (_) {}
});
</script>
