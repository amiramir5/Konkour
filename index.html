/* ✅ FIX: تبدیل timestamp */
const TS_FIELDS = ['created_at', 'updated_at', 'deleted_at'];

function toRemoteRow(row, userId) {
  const r = deepClone(row);
  TS_FIELDS.forEach(k => {
    const v = r[k];
    r[k] = (v === null || v === undefined || v === '')
      ? null
      : (typeof v === 'number' ? new Date(v).toISOString() : v);
  });
  r.user_id = userId;
  return r;
}

function fromRemoteRow(row) {
  const r = { ...row };
  TS_FIELDS.forEach(k => {
    r[k] = r[k] == null
      ? null
      : (typeof r[k] === 'number' ? r[k] : new Date(r[k]).getTime());
  });
  return r;
}

/* ✅ FIX: retryFailedOps */
async function retryFailedOps() {
  for (const o of await idbGetAll('outbox')) {
    if (o.status === 'failed') {
      o.status = 'pending';
      o.tries = 0;
      o.last_error = null;
      await idbPut('outbox', o);
    }
  }
}

async function pushOutbox() {
  if (!sb || !currentUser) return { pushed: 0, failed: 0 };

  const pending = (await idbGetAll('outbox'))
    .filter(o => o.status === 'pending' || o.status === 'retry');

  /* ✅ FIX: مرتب‌سازی بر اساس ts */
  pending.sort((a, b) => a.ts - b.ts);

  if (!pending.length) return { pushed: 0, failed: 0 };

  let pushed = 0;
  let failed = 0;

  for (const op of pending) {
    try {
      const table = op.store;
      if (!['sessions', 'exams', 'mistakes', 'plans', 'notes'].includes(table)) {
        await idbDelete('outbox', op.id);
        continue;
      }

      const payload = op.payload ? toRemoteRow(op.payload, currentUser.id) : null;

      /* ✅ FIX: همیشه upsert — حذف از طریق deleted_at */
      const res = await sb.from(table).upsert(payload, { onConflict: 'id' });
      if (res.error) throw new Error(res.error.message);

      op.status = 'done';
      op.tries = (op.tries || 0) + 1;
      op.last_error = null;
      await idbPut('outbox', op);
      pushed++;
    } catch (err) {
      failed++;
      op.tries = (op.tries || 0) + 1;
      op.last_error = String(err.message || err).slice(0, 300);
      op.status = op.tries >= 5 ? 'failed' : 'retry';
      await idbPut('outbox', op);
      logError('push ' + op.store + ': ' + op.last_error);
    }
  }

  /* Cleanup */
  const cutoff = Date.now() - 24 * 3600 * 1000;
  const all = await idbGetAll('outbox');
  for (const o of all) {
    if (o.status === 'done' && o.ts < cutoff) {
      await idbDelete('outbox', o.id);
    }
  }

  return { pushed, failed };
}

async function pullChanges() {
  if (!sb || !currentUser) return { pulled: 0 };

  const since = lastPullTs
    ? new Date(lastPullTs).toISOString()
    : new Date(0).toISOString();

  let totalPulled = 0;
  let maxTs = lastPullTs;

  const tables = ['sessions', 'exams', 'mistakes', 'plans', 'notes'];

  for (const t of tables) {
    const { data, error } = await sb.from(t)
      .select('*')
      .eq('user_id', currentUser.id)
      .gt('updated_at', since)
      .order('updated_at', { ascending: true })
      .limit(500);

    if (error) {
      logError('pull ' + t + ': ' + error.message);
      continue;
    }
    if (!data || !data.length) continue;

    for (const raw of data) {
      const remote = fromRemoteRow(raw);
      const local = await idbGet(t, remote.id);
      if (!local || remote.updated_at > (local.updated_at || 0)) {
        await idbPut(t, remote);
        totalPulled++;
      }
      if (remote.updated_at > maxTs) maxTs = remote.updated_at;
    }
  }

  lastPullTs = maxTs;
  await saveMeta('lastPullTs', lastPullTs);
  return { pulled: totalPulled };
}

async function syncNow(force) {
  if (!sb || !currentUser) return;
  if (syncState.running && !force) return;
  if (!navigator.onLine) return;

  syncState.running = true;
  updateSyncPill();

  try {
    if (force) await retryFailedOps();
    const pr = await pushOutbox();
    await pullChanges();
    await refreshSharedStatsForToday();

    syncState.backoff = pr.failed > 0
      ? Math.min(300000, syncState.backoff * 2)
      : 5000;
    syncState.lastError = null;
  } catch (err) {
    syncState.lastError = err.message || String(err);
    logError('sync: ' + syncState.lastError);
    syncState.backoff = Math.min(300000, syncState.backoff * 2);
  } finally {
    syncState.running = false;
    syncState.lastAttempt = Date.now();
    await refreshCache();
    updateSyncPill();
    updateAccountBtn();
  }
}

let syncLoopHandle = null;

  syncLoopHandle = setInterval(() => {
    if (!navigator.onLine || !sb || !currentUser || syncState.running) return;
    if (Date.now() - syncState.lastAttempt < syncState.backoff) return;
    syncNow();
  }, 8000);
}

async function startPresence() {

  try { await stopPresence(); } catch (e) {}

  presenceChannel = sb.channel('partners', {
    config: { presence: { key: currentUser.id } }
  });

  presenceChannel.on('presence', { event: 'sync' }, () => {
    const state = presenceChannel.presenceState();
    const others = Object.keys(state).filter(k => k !== currentUser.id);
    if (!others.length) {
      partnerPresence = null;
      renderPartnerCard();
      return;
    }
    const list = state[others[0]] || [];
    if (list[0]) {
      partnerPresence = {
        subject: list[0].subject,
        started_at: list[0].started_at,
        online: true
      };
    } else {
      partnerPresence = null;
    }
    renderPartnerCard();
  });

  presenceChannel.on('presence', { event: 'leave' }, (e) => {
    const leaving = e.key || (e.leftPresences && e.leftPresences[0] && e.leftPresences[0].key);
    if (leaving && leaving !== currentUser.id) {
      partnerPresence = null;
      renderPartnerCard();
    }
  });

  await presenceChannel.subscribe(async (status) => {
    if (status === 'SUBSCRIBED') {
      await trackPresence();
    }
  });
}

async function trackPresence() {
  if (!presenceChannel || !currentUser) return;

    online: true,
    subject: running ? Timer.state.subject : null,
    started_at: running ? Timer.state.started_at : null,
    updated_at: Date.now()

  try { await presenceChannel.track(payload); } catch (e) {}
}

async function stopPresence() {

   SECTION 15 — AI CLIENT (با کلید محلی)

async function aiCall(feature, payload) {
  const aiCfg = S.settings.ai || {};
  const useLocal = aiCfg.useLocalKey && aiCfg.apiKey;

  /* حالت ۱: کلید محلی — مستقیم به OpenRouter */
  if (useLocal) {
    const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + aiCfg.apiKey.trim(),
        'Content-Type': 'application/json',
        'HTTP-Referer': location.origin,
        'X-Title': 'KonkoorYar'
      },
      body: JSON.stringify({
        model: aiCfg.model || 'meta-llama/llama-3.1-8b-instruct:free',
        messages: [
          { role: 'system', content: getSystemPromptFor(feature) },
          { role: 'user', content: buildUserPromptLocal(feature, payload) }
        ],
        max_tokens: 1400,
        temperature: 0.4,
        response_format: { type: 'json_object' }
      })
    });

    if (!res.ok) {
      const errText = await res.text().catch(() => '');
      throw new Error('OpenRouter ' + res.status + ': ' + errText.slice(0, 200));
    }

    const data = await res.json();
    const text = data?.choices?.[0]?.message?.content || '';
    const parsed = extractJSONLocal(text);
    const validated = validateShapeLocal(feature, parsed);
    return { ok: true, data: validated, remaining: 'local' };
  }

  /* حالت ۲: از طریق Edge Function */
  if (!sb) throw new Error('برای AI از طریق سرور، اول وارد حساب شو یا کلید محلی بگذار');
  if (!currentUser) throw new Error('ابتدا وارد حساب شو');

  const { data: { session } } = await sb.auth.getSession();
  if (!session) throw new Error('نشست منقضی شده — دوباره وارد شو');

  const url = (S.settings.supabase.url || '').replace(/\/$/, '') + '/functions/v1/ai-proxy';

  const res = await fetch(url, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + session.access_token,
      'apikey': S.settings.supabase.anonKey
    },
    body: JSON.stringify({ feature, payload })
  });

  const data = await res.json().catch(() => ({}));

  if (res.status === 429 || data.error === 'quota_exceeded') {
    aiQuota.remaining = 0;
    throw new Error('سهم امروز تمام شد. فردا دوباره امتحان کن.');
  }
  if (!res.ok || !data.ok) {
    throw new Error(data.message || data.error || ('خطای ' + res.status));
  }
  if (typeof data.remaining === 'number') {
    aiQuota.remaining = data.remaining;
  }
  return data;
}

function getSystemPromptFor(feature) {
  return `تو یک دستیار فارسی زبان و متخصص کنکور ایران (گروه تجربی) هستی.
قواعد:
1. فقط فارسی جواب بده.
2. کوتاه، عملی، بدون شعار و تعارف.
3. هرگز آمار یا رتبه از خودت نساز.
4. اگر ورودی متن است، فقط از همان متن استفاده کن.
5. خروجی همیشه JSON معتبر باشد.`;
}

function buildUserPromptLocal(feature, payload) {
  const limit = (s, n) => String(s || '').slice(0, n);

  if (feature === 'mistake-analysis') {
    const items = Array.isArray(payload?.items) ? payload.items.slice(0, 15) : [];
    const compact = items.map((it, i) => ({
      n: i + 1,
      subject: limit(it?.subject, 40),
      cause: limit(it?.cause, 20),
      question: limit(it?.question, 400)
    }));
    return `این ${compact.length} مورد از دفترچه اشتباه من است.
تحلیل کن و JSON بده:
{"categories":["..."],"patterns":["..."],"actions":["...","...","..."],"honest":"..."}
داده: ${JSON.stringify(compact)}`;
  }

  if (feature === 'summary') {
    const text = limit(payload?.text, 6000);
    const topic = limit(payload?.topic, 100);
    return `موضوع: ${topic}
فقط از متن زیر خلاصه بساز. JSON بده:
{"title":"...","sections":[{"heading":"...","bullets":["..."]}],"not_in_text":["..."]}
متن: ${text}`;
  }

  if (feature === 'quiz-from-text') {
    const text = limit(payload?.text, 6000);
    const topic = limit(payload?.topic, 100);
    const count = Math.min(Math.max(parseInt(payload?.count) || 5, 1), 10);
    return `موضوع: ${topic}
از متن زیر ${count} سؤال چهارگزینه‌ای بساز. JSON بده:
{"questions":[{"stem":"...","options":["...","...","...","..."],"correct_index":0,"explanation":"...","needs_review":false}]}
متن: ${text}`;
  }

  throw new Error('feature ناشناخته: ' + feature);
}

function extractJSONLocal(text) {
  if (!text || !text.trim()) throw new Error('پاسخ خالی');
  let t = String(text).trim();
  t = t.replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/i, '').trim();
  const start = t.indexOf('{');
  const end = t.lastIndexOf('}');
  if (start < 0 || end <= start) throw new Error('JSON یافت نشد');
  return JSON.parse(t.slice(start, end + 1));
}

function validateShapeLocal(feature, obj) {
  if (!obj || typeof obj !== 'object') throw new Error('ساختار نامعتبر');

  if (feature === 'mistake-analysis') {
    return {
      categories: Array.isArray(obj.categories) ? obj.categories.slice(0, 8).map(String) : [],
      patterns: Array.isArray(obj.patterns) ? obj.patterns.slice(0, 8).map(String) : [],
      actions: Array.isArray(obj.actions) ? obj.actions.slice(0, 5).map(String) : ['داده کافی نیست.'],
      honest: String(obj.honest || 'این تحلیل قطعی نیست.').slice(0, 300)
    };
  }

  if (feature === 'summary') {
    const sections = Array.isArray(obj.sections) ? obj.sections.slice(0, 12).map(s => ({
      heading: String(s?.heading || '').slice(0, 120),
      bullets: Array.isArray(s?.bullets) ? s.bullets.slice(0, 8).map(b => String(b).slice(0, 400)) : []
    })) : [];
    return {
      title: String(obj.title || 'خلاصه').slice(0, 140),
      sections,
      not_in_text: Array.isArray(obj.not_in_text) ? obj.not_in_text.slice(0, 8).map(String) : []
    };
  }

  if (feature === 'quiz-from-text') {
    const questions = Array.isArray(obj.questions) ? obj.questions.slice(0, 12).map(q => {
      const opts = Array.isArray(q?.options) ? q.options.slice(0, 4).map(x => String(x).slice(0, 300)) : [];
      while (opts.length < 4) opts.push('—');
      return {
        stem: String(q?.stem || '').slice(0, 500),
        options: opts,
        correct_index: Math.min(Math.max(parseInt(q?.correct_index) || 0, 0), 3),
        explanation: String(q?.explanation || '').slice(0, 400),
        needs_review: !!q?.needs_review
      };
    }) : [];
    return { questions };
  }

  throw new Error('feature ناشناخته');
}

  const pending = (CACHE.outbox || []).filter(o =>
    o.status === 'pending' || o.status === 'retry').length;
  const failed = (CACHE.outbox || []).filter(o => o.status === 'failed').length;

  pill.className = 'sync-pill';

  if (!navigator.onLine) {
    pill.classList.add('offline');
    label.textContent = 'آفلاین';
    return;
  }
  if (!currentUser) {
    label.textContent = 'محلی';
    return;
  }
  if (failed > 0) {
    pill.classList.add('offline');
    label.textContent = 'خطا';
    return;
  }
  if (syncState.running) {
    pill.classList.add('queue');
    label.textContent = 'sync…';
    return;
  }
  if (pending > 0) {
    pill.classList.add('queue');
    label.textContent = 'صف: ' + faNum(pending);
    return;
  }
  label.textContent = 'همگام';
}

function navigate(view) {
  if (!VIEW_TITLES[view]) view = 'home';
  S.activeView = view;

  $$('.view').forEach(v => {
    v.classList.toggle('active', v.id === 'view-' + view);
  });

  const bottomTarget = BOTTOM_NAV.includes(view) ? view : 'home';
  $$('#bottomNav button').forEach(b => {
    b.classList.toggle('active', b.dataset.nav === bottomTarget);
  });
  $$('#sideNav button').forEach(b => {
    b.classList.toggle('active', b.dataset.nav === view);
  });

  const titleEl = $('#topTitle');
  if (titleEl) titleEl.textContent = VIEW_TITLES[view] || '';
  const dateEl = $('#topDate');
  if (dateEl) dateEl.textContent = faDate(todayKey(), 'weekday');

  if (RENDER[view]) {
    try { RENDER[view](); } catch (e) { logError('render ' + view + ': ' + e.message); }
  }

  updateFab();
  try { window.scrollTo({ top: 0, behavior: 'smooth' }); }
  catch (e) { window.scrollTo(0, 0); }
}

function updateFab() {
  const fab = $('#fab');
  if (!fab) return;
  const v = S.activeView;

  if (['home', 'plan', 'mistakes', 'exams'].includes(v)) {
    fab.classList.remove('hidden');
    fab.dataset.view = v;

    fab.classList.add('hidden');
  }
}

async function handleMistakeResult(id, wasRight) {
  const m = await idbGet('mistakes', id);
  if (!m) return;

  const currentBox = m.box || 1;
  const newBox = wasRight ? Math.min(5, currentBox + 1) : 1;
  const intervalDays = LEITNER_DAYS[newBox - 1];
  const nextReview = addDays(todayKey(), intervalDays);

  m.box = newBox;
  m.next_review = nextReview;
  m.updated_at = Date.now();
  m.history = Array.isArray(m.history) ? m.history : [];
  m.history.push({ ts: Date.now(), right: !!wasRight, box: newBox, interval: intervalDays });

  await idbPut('mistakes', m);
  await queueOp('upsert', 'mistakes', m.id, m);
  await refreshCache();

  if (S.settings.vibrationEnabled && navigator.vibrate) {
    try { navigator.vibrate(wasRight ? 30 : [20, 40, 20]); } catch (e) {}
  }

  toast(
    wasRight
      ? 'به مرحله ' + faNum(newBox) + ' رفت — مرور بعدی: ' + faDate(nextReview, 'short')
      : 'به مرحله ۱ برگشت — مرور بعدی: فردا',
    wasRight ? 'ok' : 'warn',
    2400
  );

  renderMistakes();
}

  const el = $('#simTime');
  if (!el) return;

  const elapsed = Math.floor((Date.now() - activeSim.started_at) / 1000);
  const remaining = Math.max(0, activeSim.duration_sec - elapsed);
  el.textContent = faNum(fmtClock(remaining));

  const bar = $('#simBar');
  if (bar) bar.style.width = clamp((elapsed / activeSim.duration_sec) * 100, 0, 100).toFixed(1) + '%';

  if (remaining <= 0) {
    toast('زمان آزمون تمام شد', 'warn', 4000);
    await finishSim(true);
  }
}

async function finishSim(auto) {
  if (!activeSim) return;

  if (simTick._handle) {
    clearInterval(simTick._handle);
    simTick._handle = null;
  }

  const c = toInt($('#simCorrect')?.value, 0);
  const w = toInt($('#simWrong')?.value, 0);
  const b = toInt($('#simBlank')?.value, 0);

  if (c + w + b === 0) {
    if (!auto) toast('هیچ پاسخی ثبت نشد', 'warn');
    activeSim = null;
    renderSim();
    return;
  }

  const pct = calcPercent(c, w, b);
  const duration = Math.round((Date.now() - activeSim.started_at) / 60000);

  const exam = {
    id: uid(),
    created_at: Date.now(),
    updated_at: Date.now(),
    deleted_at: null,
    device_id: S.settings.deviceId,
    subject: activeSim.subject,
    day: todayKey(),
    correct: c,
    wrong: w,
    blank: b,
    duration,
    percent: pct,
    note: 'آزمون شبیه‌سازی'
  };

  await idbPut('exams', exam);
  await queueOp('upsert', 'exams', exam.id, exam);
  await refreshCache();

  activeSim = null;

  if (S.settings.vibrationEnabled && navigator.vibrate) {
    try { navigator.vibrate([30, 60, 30]); } catch (e) {}
  }

  toast('آزمون ثبت شد — ' + fmtPct(pct), 'ok', 3200);
  navigate('exams');
}

async function renderMonthly() {
  const root = $('#monthlyRoot');
  if (!root) return;

  const allSessions = CACHE.sessions.filter(s => !s.deleted_at);
  const allExams = CACHE.exams.filter(e => !e.deleted_at);
  const today = todayKey();
  const currentKey = jalaliMonthKey(today);

  const buckets = new Map();
  const addToBucket = (day, kind, item) => {
    const k = jalaliMonthKey(day);
    if (!k) return;
    if (!buckets.has(k)) buckets.set(k, { sessions: [], exams: [] });
    buckets.get(k)[kind].push(item);
  };
  allSessions.forEach(s => addToBucket(s.day, 'sessions', s));
  allExams.forEach(e => addToBucket(e.day, 'exams', e));

  const keys = [...buckets.keys()].sort().reverse();

  if (keys.length === 0) {
    root.innerHTML =
      '<div class="view-title"><h2>گزارش ماهانه</h2><span>مقایسه و روند</span></div>' +
      '<div class="empty">' +
        '<b>هنوز داده‌ای نیست</b>' +
        '<p>بعد از ثبت چند جلسه و آزمون، گزارش ماهانه اینجا ساخته می‌شود.</p>' +
      '</div>';
    return;
  }

  const currentIdx = keys.indexOf(currentKey);
  const prevKey = currentIdx >= 0 ? keys[currentIdx + 1] : keys[1];

  /* ✅ FIX: برچسب از day، بازه کامل */
  const summary = (key) => {
    const b = buckets.get(key) || { sessions: [], exams: [] };
    const days = new Set(b.sessions.map(s => s.day));
    const dayList = [...days].sort();
    const sampleDay = (b.sessions[0] && b.sessions[0].day) ||
                      (b.exams[0] && b.exams[0].day) ||
                      today;
    return {
      key,
      label: jalaliLabelFromDay(sampleDay),
      activeDays: days.size,
      agg: aggregateRange(b.sessions, b.exams, '0000-00-00', '9999-99-99')
    };
  };

  const cur = summary(currentKey);
  const prev = prevKey ? summary(prevKey) : null;

  /* ✅ FIX: kpi با دلتا */
  const kpi = (label, curVal, prevVal, fmt) => {
    let delta = '';
    if (prev && Number.isFinite(curVal) && Number.isFinite(prevVal) && prevVal !== 0) {
      const d = curVal - prevVal;
      if (Math.abs(d) >= 0.01) {
        delta = '<span class="badge ' + (d > 0 ? 'ok' : 'bad') + ' badge-sm">' +
          (d > 0 ? '+' : '−') + fmt(Math.abs(d)) + '</span>';
      }
    }
    return '<div class="stat">' +
      '<div class="lbl">' + esc(label) + '</div>' +
      '<div class="val">' + (Number.isFinite(curVal) ? fmt(curVal) : '—') + '</div>' +
      '<div class="sub flex gap-2 items-center flex-wrap">' + delta +
        (prev && Number.isFinite(prevVal) ? '<span>ماه قبل: ' + fmt(prevVal) + '</span>' : '') +
      '</div>' +
    '</div>';
  };

  const kpiHtml = '<div class="grid g4">' +
    kpi('مطالعه ماه', cur.agg.minutes, prev && prev.agg.minutes, fmtHMfa) +
    kpi('تعداد تست', cur.agg.testCount, prev && prev.agg.testCount, faNum) +
    kpi('میانگین آزمون',
      cur.agg.examPercent != null ? cur.agg.examPercent : NaN,
      prev && prev.agg.examPercent != null ? prev.agg.examPercent : NaN,
      fmtPct) +
    kpi('روزهای فعال', cur.activeDays, prev && prev.activeDays, faNum) +
  '</div>';

  const daysOfMonth = [...new Set(
    allSessions.filter(s => jalaliMonthKey(s.day) === currentKey).map(s => s.day)
  )].sort();

  const perDayMap = {};
  allSessions.filter(s => jalaliMonthKey(s.day) === currentKey).forEach(s => {
    perDayMap[s.day] = (perDayMap[s.day] || 0) + (s.seconds || 0);
  });

  const maxMin = Math.max(...Object.values(perDayMap).map(s => s / 60), 60);
  const daysBars = daysOfMonth.map(day => {
    const min = (perDayMap[day] || 0) / 60;
    const h = maxMin > 0 ? (min / maxMin) * 100 : 0;
    const isToday = day === today;
    return '<div class="bar-col">' +
      '<div class="bar-val">' + faNum(Math.round(min)) + '</div>' +
      '<div class="bar-track">' +
        '<div class="bar-fill' + (isToday ? ' today' : '') + '" ' +
          'style="height:' + h.toFixed(1) + '%"></div>' +
      '</div>' +
      '<div class="bar-lbl">' + faNum(parseDay(day).getDate()) + '</div>' +
    '</div>';
  }).join('');

  const subjectMap = {};
  allSessions.filter(s => jalaliMonthKey(s.day) === currentKey).forEach(s => {
    subjectMap[s.subject] = (subjectMap[s.subject] || 0) + Math.round((s.seconds || 0) / 60);
  });
  const totalSecM = Object.values(subjectMap).reduce((a, b) => a + b, 0);

  const donutHtml = buildDonutHtml(totalSecM, subjectMap);

  const historyHtml = keys.slice(0, 6).map(k => {
    const s = summary(k);
    return '<div class="item">' +
      '<div class="item-main">' +
        '<b>' + esc(s.label) + '</b>' +
        '<span>' +
          faNum(s.activeDays) + ' روز فعال · ' +
          faNum(s.agg.testCount) + ' تست' +
          (s.agg.examPercent != null ? ' · میانگین ' + fmtPct(s.agg.examPercent) : '') +
        '</span>' +
      '</div>' +
      '<span class="mono t-xs">' + fmtHMfa(s.agg.minutes) + '</span>' +
    '</div>';
  }).join('');

  root.innerHTML =
    '<div class="view-title">' +
      '<h2>گزارش ماهانه</h2>' +
      '<span>' + esc(cur.label) + '</span>' +
    '</div>' +
    kpiHtml +
    '<div class="card section">' +
      '<div class="card-head"><h3>روزهای این ماه</h3><span class="hint">دقیقه</span></div>' +
      (daysBars ? '<div class="bars">' + daysBars + '</div>' : '<p class="t-sm muted">روزی ثبت نشده.</p>') +
    '</div>' +
    '<div class="card section">' +
      '<div class="card-head"><h3>سهم دروس ماه</h3></div>' +
      donutHtml +
    '</div>' +
    '<div class="card section">' +
      '<div class="card-head"><h3>ماه‌های گذشته</h3></div>' +
      '<div class="list">' + historyHtml + '</div>' +
    '</div>';
}

  const text = String(textEl?.value || '').trim();

  if (!topic) { toast('موضوع را وارد کن', 'error'); return; }
  if (!text) { toast('متن جزوه را بچسبان', 'error'); return; }
  if (text.length > 6000) { toast('متن طولانی است (حداکثر ۶۰۰۰ کاراکتر)', 'error'); return; }

  const out = $('#aiOutput');
  if (out) {
    out.innerHTML = '<div class="loading-state">' +
      '<span class="spinner lg"></span>' +
      '<p>در حال پردازش…</p>' +
    '</div>';
  }

  try {
    const payload = { topic, text };
    if (feature === 'quiz-from-text') payload.count = toInt(countEl?.value, 5);

    const res = await aiCall(feature, payload);
    const d = res.data;
    let html = '';

    if (feature === 'summary') {
      html = '<div class="card card-inset">' +
        '<h4 style="font-size:15px;margin-bottom:10px" dir="auto">' + esc(d.title) + '</h4>';

      d.sections.forEach(sec => {
        html += '<h5 style="color:var(--brand);font-size:13px;margin:14px 0 6px" dir="auto">' +
          esc(sec.heading) + '</h5>';
        if (sec.bullets.length) {
          html += '<ul style="padding-inline-start:20px;margin:4px 0;font-size:13px;line-height:1.95">' +
            sec.bullets.map(b => '<li dir="auto">' + esc(b) + '</li>').join('') +
          '</ul>';
        }
      });

      if (d.not_in_text.length) {
        html += '<hr class="divider">' +
          '<p class="t-sm muted mb-2">این موارد در متن نبود:</p>' +
          '<ul style="padding-inline-start:20px;font-size:12.5px">' +
            d.not_in_text.map(x => '<li dir="auto">' + esc(x) + '</li>').join('') +
          '</ul>';
      }

      html += '</div>';
    } else if (feature === 'quiz-from-text') {
      if (!d.questions.length) {
        html = '<div class="empty"><b>سؤالی ساخته نشد</b><p>متن کوتاه یا نامناسب بود.</p></div>';
      } else {
        html = '<div class="card card-inset">' +
          '<div class="badge warn mb-3"><span class="dot"></span>' +
            'سؤال‌های AI جایگزین آزمون واقعی نیستند.' +
          '</div>';

        d.questions.forEach((q, i) => {
          html += '<div style="margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border)" dir="auto">' +
            '<div class="flex gap-2 items-start">' +
              '<span class="mono" style="font-weight:800;color:var(--brand)">' + faNum(i + 1) + '.</span>' +
              '<div style="flex:1;min-width:0">' +
                '<p style="font-size:13px;font-weight:600;line-height:1.9">' + esc(q.stem) + '</p>' +
              '</div>' +
            '</div>' +
            '<ol style="padding-inline-start:22px;margin:8px 0;font-size:12.5px;line-height:1.9">' +
              q.options.map((o, oi) =>
                '<li style="' + (oi === q.correct_index ? 'color:var(--ok);font-weight:700' : '') + '">' +
                esc(o) + (oi === q.correct_index ? ' ✓' : '') + '</li>'
              ).join('') +
            '</ol>' +
            (q.explanation ? '<p class="t-xs muted mt-2">توضیح: ' + esc(q.explanation) + '</p>' : '') +
            (q.needs_review ? '<span class="badge warn sm mt-2">نیاز به بررسی</span>' : '') +
          '</div>';
        });

        html += '</div>';
      }
    }

    if (out) out.innerHTML = html;
    renderAiQuotaBadge();
  } catch (err) {
    if (out) {
      out.innerHTML = '<div class="empty">' +
        '<b>خطا</b>' +
        '<p dir="auto">' + esc(err.message) + '</p>' +
      '</div>';
    }
  }
}

  const logs = (CACHE.logs || []).slice().sort((a, b) => b.ts - a.ts).slice(0, 12);
  const pending = outbox.filter(o => o.status === 'pending' || o.status === 'retry');
  const failed = outbox.filter(o => o.status === 'failed');
  const persistState = (await navigator.storage?.persisted?.()) ? 'فعال' : 'غیرفعال';
  const sizeKb = (JSON.stringify(CACHE).length / 1024).toFixed(1);

  root.innerHTML =
    '<div class="view-title"><h2>عیب‌یابی</h2><span>وضعیت</span></div>' +

      statCard({ icon: 'exams', label: 'آزمون‌ها', value: faNum(CACHE.exams.length), sub: 'IndexedDB', tint: 'rgba(234,88,12,.08)', accent: '#f97316' }) +

      '<div class="card-head">' + ICONS.info + '<h3>وضعیت کلی</h3></div>' +
      '<div class="t-sm muted" style="line-height:2.4">' +
        '<div>آنلاین: <b>' + (navigator.onLine ? 'بله' : 'خیر') + '</b></div>' +

    (outbox.length

          '<div class="card-head"><h3>صف sync</h3><span class="hint">' + faNum(outbox.length) + '</span></div>' +

async function exportData() {
  try {
    const data = {
      settings: await idbGet('settings', STORE_KEY),
      sessions: await idbGetAll('sessions'),
      exams: await idbGetAll('exams'),
      mistakes: await idbGetAll('mistakes'),
      plans: await idbGetAll('plans'),
      notes: await idbGetAll('notes'),
      outbox: await idbGetAll('outbox')
    };
    const payload = {
      app: 'konkoor-yar', version: 1,
      exported_at: new Date().toISOString(),
      data
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'konkoor-yar-backup-' + todayKey() + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('پشتیبان ساخته شد', 'ok');
  } catch (err) {
    logError('export: ' + err.message);
    toast('خطا در پشتیبان', 'error');
  }
}

async function handleImport(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const parsed = JSON.parse(String(reader.result || ''));
      if (!parsed || parsed.app !== 'konkoor-yar' || !parsed.data) {
        throw new Error('ساختار نامعتبر');
      }
      const ok = await confirmModal({
        title: 'تأیید بازیابی',
        message: 'داده‌های فعلی جایگزین می‌شوند. ادامه؟',
        confirmLabel: 'بازیابی',
        danger: true
      });
      if (!ok) return;

      const d = parsed.data;
      if (d.settings) {
        Object.assign(S.settings, d.settings);
        await saveSettings();
      }

      const stores = ['sessions', 'exams', 'mistakes', 'plans', 'notes', 'outbox'];
      for (const store of stores) {
        await idbClear(store);
        if (Array.isArray(d[store])) {
          for (const r of d[store]) await idbPut(store, r);
        }
      }

      await refreshCache();
      applyTheme();
      navigate('home');
      toast('بازیابی موفق', 'ok');
    } catch (err) {
      toast('فایل معتبر نیست: ' + err.message, 'error');
    }
  };
  reader.readAsText(file);
}

function csvEscape(v) {
  if (v === null || v === undefined) return '';
  const s = String(v);
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function toCSV(headers, rows) {
  return '\uFEFF' + headers.join(',') + '\n' + rows.map(r => r.map(csvEscape).join(',')).join('\n');
}

function downloadText(name, text, mime) {
  const blob = new Blob([text], { type: mime || 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

  const rows = list.map(s => [

  ]);

async function runHealthCheck() {
  const out = $('#healthOut');
  if (!out) return;
  out.innerHTML = '<div class="loading-state"><span class="spinner"></span><p>در حال بررسی…</p></div>';

  const issues = [];
  const sessions = CACHE.sessions.filter(s => !s.deleted_at);
  const exams = CACHE.exams.filter(e => !e.deleted_at);
  const mistakes = CACHE.mistakes.filter(m => !m.deleted_at);

  sessions.forEach(s => {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(s.day))) issues.push('جلسه با تاریخ نامعتبر: ' + s.id);
  });
  exams.forEach(e => {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(e.day))) issues.push('آزمون با تاریخ نامعتبر: ' + e.id);
  });
  mistakes.forEach(m => {
    const b = toInt(m.box, 1);
    if (b < 1 || b > 5) issues.push('کارت با مرحله خارج بازه: ' + m.id);
  });

  if (!issues.length) {
    out.innerHTML = '<div class="card card-inset" style="padding:12px;border:1px solid var(--ok)">' +
      '<div class="flex items-center gap-2" style="color:var(--ok)">' +
        ICONS.check + '<b class="t-sm">سلامت داده تأیید شد</b>' +
      '</div></div>';
  } else {
    out.innerHTML = '<div class="card card-inset" style="padding:12px;border:1px solid var(--warn)">' +
      '<div class="flex items-center gap-2" style="color:var(--warn)">' +
        ICONS.warning + '<b class="t-sm">' + faNum(issues.length) + ' مورد</b>' +
      '</div>' +
      '<ul style="padding-inline-start:18px;margin-top:8px;font-size:12.5px;line-height:1.9">' +
        issues.slice(0, 20).map(x => '<li dir="auto">' + esc(x) + '</li>').join('') +
      '</ul></div>';
  }
}

function bindEvents() {
  document.addEventListener('click', async (e) => {
    /* Navigation */
    const navBtn = e.target.closest('[data-nav]');
    if (navBtn && navBtn.dataset.nav) {
      e.preventDefault();
      navigate(navBtn.dataset.nav);
      return;
    }

    /* Command palette item */
    const cmdItem = e.target.closest('[data-cmd-id]');
    if (cmdItem) {
      runCmdItem(cmdItem.dataset.cmdId);
      return;
    }

    const el = e.target.closest('[data-action]');
    if (!el) return;
    const action = el.dataset.action;
    const id = el.dataset.id;

    switch (action) {
      case 'close-modal': closeModal(); break;
      case 'open-cmd': openCmd(); break;
      case 'close-cmd': closeCmd(); break;

      /* Theme */
      case 'toggle-theme':
        S.settings.theme = S.settings.theme === 'dark' ? 'light' : 'dark';
        applyTheme();
        await saveSettings();
        if (S.activeView === 'settings') renderSettings();
        break;

      case 'toggle-sound':
        S.settings.soundEnabled = !S.settings.soundEnabled;
        await saveSettings();
        if (S.activeView === 'settings') renderSettings();
        break;

      case 'toggle-vibration':
        S.settings.vibrationEnabled = !S.settings.vibrationEnabled;
        await saveSettings();
        if (S.activeView === 'settings') renderSettings();
        break;

      /* AI local toggle */
      case 'toggle-ai-local':
        S.settings.ai = S.settings.ai || {};
        S.settings.ai.useLocalKey = !S.settings.ai.useLocalKey;
        await saveSettings();
        renderSettings();
        break;

      /* Key visibility */
      case 'toggle-key-visibility': {
        const target = document.querySelector('input[name="' + el.dataset.target + '"]');
        if (!target) break;
        const isPwd = target.type === 'password';
        target.type = isPwd ? 'text' : 'password';
        el.innerHTML = isPwd ? ICONS.eyeOff : ICONS.eye;
        break;
      }

      case 'test-ai-key': {
        const resultEl = $('#aiKeyTestResult');
        if (!resultEl) break;
        resultEl.innerHTML = '<div class="card card-inset" style="padding:12px"><div class="flex items-center gap-2"><span class="spinner"></span><span class="t-xs muted">در حال تست…</span></div></div>';

        const form = document.querySelector('form[data-form="ai-settings"]');
        const keyInput = form ? form.querySelector('input[name="aiApiKey"]') : null;
        const modelSelect = form ? form.querySelector('select[name="aiModel"]') : null;

        const testKey = (keyInput && keyInput.value.trim()) || S.settings.ai?.apiKey || '';
        const testModel = (modelSelect && modelSelect.value) || S.settings.ai?.model;

        if (!testKey) {
          resultEl.innerHTML = '<div class="card card-inset" style="padding:12px;border:1px solid var(--bad)">' +
            '<p class="t-sm" style="color:var(--bad)">کلید API را وارد کن</p></div>';
          break;
        }

        try {
          const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Authorization': 'Bearer ' + testKey,
              'Content-Type': 'application/json',
              'HTTP-Referer': location.origin,
              'X-Title': 'KonkoorYar'
            },
            body: JSON.stringify({
              model: testModel,
              messages: [
                { role: 'system', content: 'فقط بگو: سلام' },
                { role: 'user', content: 'سلام' }
              ],
              max_tokens: 30
            })
          });

          if (!res.ok) {
            const errText = await res.text().catch(() => '');
            throw new Error('HTTP ' + res.status + ': ' + errText.slice(0, 150));
          }

          const data = await res.json();
          const text = data?.choices?.[0]?.message?.content || '';
          resultEl.innerHTML = '<div class="card card-inset" style="padding:12px;border:1px solid var(--ok)">' +
            '<div class="flex items-center gap-2" style="color:var(--ok)">' +
              ICONS.check + '<b class="t-sm">اتصال موفق</b></div>' +
            '<p class="t-xs muted mt-2" dir="auto">' + esc(text.slice(0, 100)) + '</p></div>';
        } catch (err) {
          resultEl.innerHTML = '<div class="card card-inset" style="padding:12px;border:1px solid var(--bad)">' +
            '<div class="flex items-center gap-2" style="color:var(--bad)">' +
              ICONS.warning + '<b class="t-sm">اتصال ناموفق</b></div>' +
            '<p class="t-xs muted mt-2" dir="auto">' + esc(err.message) + '</p></div>';
        }
        break;
      }

      /* Exam date */
      case 'edit-exam-date':
        navigate('settings');
        setTimeout(() => {
          const inp = document.querySelector('input[name="examDate"]');
          if (inp) inp.focus();
        }, 250);
        break;

      /* Timer */
      case 'timer-subj': {
        /* ✅ FIX: اگر تایمر نیست، فقط انتخاب کن */
        if (Timer.state && Timer.state.status === 'running') {
          toast('اول تایمر را متوقف کن', 'warn');
          break;
        }
        if (Timer.state) {
          Timer.state.subject = id;
          await Timer.save();
        } else {
          Timer.pendingSubject = id;
        }
        renderTimer();
        break;
      }

      case 'timer-start':
        Timer.start(Timer.state ? Timer.state.subject : (Timer.pendingSubject || 'bio'));
        renderTimer();
        break;

      case 'timer-pause':
        Timer.pause();
        renderTimer();
        break;

      case 'timer-resume':
        Timer.resume();
        renderTimer();
        break;

      case 'timer-finish': {
        const s = await Timer.finish();
        if (s) toast('ثبت شد — ' + fmtHMfa((s.seconds || 0) / 60), 'ok');
        else toast('مدت کمتر از ۱ دقیقه بود', 'warn');
        navigate('home');
        break;
      }

      case 'timer-cancel': {
        if (!Timer.state) break;
        const ok = await confirmModal({
          title: 'لغو',
          message: 'جلسه لغو شود؟',
          confirmLabel: 'لغو',
          danger: true
        });
        if (!ok) break;
        await Timer.reset();
        renderTimer();
        break;
      }

      case 'timer-zen':
        document.body.classList.toggle('zen-mode');
        break;

      /* Del exam */
      case 'del-exam': {
        const ok = await confirmModal({
          title: 'حذف آزمون',
          message: 'این آزمون حذف می‌شود.',
          confirmLabel: 'حذف',
          danger: true
        });
        if (!ok) break;
        const ex = await idbGet('exams', id);
        if (!ex) break;
        ex.deleted_at = Date.now();
        ex.updated_at = Date.now();
        await idbPut('exams', ex);
        await queueOp('delete', 'exams', id, ex);
        await refreshCache();
        renderExams();
        toast('حذف شد', 'ok', 1600);
        break;
      }

      /* Mistakes */
      case 'mistake-right':
        await handleMistakeResult(id, true);
        break;

      case 'mistake-wrong':
        await handleMistakeResult(id, false);
        break;

      case 'del-mistake': {
        const ok = await confirmModal({
          title: 'حذف کارت',
          message: 'این کارت حذف می‌شود.',
          confirmLabel: 'حذف',
          danger: true
        });
        if (!ok) break;
        const m = await idbGet('mistakes', id);
        if (!m) break;
        m.deleted_at = Date.now();
        m.updated_at = Date.now();
        await idbPut('mistakes', m);
        await queueOp('delete', 'mistakes', id, m);
        await refreshCache();
        renderMistakes();
        toast('حذف شد', 'ok', 1600);
        break;
      }

      case 'pick-mistake-image': {
        const inp = document.createElement('input');
        inp.type = 'file';
        inp.accept = 'image/*';
        inp.addEventListener('change', async () => {
          const f = inp.files && inp.files[0];
          if (!f) return;
          if (f.size > 5 * 1024 * 1024) {
            toast('حداکثر ۵ مگابایت', 'error');
            return;
          }
          try {
            pendingMistakeImage = await compressImage(f);
            toast('آماده شد', 'ok', 1400);
            renderMistakes();
          } catch (err) {
            toast('خطا', 'error');
          }
        });
        inp.click();
        break;
      }

      case 'clear-mistake-image':
        pendingMistakeImage = null;
        renderMistakes();
        break;

      /* Plan */
      case 'plan-toggle': {
        const tKey = todayKey();
        const sameDay = CACHE.plans.filter(p => p.day === tKey && !p.deleted_at);
        sameDay.sort((a, b) => (b.updated_at || 0) - (a.updated_at || 0));
        const plan = sameDay[0];
        if (!plan) break;
        const i = toInt(el.dataset.idx, -1);
        if (i < 0 || i >= plan.items.length) break;
        plan.items[i].done = !plan.items[i].done;
        plan.updated_at = Date.now();
        await idbPut('plans', plan);
        await queueOp('upsert', 'plans', plan.id, plan);
        await refreshCache();
        renderPlan();
        break;
      }

      case 'plan-del': {
        const tKey = todayKey();
        const sameDay = CACHE.plans.filter(p => p.day === tKey && !p.deleted_at);
        sameDay.sort((a, b) => (b.updated_at || 0) - (a.updated_at || 0));
        const plan = sameDay[0];
        if (!plan) break;
        const i = toInt(el.dataset.idx, -1);
        if (i < 0) break;
        plan.items.splice(i, 1);
        plan.updated_at = Date.now();
        await idbPut('plans', plan);
        await queueOp('upsert', 'plans', plan.id, plan);
        await refreshCache();
        renderPlan();
        break;
      }

      case 'note-del': {
        const n = await idbGet('notes', id);
        if (!n) break;
        n.deleted_at = Date.now();
        n.updated_at = Date.now();
        await idbPut('notes', n);
        await queueOp('delete', 'notes', id, n);
        await refreshCache();
        renderPlan();
        break;
      }

      /* Simulation */
      case 'sim-finish':
        await finishSim(false);
        break;

      case 'sim-cancel': {
        const ok = await confirmModal({
          title: 'لغو آزمون',
          message: 'لغو شود؟',
          confirmLabel: 'لغو',
          danger: true
        });
        if (!ok) break;
        if (simTick._handle) {
          clearInterval(simTick._handle);
          simTick._handle = null;
        }
        activeSim = null;
        renderSim();
        break;
      }

      /* CSV */
      case 'csv-sessions': exportSessionsCSV(); break;
      case 'csv-exams': exportExamsCSV(); break;
      case 'csv-mistakes': exportMistakesCSV(); break;

      /* Backup */
      case 'export': exportData(); break;
      case 'import':
        const fi = $('#importFile');
        if (fi) { fi.value = ''; fi.click(); }
        break;

      case 'wipe-store':
        await wipeStore(el.dataset.store);
        break;

      case 'health-check':
        await runHealthCheck();
        break;

      case 'request-persist':
        if (navigator.storage && navigator.storage.persist) {
          try {
            const r = await navigator.storage.persist();
            toast(r ? 'فعال شد' : 'مرورگر اجازه نداد', r ? 'ok' : 'warn');
          } catch (e) { toast('پشتیبانی نمی‌شود', 'warn'); }
        }
        break;

      case 'clear-logs':
        for (const l of await idbGetAll('logs')) await idbDelete('logs', l.id);
        await refreshCache();
        renderDiag();
        toast('پاک شد', 'ok', 1600);
        break;

      /* Account */
      case 'open-account': openAccount(); break;

      case 'show-signup': {
        const m = document.querySelector('#modalRoot .modal');
        if (m) {
          m.innerHTML =
            '<div class="modal-head"><h3>ثبت‌نام</h3>' +
              '<button class="icon-btn sm" data-action="close-modal">' + ICONS.close + '</button>' +
            '</div>' + buildSignupForm();
        }
        break;
      }

      case 'show-login': {
        const m = document.querySelector('#modalRoot .modal');
        if (m) {
          m.innerHTML =
            '<div class="modal-head"><h3>ورود</h3>' +
              '<button class="icon-btn sm" data-action="close-modal">' + ICONS.close + '</button>' +
            '</div>' + buildLoginForm();
        }
        break;
      }

      case 'clear-supabase-config': {
        const ok = await confirmModal({
          title: 'پاک‌کردن',
          message: 'پیکربندی پاک شود؟',
          confirmLabel: 'پاک'
        });
        if (!ok) break;
        S.settings.supabase = { url: '', anonKey: '' };
        await saveSettings();
        updateAccountBtn();
        closeModal();
        break;
      }

      case 'open-link-partner':
        if (!currentUser) { toast('اول وارد شو', 'warn'); return; }
        openLinkPartnerModal();
        break;

      case 'sign-out': {
        const ok = await confirmModal({
          title: 'خروج',
          message: 'از حساب خارج می‌شوی؟ داده‌های محلی می‌مانند.',
          confirmLabel: 'خروج'
        });
        if (!ok) break;
        await authSignOut();
        closeModal();
        toast('خارج شدی', 'ok');
        break;
      }

      case 'sync-now':
        toast('در حال sync…', 'info', 1200);
        await syncNow(true);
        if ($('#modalRoot').classList.contains('open')) openAccount();
        else if (S.activeView === 'diag') renderDiag();
        break;

      case 'force-pull':
        lastPullTs = 0;
        await saveMeta('lastPullTs', 0);
        await syncNow(true);
        toast('دریافت مجدد', 'ok', 1200);
        if ($('#modalRoot').classList.contains('open')) openAccount();
        break;

      /* AI */
      case 'ai-mistakes': aiAnalyzeMistakes(); break;

      /* FAB */
      case 'fab-main': {
        const v = $('#fab').dataset.view;
        if (v === 'plan') {
          const inp = document.querySelector('form[data-form="plan-add"] input[name="text"]');
          if (inp) { inp.focus(); inp.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
        } else if (v === 'mistakes') {
          const inp = document.querySelector('form[data-form="mistake"] textarea[name="question"]');
          if (inp) { inp.focus(); inp.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
        } else if (v === 'exams') {
          const sel = document.querySelector('form[data-form="exam"] select[name="subject"]');
          if (sel) { sel.focus(); sel.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
        } else {
          navigate('timer');
        }
        break;
      }

      default: break;
    }
  });

  /* Submit */
  document.addEventListener('submit', async (e) => {
    const form = e.target.closest('form[data-form]');
    if (!form) return;
    e.preventDefault();
    const kind = form.dataset.form;

    try {
      if (kind === 'session-manual') {
        await submitManualSession(form);
      } else if (kind === 'exam') {
        await submitExam(form);
      } else if (kind === 'mistake') {
        await submitMistake(form);
      } else if (kind === 'note') {
        await submitNote(form);
      } else if (kind === 'plan-add') {
        await submitTask(form);
      } else if (kind === 'exam-date') {
        const title = String(form.examTitle.value || '').trim();
        const d = String(form.examDate.value || '');
        if (title) S.settings.examTitle = title;
        if (d && /^\d{4}-\d{2}-\d{2}$/.test(d)) S.settings.examDate = d;
        await saveSettings();
        toast('ذخیره شد', 'ok');
        renderSettings();
      } else if (kind === 'goals') {
        S.settings.dailyGoalMinutes = clamp(toInt(form.dailyGoalMinutes.value, 240), 30, 900);
        S.settings.dailyGoalTests = clamp(toInt(form.dailyGoalTests.value, 60), 0, 500);
        await saveSettings();
        toast('ذخیره شد', 'ok');
        renderSettings();
      } else if (kind === 'ai-settings') {
        S.settings.ai = S.settings.ai || {};
        const keyVal = String(form.aiApiKey.value || '').trim();
        if (keyVal) S.settings.ai.apiKey = keyVal;
        S.settings.ai.model = String(form.aiModel.value || S.settings.ai.model);
        await saveSettings();
        toast('ذخیره شد', 'ok');
        renderSettings();
      } else if (kind === 'plan-wake') {
        const tKey = todayKey();
        let plan = CACHE.plans.find(p => p.day === tKey && !p.deleted_at);
        if (!plan) {
          plan = {
            id: uid(), day: tKey, wake_time: '', items: [],
            created_at: Date.now(), updated_at: Date.now(),
            device_id: S.settings.deviceId, deleted_at: null
          };
        }
        plan.wake_time = String(form.wake.value || '');
        plan.updated_at = Date.now();
        await idbPut('plans', plan);
        await queueOp('upsert', 'plans', plan.id, plan);
        await refreshCache();
        toast('ذخیره شد', 'ok');
        renderPlan();
      } else if (kind === 'sim-start') {
        const subject = String(form.subject.value || 'bio');
        const count = clamp(toInt(form.count.value, 30), 5, 100);
        const minutes = clamp(toInt(form.minutes.value, 35), 1, 300);
        S.simConfig = { subject, count, minutes };
        await saveSettings();
        activeSim = {
          id: uid(), subject, count, minutes,
          duration_sec: minutes * 60, started_at: Date.now()
        };
        if (simTick._handle) clearInterval(simTick._handle);
        simTick._handle = setInterval(simTick, 1000);
        renderSim();
      } else if (kind === 'supabase-config') {
        S.settings.supabase = {
          url: String(form.url.value || '').trim().replace(/\/$/, ''),
          anonKey: String(form.anonKey.value || '').trim()
        };
        await saveSettings();
        if (!initSupabaseSDK()) {
          toast('SDK بارگذاری نشده', 'error');
          return;
        }
        updateAccountBtn();
        toast('ذخیره شد', 'ok');
        openAccount();
      } else if (kind === 'auth-login') {
        const btn = form.querySelector('button[type="submit"]');
        if (btn) { btn.disabled = true; btn.textContent = 'در حال ورود…'; }
        try {
          await authSignIn(form.email.value, form.password.value);
          /* ✅ FIX: قبل از بستن، UI باز شود */
          closeModal();
          toast('خوش آمدی', 'ok');
          afterSignIn().catch(e => logError('afterSignIn: ' + e.message));
        } catch (err) {
          toast(err.message, 'error', 4200);
          if (btn) { btn.disabled = false; btn.textContent = 'ورود'; }
        }
      } else if (kind === 'auth-signup') {
        const btn = form.querySelector('button[type="submit"]');
        if (btn) { btn.disabled = true; btn.textContent = 'در حال ساخت…'; }
        try {
          await authSignUp(form.email.value, form.password.value);
          toast('اگر ایمیل تأیید لازم بود، صندوق را ببین.', 'ok', 5000);
          const m = document.querySelector('#modalRoot .modal');
          if (m) {
            m.innerHTML =
              '<div class="modal-head"><h3>ورود</h3>' +
                '<button class="icon-btn sm" data-action="close-modal">' + ICONS.close + '</button>' +
              '</div>' + buildLoginForm();
          }
        } catch (err) {
          toast(err.message, 'error', 4600);
          if (btn) { btn.disabled = false; btn.textContent = 'ثبت‌نام'; }
        }
      } else if (kind === 'link-partner') {
        try {
          await linkPartner(form.partnerEmail.value);
          toast('لینک شد', 'ok');
          closeModal();
          await startPresence();
          renderHome();
        } catch (err) {
          toast(err.message || 'خطا', 'error');
        }
      } else if (kind === 'ai-text') {
        await aiRunOnText(form.dataset.feature);
      }
    } catch (err) {
      logError(err.message || String(err));
      toast('خطا: ' + (err.message || ''), 'error');
    }
  });

  /* Input */
  document.addEventListener('input', (e) => {
    const t = e.target;
    const examForm = t.closest && t.closest('form[data-form="exam"]');
    if (examForm && ['correct', 'wrong', 'blank'].includes(t.name)) {
      const c = toInt(examForm.correct.value, 0);
      const w = toInt(examForm.wrong.value, 0);
      const b = toInt(examForm.blank.value, 0);
      const prev = examForm.querySelector('#examPreview');
      if (prev) prev.value = (c + w + b) > 0 ? calcPercent(c, w, b).toFixed(2) + '%' : '—';
    }
    if (t.id === 'cmdInput') renderCmdList(t.value);
  });

  /* Keyboard */
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      const root = $('#cmdRoot');
      if (root && root.classList.contains('open')) closeCmd();
      else openCmd();
      return;
    }

    const cmdRoot = $('#cmdRoot');
    if (cmdRoot && cmdRoot.classList.contains('open')) {
      if (e.key === 'Escape') { e.preventDefault(); closeCmd(); return; }
      if (e.key === 'Enter') {
        e.preventDefault();
        const active = cmdRoot.querySelector('.cmd-item.active');
        if (active) runCmdItem(active.dataset.cmdId);
        return;
      }
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        const items = Array.from(cmdRoot.querySelectorAll('.cmd-item'));
        if (!items.length) return;
        const idx = items.findIndex(it => it.classList.contains('active'));
        items.forEach(it => it.classList.remove('active'));
        let next = e.key === 'ArrowDown' ? idx + 1 : idx - 1;
        if (next < 0) next = items.length - 1;
        if (next >= items.length) next = 0;
        items[next].classList.add('active');
        items[next].scrollIntoView({ block: 'nearest' });
        return;
      }
    }

    if (e.key === 'Escape') {
      if (document.body.classList.contains('zen-mode')) {
        document.body.classList.remove('zen-mode');
      } else if ($('#modalRoot').classList.contains('open')) {
        closeModal();
      }
    }
  });

  /* File input */
  const importFile = $('#importFile');
  if (importFile) {
    importFile.addEventListener('change', (e) => {
      const f = e.target.files && e.target.files[0];
      handleImport(f);
    });
  }

  /* Network */
  window.addEventListener('online', () => {
    updateSyncPill();
    if (currentUser) syncNow(true);
  });
  window.addEventListener('offline', () => updateSyncPill());

  /* Visibility */
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      Timer.render();
      if (currentUser && navigator.onLine) syncNow();
    }
  });

  /* Before unload */
  window.addEventListener('beforeunload', () => {
    Timer.save();
  });
}

/* =========================================================================
   SECTION 32 — FORM SUBMIT HELPERS
   ========================================================================= */

async function submitManualSession(form) {
  const subject = String(form.subject.value || '');
  const type = String(form.type?.value || SESSION_TYPES[0]);
  const minutes = clamp(toInt(form.minutes.value, 0), 1, 1440);
  const day = String(form.day?.value || todayKey());
  const correct = clamp(toInt(form.correct?.value, 0), 0, 1000);
  const wrong = clamp(toInt(form.wrong?.value, 0), 0, 1000);
  const blank = clamp(toInt(form.blank?.value, 0), 0, 1000);
  const note = String(form.note?.value || '').trim();

  if (!SUBJ_MAP[subject]) { toast('درس نامعتبر', 'error'); return; }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(day)) { toast('تاریخ نامعتبر', 'error'); return; }

  const session = {
    id: uid(), created_at: Date.now(), updated_at: Date.now(), deleted_at: null,
    device_id: S.settings.deviceId,
    subject, seconds: minutes * 60,
    correct, wrong, blank,
